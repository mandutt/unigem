 학교 옆에 호텔을 지을 수 없다는 이유로 수년간 인허가가 이뤄지지 않으면서 유휴 부지로 남아있는 곳이다.\n   왕산레저개발은 2016년 준공된 해양레저시설인 용유왕산마리나의 운영사로 대한항공이 100% 지분을 소유하고 있다.\n  대한항공 측은 연내 매각 완료를 목표로 주관사 선정 및 매각공고와 같은 관련 절차를 진행한다는 계획이다.\n  대한항공 관계자는 “비수익 유휴자산과 비주력사업을 매각하는 것은 재무구조 개선의 적극적 의지 표현”이라고 했다.\n   재계 \"조현아 그룹 복귀 원천 봉쇄\" 분석도   재계에선 이날 대한항공 이사회에서 의결된 매각안이 조현아 전 부사장이 애착을 갖고 있던 사업이었던 만큼 조 전 부사장의 흔적 지우기가 아니냐는 목소리도 나온다.\n  실제로 조 회장이 호텔과 레저 사업 등 이익이 나지 않는 사업을 구조조정을 하겠다는 방침이 조 전 부사장과의 갈등을 촉발한 결정적 원인이었던 만큼, 개선안이 조 전 부사장의 그룹 복귀를 원천 봉쇄하겠단 의미가 더 크다는 것이다.\n    조원태 회장 측이 대한항공 재무구조 개선을 발표하기 전인 이날 오전 반 조원태 연합의 일원인 사모펀드 KCGI는 “현 경영진이 내는 방안에 진정성이나 신뢰성을 부여하기 어렵다”는 입장을 밝히며 조 회장 측을 먼저 견제하고 나섰다.", "output": "조 회장은 반 조원태 연합군을 향한 반격의 신호탄으로 재무구조 개선을 골자로 한 대한항공 경영 쇄신 안을 내놓았으며 한진칼 이사회를 열고 경영 개선 방안을 내놓을 방침이다."}, {"kind": "F5", "id": "REPORT-news_r-02789-00002", "input": "인터뷰에서도 ○○동 주민자치회의 경우 확실히 더 긍정적이고 적극적인 표현을 사용하며 효능감, 만족감, 시민적 유대감을 나타내기도 했다.\n  차이는 어디서 온 걸까? 두 동은 같은 주민자치회 제도, 비슷한 사회경제적 조건, 과거 주민자치위원회의 부정적 유산을 공유하고 있었으며, 심지어 두 동 담당 행정기관인 주민센터 동장의 비협조적인 태도에 이르기까지 서로 같은 상황에 놓여 있었다.\n  결국, 유사한 제도·구조·역사·상황적 조건에도 불구하고 두 동 주민자치회의 경험과 결과에 있어 차이가 생겼다면, 이는 내부 주체의 문제이자 행위자 차원의 전략과 실천의 차이 때문이라고 볼 수밖에 없을 것이다.\n  실제 인터뷰 결과, ○○동 주민자치회는 소위 ‘6 공주’라는 자녀를 키우는 학부모를 중심으로 형성된 또래 집단의 역할이 핵심적이었다는 것을 확인할 수 있었다.\n  다른 한편, 주민자치회의 성패가 주체적 요인에 달려 있다면, △△동 주민자치회라고 낙담할 필요는 없다는 얘기가 된다.\n  결국, 결과는 행위자 차원의 노력과 실천에 따라 달라질 수 있으며, △△동도 ○○동의 경험을 나름 학습·응용·혁신할 수 있는 여지가 있기 때문이다.\n  관악구의 두 동네 주민자치 이야기가 던져주는 메시지를 정리해보자.\n  첫째, 우리 주민자치는 과거 행정 주도 주민자치위원회 시대를 지나 주민 주도의 새로운 제도가 도입되어 그 맹아기를 거쳐 현재 곳곳에서 성장을 위해 꿈틀거리고 있다.\n  둘째, 주민자치의 실현은 제도 설계, 사회경제적 조건, 역사·문화적 유산의 문제를 넘어 궁극적으로 우리의 주체적인 노력 여하에 달려 있다.\n  제도가 미비하면 보완하면 된다.\n  주민자치는 잘 사는 곳, 많이 배운 곳에서만 가능한 게 아니다.\n  고질적으로만 보이는 중앙집권적 정치 문화는 충분히 극복될 수 있다.\n  관악구 두 동의 사례는 주민자치에 있어 주체의 발굴과 형성, 관계 맺기, 경험과 시민력의 배양, 학습과 전파 등 소위 주의주의(主意主義)적 전략과 실천이 유효하다는 것을 잘 보여 준다.\n  셋째, 주민자치는 작지만 의미 있는 큰 변화의 시작일 수 있다.\n  혹시 ‘현 정권에 대한 심판이냐, 보수 제1야당에 대한 심판이냐’를 가늠할 총선을 앞두고 한가하게 동네 주민자치 얘기나 한다고 생각할지 모르겠다.\n  하지만 막상 투표함 앞에 섰을 때, 누가 더 현명한 판단을 내릴 수 있을까.\n  주민자치회 활동에 직·간접적으로 참여·관여하면서 공적 관심이 쌓이고 효능감과 유대감을 경험한 유권자가 아닐까? 시민력은 자신이 참여했던 동네에서 투표장으로 전이될 수 있기 때문이다.", "output": "서로 같은 상황에 놓여 있던 두 동 주민자치회에 차이가 생긴 것은 내부 주체의 문제이자 행위자 차원의 전략과 실천의 차이 때문이다."}, {"kind": "F6", "id": "s0528", "input": "과잉 규제 때문에 실패했는데 또 다른 규제로 땜질하겠다니 한심하다.", "output": "과잉 규제 때문에 실패했는데 또 다른 규제로 땜질 하겠다니 한심하다."}];
const KEY = "gdata_review_v1";
let state = JSON.parse(localStorage.getItem(KEY) || "{}");
let filter = "all", onlyUnrated = false;
const list = document.getElementById("list");

function save(){ localStorage.setItem(KEY, JSON.stringify(state)); renderProgress(); }
function renderProgress(){
  const done = ITEMS.filter(i => state[i.id] && state[i.id].rating).length;
  document.getElementById("prog").textContent = `${done} / ${ITEMS.length}`;
  document.getElementById("pb").style.width = (100*done/ITEMS.length).toFixed(1) + "%";
}
function visible(){
  return ITEMS.filter(i => (filter==="all"||i.kind===filter) && (!onlyUnrated || !(state[i.id]&&state[i.id].rating)));
}
function render(){
  const items = visible();
  list.innerHTML = "";
  if(!items.length){ list.innerHTML = '<p style="color:#9aa3b2;text-align:center;padding:40px 0">표시할 항목이 없습니다.</p>'; return; }
  for(const it of items){
    const st = state[it.id] || {};
    const card = document.createElement("section");
    card.className = "card";
    card.innerHTML = `
      <span class="kind">${it.kind}</span><span class="id">${it.id}</span>
      <div class="label">입력</div><div class="text">${esc(it.input)}</div>
      <div class="label">출력</div><div class="text">${esc(it.output)}</div>
      <div class="rate">
        <button data-r="1" class="bad ${st.rating==1?'sel':''}">1 부적합</button>
        <button data-r="2" class="${st.rating==2?'sel':''}">2 보통</button>
        <button data-r="3" class="ok ${st.rating==3?'sel':''}">3 적합</button>
      </div>
      <textarea placeholder="메모(선택)">${esc(st.note||"")}</textarea>`;
    card.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>{
      state[it.id] = {rating:Number(b.dataset.r), note: card.querySelector("textarea").value};
      save(); render();
    });
    card.querySelector("textarea").oninput = e => {
      state[it.id] = Object.assign({}, state[it.id], {note:e.target.value}); save();
    };
    list.appendChild(card);
  }
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
document.querySelectorAll(".tabs button[data-f]").forEach(b=>b.onclick=()=>{
  filter=b.dataset.f; document.querySelectorAll(".tabs button[data-f]").forEach(x=>x.classList.toggle("on",x===b)); render();
});
document.getElementById("unrated").onclick = e => { onlyUnrated=!onlyUnrated; e.target.classList.toggle("on",onlyUnrated); render(); };
document.getElementById("reset").onclick = ()=>{ if(confirm("모든 판정을 지울까요?")){ state={}; save(); render(); } };
document.getElementById("export").onclick = ()=>{
  const rows = ITEMS.map(i=>({kind:i.kind,id:i.id,input:i.input,output:i.output,rating:(state[i.id]||{}).rating||null,note:(state[i.id]||{}).note||""}));
  const blob = new Blob([JSON.stringify(rows,null,1)],{type:"application/json"});
  const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="gdata_review.json"; a.click();
};
render(); renderProgress();
</script></body></html>
