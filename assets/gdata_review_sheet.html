<style>
:root{--bg:#0f1115;--card:#171a21;--fg:#e8eaf0;--mut:#9aa3b2;--acc:#4f8cff;--ok:#37c26a;--bad:#e05555;--line:#262b36}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.95);backdrop-filter:blur(8px);padding:12px 14px;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0 0 8px}
.bar{height:6px;background:#222838;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-top:6px}
.tabs{display:flex;gap:6px;padding:10px 14px 0}
.tabs button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:13px}
.tabs button.on{color:#fff;border-color:var(--acc);background:#1b2740}
main{padding:12px 14px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.kind{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#23304a;color:#9dc0ff;margin-bottom:8px}
.id{color:var(--mut);font-size:11px;margin-left:8px}
.label{color:var(--mut);font-size:12px;margin:10px 0 4px}
.text{white-space:pre-wrap;word-break:break-word;background:#11141b;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:220px;overflow:auto;font-size:14px}
.rate{display:flex;gap:8px;margin-top:10px}
.rate button{flex:1;padding:12px 0;border-radius:10px;border:1px solid var(--line);background:#11141b;color:var(--fg);font-size:14px}
.rate button.sel{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.rate button.bad.sel{background:var(--bad);border-color:var(--bad)}
.rate button.ok.sel{background:var(--ok);border-color:var(--ok)}
textarea{width:100%;margin-top:8px;background:#11141b;border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:10px;font:inherit;resize:vertical;min-height:44px}
footer{position:fixed;left:0;right:0;bottom:0;background:rgba(15,17,21,.97);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px}
footer button{flex:1;padding:13px;border-radius:12px;border:0;background:var(--acc);color:#fff;font-size:15px;font-weight:600}
footer button.ghost{background:#222838;color:var(--fg)}
.hint{color:var(--mut);font-size:12px;text-align:center;margin:8px 0 0}
</style></head><body>

<script>
const ITEMS = [{"kind": "F6", "id": "s0610", "input": "그런데도 야당이 정치적 계산 아래 침묵이나 방관으로 노조 편을 들며 개혁을 방해하는 것은 국민 여론에 대한 거역이며 큰 부담을 짊어질 미래 세대에 죄를 짓는 행동이다.", "output": "그런데도 야당이 정치적 계산 아래 침묵이나 방관으로 노조 편을 들며 개혁을 방해하는 것은 국민 여론에 대한 거역이며 큰 부담을 짊어질 미래 세대에 죄를 짓는 행동 이다."}, {"kind": "F5", "id": "REPORT-news_r-01672-00001", "input": "오는 3월 열릴 주주총회부터 국민연금의 발언권이 대폭 강화된다.\n    정부는 국민연금 등 기관투자자의 주주권 행사를 지원하는 것을 골자로 하는 상법·자본시장법·국민연금법 시행령 개정안을 21일 국무회의에서 의결했다.\n  이중 상법·국민연금법 시행령은 공포 후 즉시, 자본시장법 시행령은 2월 1일부터 시행된다.\n    이는 앞서 지난 7일 문재인 대통령이 신년사를 통해 예고했던 내용이다.\n  당시 문 대통령은 “법 개정이 어려운 상황에서 시행령 등의 제·개정을 통해 ‘스튜어드십코드’를 정착시키고 대기업의 건전한 경영을 유도할 수 있는 기반을 곧 마련할 것”이라고 밝혔다.\n  ‘스튜어드십코드(수탁자책임원칙)’를 통해 국민연금의 대기업 경영에 대한 감시·견제 기능을 강화하겠다는 뜻으로 해석된다.\n  국민연금에 5%룰 완화해줘이날 국무회의 의결로 국민연금 등 공적연기금은 이른바 ‘5%룰’ 적용이 일부 완화된다.\n    기존 법령에 따르면 상장회사 주식을 5% 이상 보유한 주주는 1% 이상 지분을 사고팔 때마다 이를 5일 내 공시해야 한다(5%룰).\n  다만 국민연금 같은 공적 연기금이 경영참여가 아닌 단순투자 목적으로 주식을 사고팔 때는 5%룰의 적용을 면제받는다는 예외 규정이 있었다.\n  그간 5%룰은 국민연금의 주주활동에 걸림돌이 될 수 있다는 지적이 많았다.\n  스튜어드십코드 취지대로 국민연금이 주주로서 목소리를 내면 단순투자 목적이 아니라 경영참여 목적으로 볼 수 있어 5%룰을 적용해야 한다는 해석이 나와서다.\n  국민연금으로서는 5%룰에 따라 지분 변동 내역을 즉시 공시하면 매매전략과 투자패턴이 공개돼버려 부담이 컸다.\n  자칫 추종매매로 인해 수익률이 하락할 수 있다는 우려도 나왔다.\n    이에 따라 정부는 이번 시행령 개정을 통해 5%룰 적용 범위를 축소했다.\n  공적연기금의 기업 지배구조 개선을 위한 정관 변경 추진이나 회사 임원의 위법행위에 대한 해임청구권, 배당과 관련한 주주활동 등은 경영참여가 아니라고 보고 5%룰 적용에서 제외했다.\n  국민연금 등 5%이상 지분을 보유한 공적연기금은 이러한 주주활동을 하더라도, 지분변동이 있었던 달의 다음달 10일 이내에만 변동내용을 공시하면 된다.\n  이에 따라 국민연금이 스튜어드십코드에 따라 기업 경영에 관여할 수 있는 범위는 한층 넓어진다.\n  지난해 말 현재 국민연금이 지분 5% 이상을 보유한 상장사는 313곳이다.\n    사외이사 임기제 도입이날 개정된 상법 시행령은 사외이사의 임기를 제한하는 것이 골자다.", "output": "문 대통령이 신년사를 통해 예고한 스튜어드십코드의 정착 등 정부는 상법과 국민연금법 등의 시행령 개정안을 의결 및 시행한다."}, {"kind": "F6", "id": "s0786", "input": "이마저도 국회가 처리 약속을 지키지 못한다면 그 피해는 고스란히 국민이 입게 된다.", "output": "이마저도 국회가 처리 약속을 지키지 못한다면 그 피해는 고스란히 국민이 입게 된 다."}, {"kind": "F6", "id": "s0808", "input": "경제 현실은 갈수록 심각해지고 총수들이 없는 그룹들은 투자나 구조조정에 큰 차질을 빚고 있다.", "output": "경제 현실은 갈수록 심각해지고 총수들이 없는 그룹들은 투자나 구조조정에 큰 차질을 빚고 잇다."}, {"kind": "F6", "id": "s0919", "input": "이런 시간 낭비 염려를 해소하기 위해서도 새정치민주연합은 하루빨리 자신들 대안을 내놓고 개혁안 조율에 나서야 한다.", "output": "이런 시간 낭비 염려를 해소하기 위해서도 새정치민주연합은 하루 빨리 자신들 대안을 내놓고 개혁안 조율에 나서야 한다."}, {"kind": "F5", "id": "REPORT-news_r-04764-00001", "input": "‘기생충 열풍’이 얼어붙은 경제를 녹인다.\n  봉준호 감독의 영화 ‘기생충’이 아카데미에서 작품상 등 4관왕에 오른 뒤 ‘짜파구리’ 등 영화에 등장한 식음료 제품들까지 덩달아 인기를 끌고 있다.\n  이는 최근 신종 코로나바이러스로 침체된 국내 경기에 활력을 더한다는 점에서 긍정적으로 평가된다.\n  기생충 특수를 누리는 제품과 의미를 들여다봤다.\n  서울 여의도에 사는 주부 강유경(38)씨는 최근 대형마트를 찾았다 짜파구리(짜파게티+너구리) 열풍을 실감했다.\n  라면매대에 짜파구리 코너가 생겼고, 마트는 이 두 라면을 함께 구매한 사람에게 할인해주는 행사까지 내걸었다.\n  정육코너에선 ‘짜파구리용 소고기’가 별도로 판매되고 있고, 그마저도 몰려든 사람들로 조기 품절이 됐다.\n   ‘짜파구리 신드롬’ 숙박업계까지 상륙 짜파구리 인기가 뜨겁다.\n  영화 기생충에 소고기 채끝살을 넣은 짜파구리 요리가 등장하면서다.\n  농심에 따르면 아카데미 시상식이 열린 지난 10일 기준으로 11~15일 짜파게티와 너구리 합산 매출은 전주(2월 4~8일)보다 약 55% 증가했다.\n  한국 영화 최초 오스카 수상이라는 쾌거에 소비자들이 화제가 된 짜파구리를 먹어보기 위해 직접 마트를 찾은 것이다.\n  지난 20일엔 봉준호 감독 등 제작진·출연진이 청와대에 초청돼 문재인 대통령과 짜파구리 만찬을 즐겨 화제가 되기도 했다.\n  짜파구리 신드롬은 대형마트를 넘어 호텔 스위트룸에서 프랜차이즈까지 무대를 가리지 않는다.\n  특히 최근 숙박업계엔 ‘짜파구리 호캉스’가 유행처럼 번지고 있다.\n  여의도 글래드호텔은 스위트 객실에서 소고기가 들어간 짜파구리를 룸서비스로 즐길 수 있는 ‘스위트 플렉스’ 패키지를 다음 달 말까지 선보인다.\n  글래드 강남 코엑스센터의 ‘뷔페G’는 이달 말까지 런치·디너 고객을 대상으로 채끝 짜파구리를 2인당 1개씩 제공한다.\n  외식업계도 마찬가지다.\n  서울 광화문의 한우 레스토랑 ‘한육감’ 디타워점은 지난 18일부터 ‘한우 채끝 짜파구리’를 판매 중이다.\n  유명 맥주 프랜차이즈 ‘역전할머니맥주’에서는 짜파구리에 어묵·떡·메추리알·치즈 등을 넣은 퓨전요리를 판매하고 있다.\n  가격도 안주치곤 저렴한 8000원.\n  한 편의점에서는 짜파구리+한우 한정판 세트를 내놓기도 했다.\n  영화 속 기우(최우식 분)와 민혁(박서준 분)의 동네 슈퍼마켓 앞 술자리에서 등장한 ‘오징어땅콩’도 주목받고 있다.\n  1976년 출시해 올해로 44주년을 맞은 오리온의 장수 브랜드로, 고소하면서도 바삭한 식감으로 사랑받는 제품이다.", "output": "영화 기생충에 나온 식음료 제품들이 인기를 끌면서 신종 코로나 바이러스로 침체된 국내 경기에 활력을 더하고 있다."}, {"kind": "F5", "id": "REPORT-news_r-01053-00001", "input": "당신이 있는 곳이 어디든, 그곳이 경희사이버대학교의 캠퍼스가 된다.\n    글로벌한국학전공 정유경 학생은 유학과 직장관계로 현재 15년 넘게 일본에서 생활하고 있다.\n  평소부터 한국어교육과 한국어 교원 자격증 등에 관심을 두고 있었는데, 일본에서 한국어 교육에 종사하는 지인과 이야기를 하던 중 경희사이버대학교 대학원에 대한 이야기를 듣게 되었다.\n  인터넷을 통해 우리학교 대학원에 여러가지 정보를 수집하면서 교육과정과 커리큘럼이 흥미롭게 다가왔다.\n  특히, 해외에 거주하면서도 학위를 취득할 수 있다는 사실에 망설임 없이 경희사이버대학교 대학원을 선택했다고 한다.\n    일본에서 유학 시절에 아르바이트로 한국어를 가르치거나 소규모로 한국어 강좌를 담당한 적이 있지만, 외국인을 대상으로 한 한국어교육에 관한 체계적인 교육을 받은 적이 없어 이에 대한 갈증을 해소하고자 글로벌 한국학 전공을 선택했다고 한다.\n   한국의 여러 기관에서 한국어교원 자격증을 취득할 수 있는 과정이 있지만, 심도 있게 연구도 할 수 있는 석사과정을 밟는 것이 좋을 것이라 생각하였다.\n    “전공의 교수님들이 주축이 되어 시행하고 있는 ‘KF 글로벌 e-스쿨 사업’ 이라든지 해외의 다양한 곳에서 활동하고 있는 여러 학우들과 구축된 해외 네트워크는 한국어교육에 대한 다양한 경험과 노하우를 얻을 수 있을 것” 이라는 기대와 확신을 바탕으로 경희사이버대 대학원 진학을 결정하였다고 전했다.\n  “현재 2학기 막바지에 접어들고 있는데, 수강한 모든 과목의 수업 내용과 교수님들의 열의가 인상 깊다.\n  학기 중의 온라인 세미나에서는 늦은 시간까지 최대한 많은 것을 알려주시고 이끌어 주시려는 교수님의 열정과 더불어 일과 학업을 병행하는 학우님들의 열정적인 자세 또한 항상 자극이 되었다” 고 소감을 밝혔다.\n  특히, 이번 학기에 수강하고 있는 ‘한국학연구방법론’이라는 과목은 미지의 세계로 들어선 계기가 되어, 앞으로의 연구나 교육활동에 적용할 수 있을 것 같다며 학교의 커리큘럼과 높은 질의 강의에 만족감을 나타냈다.\n    “일본어에 目から鱗が落ちる（메카라 우로코가 오치루 : 어떤 계기로 갑자기 깨달음을 얻는 것）라는 속담이 있는데, 대학원에서의 수업을 들으면서 늘 이 속담이 떠올랐다.\n  일본의 대학원에서 정치사회학을 전공으로 석·박사 학위를 취득한 후, 한국의 대학에서 일본어와 일본사회에 관한 강의와 연구를 한 경험이 있다.\n  현재는 일본의 대학에서 인구감소와 고령화사회에 직면한 한국과 일본의 중산간 지역의 지속가능성, 마을만들기 등을 테마로 양국의 중산간지역 필드학습을 기획하거나 지역주민, 행정과 연계한 과제해결형 프로젝트도 수행하고 있다.", "output": "한국어교육에 관심이 있었던 정 학생은 해외에서 거주하면서도 학위 취득이 가능한 경희사이버대학교 대학원을 선택했다."}, {"kind": "F5", "id": "REPORT-news_r-02226-00001", "input": "2012년 대선을 앞두고 당시 경제개혁연대 소장이었던 김상조 교수를 인터뷰한 적이 있다.\n  그 시절엔 경제민주화 열풍이 거셌고 여야가 경쟁적으로 센 공약을 쏟아내고 있었다.\n  인터뷰 때 귀에 꽂히듯 다가왔던 그의 말이 몇 대목 있었다.\n  방법론적 최소원칙, 거대담론에 대한 비판, 법치주의 같은 거였다.\n  방법론적 최소원칙이란 모든 이들이 인정하는 부분부터 천천히 개혁하자는 의미였다.\n  경제민주화한다고 너도나도 한마디씩 거들다 보니 “가장 과격한 재벌 개혁론자였단 내가 이젠 중간에 불과하다”는 말을 했고, 그게 신문에 제목으로 뽑혔다.\n  거대담론만으로는 세상을 변화시킬 수 없으며, 구체적인 정책을 만들고 집행하는 능력이 한국 사회에 부족하다는 지적은 예나 지금이나 ‘뼈를 때리는’ 지적이다.\n  법치주의는 흔히 보수의 슬로건인데, 왜 진보의 아이콘인 그가 거론했을까.\n  “사회가 정한 게임의 법칙을 지키는 자에게는 보상을 주고 기회주의적 행동을 하는 자에게는 제재한다는 원칙을 세우고 이를 엄정하게 집행해야 한다.\n  이런 원칙 없이는 어떠한 개혁·진보도 실패할 것이다.\n ” 지난 16일, 청와대 정책실장에 취임한 지 7개월 다 돼가는 그를 다시 인터뷰했다.\n  특유의 달변은 여전했지만 과거 인터뷰처럼 ‘꽂히는’ 표현은 없었다.\n  아무래도 시민단체 대표 시절처럼 자유롭게 개인 생각을 밝히기는 쉽지 않았을 것이다.\n  정부 정책을 옹호하고 배경을 설명하는 가지런하고 정선된 말들이 이어졌다.\n  어지간히 대화가 오간 뒤에 물었다.\n  그가 강조했던 방법론적 최소원칙이 과연 문 정부에서 지켜지고 있다고 믿는지 궁금했다.\n  최저임금의 급격한 인상과 비정규직 제로 정책, 근로시간 단축 등은 경제정책이 지켜야 할 합리적인 선을 넘어섰다고 평소 생각했다.\n  김 실장은 경제는 정치와 다르다고 했다.\n  정치는 표를 좇더라도 경제는 국민의 다수가 공감하는 ‘가운데 길’로 가야 한다고 답했다.\n  인터뷰에서 가장 인상적인 대목이었다.\n  지면에선 빠졌지만 이런 말도 했다는 걸 기록으로 남긴다.\n  “어느 한 쪽만의 강한 지지와 다른 쪽의 강한 비난을 받는 정책보다는 차라리 양쪽 모두로부터 비판받는 ‘가운데 길’로 가는 게 성공적인 경제정책의 길이라고 그때도 생각했고 지금도 그렇게 생각한다.\n ” ‘가운데 길’로 간다는 데 왜 노조 편향이라는 말이 나오는지 묻자 “문재인 정부는 노동 존중 사회를 표방한 정부”라면서 이렇게 답했다.", "output": "김 교수는 거대담론만으로는 세상을 변화시킬 수 없으며 구체적인 정책을 만들고 집행하는 능력이 한국 사회에 부족하다는 지적은 뼈를 때리는 지적이다."}, {"kind": "F5", "id": "REPORT-news_r-03504-00001", "input": "서울 노량진의 한 구석진 골목 피자집도 잔칫집 같았다.\n  영화 '기생충' 속 기택(송강호 분)네가 동익(이선균)네 가정부를 쫓아내기 위한 작당 모의를 하던 배경으로 등장한 곳이다.\n  10일 오후 기자가 도착했을 때 테이블은 모두 동네 주민 9명으로 가득 차 있었고 일본 방송사 NHK 기자가 스탠딩 촬영 중이었다.\n  이 집 단골이라는 주민들은 피자가 나오자 \"여기 피자가 제일 맛있어\"라고 한 마디씩 큰 소리로 말했다.\n  피자 가게 주인 엄항기(66)씨는 봉준호 감독이 아카데미에서 전해온 낭보에 \"이렇게까지 잘 될 줄은 몰랐다\"며 축하 인사를 전했다.\n  그는 \"봉준호 감독님을 처음 봤을 때 청바지에 티셔츠 하나만 걸치고 가게를 둘러보고 있었다\"며 \"너무 수더분해서 이렇게 대단한 분인지 처음엔 몰랐다.\n  촬영할 때 보니 '배운 분'이라 그런지 큰 소리 한 번 안 내고 점잖은 신사였다\"고 떠올렸다.\n  서울 전역서 피자집 물색…봉준호 한번에 \"오케이\"  엄 사장 부부는 2002년 이곳 노량진에 프랜차이즈가 아닌 개인 브랜드의 피자집을 열었다.\n  이전에 전 빵집을 운영했지만 프랜차이즈 가게에 밀렸다고 한다.\n  반죽 만큼은 자신 있었던 부부는 직접 반죽하고 굽는 컨셉의 피자집을 열었다.\n  하지만 현실은 녹록지 않았다.\n  엄 사장은 \"장사도 안되고 힘들 때 영화 관계자가 찾아왔다.\n  처음엔 남편 반대가 심했는데, 촬영 장소 대여료도 나오고 무엇보다 딸 내외가 봉 감독의 팬이라 적극 찬성을 해 촬영이 성사됐다\"고 전했다.\n  남편 강양희(72) 사장은 '왜 그렇게 반대하셨냐'는 질문에 \"조용한 동네에 민폐 끼치기 싫어서\"라고 답했다.\n  한국에서 유학 중이던 노르웨이인 사위가 특히 봉 감독의 영화는 다 챙겨본 열성 팬이었다고 한다.\n  딸 내외의 지지에 힘입어 촬영 장소를 빌린 봉 감독은 엄 사장 딸과 사위의 이름을 적고 사인을 남기기도 했다.\n  영화 제작사 섭외 관계자에 따르면 '기생충' 섭외 팀은 피자 가게를 섭외하기 전 서울 전역에서 피자집을 물색했다.\n  프랜차이즈는 제외했다.\n  노량진에서 찾은 엄씨의 가게는 영화 특유의 느낌을 살리기에 최적의 장소였다.\n  내부 공간이 호프집처럼 분할돼 있어 동선을 살리기에도 적합했다.\n  봉 감독은 이곳을 방문하자마자 \"오케이\"를 외쳤다.\n  봉 감독, 피자집 손뜨개 수세미도 활용 피자집은 영화 구석구석에 기여했다.\n  피자 박스 접기 아르바이트 장면을 찍기 전 기택네가 생계를 위해 접던 피자 박스도 여기 전시돼 있다.", "output": "직접 반죽하고 굽는 컨셉의 피자집을 연 부부는 조용한 동네에 폐 끼치기 싫었지만 결국 피자집을 봉 감독 영화의 촬영 장소로 대여하게 되었다."}, {"kind": "F6", "id": "s0819", "input": "또한 사교육비는 영어만의 문제가 아니다.", "output": "또한 사교육비는 영어 만의 문제가 아니다."}, {"kind": "F6", "id": "s0213", "input": "문제는 박 원내대표 지도력을 흔들고 있는 당내 강경파다.", "output": "문제는 박 원내대표 지도력을 흔들고 있는 당내 강경 파다."}, {"kind": "F6", "id": "s0141", "input": "서로가 가장 솔직하고 현실적인 대화로 투자와 고용을 늘릴 실질적인 방안을 찾아내야 한다.", "output": "서로가 가장 솔직하고 현실적인 대화로 투자와 고용을 늘릴 실질적인 방안을 찾아내야한다."}, {"kind": "F5", "id": "REPORT-news_r-00228-00001", "input": "추미애(62·사법연수원 14기) 법무부 장관이 취임 일성으로 “검찰개혁의 성공적 완수를 위해서 줄탁동시(啐啄同時)가 이뤄져야 할 것”이라며 검찰 내부의 자발적 쇄신을 주문했다.\n 추 장관은 10분 남짓한 취임사에서 “뿌리부터 바꿔내는 ‘개혁의 마중물’이 되어야 한다”고도 언급하는 등 ‘개혁’이라는 단어를 총 17번 반복하며 강도 높은 검찰개혁을 예고했다.\n    줄탁동시는   추 장관은 ‘검찰의 안과 밖에서 개혁을 향한 결단과 호응이 병행되는 줄탁동시’를 검찰개혁 성공을 위한 전제로 들었다.\n  줄탁동시는 병아리가 알에서 깨어나기 위해서는 어미 닭이 밖에서 쪼고 병아리가 안에서 쪼며 서로 도와야 한다는 뜻이다.\n    이를 설명하기 위해 대본에 없는 멘트를 즉석으로 덧붙이기도 했다.\n  추 장관은 “밖에서 알을 깨려고 하는 사람은 국민”이고 “안에서 알껍질을 깨고 나오려는 사람은 검찰 조직이 아니라 개개 검사들”이라고 강조했다.\n    검찰개혁 동반자 주문… 왜? 또 준비된 대본에는 없었지만 “검찰을 개혁의 대상으로만 치부하지 않고 한 분 한 분을 진심으로 개혁의 동반자로 삼겠다”고 힘주어 말했다.\n  당장 내주부터 검찰 고위직에 대한 인사가 대거 단행될 것이라는 관측이 나오면서 걷잡을 수 없는 검찰 내부 반발이 예상되자 이를 염두에 두고 든 비유 아니냐는 해석이 나온다.\n    특히 검찰 ‘조직’이 아니라 ‘개별검사’의 의지를 강조한 대목이 검사들에게 조직 논리에 매몰되지 말라고 지시한 것이라는 분석이 나왔다.\n  '윤석열 사단' 대거 참석 이날 취임식에는 윤석열 검찰총장의 최측근을 비롯한 검사장급 간부들도 대거 참석했다.\n  대검에서만 강남일 대검 차장, 이원석 대검 기조부장, 박찬호 대검 공안부장, 조상준 대검 형사부장, 이두봉 대검 과수부장, 한동훈 대검 반부패부장 등 8명의 간부가 참석했다.\n     배성범 서울중앙지검장, 조남관 서울동부지검장 등 서울·수도권 재경지검 검사장들도 다수 참석했다.\n  '조국 장관 가족 수사', '유재수 감찰 무마 의혹 수사', '청와대 선거 개입 의혹 수사' 등 청와대와 친여권을 겨눈 수사를 이끌고 있는 검찰 간부들이 모두 참석한 것이다.\n  취임식이 끝난 뒤에는 추 장관이 직접 객석을 찾아 악수도 건넸다.\n   조국(55) 전 장관 취임 당시 법무부 소속이 아닌 검찰 측 검사장 인사는 김영대 서울고검장이 유일했던 것과 사뭇 대조적인 광경이다.\n  당시 다수의 검찰 간부들은 조 전 장관과 가족 수사를 지휘하고 있다는 이유로 빠졌다고 한다.", "output": "취임사에서 강도 높은 검찰개혁을 예고한 추 장관은 검찰 내부의 자발적 쇄신을 주문하며 줄탁동시가 이뤄져야 할 것이라고 말했다."}, {"kind": "F6", "id": "s0639", "input": "노조가 파업 이유로 내건 연봉제 철회, 임금 인상 주장도 납득하기 어렵다.", "output": "노조가 파업 이유로 내건 연봉제 철회, 임금 인상 주장도 납득하기 어렵다"}, {"kind": "F6", "id": "s0345", "input": "무조건 더 내고 덜 받는 개혁을 하고 나중에는 일본처럼 국민연금과 통합하는 것이 맞다.", "output": "무조건 더내고 덜 받는 개혁을 하고 나중에는 일본처럼 국민연금과 통합하는 것이 맞다."}, {"kind": "F5", "id": "REPORT-news_r-00506-00001", "input": "미국 앤젤로주립대 글로벌 특별 전형  국내 대학의 2020학년도 입시가 마무리되고 있다.\n  정시모집, 그 중에서도 군별(가·나·다 군) 전형기간만 남은 상황이다.\n  하지만 조금만 눈을 돌리면 한 번의 기회가 더 남아 있다.\n  다름 아닌 미국 명문대 입시다.\n  수능 성적이나 내신이 5등급 이내면 글로벌 특별 전형을 통해 합격할 수 있는데다 학비 감면 혜택도 누릴 수 있다.\n  졸업 후엔 현지 취업의 기회도 열려 있다.\n  글로벌 인재를 꿈꾸는 대입 수험생에게 미국 텍사스주에 위치한 앤젤로주립대(Angelo State University)가 문턱을 낮추고 입학 문을 활짝 열었다.\n    # 앤젤로주립대를 졸업한 김영광(2014년 졸업, 회계학 전공)씨는 현재 미국의 한 회계법인에서 세무사로 일하고 있다.\n  미국에서 취업하겠다는 꿈을 이루기 위해 재학 시절부터 교내에서 제공하는 인턴십 프로그램에 꾸준히 참여해 이력을 쌓았고, 회계사 출신 교수들에게 주기적으로 상담받으며 공부했다.\n  또한 앤젤로주립대가 제공하는 ‘텍사스 명문 주립대 시스템’으로 교육 받았다는 점은 취업 시장에서 큰 경쟁력으로 작용했다.\n  김씨는 “교내에서 인턴 모집을 할 때나 취업 준비를 할 때 외국 학생이란 이유로 차별하기보단 오히려 개방적인 자세로 많은 도움을 줬다”고 회상했다.\n  # 앤젤로주립대에서 국제 경영학을 전공한 졸업생 김민지(2017년 졸업)씨는 미국 뉴저지의 한 물류 회사에서 수입 오퍼레이터(Import Operator)로 재직 중이다.\n  학부에서 공부한 내용과 직결되는 직무를 맡아 만족도가 높다.\n  김씨는 한국에서 편입을 준비하다가 저렴한 학비로 미국에서 유학할 수 있다는 앤젤로주립대의 매력에 끌렸고 이곳으로 편입해 총학생회 활동, 동아리 활동, 유엔 청년의회 참석 등 다양한 경험을 쌓았다.\n  김씨는 “부족한 영어 실력을 끌어올리기 위해 학교에서 영어 모임을 만들어 미국 드라마, 영어 영상을 함께 시청하고 대사를 외우며 공부했다”며 “영어로 이력서를 작성할 때는 교수님들이 많이 도와주신 덕분에 인터뷰 제안을 많이 받을 수 있었다”고 말했다.\n   유학생 취업 지원 시스템 우수이처럼 미국에서 유학한 후 현지 취업까지 계획하는 국내 학생들에게 앤젤로주립대가 든든한 지원군이 되고 있다.\n  특히 회계학·컴퓨터공학과 등을 전공하면 현지 취업에 유리하다는 게 학교 측의 설명이다.\n  컴퓨터공학과의 졸업생 취업률은 90% 정도며 IBM·인텔 같은 세계적 IT기업에 취업하는 사례도 많다.", "output": "앤젤로주립대를 졸업한 김 씨는 인턴십 프로그램에 꾸준히 참여해 이력을 쌓았고 텍사스 명문 주립대 시스템으로 교육 받은 것이 취업 시장에서 큰 경쟁력으로 작용했다."}, {"kind": "F5", "id": "REPORT-news_r-01743-00001", "input": "“유재수는 참여정부 청와대 행정관으로 근무한 사람.\n  나와도 가까운 관계다.\n ”(윤건영 전 청와대 국정기획상황실장) “민정(수석실)은 (유재수 영전에 대해) 이견 없다.\n ”(백원우 전 민정비서관) 유재수 전 부산시 부시장 구명에 나선 친문 인사들의 청탁 내용이 조국 전 법무부 장관 공소장을 통해 생생하게 공개됐다.\n  백원우 당시 민정수석실 민정비서관도 유 전 부시장 구명과 영전 묵인 등 과정에서 적극적인 역할을 했던 것으로 조사됐다.\n  20일 주광덕 자유한국당 의원이 공개한 조 전 장관의 감찰 중단(직권남용권리행사방해 혐의) 사건 공소장에 따르면 유 전 부시장은 2017년 금융위원회 금융정책국장 재직 시 금품수수 등 비리 혐의에 대한 청와대 감찰이 시작되자 친문 실세들에게 구명을 요청했다.\n  유 전 부시장은 그해 10월께 김경수 경남지사 등에게 “감찰을 받게 돼 억울하다.\n  자리를 유지하게 해 달라”고 부탁했다.\n  김 지사는 백원우 당시 청와대 민정비서관에게 수차례 연락해 “참여정부 시절 함께 고생한 사람이다.\n  감찰을 받고 있는데 억울하다고 하니 잘 봐달라”는 취지로 부탁한 것으로 공소장에 기재됐다.\n  윤 전 실장도 백 전 비서관에게 “유재수가 나와 가까운 관계”라고 말했고, 천경득 청와대 선임행정관은 이인걸 당시 특별감찰반장에게 “참여정부에서 근무한 유재수를 왜 감찰하느냐.\n  청와대가 금융권을 잡고 나가려면 유재수 같은 사람이 필요하다”고 했다는 게 검찰 조사 결과다.\n  공소장에 따르면 이후 백 전 비서관은 박형철 전 청와대 반부패비서관에게 “(유 전 부시장을) 봐주면 어떻겠냐”고 말했다가 거부당하자 “사표만 받고 처리하면 되는 것 아니냐”고 재차 제안했다.\n  박 전 비서관은 이를 거부하고 감찰 진행 상황과 비위 내용 등을 담은 이른바 ‘4차 보고서’를 작성해 당시 민정수석이던 조 전 장관에게 전달했다.\n  조 전 장관은 박 전 비서관에게 “여기저기서 전화가 많이 온다”며 “백 비서관과 감찰 건 처리를 상의하라”고 지시했다.\n  이후 유 전 부시장에 대한 감찰은 중단됐다.\n  검찰은 조 전 장관이 백 전 비서관으로부터 “유재수가 현 정부 핵심 요직에 있고 정부 핵심 인사들과도 친분이 깊은데 정권 초기에 이런 배경을 가진 유재수의 비위가 크게 알려지면 안 된다”는 의견을 전달받은 것을 감찰 중단의 결정적 동기로 봤다.\n  공소장에 따르면 조 전 장관은 당시 금융업계 관계자들로부터 고가 승용차 무상 이용 등 1000만원 이상의 금전적 이익을 취했다는 유 전 부시장 자백까지 받아놓고도 감찰을 중단했다.", "output": "주 의원이 공개한 조 전 장관의 감찰 중단 사건 공소장에 따르면 유 전 부시장은 금융정책국장 재직 시 비리 혐의에 대한 청와대 감찰이 시작되자 억울하다며 구명을 요청했다."}, {"kind": "F5", "id": "REPORT-news_r-03166-00001", "input": "신종 코로나바이러스로 인해 중국의 직장 풍경이 바뀌고 있다.\n  실제 직장에 출근해 업무를 하는 경우는 되도록 출근 날짜를 늦추고 있으며 많은 수의 사업장은 재택근무로 전환하고 있다.\n  이에 따른 '해프닝'도 다양하다.\n     중국경제망에 따르면 지난달 28일 중국 장쑤 성에서는 오는 9일 24시 전까지는 업무개시를 하면 안 된다는 통지가 나왔다.\n  그러나 이를 무시한 채 지난 1일 가동 중인 방직공장이 당국에 적발됐다.\n  중국경제 망은 \"해당 공장 사장이 행정구류 5일 처분을 받았다\"고 보도했다.\n    긴 설 연휴를 마치고 지난 3일부터 본격적인 업무개시가 시작된 중국에선 바이러스 감염을 우려해 상당수가 재택근무 중이다.\n   대부분 중국 기업들은 2월 3~2월 7일은 재택근무를 하고 8~9일 주말을 보낸 뒤 10일부터 정상출근을 준비하는 분위기다.\n   상하이시 정부의 경우 \"도시 운영에 필요한 분야, 전염병 방지 필수 분야, 대중 생필품 분야 및 기타 주요 민생 관련 기업을 제외한 기타기업은 9일 24시까지 업무재개를 하지 않는다\"고 통지했다.\n  법무법인 율촌의 변웅재 변호사는 \"노동 당국에서 별도 공지를 하지 않는 한 기업은 근로자에게 2월 3일~2월 9일 재택근무를 지시할 수 있다\"는 뜻이라고 설명했다.\n    업무개시 첫날이었던 지난 3일, 알리바바에서 개발한 업무용 메신저 시스템인 딩딩에 접속자가 몰리며 한때 '먹통'이 되기도 했다.\n  딩딩은 중국의 대표적인 업무용 메신저로 현재 약 2억명의 회원을 두고 있다.\n    재택근무 수요가 폭발적으로 늘자 최근 다운로드 순위에서만 보면 딩딩이 국민 메신저인 중국판 카카오톡인 위챗을 앞지르는 일도 벌어졌다.\n  딩딩은 비즈니스 및 업무용으로 특화된 메신저이기 때문에 직장인 사이에서 널리 사용되고 있다.\n    이번 신종코로나 바이러스를 계기로 중국 내에서 '재택근무 혁명'이 일어날 조짐을 보인다.\n  글로벌 워크플레이스 애널리스틱스에 따르면 2005년 중국 내에서는 원격근무하는 사람이 180만명이었는데 2014년 이 숫자가 360만명으로 늘었다.\n  2017년 기준 중국의 원격근무 시장 규모는 60억 위안(약 1조원)으로 추정됐다.\n  이는 전년동기대비 68% 증가한 수치다.\n     재택근무라고 마냥 편한 것만은 아니다.\n  동료들과 아침에 화상회의를 하다 보니 \"부장님이 잠옷을 입고 회의하는 모습을 봤다\"는 반응도 있다.\n  이에 대해 소후왕은 \"집에서 업무를 본다고 파자마 차림으로 있어야 하는가에 대해 논쟁이 있다\"고 보도했다.", "output": "중국에서 신종 코로나바이러스 감염을 우려한 상당수의 사업장이 재택근무를 시행하고 있는 가운데 이에 따른 다양한 해프닝이 일어나고 있다."}, {"kind": "F6", "id": "s0230", "input": "특례로 얼마든지 돌파할 수 있는 문제다.", "output": "특례로 얼마든지 돌파할수 있는 문제다."}, {"kind": "F6", "id": "s0021", "input": "일본은 아주 계산적으로 움직이고 있다.", "output": "일본은 아주 계산적으루 움직이고 있다."}, {"kind": "F6", "id": "s1093", "input": "똑같이 위반해도 걸리는 것은 복불복이니 법의 형평성도 문제다.", "output": "똑같이 위반해도 걸리는 것은 복불복이니 법의 형평성도 문젠다."}, {"kind": "F6", "id": "s1057", "input": "그러나 악의적으로 배우자에게 큰 고통을 안긴 경우에는 거액의 징벌적인 위자료를 물려야 한다.", "output": "그러나 악의적으로 배우자에게 큰 고통을 안긴 경우에는 거액의 징벌적인 위자료를 물려야 한다"}, {"kind": "F6", "id": "s0636", "input": "지역 편중 인사가 어떤 파국적 결과를 가져오는지는 역대 정권에서 수차례 입증됐다.", "output": "지역 편중 인사가 어떤 파국적 결과를 가져오는지는 역대 정권에서 수차례 입증 됐다."}, {"kind": "F6", "id": "s0764", "input": "양국 관계 정상화에 반대하는 쿠바 출신 미국인들의 고유한 정서도 무시해선 안 되지만 이 때문에 미국 정책이 잘못된 궤도에 묶여 있어선 안 된다는 점도 상기시켰다.", "output": "양국 관계 정상화에 반대하는 쿠바 출신 미국인들의 고유한 정서도 무시해선 않 되지만 이 때문에 미국 정책이 잘못된 궤도에 묶여 있어선 안 된다는 점도 상기시켰다."}, {"kind": "F5", "id": "REPORT-news_r-02577-00002", "input": "“봉준호 감독이 15장 분량의 '기생충' 시놉시스를 보여준 게 아직도 기억이 난다.\n  '이런 이야기를 하려고 한다'며 시놉시스를 줬는데 단 15장만으로도 좋았다.\n  그냥 시작부터 끝까지 좋았다.\n  물론 팬심에서 생긴 작품에 대한 호감도도 높았겠지만 '기생충'이라는 발상부터가 신기했다.\n  마치 '기생충' 속 기정(박소담)이 연교(조여정)에게 '어머니, 저와 함께 이 검은 상자를 열어보시겠어요?'라고 말하는 기분이었다.\n ” 그 자신이 ‘기생충’ 태동부터 팬심을 지녔던 제작자인 셈이다.\n  실제로 그는 영화를 “현재 구현할 수 있는 최고 수준으로” 만드는 데 총력을 기울였다.\n  “처음부터 전 세계에 보여질 것이 예상되는 작품이었기 때문에 현재 시점에 어느 나라 수준에서 보아도 영화의 만듦새나 상영포맷 등 퀄리티에 문제가 없는 영화였으면 했다”는 이유다.\n  봉 감독도 제작과정에서 “4K(초고해상도) 촬영, 애트모스 녹음, 과감하고 정교한 세트 등 프로덕션 밸류에 대한 아낌없는 투자가 있었다”고 만족해했을 정도다.\n  다행히 투자·배급사인 CJ엔터테인먼트 측과도 이견이 없었다고 한다.\n    ‘기생충’ 제작자로 나선 것은 어느 정도 운이 맞아떨어진 결과다.\n  봉 감독은 앞서 ‘마더’(2009)를 바른손 측과 함께 한 바 있었지만 곽 대표 취임 이후로는 연이 닿지 않았다.\n  ‘옥자’(2017)를 해외 스튜디오와 함께 했던 봉 감독은 다음 작품을 국내 제작사, 특히 바른손과 함께 하고 싶다는 의향을 보였다.\n  곽 대표는 당시 제작자로서 경험이 ‘가려진 시간’(2016, 감독 엄태화)뿐이었던 ‘초짜’였다.\n  2015년 당시 그가 처음으로 봉 감독과 연락하게 됐을 때 보낸 문자는 “작품에 폐가 될까봐 너무 두렵지만 설레기도 합니다”였다고 한다.\n    이같은 태도는 그가 영화 경력을 영화전문지 ‘키노’ 기자로서 출발한 것과도 연관된다.\n  연출자를 비지니스로만 대하는 게 아니라 예술가로, 작가로 대하는 마음이 바탕에 깔린 것이다.\n  이런 마음이 통했는지 봉 감독은 영화 편집본을 처음 보여주면서 “제작자로 말고 전직 ‘키노’ 기자로 영화를 본 소감을 얘기해 달라”고 얘기하기도 했다.\n  곽 대표는 “같은 시선과 문화를 감독들과 공유한다는 건 제작자로서 이례적인 경우가 아닐까 싶다”고 회고했다.\n  영국 아카데미상 시상식 때 봉 감독은 외국어영화상 수상 소감을 밝히면서 주연인 송강호 배우와 함께 곽 대표의 헌신에도 감사를 표했다.", "output": "그는 전 세계에 보여질 것이 예상되는 작품이었기에 구현할 수 있는 최고 수준으로 만드는데 총력을 기울였는데 봉 감독도 제작과정에서 만족해했을 정도다."}, {"kind": "F6", "id": "s1186", "input": "이는 국민과의 약속으로 미래 세대의 앞날이 달린 중차대한 문제다.", "output": "이는 국민과의 약속으로 미래 세대의 앞날이 달린 중차대한 문제 다."}, {"kind": "F6", "id": "s0942", "input": "특히 새누리당이 모든 잣대를 내년 총선에 두고 대통령 지지율이 하락한 틈을 타 정부 정책을 뒤흔들고 있는데 책임 있는 여당의 모습이 아니다.", "output": "특히 새누리당이 모든 잣대를 내년 총선에 두고 대통령 지지율이 하락한 틈을 타 정부 정책을 뒤흔들고 있는데 책임있는 여당의 모습이 아니다."}, {"kind": "F5", "id": "REPORT-news_r-00499-00002", "input": "이를 통해 3년 간 수도권 25개 기관 초등학생 175명에게 미래엔 도서 1850여 권을 후원했다.\n  또 지난해 다문화 아동과 청소년을 위한 공부방에 미래엔 학습 도서와 참고서 100권을 기증하고, 이들을 위한 축구대회도 후원했다.\n     미래교육상 수여, 콘텐트 무료 제공  | 교사키움 프로젝트교사가 행복한 교육 환경 속에서 역량을 개발하고 학생과 교감하며 성장할 수 있도록 ‘교사키움 프로젝트’도 진행하고 있다.\n  미래엔 교육재단인 목정미래재단이 주최하고 미래엔이 주관하는 미래교육상이 대표적인 프로젝트 활동 중 하나다.\n  이 상은 현직·예비 교사의 전문성과 역량 개발을 돕고 대한민국 교육 발전과 미래 인재 양성에 기여하고자 2015년 제정해 매년 진행하고 있는 교육상이다.\n  이는 미래교육에 대한 소셜미디어 분석에서 연관어로 등장할 만큼 교육업계에서 인정받고 있다.\n  미래교육상은 ▶미래교육에 대한 활동 연구 결과를 평가하는 ‘미래교육연구’ 부문 ▶인성교육 연계 활동과 연구에 대한 ‘인성교육혁신’ 부문 ▶초·중·고교 대상 교육실습과 교육봉사활동 수기에 대한 ‘미래키움’ 등 세 부문으로 구분해 공모를 진행한다.\n  이와 함께 교수학습 지원 활동을 통해, 교사들이 전문성과 역량을 강화하는 데도 도움을 주고 있다.\n  그 중 하나가 초·중·고 교사를 대상으로 수업 준비와 관련한 다양한 교육 콘텐트를 무료로 제공하는 교수 활동 지원 플랫폼인 ‘엠티처’다.\n  또한 학교·수업 혁신, 교육 정보와 수업 혁신에 대한 정보를 제공하는 수업 혁신 전문지 ‘혁신수업N’도 발행한다.\n  한국교과서연구재단을 비롯해 교과서와 수업 질적 향상을 위해 노력하는 다양한 단체도 후원하고 있다.\n   손글씨·글감 공모전, 교과서박물관 운영  | 교육문화키움 프로젝트미래엔은 누구나 차별 없이 교육·문화 혜택을 누릴 수 있도록 지원하는 교육문화키움 프로젝트도 운영한다.\n  대표적인 것이 ‘창작 글감 공모전’과 ‘초등학생 손글씨 공모전’이다.\n    창작 글감 공모전은 ‘어린이 그림책’ ‘교과서 창작 글감’ ‘초등학생 글솜씨’ 공모전 세 분야로 나눠 진행한다.\n  어린이 그림책 분야 수상작은 미래엔 아동 출판 브랜드 ‘아이세움’을 통해 단행본으로 출간하고 나머지 두 분야의 수상작들은 교과서 개발에 활용하고 있다.\n  초등학생 글솜씨 공모전은 초등학생을 대상으로 동시, 기행문·설명문, 독후감 등 3개 분야로 진행한다.\n  지난해 열린 ‘초등학교 손글씨 톡톡 공모전’에는 3880 작품이, ‘창작 글감 공모전’엔 1920 작품이 응모해 성황을 이뤘다.", "output": "미래엔 교육재단인 목정미래재단이 주최하고 미래엔이 주관하는 미래교육상은 2015년에 제정해 매년 진행하고 있는 교육상이고 교육업계에서 인정받고 있다."}, {"kind": "F5", "id": "REPORT-news_r-01956-00001", "input": "2000년대 네이버, 2010년대 우아한형제들(배달의민족)을 거쳐 2020년 스타트업 조이코퍼레이션(채널톡)과 클래스101.\n  천세희(46) 조이코퍼레이션 고문은 급성장하는 벤처·스타트업을 두루 거친 이력을 가지고 있다.\n  그는 지난 20년간 이들 회사에서 고객 서비스 시스템, 사업 운영 정책 등을 수립했다.\n  지금은 연매출 6조원(네이버), 기업가치 4조8000억원(우아한형제들)의 덩치 큰 회사가 됐지만, 그가 몸담았을 때만 해도 네이버와 우아한형제들 모두 급속히 발전하던 벤처기업이었다.\n  회사가 성장하면 안주할 법도 한데, 천 고문은 또 새로운 회사로 터를 옮겼다.\n  그는 자신이 현재 몸담은 조이코퍼레이션과 클래스101이 차세대 '유니콘 기업'(기업가치 1조원 이상의 비상장기업)이 될 것이라고 확신한다.\n  벤처회사의 급성장기를 연달아 경험한 그는 최근 국내 스타트업의 성장을 돕는 조력자 역할을 자처하고 있다.\n  천 고문은 온라인 취미 플랫폼 '클래스101'에서 부대표로 재직하는 동시에 조이코퍼레이션에서 사외 고문으로 활동하고 있다.\n  그에게는 숱한 스타트업인의 SOS(구조요청)가 끊이질 않는다.\n  천 고문은 이들에게 사업과 관련한 고민을 들어주고 조언해준다.\n  스타트업인에게 '대모'와 같은 존재인 셈이다.\n    지난 8일 서울 삼성동 조이코퍼레이션 사무실에서 천 고문을 만나 잘나가는 스타트업의 조건은 무엇인지, 이들에게 어떤 조언을 해주는지 물었다.\n    그는 네이버에서 CS팀장, 우아한형제들에서는 서비스운영실, 소상공인 지원프로그램 '배민아카데미' 이사 등을 지냈다.\n  과거에는 고객 응대라고 하면 무릎 꿇고 비는 식이 전부였는데, 2010년대들어서는 고객의 요구를 실제 기업의 상품과 서비스에 반영하는 방향으로 변화하기 시작했다.\n  고객 응대 매뉴얼을 만드는 것부터 시작해 그의 업무는 점차 서비스 운영, 브랜딩, 플랫폼 기획, 정책, 위기 관리 등으로 넓어졌다.\n  천 고문은 자신과 같은 역할을 '오퍼레이터'라고 한다.\n  \"오퍼레이터는 시스템 개선, 마케팅, 세일즈, 고객응대까지 업무가 다양하다\"며 \"회사가 건강히 성장하려면 오퍼레이터의 역할이 중요하다\"고 강조했다.\n    그가 몸담고 있던 우아한형제들은 지난달 독일의 딜리버리히어로(DH)와 인수·합병(M&A)하면서 기업가치 4조8000억원을 인정받고 엑싯(투자금 회수)에 성공했다.\n  천 고문은 \"6년전 김봉진 대표 등 직원들과 소소하게 회식하던 사진을 찾아봤다\"며 \"연매출 30억원하던 시절이었는데 이때는 그 누구도 지금의 배달의민족(배민)을 상상하지 못했을 것\"이라고 회상했다.", "output": "천 조이코퍼레이션 고문은 네이버와 우아한형제들에서 고객 서비스 시스템과 사업 운영 정책 등을 수립했다."}, {"kind": "F5", "id": "REPORT-news_r-01382-00001", "input": "타봤습니다…준중형 SUV 트레일 블레이저  작심하고 만든 차라는 인상을 받았다.\n  한국GM이 지난 16일 출시한 준중형 스포츠유틸리티차량(SUV) '트레일 블레이저'는 크게 흠 잡을 데가 없었다.\n   차가 부드럽게 나가고 코너링이나 가속에 있어서도 부대낀다는 느낌이 들지 않았다.\n  고속도로 주행시 특별히 가속을 한 것 같지 않았는데 어느새 시속 140㎞까지 올라가 있었다.\n  시승 차량은 ACTIV 모델로 1.\n 35L 가솔린 E-터보 엔진이 탑재됐다.\n  최고출력 139마력, 최대토크 22.\n 4㎏·m이다.\n  전체 5개 트림 중 프리미어∙ACTIV∙RS 모델은 이 엔진이고, LS∙LT 모델에는 1.\n 2L 가솔린 엔진이 달렸다.\n  컴팩트 SUV답지 않게 주행시 매우 조용하다.\n  카허 카젬 한국GM 사장은 16일 간담회에서 “한국 소비자들이 특히 소음에 민감한 것을 잘 알고 있다”며 “액티브 노이즈 캔슬레이션 시스템을 도입해 북미 등지에서도 호평을 받을 것으로 기대한다”고 말했다.\n  17일 실제 타봤더니 엔진∙주행 소음 모두 거의 느끼지 못했다.\n   트레일 블레이저의 매력은 무엇보다 가격이다.\n  스펙만 보면 기아 셀토스와 현대 투싼 사이라고 생각하기 쉽지만 사실 셀토스에 더 가깝다.\n  셀토스가 1965만~2865만원이고, 트레일 블레이저는 1995만~2830만원이다.\n  그런데 트레일 블레이저가 내부 공간이 더 넓고, 연비도 더 좋고, 각종 첨단 사양이 대거 들어가 있다.\n  특히 휠베이스가 비슷한 차종보다 10mm 더 길어 넉넉한 공간이 특징이다.\n  한국GM '저렴이' 이미지 완전히 벗었다 실내는 과거 일부 GM차에 있었던 저렴한 이미지를 완전히 벗겨냈다.\n  이 가격의 SUV가 할 수 있는 최고의 사양을 갖췄다.\n  RS 트림의 경우 D컷 스티어링휠과 RS 전용 계기반, 레드 스티치 등으로 멋을 냈다.\n  8인치 센터 디스플레이는 알차게 만들었다.\n  특히 애플 카플레이를 무선으로 사용할 수 있다.\n  케이블을 찾지 않아도 되는 건 큰 매력으로 느껴진다.\n  안드로이드 오토는 구글 정책에 따라 추후 적용 예정이다.\n   이밖에 열선 스티어링휠, 통풍시트, 핸즈프리 파워 테일게이트, 헤드업 디스플레이, 파노라마 선루프 등 한국 소비자가 선호하는 옵션이 다양하다.\n  접었다 폈다 할 수 있는 헤드업 디스플레이도 쉐보레 최초로 탑재했다.\n  간단한 온·오프 버튼 조작만으로 전륜·사륜구동 전환이 가능하다.", "output": "한국GM이 출시한 트리엘 블레이저는 멈팩트 SUV 답지 않게 매우 조용하고 부드럽게 나가며 셀토스보다 내부 공간이 더 넓고 연비가 더 좋다."}, {"kind": "F6", "id": "s0589", "input": "하지만 중국의 갑작스러운 선회는 일본을 둘러싼 동북아 국가 간 줄다리기에서 우리를 어정쩡한 처지로 몰아넣고 있다.", "output": "하지만 중국의 갑작스러운 선회는 일본을 둘러싼 동북아 국가간 줄다리기에서 우리를 어정쩡한 처지로 몰아넣고 있다。"}, {"kind": "F6", "id": "s0693", "input": "먼저 박 대통령과 대통령을 보좌하는 모든 이들이 국민의 공감과 신뢰를 얻는 데 소홀한 점이 없었는지 스스로 성찰해봐야 한다.", "output": "먼저 박 대통령과 대통령을 보좌하는 모든 이들이 국민의 공감과 신뢰를 얻는데 소홀한 점이 없었는지 스스로 성찰해 봐야 한다."}, {"kind": "F5", "id": "REPORT-news_r-00726-00002", "input": "표준계약 여부, 기업규칙, 공인 행동강령 등을 까다롭게 심사한다.\n   이를 피하려면 국가 차원에서 EU의 적정성 심사를 받아야 한다.\n  개인정보 보호 수준이 EU와 동등한 나라들과 EU가 맺는, 일종의 '개인정보 FTA(자유무역협정)'인 셈이다.\n  한국은 아직 심사를 통과하지 못했다.\n  하지만 이날 개정안 통과로 개인정보보호위원회가 총리실 산하의 독립 행정기관으로 격상돼 EU의 기준도 맞출 수 있게 됐다.\n  신종철 방송통신위원회 개인정보보호윤리 과장은 “EU가 적정성 심사 때 우리에게 요구했던 ‘독립된 개인정보 규제기관 설립’ 요건이 충족됐다”고 말했다.\n  ③ 개인 살림에 좋은 점은주부ㆍ학생ㆍ사회초년생 같이 금융 이력 정보가 적은 이들의 신용 등급이 올라갈 수 있다.\n  고객의 동의를 받은 제3자가 여러 곳에 흩어진 고객의 금융정보나 공공요금 납부, 온라인 쇼핑 같은 정보를 종합 평가할 수 있어서다.\n  자신의 신용평가 결과에 대해 ‘왜 이렇게 나왔느냐’고 설명을 요구하거나 이의를 제기할 ‘프로파일링 대응권’, 내 금융 정보를 다른 회사로 넘겨달라고 요구할 수 있는 '개인신용정보 이동권' 같은 새로운 개념도 이번 법 개정을 통해 생긴다.\n   ④ 사생활에 영향은관건은 '개인 재식별화'다.\n  법안은 가명정보의 암호화를 되돌려 개인 신원을 식별하는 것을 금지하고 있다.\n  이를 어기는 기업은 전체 매출의 3% 이하에 해당하는 과징금, 개인은 5년 이하의 징역 또는 5000만원 이하의 벌금에 처한다.\n  암호화 처리를 되돌리지 않더라도, 추가 정보들을 결합하면 가명정보가 더 이상 '가명'이 아닐 수 있다는 우려도 제기된다.\n  동의 없이 가져간 가명 정보로 내가 누군인지 노출될 수 있다는 우려다.\n    이에 대해 김민호 성균관대 법학전문대학원 교수는 “작정하고 누군가가 엄청난 시간과 노력을 들이면 특정인을 재식별하는 게 가능할 수도 있지만, 그 가능성 때문에 제도화 자체를 막는 것은 지나치다”고 말했다.\n  그러면서 “EU의 GDPR에도 '합리적 수준의 시간과 노력으로 재식별할 수 없어야 한다'고만 돼 있다”고 덧붙였다.\n  기업은 비용 부담 없이 개인정보로 장사해서 좋겠으나, 정작 정보의 주인인 개인에게는 별다른 이득이 없다는 지적도 있다.\n   이날 참여연대와 건강과대안, 민주노총 등 7개 단체는 청와대 앞에서 기자회견을 열고 “기업의 이윤을 위해 충분한 안전장치도 없이 정보주체의 권리를 희생한다”며 데이터3법 국회 통과를 반대했다.", "output": "까다로운 심사를 피하려면 개인정보 FTA인 셈의 EU 적정성 심사를 받아야 하는 한국은 아직 심사에 통과하지 못했지만, 개정안 통과로 EU의 기준을 맞출 수 있게 됐다."}, {"kind": "F5", "id": "REPORT-news_r-04099-00002", "input": "그 당시부터 마는 우리의 인기 음식이었다는 방증이기도 하다.\n  마에 산에서 나는 장어라는 별명이 붙은 것은 그만큼 우리의 원기를 북돋아서 체력을 도와주는 것에서 비롯되었다.\n  이것은 우리나라뿐만 아니라 마를 먹을 줄 아는 외국에서도 알려진 사실이다.\n  아프리카의 자메이카라는 나라에서도 역시 마를 즐긴다.\n  이 나라의 마는 얌이라 불리는데, 자메이카 얌이 세계적으로 유명해진 것이 우사인 볼트 덕이다.\n  세계에서 가장 빠른 사나이인 우사인 볼트가 “나의 힘의 원천은 얌 덕분이다”라고 한 인터뷰 때문에 이제는 아예 국민 간식이 되었다.\n  마는 노화를 방지하는 생리활성 물질이 굉장하고, 체력을 키워주며, 소화기 특히 장의 기능을 좋아지게 하는 성분들이 풍부하다.\n  이런 성분들이 들어 있는 핵심적인 부분이 끈적이는 곳이다.\n  마를 잘라보면 끈적끈적한 물질들이 나와 들러붙는다.\n  끈적이는 성분에 들어 있는 뮤신이 여러 역할을 해서 마의 효능에 큰 영향을 미친다.\n  뮤신은 당단백질로 소화기관에서는 소화기 점막을 보호하고 소화 연동운동을 하는 윤활제 역할을 하며, 위산과다와 위궤양을 치료하는 성분으로 작용한다.\n  또한, 이 성분은 정력을 높이는 자양강장제로 쓰인다.\n  우리가 먹는 여러 음식 중에서 끈적이는 것이 나오는 것들이 건강에 좋은 것들이 많은 점은 주목할 필요가 있다.\n  미역이나 다시마를 치대보면 끈적이는 점액들이 나오고 이는 수용성 식이섬유로 피를 맑게 해 준다.\n  메주를 띄우거나 청국장, 낫또를 휘휘 저으면 끈적한 실 같은 물질들이 막 나오고, 뿌리채소인 연근도 자르면 끈적이는 것이 나온다.\n  오크라 모로헤이야 같은 외국에서 익숙한 채소 중에서도 끈적이는 물질이 나오는 것들이 있다.\n  모두 장에도 좋고, 면역도 도와주는 음식들이다.\n  마 하면 떠오르는 원기회복과 체력을 담당하는 성분은 아르기닌과 디오스게닌이다.\n  아르기닌은 부신의 호르몬을 왕성하게 만들어 몸의 생리대사기능을 끌어 올린다.\n  아르기닌은 성장호르몬 분비를 도와 항노화 기능이 있고, 혈관 내 산화질소 NO의 양을 늘려서 혈관 확장 및 순환 기능을 하게 하는 성분이기도 하다.\n  디오스게닌은 성호르몬 관련 물질의 원료로 현대 의학에서 인공적인 성호르몬을 만드는 성분이기도 하다.\n  이 성분은 성호르몬 전구체가 되어서 DHEA가 되고, 여기서 에스트로겐이나 남성호르몬이 만들어진다.\n  이런 성분들 덕분에 힘이 폭발적으로 늘면서 혈액순환도 되다 보니 남성의 기운을 올려주는 음식으로 주목을 받게 되었다.", "output": "산에서 나는 장어라고 별명이 붙은 마는 생리활성 물질이 굉장하고 체력을 키워주며 마의 효능에 큰 영향을 미치는 뮤신은 당단백질로서 위궤양과 위산과다를 치료하는 성분으로 작용한다."}, {"kind": "F6", "id": "s1120", "input": "정권 교체를 목표로 삼는 문재인 대표는 공무원 표를 의식해 이런 비겁한 자세를 고집해선 안 된다.", "output": "정권 교체를 목표로 삼는 문재인 대표는 공무원 표를 의식해 이런 비겁한 자세를 고집해선 않 된다."}, {"kind": "F5", "id": "REPORT-news_r-01033-00001", "input": "'OO동 곱창' 포털사이트 네이버에 이런 검색어를 넣으면 검색창 바로 아래 몇 가지의 '연관검색어'가 뜬다.\n  검색 결과가 만족스럽지 않을 때 '이런 검색어를 넣어서 다시 검색해보라'는 안내다.\n  위 사례처럼 지역과 음식 이름을 넣어 검색했을 때 연관검색어에 특정 식당 이름이 나오기도 한다.\n  네이버는 일정 기간 반복 입력된 검색어를 바탕으로 그 관련성을 계산해 이같은 연관검색어를 이용자에게 소개하고 있다.\n  연관검색어 목록에 식당 이름이 오르면, 이용자들은 \"여기가 유명한 곳인가보다\"로 생각할 수 있다.\n  거꾸로 이같은 심리를 이용하기 위해 연관검색어가 조작되는 것 아니냐는 의혹도 있어왔다.\n  PC 21만대 장악…이용자 네이버 비밀번호 탈취실제 PC방 컴퓨터 21만대가 포털사이트 네이버 연관검색어 조작에 동원됐다는 수사 결과가 나왔다.\n  PC방 컴퓨터에 악성코드를 심어 ‘좀비 PC’로 만든 일당 때문이다.\n  56만 건에 달하는 PC방 이용자의 네이버 아이디·비밀번호 등도 이들에게 넘어갔다.\n   서울동부지검 사이버수사부(부장 김봉현)는 10일 PC방 컴퓨터에 게임관리 프로그램을 제작해 전국 PC방에 납품하면서 악성코드를 심고 이를 이용해 포털 검색어를 조작한 A씨(38) 등 4명을 재판에 넘겼다고 밝혔다.\n  A씨는 2018년 말 PC방에 납품하는 프로그램에 악성코드를 심어 21만대의 PC방 컴퓨터를 ‘좀비 PC’로 만들었다.\n  좀비 PC는 외부에서 마음대로 조작이 가능한 컴퓨터를 말한다.\n  해당 프로그램을 이용한 PC방은 전국 3000여곳에 달한다.\n  검찰 관계자는 \"A씨 등은 좀비 PC에서 로그인을 한 이용자들의 네이버 아이디와 비밀번호를 탈취해 검색어 조작에 사용했다\"고 말했다.\n  2018년 12월부터 지난해 11월까지 상당수 PC방 이용자의 계정이 자신도 모르는 새 검색어 조작에 이용됐다.\n  \"공용 컴퓨터 썼다면 비밀번호 바꿔야\" A씨 등은 좀비 PC로 포털에 접속한 이용자의 ID와 비밀번호를 56만 회에 걸쳐 빼돌려 이 중 일부를 하나당 1만원에 판매했다고 한다.\n  전문가들은 \"공용 컴퓨터를 사용하면서 벌어지는 해킹은 사실상 막는 게 불가능하다\"고 입을 모은다.\n  강구민 성균관대 과학수사학과 교수는 \"PC방에서 이용한 컴퓨터가 좀비화가 돼 있다면 개인정보가 빠져나가는 걸 막을 방법이 사실상 없다\"며 \"공용 컴퓨터를 사용해 로그인 한 계정의 비밀번호는 휴대전화 등으로 따로 바꿔주는 게 필요하다\"고 했다.", "output": "PC방 컴퓨터에 악성 코드를 심어 이용자의 네이버 아이디·비밀번호를 탈취한 후 포털 검색어를 조작한 일당이 재판에 넘겨졌다."}, {"kind": "F6", "id": "s0182", "input": "연휴와 원화 강세 영향도 어느 정도 반영된 결과로, 요즘 같은 세계화 시대에 외국 관광 지출이 늘어나는 건 일면 당연한 일이다.", "output": "연휴와 원화 강세 영향도 어느정도 반영된 결과로, 요즘 같은 세계화 시대에 외국 관광 지출이 늘어나는 건 일면 당연한 일이다."}, {"kind": "F5", "id": "REPORT-news_r-03184-00001", "input": "일부 관공서와 대형마트에 반려동물 쉼터라는 이름으로 설치된 보관함의 실효성에 의문이 제기되고 있다.\n  이용자가 없기 때문이다.\n  반려동물을 사물함 형태의 공간에 두는 ‘반려동물 쉼터’가 반려동물을 가족처럼 생각하는 인식을 따라가지 못했다는 지적이 나온다.\n    “쉼터 사용 건수는 1년에 2건”서울 서초구는 구청과 주민센터에 방문하는 반려동물 주인을 위해 2017년 반려동물 쉼터를 도입했다.\n  서초구청 내 2곳을 비롯해 주민센터 4곳 (반포1동•서초1동•양재2동•방배4동)에 보관함 형태의 반려동물 쉼터가 운영되고 있다.\n  대부분 1달에 1건 이상의 이용자를 찾기 어려운 상황이라고 한다.\n    반려동물을 보관할 수 있게끔 만들어진 보관함은 가로·세로 70cm, 폭 60cm로 전자레인지 2배 정도의 크기다.\n  서초구는 바닥 난방과 환기, 조명 시스템을 갖추고 있다고 홍보했지만 반려동물 주인들의 외면을 받고 있다.\n  지난달 17일 방배4동 주민센터의 반려동물 쉼터는 텅 비어있었다.\n  지난 한 해 동안 이용자는 2명에 그쳤다고 한다.\n  반포 1동 등 다른 주민센터의 사정도 다르지 않았다.\n  반포 1동 반려동물 쉼터의 지난해 이용자는 4명에 불과했다고 한다.\n 반포1동 주민센터 앞에서 만난 전숙희씨는 “반려견이 폐쇄된 공간을 싫어해 쉼터에 넣어 둘 수가 없다”고 말했다.\n    사용법 모르고, 고장 난 채 방치  이용자가 적다 보니 관리가 되지 않는 곳도 있었다.\n  지난달 21일 양재2동 주민센터 출입구 옆에 설치된 반려동물 쉼터의 전원은 꺼져 있었다.\n  이 센터 관계자는 “자물쇠가 작동하지 않아 고장이 났다”며 “반려견과 같이 오는 민원인이 많지 않고, 다른 업무가 있다 보니 신경 쓰기 어렵다”고 했다.\n  그는 또 “열쇠를 곧 수리할 예정이다”고 덧붙였다.\n  방배4동 주민센터의 경우 쉼터 내 온도를 조절하고 환풍기를 가동하는 방법 등을 관리자가 알지 못했다.\n  구청 차원에서의 사용법 교육이 이뤄지지 않는 등 이용자가 없다 보니 주요 업무에 포함되지 않아서다.\n  대형마트도 보관함 이용자 거의 없어비슷한 형태의 반려동물 보관함을 운영하는 대형마트의 사정도 관공서와 다르지 않다.\n  롯데마트 서초점은 고객센터 앞에 6칸의 반려동물 보관함을 운영 중이다.\n  전면이 투명한 유리로 돼 있어 내부가 보일 뿐 물품 보관함과 유사한 형태다.\n   롯데마트 해당 지점 관계자는 “이용자가 한 달에 10여건 정도다”고 말했다.", "output": "반려동물 쉼터라는 이름으로 설치된 보관함이 이용자를 찾기 어려워 실효성에 의문이 제기되고 있으며 반려동물을 생각하는 인식을 따라가지 못했다는 지적이 나온다."}, {"kind": "F5", "id": "REPORT-news_r-01155-00002", "input": "2012년말 12.\n 8%였던 LPG차 비율은 2018년 말 기준 8.\n 77%까지 낮아졌다.\n  LPG차 신규 판매대수가 줄어드는 추세에 2000년대 초반 등록된 차들의 말소까지 이어지며 LPG차 비율이 급속도로 줄어들고 있는 상황이다.\n  특히 LPG차 판매가 감소세로 돌아선 2013년부터는 등록대수 감소폭이 커지고 있다.\n  한국자동차산업협회(KAMA)에 따르면 LPG차 판매량은 2013년 17만8935대를 기록한 이후 계속 줄어들어 2018년에는 11만8436대에 그쳤다.\n  김필수 대림대학교 자동차학과 교수는 “2000년대 후반부터 자동차 연비 경쟁이 가속화되며 각 브랜드의 가솔린 엔진 연비가 높아졌고, 디젤차가 몇 년간 자동차 시장을 주도하며 상대적으로 LPG차에 대한 주목도가 떨어졌다”고 설명했다.\n  LPG차 등록대수가 크게 줄자 가스업계는 더욱 강하게 규제완화를 요구했다.\n  그 결과 2018년 5인승 레저용차량(RV)에 대한 규제가 완화됐고, 지난해 3월 28일에는 LPG차에 대한 규제가 완전히 사라졌다.\n  규제를 없앤 효과는 즉각적으로 나타났다.\n  KAMA에 따르면 2019년 상반기 LPG차 등록 대수는 전년 동기 대비 3.\n 5% 감소했는데, 이는 2018년 연간 감소폭이 14.\n 1%에 달했던 것과 비교해 크게 줄어든 수치다.\n  특히 구매제한 규제가 전면 폐지된 이후 4~6월 판매량은 1~3월 대비 29.\n 9% 증가했다는 게 KAMA의 설명이다.\n  LPG차의 성장을 전망하는 이유는 단순히 규제가 풀렸기 때문만은 아니다.\n  기술 발전을 통해 치명적인 단점을 지웠다.\n  대표적인 게 ‘가스 탱크’다.\n  LPG차는 트렁크 부분에 커다란 LPG 탱크를 실어야 해 공간활용이 나빴는데, 이를 거의 완벽하게 해결했다.\n  QM6 돌풍을 일으킨 르노삼성의 ‘도넛 탱크’가 주인공이었다.\n  여분의 타이어를 적재하는 트렁크 하단에 위치시켜 트렁크를 완전히 활용할 수 있도록 했다.\n  최근 현대·기아차에서도 비슷한 기술을 개발해 쏘나타와 K5 등에 적용시켰다.\n  자동차업계 관계자는 “일반 판매용 LPG차에는 대부분 도넛 형태의 탱크가 탑재될 것”이라고 전망했다.\n   2023년 디젤 엔진 사라지는 1t 트럭시장 주목최근 QM6의 성공은 올해 나올 LPG차에 대한 기대감을 높인다.\n  자동차업계에서는 지난해 LPG차 규제 전면 폐지 이후 연간 LPG차 판매량이 늘었을 것으로 추정하고 있으며 올해 LPG차 등록대수도 증가세로 전환할 것으로 기대한다.", "output": "LPG차 비율이 매우 빠른 속도로 줄고 있는 상황에 대해 대림대학교 김 교수는 자동차 연비 경쟁으로 가솔린 엔진 연비가 높아지면서 디젤차가 시장을 주도하게 된 것이라고 설명했다."}, {"kind": "F6", "id": "s1047", "input": "그러나 이는 실제 태어난 아기가 많은 게 아니라 가임 여성이 감소한 탓으로 출산 구조가 더 취약해졌음을 의미한다.", "output": "그러나 이는 실제 태어난 아기가 많은게 아니라 가임 여성이 감소한 탓으로 출산 구조가 더 취약해졌음을 의미한다."}, {"kind": "F6", "id": "s1077", "input": "지금처럼 전과가 없고 돈만 있으면 누구든 총기를 구매할 수 있는 상황을 내버려둬서는 안된다.", "output": "지금처럼 전과가 없고 돈만 있으면 누구든 총기를 구매할 수 있는 상황을 내버려 둬서는 안된다."}, {"kind": "F6", "id": "s0865", "input": "한국도 대기업을 중심으로 새로운 기술 트렌드를 좇기 위해 안간힘을 썼다.", "output": "한국도 대기업을 중심으로 새로운 기술 트렌드를 좇기 위해 안간 힘을 썼다."}, {"kind": "F5", "id": "REPORT-news_r-04423-00001", "input": "전 세계가 신종 코로나 감염증(코로나19) 패닉에 빠졌다.\n  국내 확진자는 20일 오전 기준 총 82명으로 늘었다.\n  정부도 “지역사회 감염 시작 단계”라고 인정했다.\n  중국 본토 이외의 국가에서도 사망자가 잇따라 발생하고 있다.\n  신종 코로나 감염을 우려하는 사람들 사이에서 ‘접촉 공포증’이 번지고 있다.\n  엘리베이터 버튼, 공용 화장실 수도꼭지, 지하철 손잡이 등 여러 사람의 손이 닿는 부분을 맨손으로 만지길 꺼리는 현상이다.\n  이런 불안감에 맞서 소셜미디어(SNS)상에선 갖가지 터치리스(touchless·비접촉식) 아이디어들이 올라오고 있다.\n 곽금주 서울대 심리학과 교수는 “사태가 심각해지자 강한 생존 본능이 발현돼 개개인이 자신을 지키려는 자구책을 마련하는 것”이라고 진단했다.\n 엘리베이터 버튼은 손가락 대신 무엇으로 누를 수 있을까.\n  SNS에는 ‘립스틱 빈통’을 재활용한 아이디어가 올라왔다.\n  이 립스틱 ‘버튼 푸셔(button pusher)’의 제작과 사용 방법은 이렇다.\n  다 사용한 립스틱의 빈통 안에 코르크 마개를 넣는다.\n  뚜껑이 닫힐 수 있도록 튀어나온 코르크 마개는 칼로 조금 깎아낸다.\n  뚜껑을 닫은 채 보관하고 다니다가, 뚜껑을 열어 코르크 마개로 버튼을 누른다.\n  그 후 다시 뚜껑을 닫아 보관한다.\n  SNS에선 그 이유에 대해 “(립스틱 푸셔를 보관하는) 가방 안에 세균이 퍼지는 것을 막는다”고 설명했다.\n  또 손이 닿지 않고, 가까이만 가도 작동하는 엘리베이터 버튼 시제품을 개발해 작동 영상이 올라오기도 했다.\n  엘리베이터 버튼 접촉을 두려워하는 상황을 압축적으로 그려 낸 그림도 SNS에서 눈길을 끌고 있다.\n  이 그림에선 엘리베이터를 탄 사람들이 맨 손가락으로 버튼을 만지지 않기 위해 갖가지 방법을 동원한다.\n  콘돔을 끼운 검지 손가락으로 버튼을 누르는가 하면, 손가락 대신 라이터나 펜으로 버튼을 누른다.\n  이런 도구가 없는 사람은 심지어 다른 사람의 손을 끌어당겨 버튼을 누르게 한다.\n  신종 코로나의 영향으로 매장 방문을 꺼리는 고객들을 끌어모으기 위해 ‘터치리스 환경’의 매장을 홍보하기도 한다.\n  중국 내 한 외제차 매장의 경우 SNS에 매장 곳곳의 사진과 함께 ‘팔꿈치로 열 수 있는 자동문, 센서로 작동하는 수도꼭지, 발로 열 수 있는 쓰레기통’ 등을 소개했다.\n 이외에도 SNS상에선 다양한 터치리스 제품들이 홍보를 목적으로 올라오고 있다.", "output": "중국 외 국가에서도 코로나19 사망자가 잇따라 발생했으며 공용 화장실 수도꼭지 등 감염을 우려하는 접촉 공포증이 번지고 있다."}, {"kind": "F5", "id": "REPORT-news_r-00695-00001", "input": "'명륜등심해장국'이라는 식당을 운영하는 유모씨는 지난해 8월 가맹점주들의 불만을 들었다.\n  명륜등심해장국은 1999년 충북 청주에서 영업을 시작해 현재 6개의 가맹점을 가지고 있다.\n  이 업체 가맹점주들은 \"상호가 비슷한 '명륜진사갈비'가 갑자기 유명해져 손님들이 두 가게를 혼동해 약속장소를 잘못 찾아가는 일이 생긴다\"고 했다.\n  유씨는 \"어떤 지역에는 바로 100m 거리에 두 식당이 함께 있는 데다 점심 메뉴까지 겹쳐 장사하기 힘들다\"고 말했다.\n   고민하던 유씨는 명륜진사갈비가 상표권을 확보하지 못했다는 사실을 알았다.\n  상표권을 가진 명륜등심해장국은 지난해 11월 명륜진사갈비를 상대로 \"상표권을 침해당했다\"며 \"상표를 쓰지 말고, 그동안 우리가 본 유·무형의 손해 5000만원을 배상하라\"며 서울중앙지법에 소송을 냈다.\n  2년간 상표 등록 안 한 채 가맹점 500개 모아 명륜진사갈비는 돼지갈비 프랜차이즈 업체다.\n  2017년 7월과 2018년 5월 두 차례 특허청에 상표권을 출원했지만 모두 거절당했다.\n  특허청은 \"2001년 상표를 출원한 명륜등심해장국과 이름과 판매상품이 모두 유사하다\"고 거절 이유를 밝혔다.\n   명륜진사갈비는 상표권을 얻지 못한 채 꾸준히 가맹점을 모집했다.\n  설립 2년 만에 전국 가맹점 500개를 돌파했고, 1월 1일 기준 영업 중인 점포는 456곳이다.\n   유씨는 \"명륜진사갈비가 마치 상표권이 있는 것처럼 행동해 관계자들을 속인다\"고 주장한다.\n  9일 현재 명륜진사갈비 공식 홈페이지에는 ‘상표권 침해 및 디자인 도용에 따른 법적 조치 단행’이라는 공지가 올라와있다.\n  최근 명륜진사갈비와 유사한 느낌의 가게가 많아지자 법적 대응에 나서겠다는 것이다.\n  유씨는 “상표권은 우리(명륜등심해장국)에게 있는데 어떻게 법적 조치를 하느냐”며 “가맹점주, 예비가맹점주들을 속이는 일”이라고 말했다.\n  명륜진사갈비, 특허청 결정에 불복 명륜진사갈비 측은 특허심판원에 불복 심판을 낸 상태다.\n  \"해장국과 갈비집의 상호가 소비자 입장에서 혼동되지 않는다\"는 게 명륜진사갈비의 주장이다.\n  명륜진사갈비 관계자는 “우리와 비슷한 사건에서 결정이 뒤바뀐 사례가 있어 심판원의 판단을 기다리고 있다”고 밝혔다.\n  불복 주장이 받아들여져 명륜진사갈비의 상표권이 인정되면, 명륜등심해장국이 건 소송도 자연스럽게 무효화 된다는 게 이들의 예상이다.\n  이 관계자가 제시한 특허심판원 결정은 2017년 ‘백촌막창’과 ‘백촌막국수’의 다툼이다.", "output": "돼지갈비 프랜차이즈 명륜진사갈비는 특허청에 상표권 출원을 했지만 명륜등심해장국과 이름 등이 유사하다는 이유로 상표권을 얻지 못한 채 꾸준히 가맹점을 모집했다."}, {"kind": "F5", "id": "REPORT-news_r-02957-00002", "input": "‘소셜 50’은 팬들이 가장 애착을 보이는 차트이기도 하다.\n  방탄소년단의 트위터 팔로워 수는 약 2400만명으로 1억 명을 넘긴 저스틴 비버의 4분의 1 수준이지만 언급 빈도와 조회 수 등은 팬들의 노력 여하에 달려있기 때문.\n  3년 연속 ‘톱 소셜 아티스트’를 수상한 방탄소년단에 앞서 6년 내리 수상한 저스틴 비버가 이달 5년 만에 5집 ‘체인지(Changes)’ 발매한다는 소식이 전해지자 팬덤 사이에 긴장감이 맴돌기도 했다.\n  『BTS 예술혁명』을 쓴 이지영 세종대 초빙교수는 “소셜 차트는 긍정적인 것뿐만 아니라 부정적인 것도 집계가 되기 때문에 팬들은 1위를 유지하기 위해 항상 새로운 뉴스에 촉각을 곤두세우고 있다.\n  놀이이자 노동의 결과물”이라고 밝혔다.\n   넥스트 빅 사운드에 따르면 이번 주 차트에서 방탄소년단을 언급한 트위터 멘션은 1710만건으로 지난주 대비 29% 늘었다.\n  지난달 26일 그래미 시상식에서 래퍼 릴 나스 엑스와 ‘올드 타운 로드(Old Town Road)’ 합동 무대를 선보인 데 이어 28일 CBS ‘더 레이트 레이트 쇼 위드 제임스 코든’에 출연해 신곡 ‘블랙 스완(Black Swan)’ 무대를 처음 공개하면서 평소보다 많은 버즈량(언급 횟수)을 이끌어냈다.\n  오는 21일 새 앨범 ‘맵 오브 더 솔: 7(MAP OF THE SOUL: 7)’ 발매를 앞두고 전 세계 5개 도시에서 순차 진행 중인 현대 미술 협업 프로젝트 ‘커넥트, BTS’ 역시 이들에게 새롭게 관심을 갖는데 한몫 한 것으로 보인다.\n    이 같은 성과를 보고 다른 팬덤도 분발하고 있다.\n  지난해 ‘소셜 50’ 연간 차트를 살펴보면 1위 방탄소년단을 비롯해 2위 엑소, 4위 갓세븐, 6위 세븐틴, 7위 NCT 127, 8위 몬스타엑스, 9위 블랙핑크 등 10위권 내 7팀이 K팝 아이돌 그룹이다.\n  투모로우바이투게더(12위)나 스트레이키즈(23위), 에이티즈(30위) 등 신인도 대거 포함돼 있다.\n  전체 50팀 중 차지하는 비중이 40%(20팀)에 달할 정도.\n  웹진 ‘아이돌로지’의 미묘 편집장은 “K팝 팬덤 내 경쟁이 워낙 치열하기 때문에 각종 투표에 임하는 것처럼 버즈량 늘리기에 동참하는 것 같다”며 “특히 아이돌 그룹의 활동 영역이 전 세계로 확대되면서 해외 팬들이 늘어나고 이들이 지리적ㆍ물리적 한계를 극복하기 위해 SNS를 더욱 적극적으로 활용하면서 시너지를 내고 있다”고 분석했다.", "output": "저스틴 비버의 5집 발매 소식에 팬덤 사이에 긴장감이 맴돌았는데 이에 이 교수는 팬들은 노동이자 놀이의 결과인 소셜 차트 1위 유지를 위해 늘 촉각을 곤두세운다고 밝혔다."}, {"kind": "F6", "id": "s0328", "input": "일단 지난달 금리 인하 효과와 국내외 경제 흐름을 조금 더 지켜보자는 것이다.", "output": "일단 지난달 금리 인하 효과와 국내외 경제흐름을 조금 더 지켜보자는 것이다."}, {"kind": "F5", "id": "REPORT-news_r-01496-00001", "input": "진중권 전 동양대 교수가 21대 총선 출마 의사를 밝힌 정봉주 더불어민주당 전 의원을 향해 또다시 날을 세웠다.\n  지난 16일에 이어 두 번째다.\n   진 전 교수는 이날 자신의 페이스북에서 \"정봉주는 절대 정치를 해선 안 될 사람\"이라고 비판하며 지난 19대 총선 당시 민주당 노원갑 공천을 둘러싼 비화를 공개했다.\n   진 전 교수는 페이스북 글에서 \"2012년 (19대 총선때) 민주당은 나꼼수 김용민의 막말 파장으로 선거를 말아먹었다\"면서 \"김용민을 공천한 것 자체가 문제였다\"고 적었다.\n   이어 나꼼수 김씨가 당시 막말 파문에도 불구하고 민주당 노원갑 후보에 출마한 데는 정 전 의원의 비호가 있었기 때문이라고 주장했다.\n   진 전 교수는 \"사실 노원갑은 정봉주 지역구인데 감옥을 가면 지역구를 남에게 빼앗기게 된다.\n  그래서 같은 나꼼수 멤버인 김용민에게 세습해 주었다가 나중에 형 살고 나와 복권되면 돌려받으려 했던 것\"이라고 했다.\n   실제 정 전 의원은 2004년 17대 총선에서 서울 노원갑에 당선됐다.\n  이후 2008년 18대 총선에서 현경병 새누리당 의원에 패배했고, 2011년에는 이명박 전 대통령에 대한 허위사실을 유포한 혐의로 징역 1년형을 선고받았다.\n  이 때문에 정 전 의원은 19대 총선에서 피선거권이 제한됐다.\n   진 전 교수는 \"그러던 중 김용민의 막말 테이프(욕설과 여성에 대한 혐오발언)가 공개됐다.\n  민주당이 공당이라면 그 순간 공천을 즉시 철회했어야 한다\"고 했다.\n  이어 \"당시 민주당 선거를 돕던 조국 교수한테 '어떻게 해야 하냐'고 전화가 왔다.\n  당장 자르라고 조언했다.\n  그런데 민주당에선 그냥 가더라\"라며 \"새누리당은 매일 하나씩 막말을 공개하며 선거운동 기간 내내 랠리를 이어갔다.\n  결국 불리하던 선거판을 극적으로 뒤집는데 성공했고 박빙으로 승패가 갈리는 수도권 선거를 통째로 말아먹었다\"고 덧붙였다.\n   진 전 교수는 \"김용민을 당장 자르라\"는 자신의 조언을 차단한 사람이 정 전 의원이었다고 밝혔다.\n  \"정 전 의원 본인 입으로 스스로 내게 털어놨다\"며 \"이는 공적 원칙에 따른 '공천'이 아니라, 사적 인연과 이해에 따른 '사천'이다.\n  사적 인연과 이해가 어떻게 공적 기준과 원칙을 무너뜨림으로써 공당에 치명적 해를 끼치는지 잘 보여준다\"고 꼬집었다.\n  그러면서 \"민주당은 그때부터 공사 구별없이 야쿠자스러웠다\"고 비판했다.\n  진 전 교수는 정 전 의원이 지난 13일 '빨간점퍼 민주당 솎아낼 것'이라며 금태섭 더불어민주당 의원 지역구에 출마 의사를 밝힌 데 대해서도 비판했다.", "output": "진 전 교수가 지난 19대 총선 당시 민주당 노원갑 공천을 둘러싼 비화를 공개하며 또다시 정 전 의원을 비판했다."}, {"kind": "F5", "id": "REPORT-news_r-01075-00001", "input": "지난해 10월 23일 오전 경기도 수원시 아주대병원 권역외상센터 5층.\n  간호팀장이 황급히 이국종 교수를 찾아 올라왔다.\n  간호팀장은 “본원에서 외상센터 환자에게 병실을 배정하지 말라고 한다”고 했다.\n  이 교수는 “또 그런 거예요”라며 화를 냈다.\n  외상센터는 즉시 바이패스(bypass·우회)를 걸었다.\n  환자를 더는 받을 수 없으니 신규 환자를 보내지 말고 다른 데로 우회시켜달라고 소방청에 요청했다.\n  이국종 교수의 아주대 권역외상센터가 지난해 63회 바이패스를 건 것으로 나타났다.\n  868시간으로 36일이 좀 넘는다.\n  환자를 받지 못하고 일시적으로 문을 닫는, 셧 다운(shut down) 상태를 말한다.\n  2018년 53건, 719시간(약 30일) 그랬다.\n  하지만 이국종 교수의 이런 주장에 아주대병원 측은 “우리 병원의 병실이 항상 부족하다.\n  그 와중에도 외상센터를 충분히 지원했다”고 반박한다.\n  아주대 외상센터는 100병상으로 전국 외상센터 중 가장 크다.\n  외상센터가 넘치면 본원 병동으로 환자를 입원시켜야 하는데, 이게 원활하지 않다가 지난해 9, 10월께 완전히 막혔다는 것이다.\n  지난해 63건의 바이패스 중 9월 이후 발생한 게 43건에 달한다.\n  이 교수는 지난해 10월 “(병원 당국이)병실을 안 준다”며 “외상센터 운영지침에는 환자가 넘치면 본원이 적극적으로 받아주게 돼 있는데, 이를 위반했다”고 말했다.\n  이 지침을 위반하면 외상센터 지원금을 환수할 수 있게 돼 있다.\n  아주대 외상센터는 지난해 66억3600만원의 국고 지원을 받았다.\n  2016년 3월 외상센터 정식 개원 전엔 별 문제가 없었다고 한다.\n  하지만 오픈 후 환자가 몰리면서 갈등이 시작됐다.\n  이 교수는 “본관에 병실이 많이 비었는데도 (우리 환자에게) 내주지 않더라.\n  수없이 사정했다.\n  병실을 안주면 긴급 출동을 못하고, 환자를 데려오지 못한다”고 말했다.\n  또 유희석 아주대 의료원장이 이국종 교수에게 폭언을 한 대화록이 공개돼 논란이 일고 있다.\n  13일 MBC 뉴스데스크는 유 원장과 이 교수를 담은 녹음파일을 공개했다.\n  녹음파일에서 유 원장은 이 교수를 향해 \"때려치워 이 XX야.\n  꺼져.\n  인간 같지도 않은 XX가 말이야\"라며 욕설이 담긴 막말을 한다.\n  유 원장이 \"나랑 한판 붙을래 너\"라고 말하자 이 교수는 \"아닙니다\"라고 답한다.\n   이 교수는 “이런 일이 반복되면서 더 이상 못 해먹겠다”라고 말했다.", "output": "아주대 권역외상센터가 셧 다운 상태인 바이패스를 63회 건 것에 대해 이 교수는 외상센터 환자가 넘치면 본원이 적극적으로 받아줘야 하는데 병원 당국이 이를 위반했다고 말했다."}, {"kind": "F6", "id": "s0358", "input": "그럼 이미 시행하고 있는 선진국은 바보란 말인가.", "output": "그럼 이미 시행하고 있는 선진국은 바보 란 말인가."}, {"kind": "F6", "id": "s1140", "input": "국가를 상대로 한 이런 공갈 해커를 빨리 못 잡으면 모방 범죄가 활개를 치게 된다.", "output": "국가를 상대로 한 이런 공갈 해커를 빨리 못 잡으면 모방 범죄가 활개를 치게 돼게 된다."}, {"kind": "F6", "id": "s0536", "input": "우리 정부도 인내심을 갖고 유연성을 발휘해야 한다.", "output": "우리 정부도 인내심을 갖고 유연성을 발휘 해야 한다."}, {"kind": "F6", "id": "s0815", "input": "더욱이 지금처럼 기업 구조조정이 절실한 때에는 이를 장려할 필요도 있다.", "output": "더욱이 지금처럼 기업 구조조정이 절실한 때에는 이를 장려 할 필요도 있다."}, {"kind": "F5", "id": "REPORT-news_r-03395-00002", "input": "7%였지만, 3분기에는 43.\n 5%로 급등했다.\n  위기 대응 능력도 빛났다.\n  비상경영 체제를 가동해 전 세계 170여국에 있는 고객사의 요청에 24시간 즉각 대응했다.\n  신뢰를 지키기 위해서다.\n  미국 구글의 운영체제(OS)인 안드로이드를 사용할 수 없게 되자 자체 개발한 ‘훙멍’을 선보였고, 주요 부품도 미국산 대신 유럽·일본·중국산 등을 활용했다.\n  이를 진두지휘한 사람이 바로 런 회장이다.\n  당황한 쪽은 미국이었다.\n  믿었던 ‘우군’인 영국은 미국의 반대에도 화웨이 5G장비를 국가 안보와 큰 관련이 없는 영역에 한해 허용하기로 했다.\n  보리스 존슨 영국 총리는 BBC와의 인터뷰에서 “화웨이 장비를 쓰지 말라고 한다면 그 대안을 함께 제시해야 한다”고 밝히기도 했다.\n  캐나다도 비슷한 제한적 도입을 검토 중이다.\n  반(反) 화웨이 동맹인 영어권 5개국 기밀정보 동맹체 ‘파이브 아이즈(Five Eyes)’에 균열이 생긴 것이다.\n  여기에 미국 반도체·소프트웨어 기업들은 미국 정부에 화웨이 제재를 풀어야 한다고 요구하고 있다.\n  이들 입장에서는 화웨이가 자사 제품을 사주는 ‘큰 손’이기 때문이다.\n  미 행정부 내에서도 비슷한 의견이 나오고 있다.\n  월스트리트저널(WSJ)에 따르면 미국 상무부는 최근 화웨이에 대한 제재를 강화하려 했으나, 오히려 미국 기업에 더 큰 타격을 줄 수 있다는 반대 의견이 나오면서 결국 계획을 미뤘다.\n  물론 이는 화웨이의 제품 경쟁력이 뒷받침됐기에 가능한 일이었다.\n  화웨이의 통신 장비 가격은 타사 대비 30~40%쯤 저렴한 데다, 지난해 2400여건의 미국 특허를 취득해 특허를 많이 받은 기업 10위에 오를 정도로 기술력도 탄탄하다.\n  하지만 화웨이의 길이 순탄치만은 않을 것이라는 전망도 많다.\n  현재 5G장비 시장은 LTE장비와 망을 함께 쓰는 비단독모드(NSA)이기 때문에 화웨이에 유리하다.\n  그러나 5G장비만 독립적으로 쓰는 단독 모드(SA)가 본격화하면 새로운 경쟁 환경이 조성된다.\n  중국 내부에서는 화웨이가 퇴직자를 부당하게 고소해 억울한 옥살이를 시킨 사건이 드러나면서 ‘애국 소비’에 찬물을 끼얹었다.\n  또 화웨이가 독자 OS를 기반으로 자체 생태계 구축을 추진하고 있으나, 이미 구글·애플 양대 진영을 주축으로 형성된 IT 생태계를 재편하는 것은 한계가 있다.\n  무엇보다 화웨이에 대한 제재를 풀지 않으려는 미 정부의 ‘마이웨이’가 큰 장벽이다.", "output": "미국은 미국의 반대에도 동맹인 영국과 캐나다가 화웨이 장비를 제한적으로 허용하고 미국 소프트웨어·반도체 기업들이 제재를 풀어야 한다고 요구하자 당황했다."}, {"kind": "F6", "id": "s0798", "input": "개각 수요가 진작 돌출해 있었던 만큼 그동안 충분한 인물 검증을 했을 것이다.", "output": "개각 수요가 진작 돌출해 있었던 만큼 그동안 충분한 인물 검증을 했을꺼다."}, {"kind": "F6", "id": "s0097", "input": "아직 상임위 일정도 안 잡고 있는데, 말이 안 된다.", "output": "아직 상임위 일정도 안잡고 있는데, 말이 않 된다."}, {"kind": "F5", "id": "REPORT-news_r-05362-00001", "input": "미국 국무부가 29일(현지시간) 한국 대구에 대해 여행경보를 최고수준인 금지 권고(4단계)까지 상향하자, 외교부가 미국발 ‘코로나 장벽’을 막기 위해 총력전에 나섰다.\n     1일 외교부에 따르면 강경화 외교부 장관은 이날 오전 스티븐 비건 국무부 부장관과 전화 통화를 갖고 코로나 사태에 대한 한국 정부의 요청을 전달했다.\n  강 장관은 비건 부장관에게 “(한ㆍ미) 양국 간 교류를 불필요하게 위축시킬 수 있는 미 정부의 과도한 조치는 자제해달라’고 강력히 요청”했다고 한다.\n   정통한 한 외교 소식통은 “비건 대표에 전달한 ‘과도한 조치’에는 우리 국민에 대한 입국 제한 문제도 포함된다”고 말했다.\n  강 장관은 카운터파트인 마이크 폼페이오 국무부 장관이 탈레반 평화협정 문제로 출장 중이어서 비건 부장관과 이날 통화했다.\n     이번 통화는 도널드 트럼프 미 대통령이 전날 코로나19와 관련한 추가 기자회견에서 “한국ㆍ이탈리아의 ‘특정 지역’에 대한 여행금지 조치를 단행할 것”이라고 한 직후에 이뤄졌다.\n  트럼프 대통령은 기자회견에서 특정 지역을 언급하진 않았지만, 이후 국무부가 여행 경보 사이트를 통해 ‘여행하지 말 곳(do not travel to)’ 명단에 대구를 명시했다.\n  미국이 한국의 특정 지역에 대해 여행 금지 권고를 내린 건 이번이 처음이다.\n    미 정부는 일찌감치 중국(2월 2일)과 이란(2월 26일)에 대해서 여행금지 권고를 한 데 이어 이들 국가를 방문한 외국인의 입국 금지를 시행하고 있다.\n  이 때문에 한국도 여행금지→입국제한의 수순을 밟는 것이 아니냐는 우려의 목소리가 커지고 있다.\n   한 외교 소식통은 “미 정부는 중국 우한에 대해서도 전세기로 실어나른 적이 있는 만큼 대구 체류 자국민에 대해 ‘철수 권고’ 비슷한 시그널만 내더라도 한국은 경제ㆍ외교적으로 강타당할 수밖에 없다”고 우려했다.\n    이에 대해 외교부 당국자는 “이번 조치는 자국민에 대한 권고(advisory)일 뿐, 대구 지역에 있는 주한미군이나 자국민이 귀국해야 한다거나 대구발 입국자들의 입국을 제한한다는 의미는 전혀 아니다”고 설명했다.\n   \"미 정부는 신중\"이라지만.\n 비상 걸린 외교부  외교부 내에서는 “한국에 대한 입국 제한 조치는 미 정부가 매우 신중하게 보고 있다”는 분위기가 우세하다.\n  그러나 물밑에서는 비상이 걸렸다.\n   특히 트럼프 대통령이 코로나19 관련 첫 ‘원 포인트 기자회견’을 예고했던 26일(현지시간)을 전후해 워싱턴의 주미 한국 대사관은 분주하게 움직였다고 한다.", "output": "미 국무부는 여행 경보 사이트를 통해 여행하지 말 곳 명단에 대구를 명시하였으며 중국과 이란에 대해서도 여행금지를 권고했다."}, {"kind": "F5", "id": "REPORT-news_r-01655-00002", "input": "단층 위에 건설된 댐댐 공사가 부실했다는 지적도 있다.\n 영주댐 건설에 반대해온 '내성천의 친구들'은 지난해 11월 '물 새는 영주댐, 주민 안전 위협한다'는 제목의 성명을 냈다.\n  이 단체는 2016년 7월과 2017년 10월, 2019년 9월 등 세 차례 담수가 진행되는 과정에서 영주댐 벽체 동일한 위치에서 누수 현상이 관찰됐다고 밝혔다.\n 이 단체는 영주댐이 활성단층으로 추정된 옥천단층이 지나가는 지반 위에 건설됐고, 댐 하부를 지나가는 주 단층의 폭이 30m에 이르는 게 원인이라고 주장했다.\n  이들은 영주댐 건설 후 주변 15㎞ 반경에서 일어난 지진이 7차례라는 점도 지적했다.\n  영주댐 건설 이전 30년 동안에는 같은 구간 내에서 일어난 지진이 1회에 불과한 것과 큰 차이가 있다는 것이다.\n  하지만 다른 의견도 없지 않다.\n 협의체 한 위원은 \"댐 누수 현상이 일부 있다고 하더라도 보수를 하면 충분히 해결할 수 있을 것으로 본다\"고 밝히기도 했다.\n  사라진 토종 물고기 흰수마자토종 민물고기이자 멸종위기 야생생물 I급 민물고기인 흰수마자가 최고의 서식지인 내성천에서도 숫자가 급감한 것이 상류 영주댐 건설과 관련이 있다는 주장도 꾸준히 나오고 있다.\n  지난해 10월 수자원공사가 국회 환경노동위원회 이상돈 의원에게 제출한 국감 자료에 따르면 영주댐 하류에서 2014~2017년 181~492마리가 관찰됐으나, 2018년에는 9마리만 관찰됐다.\n 지난해 초까지 환경부 산하 국립생태원이 실시한 내성천 조사에서도 흰수마자는 7마리만 발견됐다.\n  흰수마자의 급감은 영주댐이 들어서면서 수질이 악화하고 상류로부터 모래 공급이 끊긴 게 원인으로 지목되고 있다.\n 흰수마자는 강바닥이 모래이고, 흐름이 비교적 빠른 여울이 있는 얕은 물에서만 산다.\n  흰수마자는 위협을 느끼면 모래 속에 파고 들어가 숨는다.\n 흰수마자가 살아가는 데는 고운 모래가 필요한 것이다.\n  수자원공사 조사에 따르면 내성천 석탑교(영주시 문수면 조제리) 지점의 경우 2014년에는 지름 1㎜ 미만의 모래가 51.\n 3%를 차지했으나, 지난해 조사에서는 20.\n 6%로 줄었다.\n 반면, 지름 1~2㎜ 모래는 39.\n 4%에서 43.\n 2%로, 지름 2㎜ 이상의 모래는 9.\n 3%에서 33.\n 4%로 늘었다.\n  영주댐 하류 내성천의 다른 지점도 상황은 비슷했다.\n 오신교 지점도 지름 1㎜ 미만의 모래는 2014년 50.\n 5%에서 지난해 32.", "output": "이 단체는 동일한 위치에 누수 현상이 관찰되는 영주댐에 대해 옥천 단층이 지나는 지반 위에 건설된 게 원인이라고 주장했으며 지진이 7차례나 일어난 점도 지적했다."}, {"kind": "F5", "id": "REPORT-news_r-05323-00001", "input": "장내 세균의 가치 신종 코로나바이러스 감염증(코로나19) 사태로 면역력에 대한 관심이 어느 때보다도 높다.\n  마땅한 예방약이나 치료제가 없는 상황에선 유일하게 의지할 것이 바로 면역력이다.\n  실제로 코로나19 환자 중 완치 판정을 받고 퇴원한 국내 환자들은 모두 기저 질환이 없고 자체 면역력으로 병을 이겨낸 것으로 알려졌다.\n  결국 면역력을 높이는 것이 질병을 예방하고 회복하는 데 가장 근본적인 방법인 셈이다.\n  최근 장(腸)과 장내 세균이 ‘인체 최대 면역기관’으로 불리며 관심사로 떠오르고 있는 이유다.\n  면역력에서 장이 중요시되는 이유는 간단하다.\n  장에 면역 세포의 70% 이상이 존재하기 때문이다.\n  면역 세포의 대부분은 장내 점막에 집중돼 있는데, 면역 세포를 활성화하는 것이 바로 ‘장내 세균’이다.\n  장내 세균의 구성에 따라 면역력이 달라진다.\n  게다가 장내 세균은 해독 작용을 한다.\n  감염을 예방하고 장내에 침입하는 독소에 대항해 방어벽 역할을 한다.\n  실제로 미생물은 음식에 든 많은 독소를 중화시킨다.\n   감염 예방과 독소 중화 역할 사람은 저마다 고유한 장내 세균총을 가지고 있다.\n  어떤 사람은 유익균이, 어떤 사람은 유해균이 많다.\n  병에 걸린 사람일수록 유익한 균은 줄고 나쁜 균이 득세한다.\n  장내 세균 균형이 깨진 것이다.\n   장내 세균의 균형이 깨지면 염증과 산화 스트레스가 발생해 각종 질병의 원인이 된다.\n  아예 건강한 사람의 장내 세균을 환자에게 이식해 질병을 치료하는 연구도 활발하다.\n  장 속에 건강한 미생물을 이식해 병을 치료하는 것이다.\n   최근 자주 언급되는 ‘마이크로바이옴’ 역시 장내 세균에 관한 것이다.\n  마이크로바이옴은 몸에 사는 미생물과 그 유전정보를 일컫는다.\n  ‘제2의 지놈’으로도 불린다.\n  학계에서는 ‘마이크로바이옴’을 활용한 개인 맞춤형 의료가 현실화될 것으로 전망하고 있다.\n  그만큼 장내 세균이 건강의 핵심으로 언급된다.\n   장내 세균의 연구 범위는 뇌까지 확대되고 있다.\n  장내 세균이 뇌에 영향을 미치며 인간의 신경 활동을 좌우하고 특정 뇌 질환을 치료할 수 있다는 논리다.\n  실제로 일본 국립장수의료연구센터가 2016~2017년 건망증으로 진료를 받은 남녀 128명(평균 74세)을 대상으로, 대변 속 세균의 DNA를 추출해 분석한 결과, 치매 환자의 장 속에는 ‘박테로이데스’라는 균이 정상 환자보다 현저히 적었다.", "output": "코로나19의 예방약이나 치료제가 없는 상황에서는 면역력을 의지할 수 밖에 없는데 실제로 코로나19 환자 중 완치 판정을 받고 퇴원한 환자들은 자체 면역력으로 병을 이겨냈다."}, {"kind": "F6", "id": "s0576", "input": "현 세대의 복지를 위해 미래 세대의 지나친 고통을 요구해서는 안 된다.", "output": "현 세대의 복지를 위해 미래 세대의 지나친 고통을 요구해선 안 된다."}, {"kind": "F5", "id": "REPORT-news_r-03133-00001", "input": "중국 우한에서 발생한 신종 코로나바이러스 감염증 16번 환자를 처음 진료했던 광주광역시 광산구 21세기병원이 환자의 확진이 늦어진 데 대해 정부의 초동 대처를 지적하고 나섰다.\n  병원 측 신고로 초기에 환자를 걸러낼 수 있었지만, 중국 입국자 위주의 방역망으로 인해 확진이 늦어지는 바람에 접촉자가 늘어났다는 것이다.\n  최민혁 21세기병원장은 5일 중앙일보와의 통화에서 “지난달 27일 우리 병원 내과의사가 16번 환자를 진료한 뒤 신종 코로나를 의심해 관할 광산구 보건소에 전화했지만 ‘중국에 갔다 오지 않았으니 (검사 대상에) 해당이 안 된다’는 답변을 들었다”고 말했다.\n  보건당국에 따르면 16번 환자는 태국 방콕과 파타야 등을 다녀온 뒤 지난달 19일 귀국했고, 25일 저녁부터 오한과 발열 증세가 나타났다.\n  지난달 27일 21세기병원에서 진료를 받은 뒤 전남대병원을 찾았다.\n  전남대병원에서 폐렴약을 처방받은 뒤에도 호전되지 않자 다시 21세기병원을 찾았다.\n  수술을 받으러 먼저 입원해 있던 딸과 한 병실에서 8일간 머무르다 4일 확진 판정을 받았다.\n  고재민 21세기병원 총무팀장은 “인대 봉합수술을 받기 위해 병원에 왔던 딸과 동행했다가 컨디션이 좋지 않아 내과 진료를 받은 것”이라며 “보건소에선 해당 사항이 없으니 일반 진료를 받으면 된다고 했는데 우리가 신종 코로나 의심 소견서를 써 전남대병원으로 보냈다”고 설명했다.\n  이날 병원 측이 공개한 당시 진료의뢰서를 보면 21세기병원 내과의는 “(16번 환자가) 2016년 폐절제술 후 암이 진단돼 서울대병원이 추적 관찰 중”이라며 “2020년 1월 15일부터 19일까지 태국 여행을 다녀왔다.\n  태국 공항 출국장에서 상태가 안 좋은 사람과 접촉이 의심된다”고 적었다.\n  그러면서 “25일 저녁부터 발열, 몸살, 오한 증상이 발생해 금일(27일) 내원, 변종 바이러스 폐렴이 의심돼 전원한다”고 썼다.\n  상병명에는 ‘변종 코로나바이러스 폐렴의증’이라고 적혀 있다.\n  상병 분류 기호는 J18(폐렴)로 기재됐다.\n  최 병원장은 “애초 16번 환자는 (신종 코로나가) 의심되는 데다 수술한 딸을 간호할 겸 환자 본인도 같은 방에서 치료를 받겠다고 해서 단독방을 쓰게 했다.\n  딸과 엄마를 다른 환자와 철저히 격리했다”고 주장했다.\n  딸은 5일 18번째 환자로 확진받았다.\n    정은경 질병관리본부장은 이날 브리핑에서 “환자가 증상이 있었고, 또 (병원에서) 코로나 검사를 요청한 것도 맞는 사실인 것 같다”며 “현 지침으로 코로나를 의심하는 사례 정의에 들어가지 않다 보니 (보건소 등에서) 기계적으로 답변했다고 보고 있다”고 해명했다.", "output": "21세기병원에서는 16번 환자를 처음 진료하며 관할 보건소에서 검사 대상에 포함시키지 않아 검사가 늦어지면서 접촉자가 늘어났다고 지적했다."}, {"kind": "F6", "id": "s0877", "input": "그렇다고 유명 브랜드의 대기업만 유리하게 해서는 안 된다.", "output": "그렇다고 유명 브랜드의 대기업만 유리하게 해서는 않 된다."}, {"kind": "F5", "id": "REPORT-news_r-05065-00001", "input": "6년 7개월.\n  미국 여자프로골프(LPGA) 투어 빅 오픈에서 개인 통산 3승을 달성한 박희영(33)이 1승을 추가하는데 걸린 기간이다.\n  그 사이 그는 20대에서 30대가 됐고, 투어 생활도 10년을 훌쩍 넘겼다.\n  그에게도 많은 일이 있었다.\n  인내와 마음을 다잡았던 시간이 지난 뒤 따라온 건 달콤한 결실이었다.\n  24일 박희영을 만났다.\n  다음 달 초에 미국으로 건너갈 예정이었던 그는 신종 코로나바이러스 감염증(코로나19) 확산에 따라 일정을 앞당겨 25일 출국했다.\n  몇 달 전까지도 투어 카드를 지킬 수 있을까 걱정했던 그다.\n  그랬던 그의 위상은 이제 달라졌다.\n  9일 끝난 빅 오픈 우승이 변곡점이다.\n  그는 최혜진(21), 유소연(30)을 4차 연장 승부 끝에 꺾고 우승했다.\n  2013년 7월 매뉴라이프 클래식 이후 정말 오래 걸렸다.\n  우승으로 2년간 투어 카드 걱정은 덜었다.\n   우승한 지 2주가 지났는데도, 여운은 여전히 남았다.\n  박희영은 “부진한 성적 때문에 TV 중계에 나올 일이 많지 않았다.\n  챔피언 조에 합류한 것만으로도 만족했다.\n  혜진이, 소연이 플레이 성향을 안다.\n  그날 안에 승부가 안 끝날 것 같다고도 생각했다.\n  그런데 덜컥 우승했다”고 회상했다.\n  모처럼 우승이라 눈물이 날 법했는데, 당시 그는 환하게 웃었다.\n  그는 “멀리서 가족이 보는데, 내가 울면 힘든 감정을 함께 느껴야 할까 봐 일부러 밝게 웃었다”고 말했다.\n  박희영은 꾸준함의 대명사다.\n  17세였던 2004년 아마추어로 하이트컵 여자골프대회에서 우승했다.\n  국내에서 4승을 거뒀고, 2008시즌부터 LPGA 투어 무대를 지켰다.\n  그는 “프로생활 15년 동안 한·미·일 투어에서 한 번도 중도 기권한 적이 없다는 게 가장 큰 자부심”이라고 말했다.\n  자부심이 있다고 시련이 비껴가지는 않았다.\n  2013년 LPGA 투어 두 번째 우승 직후부터 시련이 이어졌다.\n  문제는 고질적인 손목 부상이었다.\n  박희영은 “한때는 손목이 너무 아파서 샴푸 통조차 들 수 없을 정도였다.\n  하지만 중간에 쉰다는 게 나 스스로 용납할 수 없었다.\n  어린 마음에 그렇게 자신을 압박했다.\n  시간이 지날수록 자신감도 떨어지고 샷도 멀리 보낼 수 없었다”고 말했다.\n   지난해 박희영은 LPGA 투어 상금 랭킹 110위로 추락했다.\n  시드를 뺏겼다.\n  골프를 그만둘까 생각했다.\n  그는 “프로 입문 동기 중 80%가 그만뒀다.", "output": "투어 생활이 10년을 훌쩍 넘긴 박 씨는 미국 여자프로골프 투어 빅 오픈에서 6년 7개월 만에 1승을 추가했으며 이는 인내의 시간을 거쳐 얻어낸 결실이었다."}, {"kind": "F6", "id": "s0993", "input": "피해액 산정 증거를 내라는 법원 요구에 공정위는 속수무책이었다.", "output": "피해액 산정 증거를 내라는 법원 요구에 공정위는 속수무책 이었다."}, {"kind": "F6", "id": "s0745", "input": "사실 유가 하락은 기업과 소비자들에게 세금 감면과 같은 효과를 내 세계 경제에 새로운 활력을 불어넣을 수 있다.", "output": "사실 유가 하락은 기업과 소비자들에게 세금 감면과 같은 효과를 내 세계경제에 새로운 활력을 불어넣을 수 있다."}, {"kind": "F5", "id": "REPORT-news_r-00604-00001", "input": "서울 서북권 최대 전통시장인 마포농수산물시장의 임대 계약을 놓고 마포구와 시장 상인들이 갈등을 빚고 있다.\n  시장을 관리하는 마포구 공기업인 마포구시설관리공단이 계약 갱신이 한 달도 안 남은 지난달 초 상인들에게 임대료 인상과 계약 기간 1년 단축을 통보하면서다.\n  상인들은 “개장(1998년) 이래 계약 기간은 늘 2년이었고, 임대료 인상분도 협의를 통해 정해왔다”고 주장하며 집단 반발에 나섰다.\n  상인들의 반발은 지난해 12월 초 공단이 보낸 통지문 한 통에서 비롯됐다.\n  등기우편으로 온 ‘2020년 마포농산물시장 임대차갱신 안내’에는 ‘인상률: 현 월 임대료의 5%’, ‘임대차기간: 1년간’이라고 쓰여 있었다.\n  계약 기간은 2020년 1월 1일부터였다.\n  인상 이유는 시설관리ㆍ인건비 상승 및 적자 예상 등으로 적혀있었다.\n    이에 상인들은 통지를 받은 후 ‘계약 불가’를 원칙으로 삼고, 구청ㆍ공단ㆍ서울시청을 모두 찾아 항의했다.\n  하지만 돌아온 것은 ‘임대차해지 및 명도 통보’였다.\n  통보의 주요 내용은 \"계약을 2019년 12월 31일 오후 5시까지 완료하길 바라며, 그렇지 않을 경우 계약이 자동해지된다\"였다.\n  이어 “(계약 해지시) 2020년 1월 10일까지 매장을 원상 복구하여 공단에 반환하라”며 “미이행시엔 불법 점유로 법적 조치 진행하겠다”고 했다.\n   결국 상인들은 시장상인번영회에 위임장을 일괄 제출하고 집단행동에 나섰다.\n  8일 오후 상인 90여 명은 서울시청 앞을 찾아 ‘관리규정 2년 원칙! 1년이 웬 말이냐!’ 등 적힌 피켓을 들고 “마포구청장 옷 벗어라” “시설관리공단 이사장 옷 벗어라” 구호를 외쳤다.\n  개장 때부터 22년째 대파 상점을 운영한다는 정양호(53)씨는 “이런 독단적 운영은 처음 본다.\n  계약 기간을 1년으로 줄여 앞으론 매해 5%씩 상승하겠단 얘기가 아닌가”라며 “자기네들 적자 예상을 왜 애먼 시장 상인한테 덮어씌우느냐”고 했다.\n   공단 “서울시가 임대료 올려…적자 운영 예상으로 불가피” 이에 대해 공단 측은 임대료 5% 인상 이유로 서울시에 내는 임대료가 전년 대비 1억4000만원이 오른 점을 강조했다.\n  시장은 마포구가 서울시 시유지를 임대해 사용하고 있는데, 서울시가 임대료를 높였으니 수지를 맞추려면 마포구 역시 임대료 인상이 불가피하다는 입장이다.\n  또 새해 인건비와 시설유지 비용 상승도 임대료를 올리는 요인이 됐다고 한다.\n  계약 기간을 1년으로 단축한 데 대해 공단은 “매해 달라지는 경제여건을 감안했을 땐, 1년으로 줄여 탄력적으로 대응하는 게 맞다고 판단했다”고 했다.", "output": "마포구시설관리공단이 임대료 인상과 계약 기간 1년 단축을 상인들에게 통보하면서 집단 반발에 나선 상인들과 마포구가 갈등을 빚고 있다."}, {"kind": "F5", "id": "REPORT-news_r-00190-00001", "input": "① 100년 전 달력의 새해 메시지 새해가 밝았다.\n  새해 첫 달력을 펼친다.\n  대한민국 달력으로 올해는 2020년, 아라비아 숫자 0과 2가 사이좋게 두 개씩 들어간 조합이다.\n  이 조합이 들어간 달력이 처음 나온 해는 18년 전, 그러니까 한일 월드컵이 있었던 2002년이었다.\n  이 조합이 들어간 달력이 다시 나올 해는 180년 후, 그 해 2200년에는 과연 어떤 일이 기다리고 있을까.\n  대한민국 달력은 100년 전에도 있었다.\n  대한민국 임시정부 학무부는 임시정부 수립 후 첫 번째 새해가 되는 1920년을 앞두고 대한민력(大韓民曆)이라는 달력을 제작했다.\n  북간도 화룡현 명동학교 건축기 뒷면에서 처음 실물이 발견된 이 달력을 통해 대한민국이라는 국가공동체를 만들고자 했던 임시정부의 노력을 엿볼 수 있다.\n  북간도 한인 교민사회는 대한민국의 상징으로 대한민력을 공유하는 달력 공동체의 중요한 일원이었다.\n  대한민력 상단에는 흥미로운 그림이 있다.\n  대한민국 기병과 보병이 독립문을 지나 행진하고 있고 길가에는 환호하는 인파로 가득하다.\n  독립문에 두 태극기가 각각 좌우를 향해 걸려 있어 이날이 경축일임을 알려 준다.\n  이 그림의 좌우 양단에는 각각 태극기가 그려져 있는데, 우측 태극기 아래에는 ‘독립’ 두 글자가, 좌측 태극기 아래에는 ‘만세’ 두 글자가 적혀 있다.\n  다시 ‘독립’ 두 글자 아래에는 ‘개천절’(음력 10월 3일)과 ‘독립선언일’(3월 1일)이, ‘만세’ 두 글자 아래에는 ‘중화민국 9년’과 ‘서력 1920년’이 기입돼 있다.\n  물론 전체 그림 위에는 ‘대한민국 2년’이 표시돼 있다.\n   북간도 명동학교 건축기 뒷면에서 발견 그림의 메시지는 명확하다.\n  행진하는 대한민국 군대를 향해 독립문 주변에서 한인이 독립 만세를 외치고 있다.\n  일본의 식민 지배에서 완전히 해방된 감격의 그 날을 표상하고 있다.\n  그 날이 언제가 될지 예측할 수는 없었을 것이다.\n  하지만 ‘대한민국 2년’ 안에 맞이해야 할 그 날이 되어야 한다는 의지가 드러나 있다.\n  어쩌면 돌아오는 ‘독립선언일’이 감격의 그 날이 될 수 있을까? 독립선언일이란 글자 그대로 독립을 선언한 날, 곧 미국의 ‘Independence Day’ 같은 날.\n  독립을 선언한 미국이 독립전쟁으로 식민 지배에서 벗어나 독립국이 됐듯이 대한민국 역시 미국의 길을 걸어 불원간 독립국이 된다면? 1919년 4월 재미 한인이 미국 독립 선언의 성소 필라델피아에서 독립을 선언하고 시가행진을 벌인 데에는 깊은 뜻이 있었다.", "output": "북간도의 명동학교에서 발견된 임시정부가 제작한 대한민력에는 대한민국 병사들이 독립문을 행진하고 인파들이 환호하며 식민 지배에서 해방된 날을 표상하는 그림이 돋보인다."}, {"kind": "F6", "id": "s0168", "input": "그러자면 제도적 장치를 위해 국회에서 잠자고 있는 부동산 관련 법안을 신속하게 처리해야 한다.", "output": "그러자면 제도적 장치를 위해 국회에서 잠자고 있는 부동산 관련 법안을 신속하게 처리해야한다."}, {"kind": "F6", "id": "s0205", "input": "시중은행들은 일단 적극 화답하고 있다.", "output": "시중은행들은 일단 적극 화답하고 잇다."}, {"kind": "F6", "id": "s0494", "input": "애초부터 결함이 있거나 부실 시공됐을 가능성이 크다.", "output": "애초부터 결함이 있거나 부실 시공됬을 가능성이 크다."}, {"kind": "F5", "id": "REPORT-news_r-01848-00001", "input": "“‘물갈이 쇼’를 위해서라면 모를까 현직 국회의원에게 모욕과 창피를 주면서까지 살생부를 오픈할 이유는 없습니다”더불어민주당 핵심 관계자는 21일 현역 의원 평가 ‘하위 20%’에 해당하는 명단 22명을 공개하지 않고 개별 통보키로 한 이날 당 공천관리위원회(공관위) 결정 이유를 이렇게 설명했다.\n  하위 20%는 공천 심사에서 20% 감점을 받는다.\n  경선에서 절대적으로 불리하다.\n  평판 등에도 안 좋은 영향을 미친다.\n  하위 20% 명단을 ‘살생부’라고 부르는 이유다.\n     이근형 민주당 전략기획위원장은 이날 오후 공관위 전체회의가 끝난 직후 “오는 28일 공관위원장(원혜영 의원)이 하위 20% 해당자에 대해 개별통보 방식으로 통지하기로 결정했다”며 “통보가 이뤄지면 해당 의원은 48시간 내 이의신청이 가능하다”고 말했다.\n    민주당은 지난해 5월 의원들의 입법실적ㆍ지역활동ㆍ기여도 등을 평가해 하위 20%에 해당하는 의원은 공천 심사에서 20%의 감점을 받는 제도를 도입했다.\n  지난해 11월 평가에 돌입해 최근 명단을 완성했다.\n    밀봉된 '살생부'…공개 불가 당초 민주당 내부에선 명단을 외부에 공개해야 한다는 의견이 제기됐다.\n  민주당 당규 74조 1항은 “평가 대상이 된 선출직 공직자는 발표 시점으로부터 48시간 이내에 이의신청할 수 있다”고 규정하는데, 여기서 ‘발표’는 곧 외부 공개에 해당한다는 해석 때문이었다.\n  또 하위 20%에 해당하는 의원에게 일일이 전달하면서 보안을 유지하는 건 불가능하다는 판단도 적지 않았다.\n  이와 관련해 지난 20일엔 민주당 안팎에서 하위 20% 중 일부의 명단이 담긴 '지라시'가 돌면서 당이 시끌시끌했다.\n  ‘도는 글) 하위 20%’란 제목 아래 의원 12명의 이름이 적힌 것이었다.\n  지라시 속 의원들은 서울·인천·경기·충청·부산 등 지역구가 고루 분포돼 있고 초선부터 다선 중진까지 다양했지만 친문 실세로 꼽히는 의원들은 보이지 않았다.\n  이때문에 당 내부에서 “친문 쪽이 특정 의원들을 쳐내기 위해 가짜 정보를 유포하는 것 아니냐”는 얘기까지 나왔다.\n  논란이 커지자 윤호중 민주당 사무총장은 “명단은 개봉하지 않아 밀봉된 상태”라며 진화에 나섰지만 이름이 적시된 의원을 포함해 민주당은 하루 종일 술렁였다.\n  하위 20%로 지목된 한 중진 의원은 이해찬 민주당 대표를 개인적으로 찾아가 “누가 나를 흔들려고 이러느냐”며 거세게 항의했다고 한다.", "output": "공관위원장이 개별 통보할 하위 20% 명단에 해당하는 의원들은 공천 심사에서 20% 감점을 받으며 경선과 평판에 불리한 영향을 받는다."}, {"kind": "F6", "id": "s0210", "input": "그는 아울러 장관들을 향해 아랫사람들에게만 맡기지 말고 직접 발로 뛰어 달라고 했다.", "output": "그는 아울러 장관들을 향해 아랫 사람들에게만 맡기지 말고 직접 발로 뛰어 달라고 했다."}, {"kind": "F6", "id": "s0081", "input": "대졸자들도 눈높이를 낮춰 생산라인 일자리를 갖는 변화를 보여줘야 한다.", "output": "대졸자들도 눈높이를 낮춰 생산라인 일자리를 갖는 변화를 보여줘 야 한다."}, {"kind": "F6", "id": "s0640", "input": "이 지역 기업과 근로자는 정신을 바짝 차려야 하다.", "output": "이 지역 기업과 근로자는 정신을 바짝 차려야 해다."}, {"kind": "F6", "id": "s0234", "input": "하지만 우리 현실과 보면 한참 동떨어진 발상이다.", "output": "하지만 우리 현실과 보면 한참 동떨어 진 발상이다."}, {"kind": "F6", "id": "s0462", "input": "하지만 전단 살포는 민간 단체가 주도하는 것이어서 남측 정부가 막을 명분이 없다.", "output": "하지만 전단 살포는 민간 단체가 주도하는 것이어서 남측 정부가 막을 명분이 없다"}, {"kind": "F5", "id": "REPORT-news_r-00853-00001", "input": "1917년 발굴된 지 103년 만에 쌍릉 대왕릉의 나무관이 아스라한 형체를 드러냈다.\n  백제 무왕(재위 600∼641)과 그의 왕비 무덤으로 추정되는 쌍릉 중 대왕릉의 무덤 방 안에서 나온 나무널(목관)이다.\n  1500년에 걸친 인고의 세월을 반영하듯 해진 옷처럼 너덜너덜, 부분적인 형체만 남았다.\n    그래도 물에 강하고 잘 썩지 않는 일본산 금송(金松) 자재인 걸로 보아 귀한 분을 모신 ‘영원의 잠자리’임을 짐작할 수 있다.\n  바로 옆엔 화강암을 고르게 다듬어 조성됐던 대왕릉 현실(玄室·시신을 넣은 널이 안치된 방)을 어른 10명이 들어갈 정도의 규모 그대로 재현해 놨다.\n  10일 문을 연 국립익산박물관의 상설전시실 풍경이다.\n    삼국시대 최대 절터인 익산 미륵사지 출토 유물 2만3000여 점을 포함해 전북 서북부 문화재 약 3만 점을 보관‧전시할 국립익산박물관이 10일 개관했다.\n  사적 제150호 미륵사지 남서쪽에 있으며 주변 경관을 해치지 않게 유적밀착형으로 나지막이(지하 2층·지상 1층) 건립했다.\n  연면적 7500㎡, 전시실 면적 2100㎡에 이른다.\n  2015년 백제역사유적지구가 유네스코 세계유산으로 등재된 지 5년 만이다.\n  이날 처음 공개된 상설전시실에선 그간 국립중앙박물관이나 국립전주박물관 등에 흩어져 보관돼온 유물들이 일제히 ‘고향’으로 귀환한 게 눈에 띄었다.\n  일제강점기에 처음 발굴돼 무덤 주인공을 놓고 갑론을박이 일었던 쌍릉 대왕릉 관련 유물이 대표적이다.\n  애초 『고려사』 등 옛 기록에 따르면 쌍릉은 백제 제30대 무왕 내외의 무덤으로 전해졌다.\n  널리 알려진 ‘서동요’ 설화의 주인공인 백제 서동왕자와 신라 선화공주 말이다.\n    그러다 2009년 미륵사지 서탑의 1층 탑신부 심주석에서 사리장엄구(사리를 봉안하는 일체의 장치)가 발견됐다.\n  이 중 사리를 안치한 경과를 기록한 ‘사리봉영기’에 639년 미륵사를 건설한 주체가 ‘사택적덕의 딸’로 기록돼 있었다.\n  이를 계기로 ‘서동요’ 로맨스가 후대에 만들어진 얘기일 가능성이 높다는 주장이 나왔다.\n  게다가 2017년 공개된 일제강점기 자료조사 보고서에 따르면 그간 무왕의 무덤으로 여겨져온 대왕릉 주인이 20~40대 여성일 가능성이 제기됐다.\n  1400년 만에 빛을 본 쌍릉 주인공이 다시 미스터리에 빠지는 순간이었다.\n    결국 2017~2018년간 대왕릉에 대한 재조사가 대대적으로 이뤄졌다.\n  100년 만에 다시 열린 나무상자에 담긴 102점의 인골 파편을 국립부여문화재연구소가 현대 기술로 분석했다.", "output": "부분적인 형제만 남은 쌍릉 대왕릉의 나무관이 백제 무왕과 그의 왕비 무덤으로 추정되는 쌍릉 중 대왕릉의 무덤 방 안에서 나왔다."}, {"kind": "F5", "id": "REPORT-news_r-04717-00002", "input": "거의 모든 주요 사건(국민이 주목하는 사건)은 정치적으로 해석된다.\n  한편에서는 윤석열 검찰총장이 정의의 칼을 휘둘렀다고 생각하고, 다른 한편에선 적폐 세력의 반격으로 여긴다.\n  일반 사건의 결과는 수임료 비싼 변호사와 검찰의 협잡이거나, 정치권력과 검찰의 유착 아니면 충돌로 이해한다.\n  지금 윤 총장을 정의의 사도로 생각하는 시민 중 상당수는 얼마 전까지만 해도 그를 권력의 앞잡이라고 비난했다.\n  판단은 언제든 다시 뒤바뀔 수 있다.\n  노무현·이명박·박근혜 전 대통령에 대한 검찰 수사 중 하나라도 반대하는 이는 검찰이 공정하다고 생각하기 어렵다.\n   “사법 불신의 끝은 배심제” 법원을 보는 시각도 크게 다르지 않다.\n  큰 사건의 판결이 나면 재판을 맡은 판사의 성향을 본다.\n  아니, 판결 전부터 그것을 근거로 삼아 예측한다.\n  ○○○연구회 소속이냐, 고향이 어디냐, 사법부에서 주류·비주류 중 어느 쪽에 속하냐를 따진다.\n  죄를 보지 않고 판사를 본다.\n  판결 뒤에는 시민들이 두 패로 갈려 싸우기 일쑤다.\n  법관은 ‘법률과 양심에 따라 재판한다’는 믿음은 헌법 속에 있는 박제가 됐다.\n  김용담 전 대법관은 “사법의 틀에 대해 근본적인 고민을 할 때가 됐다”고 말했다.\n  그는 “배심제 재판 도입도 진지하게 고민해 봐야 한다.\n  국민이 판사를 믿지 않으니 별도리가 없지 않으냐”고 했다.\n  1년 전에 만났을 때만 해도 “국민이 판사의 양심을 믿어야 한다”고 말했는데, 그런 기대를 포기한 듯했다.\n  “판사들이 정치계로 잇따라 뛰어드는 상황에서 어떻게 계속 재판에 대한 신뢰를 말할 수 있겠느냐”며 한탄했다.\n  배심제는 2008년 국민참여재판이라는 이름으로 한국 법원에 부분적으로 도입됐다.\n  ‘부분적’이라 함은 합의부 재판에서, 피고인이 동의할 경우에만 이뤄지는 데다가 판결에도 ‘권고적 효력’만 미치기 때문이다.\n  배심원 평결에서는 무죄 판단이 나와도 판사가 유죄를 선고할 수 있다.\n  김 전 대법관은 “우리 헌법에 재판은 판사가 하게 돼 있기 때문에 본격적인 배심제 도입은 개헌 사항이다.\n  이런 이유 등으로 인해 우리 법원이 배심제 도입에 대해 소극적이었다.\n  영국·미국의 배심제가 우리 현실에 맞지 않는다면 시민과 법관이 함께 판단하는 ‘참심제’ 도입도 대안으로 생각해 볼 수 있다”고 말했다.\n  독일·일본 등에서 참심제가 운용되고 있다.\n   ‘관료 사법’의 중대 위기 판·검사를 믿지 못하면 결국 갈 길은 뻔하다.", "output": "김 전 대법관은 2008년부터 부분적으로 실행된 배심제가 우리 현실에 맞지 않는다면 대안으로 참심제의 도입을 생각해 보자고 발언했다."}, {"kind": "F6", "id": "s0329", "input": "금리 향방에 관한 분명한 신호를 주지 않은 것이다.", "output": "금리 향방에 관한 분명한 신호를 주지 안은 것이다."}, {"kind": "F5", "id": "REPORT-news_r-03321-00001", "input": "일본의 대형 크루즈 ‘다이아몬드 프린세스’내에서 신종 코로나바이러스 감염증 환자가 대규모로 발생한 가운데 국내 항구로 조만간 입항 예정인 국제 크루즈 선박들에 대한 우려가 제기되고 있다.\n    8일 일본 보건당국에 따르면 다이아몬드 프린세스 크루즈 내 감염 의심자들에 대한 검사 결과 신종코로나 확진자가 3명 추가로 확인됐다.\n  전날 41명의 승객이 무더기로 확진 판정을 받은데 이어 또 환자가 늘어난 것이다.\n  이 크루즈 내에서 감염된 사람만 이날까지 64명이다.\n  승객과 승무원 등 3700여명을 태운 이 크루즈는 지난달 20일 일본 요코하마항을 출발해 홍콩과 동남아 지역을 운항했다.\n  이 배에 승선했던 홍콩 국적 남성(80)이 지난달 25일 홍콩에서 내린 뒤 신종 코로나 확진 판정을 받았다.\n  이 승객이 어디에서 감염됐는지는 확인되지 않았다.\n  이 배는 일본의 수도 도쿄 인근인 요코하마항에 봉쇄된 채 정박해 있다.\n  일본 정부는 신종 코로나 최대 잠복기인 14일동안 탑승객 3700여명을 크루즈 내에 머물게 할 계획이다.\n  크루즈 내에서 확진자가 속속 나타면서 감염된 승객이 내릴 경우 지역사회 감염원이 될 가능성이 있어서다.\n    크루즈선 내에는 객실, 식당, 수영장, 사우나, 운동시설, 공연시설 등이 갖춰져있다.\n  승객들은 배 안에서 먹고, 자고, 놀다가 중간 기착지마다 내려 관광을 하는 방식이다.\n  전문가들은 승객들이 식당 등 폐쇄된 실내 공간에 장시간 머물게 되는 구조가 바이러스 전파를 부추겼다고 보고있다.\n  엄중식 가천대길병원 감염내과 교수는 “배에서 확진자가 얼마나 더 나올지 알 수가 없어 걱정된다.\n  크루즈선은 내부가 굉장히 좁다.\n  승객 동선을 고려하면 확진자가 돌아다니지 않은 곳이 없을 것으로 본다.\n  폐쇄된 공간이다 보니 손님들이 다닐 수 있는 곳은 다 돌아다니기 때문에 대규모 감염 위험이 크다”라고 설명했다.\n  과거 이 크루즈가 부산항에 종종 들렀지만, 이번에는 일본 불매 운동 때문에 오지 않은 것이라는 주장도 나왔다.\n  실제로 이 크루즈선은 지난해 4월 부산항을 출발해 일본 요코하마항에 도착했다.\n  6박 7일의 여행 비용은 숙박비ㆍ식비 등을 모두 포함해 130여만원이었다.\n  \"가성비가 좋다\"는 입소문이 돌면서 승객 상당수가 한국인으로 채워졌다.\n  이번 여행상품도 예년같으면 부산항에 머무르며 부산 관광을 원하는 승객들을 내려줬을테지만, 일본 불매 운동으로 국내 수요가 급감하면서 부산을 들르지 않았다는 얘기다.", "output": "요코하마항에 봉쇄된 채 정박 중인 다이아몬드 프린세스 크루즈에서 신종 코로나 확진자가 추가로 발생하자 일본 정부가 탑승객을 잠복기 동안 크루즈 내에 머물게 할 것이라 밝혔다."}, {"kind": "F6", "id": "s0142", "input": "오늘 회동은 이런 인식 차이를 좁혀 접점을 찾는 생산적인 자리가 돼야 한다.", "output": "오늘 회동은 이런 인식 차이를 좁혀 접점을 찾는 생산적인 자리가 되야 한다."}, {"kind": "F5", "id": "REPORT-news_r-04863-00001", "input": "‘트럼프표 블랙리스트’라도 만든 걸까.\n   탄핵 공방을 끝낸 도널드 트럼프 미국 대통령이 본격적인 재선 레이스를 앞두고 반대파를 제거하기 시작했다.\n  그러자 이에 대한 미국 주요 언론의 우려가 쏟아지고 있다.\n  정치적 중립을 지켜야 하는 미국 공무원 사회의 기본을 흔들뿐더러 자칫 민주주의의 가치를 훼손할 수 있어서다.\n      뉴욕타임스(NYT)는 22일(현지시간) 보도에서 “요즘 트럼프 행정부의 고위 관료들은 과연 자리를 보전할 수 있을지 매일 불안에 떨고 있다”고 최근 백악관 분위기를 전했다.\n  그러면서 “1883년 미국의 공무원 임용법이 제정된 이후 공무원 사회에 가해진 가장 큰 폭력”이라고 강하게 비판했다.\n  일명 ‘펜들턴법(Pendleton Civil Service Act)’이라 불리는 공무원 임용법은 공무원의 정치적 중립을 중요하게 다루고 있다.\n     이런 지적이 나오는 것은 최근 트럼프 대통령의 반대파 제거 행보가 무척 과감했기 때문이다.\n   가장 먼저 쫓아낸 건 탄핵 공방에서 자신에게 불리한 증언을 한 이들이다.\n  조지프 맥과이어 국가정보국장 대행, 존 루드 국방부 전 정책담당 차관이 표적이 됐다.\n  물론, 트위터를 통해서였다.\n  알렉산더 빈드먼 백악관 국가안보회의(NSC) 유럽 담당 국장과 고든 선들랜드 유럽연합(EU) 대사 역시 트럼프에 불리한 증언을 했다는 이유로 경질됐다.\n  이것도 모자라 몇 년 전 트럼프 대통령을 비판하는 신문 기고를 했다고 의심 받아온 빅토리아 코츠 백악관 국가안보 부보좌관도 다른 직책으로 밀려났다.\n   미 언론들은 이런 작업이 “체계적으로 이뤄지고 있다”(NYT)는 점에 주목하고 있다.\n      워싱턴포스트(WP)는 “트럼프 대통령은 모든 부처에서 충성심이 부족한 이들을 쫓아내라고 측근들에게 지시”했으며 ‘트럼프표 블랙리스트’를 주도적으로 만들고 있는 이는 백악관 인사국장 존 매켄티와 트럼프의 사위이자 백악관 선임보좌관인 재러드 쿠슈너라고 22일 보도했다.\n  CNN 역시 24일 보도에서 “트럼프 대통령은 새로운 인사국장에게 불충한 이들을 색출하라고 했으며 매켄티는 특히 국무부와 국방부를 중심으로 ‘색출 작업’에 나설 것으로 보인다”고 전했다.\n     문제는 매켄티 국장이 올해 29세에 불과한 초보라는 점이다.\n  WP에 따르면 매켄티는 인사 관련 업무를 제대로 해본 적이 없다.\n  백악관 관료들의 불안과 불만이 높아지고 있는 이유다.\n     NYT는 “트럼프와 그 측근들은 '불충한' 관료들 없이도 행정부를 잘 이끌 수 있을 거라 생각하는 것 같은데 이는 오산”이라고 비판했다.", "output": "트럼프표 블랙리스트를 만든 건지 트럼프 대통령이 반대파를 제거하기 시작하자 민주주의 가치가 훼손될 수 있다며 미국 주요 언론에서 우려가 쏟아지고 있다."}, {"kind": "F6", "id": "s0335", "input": "임직원들도 그 편싸움 행렬에 줄 서고 가담하면서 금융 경쟁력은 쑥대밭이 됐다.", "output": "임직원들도 그 편싸움 행렬에 줄서고 가담하면서 금융 경쟁력은 쑥대밭이 됐다."}, {"kind": "F5", "id": "REPORT-news_r-05319-00002", "input": "하지만 신종 감염병에 대한 일반적인 수준의 불안감과 약간의 스트레스는 정상이다.\n  홍 교수는 “스트레스가 자연스러운 현상이라는 점을 받아들이면서 다른 사람과 감정을 공유하면 나만 이렇게 불안하거나 힘든 게 아니라는 걸 알고 마음이 편안해지는 부분이 있다”고 말했다.\n  다만 부정확한 소문을 전하거나 최악의 상황을 상상하는 건 도움이 안 된다.\n  　셋째, 감정 조절이 지나치게 힘들면 전문가에게 도움을 청한다.\n  일시적인 불안과 스트레스는 우울증이나 불안 장애는 아니다.\n  하지만 이런 감정이 장기화하면 문제될 수 있다.\n  홍 교수는 “잠을 잘 자지 못하고 입맛이 떨어지며 가슴이 두근거리는 등 신체 증상이 나타나고 일상생활에 방해가 될 정도로 감정 조절이 힘들면 전문가의 진료를 받아봐야 한다”며 “지금은 병원에 오는 것 자체를 꺼려 이런 문제로 진료받는 환자는 없지만 기존에 불안증·우울증으로 병원에 다니던 환자 중에는 증상이 악화한 경우가 꽤 있다”고 말했다.\n   자녀가 두려움 느끼지 않게 관심을 넷째, 어린이와 청소년에게 관심을 기울여야 한다.\n  인터넷상 정보에 민감한 아이들은 과도한 불안, 두려움이나 스트레스를 경험할 수 있다.\n  아이들은 감염병에 대해 정확하게 이해하지 못하기 때문에 아이들 수준에 맞춰 침착하게 설명해 주는 것이 좋다.\n  최근 감염병에 대해 자녀가 어떻게 알고 있는지 묻고, 자녀가 걱정을 많이 한다면 왜 그런지 대화로 풀어보는 게 도움된다.\n  아이의 질문에 부모가 정확한 답을 모르면 당황해 얼버무리거나 대답을 피할 게 아니라 자녀에게 믿을 만한 정보의 출처를 알려주고 함께 정보를 찾아본다.\n  　마지막으로 격리된 환자·가족에게도 격려가 필요하다.\n  지나친 불안과 공포로 적대감을 조장하는 건 공동체의 면역력을 해친다.\n  격리는 질병의 확산을 막기 위해 불가피한 조치로 격리 대상자는 격리를 준수해야 할 책임이 있다.\n  하지만 격리 당사자와 가족에게는 스트레스가 크다.\n  자신의 질병 경과에 대한 현실적인 불안, 자신으로 인해 격리된 가족이나 지인에 대한 미안함, 격리에 따른 고립감 등 다양한 원인으로 정신적 어려움을 겪는다.\n  　격리된 상황에서는 스마트폰 등 IT기기를 이용해 가족·친구들과 영상 통화를 하면서 고립감을 줄이고 정확한 정보를 확인해 불안감을 다독이는 게 좋다.\n  홍 교수는 “감염병은 공동체 의식을 갖고 해결해야 하는 부분이라서 가해자·피해자로 나눌 수 있는 간단한 문제가 아니다”며 “갈등 구도를 만드는 건 현 상황에서는 별 도움이 안 된다”고 말했다.", "output": "일시적 불안이나 스트레스는 불안 장애가 아니지만 장기화되어 일상생활에 방해가 될 정도로 감정 조절이 힘들어지면 전문가의 도움을 받아봐야 한다."}, {"kind": "F5", "id": "REPORT-news_r-01679-00001", "input": "삼성전자가 스마트폰사업 수장에 노태문(52) 사장을 새로 선임하면서 국내 스마트폰 부품업계가 긴장하고 있다.\n  노 사장이 삼성전자 안에서 스마트폰의 외주 생산 확대 전략을 주도하는 인물로 알려져있기 때문이다.\n  삼성전자가 중국의 업체를 활용해 제조자개발생산(ODM) 방식으로 외주 생산을 확대할 경우 삼성 의존도가 높은 국내 부품업계는 어려움을 겪을 수 있다.\n    노태문 사장 \"스마트폰 ODM 비중 늘려야\" 스마트폰용 카메라 부품을 만드는 한 부품업체 임원은 20일 \"삼성전자의 이번 인사로 스마트폰 생산의 외주화에 가속도가 붙을 것으로 보인다\"며 \"(삼성전자 협력회사 모임인) 협성회 회원사들이 바짝 긴장하고 있다\"고 말했다.\n  다른 업체 관계자는 \"삼성이 외주 생산을 확대하는 방향으로 간다는 것은 이미 알려진 사실이기 때문에 특별히 뭐라 할 말은 없다\"며 말을 아꼈다.\n    삼성전자는 스마트폰을 100% 외주 생산하는 애플과 달리 그동안 자체 생산을 유지해 왔다.\n  하지만 2018년부터 기류가 변했다.\n  당시 삼성전자는 중국 ODM 업체인 윙테크에 중저가 스마트폰인 갤럭시A6s 생산을 맡겼다.\n  ODM이란 제품 개발부터 디자인, 생산까지 외주 업체에 맡기고 주문자는 '브랜드 로고'만 붙여 판매하는 방식이다.\n  삼성전자가 스마트폰 생산을 외부 업체에 맡긴 것은 이 때가 처음이고, 이를 주도한 것이 노태문 사장으로 알려져 있다.\n  무선개발실장(부사장)이던 그는 2018년 9월 임원진을 이끌고 윙테크를 직접 방문해 계약을 끌어냈다.\n   삼성전자 ODM 30%까지 확대할 가능성 노태문 사장은 지난해 말 주요 임원 회의에서도 “현재 스마트폰 라인업을 관리하려면 품질 관리를 위해서라도 ODM을 확대할 필요가 있다\"고 주장한 것으로 알려졌다.\n  ‘ODM 30%’라는 구체적인 수치까지 제시했다고 한다.\n  삼성전자가 최근 3년간 연평균 3억대 안팎을 출시한 점을 고려하면, ODM을 1억대까지 확대할 수 있다는 얘기다.\n   삼성전자 입장에서 ODM 확대는 불가피한 선택이다.\n  삼성전자는 중저가폰의 최대 시장인 중국과 인도에서 고전중이다.\n  2013년 20%까지 올랐던 중국 스마트폰 시장 점유율은 1%대로 떨어졌다.\n  인도에서는 지난해 3분기 기준 점유율 2위(20%)지만 선두인 샤오미(26%)와 격차가 더 벌어졌다.\n  삼성전자 스마트폰 전체 판매량에서 중저가폰은 60~70%를 차지한다.\n  중국 업체의 저가 물량 공세에 대응하기 위해서라도 ODM을 통해 원가 절감에 나설 수밖에 없는 처지다.", "output": "삼성전자가 스마트폰의 외주 생산 확대를 주도하는 노 사장을 스마트폰 사업 수장에 선임했는데 삼성전자가 외주 생산을 확대하면 어려움을 겪을 수 있어 국내 부품업계가 긴장하고 있다."}, {"kind": "F5", "id": "REPORT-news_r-03934-00001", "input": "구자철(31·알 가라파)이 K리그 복귀가 불발된 친구 기성용(31·전 뉴캐슬)의 상황에 대해 안타까워했다.\n  구자철은 14일 자신의 유튜브 채널 ‘슛별친’에 ‘성용이가 K리그 복귀를 결정하며 했던 각오’란 제목의 4분50초짜리 영상을 올렸다.\n  구자철은 “성용이가 기자회견을 열려했는데 코로나 여파로 당장 열지 않았다.\n  그래서 내가 (영상) 편집자를 보내줄테니 어떤 마음인지 팬들과 소통하라고 했다.\n  성용이가 ‘하루이틀 생각해볼게’라고 했는데”라며 “제가 먼저 한 명의 팬으로, 기성용의 팬으로, FC서울 팬은 아니고.\n  영상 찍는 것도 성용이와 충분히 이야기하고 나의 안타까움을 표현하게 됐다.\n  FC서울 팬 뿐만 아니라 한국축구팬들이 아쉬워하고 안타까워해서 공감하고자하는 마음에서다”고 운을 뗐다.\n 기성용은 지난 11일 K리그 복귀가 불발됐다.\n  잉글랜드 뉴캐슬과 계약을 해지한 기성용은 친정팀 FC서울 복귀를 타진했다.\n  연봉을 삭감할 뜻도 내비쳤지만 협상은 이뤄지지 않았다.\n  이후 K리그 전북과 협상했으나, 기성용과 서울 사이에 ‘K리그 다른 팀 이적 시 위약금’ 조항이 있었다.\n  결국 K리그 복귀 자체가 무산됐다.\n  구자철은 유럽무대에서 뛸 때부터 기성용, 이청용(32·보훔)과 연락하며 “우리가 K리그에서 활약하는 모습을 팬들에게 보여주자”는 말을 굉장히 많이 했다고 했다.\n  구자철은 K리그 제주, 기성용과 이청용은 서울에서 뛰었고, 셋은 축구대표팀 주전으로 오랜 시간을 함께 활약했다.\n  구자철은 “성용이가 K리그에 복귀하겠다는 마음을 먹은거 자체가, 제가 옆에서 지켜봐온 친구로서 굉장히 놀랍고, 대단한 선택을 해줘서 너무 반가웠다”고 했다.\n  이어 구자철은 “그래도 1% 희망이 아직도 남아있다고 믿는 사람인데, 성용이와 대화를 나눠보면 이미 마음의 상처를 좀 많이 받아서, 돌아갈 수 있을까란 생각을 하게 된다”고 했다.\n  구자철은 “진짜 많이 안타깝다.\n  화도 많이 난다.\n  제가 만약 프로팀 단장이었다면 어떻게 했을까”라고 했다.\n 구자철은 “저랑 성용이, 청용이랑 셋이 얘기한게 뭐나면.\n  우리가 K리그에 돌아간다면 설렁설렁하거나 거만하거나 절대 그런 일은 일어나지 않는다는거다.\n  셋 다 똑같은 이야기”라고 했다.\n  이어 그는 “성용이와 5일동안 계속 통화하면서 똑같은 마인드였다.\n  K리그 돌아간다면 처음 유럽에 진출해서 살아남기 위해 진짜 미친듯이 운동하던 그 시절처럼 아마 할거다.", "output": "기 씨가 FC 서울 복귀를 타진했지만 위약금 조항이 있어 협상이 이뤄지지 않은 상황에 대해 구 씨는 안타까워했다."}, {"kind": "F5", "id": "REPORT-news_r-03454-00001", "input": "21대 총선 후보 등록(3월26일부터)까지는 11일 현재 43일이 남았지만 이미 서울 종로에선 사실상 본선 경쟁이 시작됐다.\n  박근혜ㆍ문재인 정부 국무총리 출신 간의 빅매치가 성사되면서다.\n  10일 이낙연 전 총리는 신종 코로나바이러스 감염증 사태로 직격탄을 맞은 광장시장의 상인들을 달래러 나섰고 황교안 자유한국당 대표는 모교 성균관대 앞에 있는 성균관을 찾았다.\n  두 사람의 동선에선 위기 대응을 위해선 안정이 필요하다는 점을 강조하려는 시도(이 전 총리)와 종로와의 연고를 유권자들에게 확인시키려는 노력(황 대표)이 각각 읽혔다.\n    그러나 종로구 선거를 관심있게 지켜보아 온 전문가들은 양대 정당 대표선수 간의 격돌이지만 의외로 승패는 미시적인 선거전략의 성패에 따라 갈릴 수 있다고 전망한다.\n  동별 표심이 확연히 다른 종로구의 특성 때문이다.\n  주거지가 집중된 동네들을 중심으로 보면, 종로구의 동쪽 끝인 창신 1ㆍ2ㆍ3동과 숭인 1ㆍ2 동 등은 민주당 계열의 텃밭으로 분류된다.\n  중·소형 평수 아파트와 다가구 주택에 인구가 밀집해 20대 총선 때 5개 동의 선거인수가 3만3803명에 달했다.\n  이명박 신한국당 후보가 당선됐던 1996년 15대 총선 당시 야권은 새정치국민회의 이종찬 후보와 민주당 노무현 후보로 분열됐지만 이 지역에서만큼은 이종찬 후보가 이명박 후보를 2500표 이상 앞섰다.\n  종로구의원을 오래 지낸 한 인사는 “호남 출신 인구가 많은 곳으로 정평이 나 있는 지역”이라며 “호남 향우회의 조직력이 막강하다”고 말했다.\n 2008년 18대 총선 당시 박진 한나라당 후보에 전체 2583표 차로 패한 손학규 통합민주당 후보도 이 지역에선 승리했다.\n  종로구의 서쪽 끝인 인왕산 자락의 무악동도 아직 다가구주택에 사는 서민층이 많아 민주당 유리 지역으로 꼽힌다.\n   반면 주거 형태가 대형 평수의 빌라나 고급 단독 주택 위주인 구기동과 평창동은 보수 성향 표심이 뚜렷한 지역이다.\n  2016년 20대 총선 때 이곳 선거인 수는 1만5372명이었다.\n  당시 오세훈 새누리당 후보를 1만표 이상 여유있게 따돌렸던 정세균 더불어민주당 후보도 이 구역에선 열세를 극복하지 못했다.\n  이 구역에서 최종 득표 결과는 정 후보 4571표, 오 후보 4619표였다.\n    21대 총선을 앞두고 주목받는 승부처는 행정동으로 부암동(법정동 부암ㆍ신영ㆍ홍지)과 교남동(법정동 교남ㆍ교북ㆍ송월ㆍ평ㆍ행촌ㆍ홍파)이다.", "output": "전문가들은 21대 총선 후보인 이 전 총리와 황 자유한국당 대표의 격돌은 미시적인 선거전략의 성패에 따라 갈릴 수 있다고 전망한다."}, {"kind": "F5", "id": "REPORT-news_r-02843-00001", "input": "\"반드시 낫게 하겠습니다.\n  첫 증상 7일째인 지난달 29일부터 폐렴 증세가 경미하게 동반됐으나 어제(2일)부터 매우 안정적인 상태로 돌아왔습니다.\n \" 신종 코로나바이러스 감염증(우한 폐렴) 3번째 확진 환자(3번 환자)가 입원치료를 받고 있는 명지병원의 이왕준 이사장(외과 전문의)은 3일 중앙일보와 통화에서 이같이 말했다.\n  경기도 고양시에 있는 명지병원에서 입원 치료를 받고 있는 3번 환자 A씨(54)를 두고 한 말이다.\n  A씨는 지난달 25일 의심환자 상태로 음압병실(외부와의 기압 차이로 병원체가 빠져나가지 못하게 만든 특수병실)에 들어와 다음날 확진 판정을 받았다.\n  이 이사장은 \"A씨가 가장 민감한 시기를 잘 통과한 듯하다\"며 A씨의 퇴원 가능성을 크게 봤다.\n  이 이사장에 따르면 신종 코로나는 증세가 나타난 후 7~12일 사이가 가장 고비로 꼽힌다.\n   이 이사장은 또 \"지난 주말부터 정신적 안정을 위해 A씨가 인터넷 댓글을 못 보게 하고 있다\"고 말했다.\n  A씨가 서울 강남, 고양 일산 등을 사흘간(지난달 22~25일) 이동한 사실이 확인되면서 인터넷에 악성 댓글이 많아진 데 따른 조치다.\n  명지병원은 A씨가 입원했다는 소식이 알려진 뒤 일반환자의 입원 외래가 평상시보다 60% 가까이 떨어졌다고 한다.\n  명지병원 일부 직원들은 그들을 꺼리는 듯한 주변 시선에 힘들어하고 있는 것으로 알려졌다.\n  이에 대해 이 이사장은 \"주변에서 꺼리고 두려워하는 걸 알고 있다\"며 \"일부가 전부는 아니라고 본다.\n  병원을 와주시는 나머지 분들에게 감사하다\"고 말했다.\n    명지병원 가족들에게 용기를 주는 사람들도 있다.\n  고양시청 관계자는 \"최근 명지병원에 '캔커피 200개를 전달해달라'는 요청이 있었다\"고 말했다.\n  이 이사장 역시 최근 자신의 페이스북을 통해 \"최근 유음료(요구르트 등)를 배달하는 아주머니가 응원 손편지 등을 전해달라 하고 익명 기부자들이 시청과 구청을 통해 직원들에게 생수와 캔커피를 보내오고 있다\"고 전했다.\n  이 이사장이 공개한 사진엔 \"명지병원 선생님들 힘내세요.\n  화이팅\"이라고 적힌 편지가 요구르트와 함께 놓여있었다.\n  명지병원은 A씨 완치에 대해 강한 자신감을 보였다.\n  명지병원 관계자는 \"의료진을 믿어주면 메르스에 이어 신종 코로나바이러스도 반드시 이겨낼 것\"이라고 말했다.\n  명지병원은 2015년 메르스(MERS·중동호흡기증후군) 사태 때도 2차 감염 없이 환자 5명을 완치한 적 있다.", "output": "명지병원 관계자는 2차 감염 없이 환자를 완치한 메르스 사태에 이어 신종 코로나바이러스도 이겨내겠다는 강한 자신감을 보였다."}, {"kind": "F5", "id": "REPORT-news_r-04631-00001", "input": "흔한데 잘 모르는 점액낭염메이저리그(MLB) 특급 투수인 맥스 셔저(워싱턴 내셔널스)는 지난해 등 쪽에 뻐근함을 느껴 받은 정밀 검진에서 ‘견갑흉부 점액낭염’이란 진단을 받았다.\n  팔뼈와 몸통을 연결하는 오른쪽 어깻죽지에 염증이 생긴 것이다.\n  당시 셔저는 ‘돌이 들어간 신발을 신고 달리는 것 같다’며 통증을 호소했다.\n  　점액낭은 피부와 뼈 사이에서 마찰·압력을 줄여 완충 작용을 하고 관절의 움직임을 원활히 하는 점액 주머니다.\n  인천성모병원 정형외과 송광연 교수는 “평소에는 점액의 양이 매우 적어 만져지지 않지만 반복적으로 자극이 가해져 염증이 생기면 물이 차고 부풀어 오른다”며 “점액낭염은 환자가 꽤 많지만 잘 알려지지 않은 질환”이라고 말했다.\n  건강보험심사평가원 질병 통계에 따르면 지난해 어깨 점액낭염으로 진단받은 환자는 12만여 명, 무릎 점액낭염 환자는 4만7000여 명이었다.\n  　점액낭은 모든 관절 주변에 정상적으로 존재하는 물주머니다.\n  그중 마찰이 잦은 어깨·무릎·엉덩이뼈·발목 부위의 점액낭에 염증이 잘 생긴다.\n  어깨는 체중 부하를 받지 않는 부위지만, 팔을 머리 위로 올리거나 회전하는 반복적인 운동을 하면 스트레스가 전해져 염증이 생길 수 있다.\n  스포츠 활동을 하며 팔꿈치에 충격이 지속해서 가해지거나 팔꿈치를 책상에 괴는 습관이 있을 땐 팔꿈치에 점액낭염이 생긴다.\n  팔꿈치를 구부렸을 때 통증이 심해지는 특징이 있다.\n   지난해 어깨·무릎 환자 16만 명 넘어 사무실에서 오랫동안 앉아 있는 사람의 경우 의자와 닿는 엉덩이뼈 쪽에 점액낭염이 흔하다.\n  쿠션을 사용하면 마찰을 줄일 수 있다.\n  겨울에 부츠를 자주 신는 여성은 복숭아뼈 부위가 마찰로 자극받아 점액낭염이 생기는 경우가 있다.\n  송 교수는 “점액낭염은 생활습관이나 과한 운동, 직업 특성 때문에 발병하는 경향이 있다”며 “노화가 주요 원인이 아니므로 젊은 연령층에서도 흔하다”고 말했다.\n  　무릎의 점액낭염은 퇴행성 관절염이라 여겨지는 경우가 적지 않다.\n  하지만 두 질환에는 차이가 있다.\n  송 교수는 “점액낭염은 말랑말랑한 물주머니가 만져지면서 열감이 느껴지고 눌렀을 때 통증(압통)이 있다.\n  가만히 있을 때도 통증이 있다”며 “상대적으로 급성으로 증상이 생기며 통증이 악화한다는 점에서 관절염과 다르다”고 말했다.\n  　무릎에 생긴 부종이 점액낭염 때문인지 확인하는 방법은 이렇다.\n  먼저 양쪽 무릎을 편안하게 편 상태에서 힘을 주지 말고 무릎의 슬개골 위를 살짝 눌러 본다.", "output": "점액낭은 모든 관절 주변에 존재하며 마찰이 잦은 부위의 점액낭에 염증이 잘 생기고 팔꿈치를 책상에 괴는 습관이 있으면 점액낭염이 생기는데 팔꿈치를 구부렸을 때 통증이 심해진다."}, {"kind": "F5", "id": "REPORT-news_r-03548-00001", "input": "신종 코로나바이러스 감염에 의한 중국의 사망자가 1000명을 넘어섰다.\n  중국 국가위생건강위원회는 11일 발표에서 10일 하루 역대 1일 최다인108명이 숨졌다고 밝혔다.\n  전날의 97명 사망자보다 11명이 더 많다.\n 이로써 신종 코로나에 의한 전체 사망자 수는 1016명으로 늘었다.\n  지난달 11일 첫 희생자가 나온 이래 불과 한 달 만에 사망자 수가 네 자릿수를 기록하게 됐다.\n  예상을 뛰어넘는 엄청난 사망자 발생에 중국 사회는 극도의 공포로 가득 차 있다.\n  사망자로 이어지기 쉬운 중증 환자도 10일 자정 현재 7333명으로 늘어 두려움은 더욱 커진다.\n   신종 코로나에 의한 사망자 누계는 지난 일주일 사이 매일 100명 단위로 바뀌고 있어 충격이다.\n  지난 4일까지의 중국 내 사망자는 490명이었다.\n  5일엔 563명으로 뛰더니 6일 636명, 7일엔 722명이 됐다.\n  또 8일엔 811명에 이어 9일에는 908명을 기록했다.\n 그리고 10일 마침내 1016명에 이르렀다.\n  매일 아침 급증하는 사망자 수를 확인하면서 이게 무슨 숫자 놀음도 아니고 황당하다는 느낌을 지울 수 없다.\n  전시도 아닌 평시에 어떻게 이렇게 쉽게 사망자 수가 늘어나는지 그저 놀라울 뿐이다.\n 중국 당국의 대처 능력에 의문을 표시하지 않을 수 없다.\n  시진핑(習近平) 중국 국가주석은 10일 오후 마스크를 낀 채 베이징 내 신종 코로나 환자를 치료하는 병원을 찾고 마을 주민센터를 방문하는 등 처음으로 현장에 모습을 드러냈다.\n   그동안 리커창(李克强) 총리를 당 중앙 차원의 신종 코로나 대응 소조 조장으로 앉히고 자신은 뒷전에 물러나 한 발 빼는 모습을 보였으나 여론이 극도로 악화하자 등 떠밀려 나왔다는 따가운 지적을 받는다.\n 뭐가 잘못됐나.\n  중국의 현대사를 관통해온 사상을 뜻하는 홍(紅)과 실용을 의미하는 전(專)의 투쟁에서 지난 몇 년 사이 홍이 압도적으로 전을 누르며 지나치게 득세한 결과가 아닌가 하는 분석이 나온다.\n 사상과 이념을 강조하는 홍(紅)은 마오쩌둥(毛澤東) 생전 전성기를 누렸다.\n  그러나 결과는 1950년대 말 60년대 초 수천만 명이 먹을 게 없어 사망하는 대기근, 그리고 60~70년대엔 ‘잃어버린 10년’이란 말을 듣는 문화대혁명을 낳았다.\n 그 반성에서 시작된 덩샤오핑(鄧小平)의 개혁개방은 실용과 이성이 지배하는 전(專)의 시대를 열었다.\n  고도의 과학적인 지식과 전문적인 기술을 갖춘 기술 관료 이른바 테크노크랫이 중국을 지배하며 고도성장을 이끌었다.", "output": "신종 코로나바이러스 감염으로 7333명의 중증 환자와 1016명의 사망자 발생에 중국 사회는 극도의 두려움으로 가득 차 있다."}, {"kind": "F6", "id": "s0778", "input": "어차피 해당 기업의 주식을 매각할 방침이라면 명단 공개를 주저할 이유가 없다.", "output": "어차피 해당기업의 주식을 매각할 방침이라면 명단 공개를 주저할 이유가 없다."}, {"kind": "F6", "id": "s1160", "input": "물론 경제 문제를 어떻게 풀어 나갈지 여야가 똑같은 해법을 내놓을 수는 없지만 크게 보면 결국 여야 모두 같은 목표를 추구한다고 볼 수 있다.", "output": "물론 경제 문제를 어떻게 풀어나갈지 여야가 똑같은 해법을 내놓을 수는 없지만 크게 보면 결국 여야 모두 같은 목표를 추구한다고 볼수 있다."}, {"kind": "F5", "id": "REPORT-news_r-05505-00001", "input": "집단감염으로 전국을 충격에 빠뜨렸던 경북 청도군 청도대남병원 신종코로나(코로나19) 확진환자가 4일 모두 다른 데로 옮긴다.\n  지난달 19일 이 병원 5층 폐쇄병동에서 확진환자가 처음 나온 이후 보름만이다.\n  보건 당국은 청도대남병원 2층에 격리돼 있던 확진환자 32명이 4일까지 국립정신건강센터 등으로 모두 이송될 예정이라고 밝혔다.\n  32명 중 18명은 1차 검사에서 음성이 나왔고 3일 2차 음성이 나오면 5층 폐쇄병동으로 잠시 옮겼다가 경남 부곡정신병원으로 이송된다.\n  양성 확자는 국립정신건강센터로 옮겨 전문적 치료를 받게 된다.\n  잘 오지도 않는 가족 끊길까봐 보건 당국은 환자들이 이송을 반대하는 바람에 무척 애를 먹었다고 한다.\n  최근 13명을 국립정신건강센터로 이송하려 있는데 7명이 완강하게 거부했다.\n  이유는 청도를 떠나면 가족과 끈이 떨어질 것을 우려해서다.\n  보건 당국 관계자는 \"청도에 있으면 아주 가끔씩 가족이 면회 오는데, 서울 가면 가족과 영원히 단절될 것을 우려해 이송을 거부했다.\n  밤새 설득했는데도 1명은 끝내 이송을 거부했다\"고 말했다.\n  이 관계자는 \"환자가 50대가 가장 많다.\n  부모는 대부분 사망했고, 형제·조카·사촌이 많아 애착이 덜한 편인데도 단절을 걱정하더라\"고 말했다.\n   \"정신질환자가 병실 나가면 책임질거냐\"청도대남병원 폐쇄병동 환자 102명 중 100명이 확진판정을 받자 지난달 20일 이후 국립정신건강센터와 경남 부곡병원 의료진 40여명이 급파됐다.\n  대남병원 직원 20명과 함께 확진환자와의 사투가 시작됐다.\n  가장 시급한 것은 중증환자 이송이었다.\n  상급종합병원으로 보내지 않으면 위험한 상황이었다.\n  하지만 큰 병원들이 증상이 심한 사람은 받지 않겠다고 거부했다.\n  어떤 병원은 \"정신질환자가 우리 병원의 음압격리병실 문을 열고 나오면 어떡할거냐.\n  법적 책임을 지겠느냐\"고 나왔다.\n  의료진에게 \"당신 이름이 뭐냐\"고까지 반감을 드러냈다.\n  파견 의료진이 해당 상급종합병원의 정신과 의사에게 통사정해서 설득한 뒤에야 이송할 수 있었다고 한다.\n   또 이송 차량을 구하지 못해 무척 애를 먹었다.\n  구급차에 비닐로 벽을 치고 이송하자고 해도 거부했다.\n  119구급차를 못 구해 민간 구급차를 요청했지만 이마저 안 됐다.\n  경상북도가 나서 간신이 구급차를 구했다.\n    지우지 못한 그 이름들파견 의료진이 도착했을 때는 2명 가량의 환자가 이미 다른 데로 이송간 상태였다.", "output": "보건 당국은 청도대남병원에 있는 코로나19 확진환자를 다른 곳으로 이송하는 것에 대해 가족과의 연락이 힘들어질 것을 우려해 거부하는 환자들이 있어 애를 먹었다고 한다."}, {"kind": "F6", "id": "s0979", "input": "연초부터 소비와 수출이 걱정스러운 출발을 보이고 있다.", "output": "연초 부터 소비와 수출이 걱정스러운 출발을 보이고 있다."}, {"kind": "F5", "id": "REPORT-news_r-04643-00002", "input": "미국인이나 미국인 직계 가족은 입국을 허용하되 14일간 자가격리를 명령했다.\n  미국과 중국을 오가는 항공편 대부분이 운항을 멈춘 상태다.\n   보다 직접적인 이유는 신종 코로나가 미국에서 확산할 경우 재선 가도에 빨간불이 켜질 수 있기 때문이다.\n  정치전문매체 폴리티코는 전문가를 인용해 “대통령 재선과 관련해 현재 가장 큰 위협은 신종 코로나 사태가 통제력을 벗어나 보건 행정과 경제에 충격을 가져오는 것”이라고 전했다.\n  의회전문매체 더힐은 트럼프가 재선되기 위해 필요한 두 가지로 경제 안정과 미국인들이 안전하다고 느끼는 감정을 꼽았다.\n  신종 코로나가 미국에서 퍼지면 두 가지를 모두 놓치게 된다.\n  23일 현재 미국 내 신종 코로나 확진자는 다이아몬드 프린세스호 승객 18명을 포함해 35명이다.\n  인구수에 비하면 적은 편이어서 잘 통제되는 것으로 보이지만, 순식간에 퍼질 수 있다는 위기감이 크다.\n  백악관에선 연일 고위급 대책회의가 열리고 있는데, 일부 관료들은 확진 사례가 너무 적은 데 의문을 제기하면서 은밀하게 퍼지고 있는데 정부가 모르는 것 아니냐는 우려까지 하고 있다고 폴리티코가 전했다.\n  월스트리트저널(WSJ) 21일 자에는 “미국 내 수십 또는 수백건의 감염 사례가 있는데 보고되지 않는 것일 수 있다”는 전직 안보ㆍ보건 관료의 공동 기고문이 실렸다.\n  백악관은 또 소비 심리가 위축되면서 경기가 하강하는 위험을 경계하고 있다.\n  중국에서 대부분의 제품을 생산하는 애플과 월마트 등 미국 기업들은 이미 올 1분기 실적 부진을 예고하고 전망치를 하향 조정했다.\n  미국 연방준비제도(Fed)도 상황을 예의 주시하고 있다.\n  트럼프가 중국의 신종 코로나 대응을 비판하지 않는 것도 주식시장을 흔들지 않기 위해서라고 전문가들은 추측한다.\n  신종 코로나 언급을 삼가면서 공개적으로 '무시' 전략을 쓰고 있지만, 사적인 자리에서 불안감을 드러내고 있다고 폴리티코는 전했다.\n   2014년 에볼라 확산으로 미국 중간선거에서 당시 집권 민주당이 공화당에 상원을 내준 불편한 기억도 트럼프를 불안케 하는 요인이다.\n  에볼라에 감염된 미국 의료진을 국내로 데려와 치료하자 민심이 동요했고, 버락 오바마 행정부가 미온적으로 대처하고 있다는 불만이 나왔다.\n  당시 공화당은 여행 금지를 주장하면서 여론에 편승했다.\n  에볼라가 미국인들에게 심각한 공중 보건 위기라는 잘못된 인식과 패닉이 퍼졌다.\n  오바마 행정부가 군인 3000명을 파병해 에볼라와 싸우겠다고 발표했지만, 너무 늦었다.", "output": "폴리티코는 미국에서 신종 코로나가 보건 행정과 경제에 충격을 가지고 오는 것이 대통령 재선에 큰 위협을 가지고 올 것이며 코로나 확산에 대해 정부가 모르는 것이 아니냐고 했다."}, {"kind": "F5", "id": "REPORT-news_r-00389-00001", "input": "법무부가 6일 검찰 고위 간부 인사를 논의하는 검찰 인사위원회 위원들에게 이번 주 위원회 참석 가능 날짜를 제출하라고 요청한 것으로 확인됐다.\n  물 밑에서 검찰 인사 절차가 초고속으로 진행되고 있지만, 윤석열 검찰총장은 법무부로부터 아직 인사와 관련된 아무런 이야기를 듣지 못했다고 한다.\n  검찰 사령탑에 검찰 인사를 꼭꼭 숨기는 법무부의 ‘윤석열 패싱’이다.\n   물론 추미애 법무부 장관과 윤 총장의 상견례 날짜를 조율하고 있지만, 이는 요식행위에 불과하다는 게 법조계의 시각이다.\n  검찰의 정치적 독립성을 해치는 초유의 ‘답정너(답은 정해져 있고 너는 대답만 하면 돼)’식 인사라는 비판까지 나온다.\n    코앞으로 다가온 검찰 고위직 인사법조계에 따르면 법무부는 이날 오전 검찰인사위 위원들에게 이번 주 위원회 참여가 가능한 복수의 날짜를 제출해 달라고 요청했다.\n  법조계 관계자는 “이날 오전까지 소집 요청이 오진 않았다”면서도 “이번 주에 가능한 날짜를 복수로 적어내라고 했기 때문에 이번 주에 인사위가 열리는 게 확실해졌다”고 말했다.\n    검찰청법에 따르면 검찰인사위는 위원장을 포함해 11명으로 구성된다.\n  검사 3명과 판사 2명, 변호사 2명 등 법조인 이외에 법학 교수 2명과 외부 인사 2명 등이다.\n  인사위가 검사들의 보직과 근무지, 근무 기간 등을 직접 결정하는 것은 아니다.\n  이번 인사에서 검사장 승진은 ‘몇 기수까지 한다’, ‘인사 방향은 어떻다’는 등의 인사 방향을 제시하는 성격이 짙다.\n  검찰의 임명과 보직은 법무부 장관이 검찰총장의 의견을 들어 제청하고 대통령이 한다.\n    \"윤석열은 1도 모른다\" 법무부가 검사장급 이상 고위 간부의 인사에 속도를 내고 있지만, 법령상 규정된 검찰총장과의 소통은 전혀 이뤄지지 않고 있다.\n  대검찰청 내부 소식에 정통한 한 관계자는 “법무부가 검찰청법에 따라 검찰총장과 논의를 하지 않겠냐”면서도 “아직도 법무부는 윤 총장에게 인사 시기, 인사 범위, 인사 절차에 대해 아무런 말이 없다”고 전했다.\n    이는 ‘검찰총장의 의견을 들으라’고 명시한 검찰청법의 법령에도 맞지 않는 데다 기존 검찰 인사 관례에서도 상당히 어긋나 있다는 게 법조계의 해석이다.\n   검찰 인사 관례상 검사장급 이상의 인사는 몇 명 되지 않기 때문에 법무부 장관과 검찰총장이 직접 만나 협의를 해왔다.\n  그 이하 직급에 대한 인사는 법무부 검찰국장이 법무부 장관의 인사 안을 가져오면 검찰총장과 협의하는 방식이었다.", "output": "검사 3명 등 11명으로 구성되는 검찰인사위는 검사들의 보직 등을 직접 결정하지는 않지만 인사 방향을 제시한다."}, {"kind": "F5", "id": "REPORT-news_r-05055-00001", "input": "프로배구 OK저축은행이 봄배구 불씨를 살렸다.\n  레오 안드리치와 최홍석의 활약을 앞세워 KB손해보험을 제압했다.\n  OK저축은행은 26일 안산 상록수체육관에서 열린 2019~2020 도드람 V리그 프로배구 6라운드 KB손해보험과 경기에서 세트 스코어 3-1(25-17, 17-25, 25-21, 25-23)로 이겼다.\n  레오가 서브득점 3개 포함 27점, 최홍석이 블로킹 2개 포함 16점을 기록했다.\n  2연승을 이어간 4위 OK저축은행은 15승16패(승점47)가 됐다.\n  3위 현대캐피탈(18승12패, 승점53)과는 승점 6점 차로 좁혔다.\n  프로배구에선 3,4위 승점이 3점 이내면 단판제 준플레이오프가 열린다.\n  경기 초반 OK저축은행은 강한 서브를 바탕으로 분위기를 이끌었다.\n  레오-송명근-최홍석-한상길-전진선의 공격적인 라인업도 잘 먹혔다.\n  두세 점 차 리드를 지키던 OK저축은행은 최홍석의 서브득점, 송명근의 페인트 공격, 최홍석의 백어택이 터지면서 21-15로 달아났다.\n  24-17에선 레오의 첫 서브득점까지 터지면서 깔끔하게 마무리했다.\n KB손보는 2세트에 변화를 줬다.\n  김학민을 먼저 넣어 공격을 강화했다.\n  마테우스와 김학민 쌍포가 터지면서 앞서갔다.\n  KB손보는 김정호의 강력한 서브와 블로킹까지 나오면서 12-6으로 달아났다.\n  OK저축은행은 송명근 대신 김웅비를 투입해 재정비했다.\n  하지만 KB손해보험은 잇따라 블로킹을 성공시키며 세트 스코어 1-1을 만들었다.\n  OK저축은행은 3세트에서 전열을 재정비했다.\n  심경섭이 투입돼 공수에서 안정감을 더했다.\n  손주형은 무려 블로킹 4개를 잡아내는 괴력을 뽐냈다.\n  공격 범실로 추격을 허용하긴 했지만 후반엔 레오가 해결사 본능을 발휘하며 승리했다.\n  4세트에선 KB손해보험이 한 발 앞서갔다.\n  하지만 레오의 강서브가 터졌다.\n  서브득점 2개 포함 레오의 서브때 연속득점이 나오면서 OK저축은행이 14-12로 뒤집었다.\n  결국 OK가 마지막까지 리드를 지켜냈다.\n  권순찬 KB손해보험 감독은 \"마테우스 말고는 공격이 잘 되지 않았다.\n  국내 선수들이 잘 못 받쳐줬다.\n  서브가 잘 들어가는 세트에선 흐름을 탔는데 그렇지 않을 땐 어려웠다.\n  김학민의 허리가 좋지 않아 완벽한 컨디션이 아니다\"고 말했다.\n  석진욱 OK저축은행 감독은 \"선수 전원이 잘 해줬다.\n  2세트에 김학민이 들어왔을 때 목적타 서브를 지시했는데 오히려 부담을 가진 것 같았다.", "output": "OK저축은행은 2019~2020 도드람 V리그 프로배구 6라운드 KB손해보험과 경기에서 레오가 서브득점 3개 포함 27점을 기록하면서 3-1로 이겼고 15승 16패가 됐다."}, {"kind": "F5", "id": "REPORT-news_r-03803-00001", "input": "“대기업엔 주문할 것이 별로 없다.\n  너무 잘 해주고 계신다.\n ” 문재인 대통령은 13일 서울 중구 대한상공회의소에서 열린 ‘코로나 19 대응 경제계 간담회’에서 이재용 삼성전자 부회장 등 6개 그룹 총수와 경영진에게 이렇게 말했다.\n  문 대통령이 대기업 총수들과의 자리에서 칭찬 일변도로 언급한 것은 이례적이다.\n  문 대통령은 간담회 모두 발언부터 대기업을 돌아가며 치켜세웠다.\n  CJ그룹이 투자한 영화 ‘기생충’을 맨 처음 언급하며“한류 문화의 우수성을 또 한 번 세계에 보여준 쾌거”라고 했다.\n  이재현 CJ 회장은“(아카데미 수상 소식은) 큰 힘이다.\n  (코로나 19 사태 중에도) 영화 얘기를 하면 국민 마음이 풀린다”고 말했다.\n 문 대통령은 이어 LG전자 ‘롤러블(말아지는) TV’, 삼성전자의 인공지능 로봇 ‘볼리’, SK의 불화수소 가스 생산공장 완공 등 대기업이 최근 거둔 성과를 일일이 거론했다.\n  그러면서 “우리 기업들이 끊임없이 도전과 혁신으로 국민의 희망이 되고 있다”고 말했다.\n  간담회에는 이 부회장을 비롯해 윤여철 현대자동차 부회장, 최태원 SK 회장, 구광모 LG 회장, 황각규 롯데 부회장, 이재현 회장이 참석했다.\n  문 대통령은 기존에 대기업 총수와 자리를 가질 땐 ‘칭찬’보다는 ‘당부’에 초점을 맞췄다.\n  문 대통령은 지난해 7월 일본이 수출규제 조치를 시행하자 청와대로 30대 그룹 총수를 초청해 간담회를 열었다.\n  기업의 애로사항 등을 듣기 위해서였다.\n  문 대통령은 당시 “핵심기술, 핵심부품, 소재, 장비의 국산화 비율을 획기적으로 높여 해외 의존도를 낮추는 계기로 삼아야 할 것”이라고 주문했다.\n  문 대통령이 이번에 대기업을 강하게 격려한 배경에 대해 한 청와대 관계자는 “코로나 19 사태에서 대기업이 기부하는 등 솔선수범하는 모습을 보였기 때문인 것 같다”고 말했다.\n  문 대통령은 모두발언에서 “롯데그룹은 우한 교민에게 생필품을 적극적으로 후원해줬고, 중국 적십자사 등에도 후원금을 전달해 양 국민의 우호 감정을 높여줬다”고 말했다.\n  이에 황각규 부회장은“롯데는 상생협력 대책을 강구 중이다.\n  대통령이 쇼핑몰에 한번 들르시는 게 어떤가”라고 제안하기도 했다.\n 또 최태원 회장이 “SK는 일주일에 한 번 직원들에게 구내식당 이용을 자제하도록 하고 있다”고 하자, 문 대통령이 “청와대도 일주일 중 하루는 아예 구내식당을 문을 닫고 있고, 강제적으로 바깥에 나가 식사를 하도록 했다”며 화답했다고 강민석 청와대 대변인은 전했다.", "output": "문 대통령은 코로나19 대응 경제계 간담회에서 삼성전자를 비롯한 6개의 대기업 총수들과 경영진을 칭찬하며 치켜세웠다."}, {"kind": "F5", "id": "REPORT-news_r-03163-00001", "input": "대한항공, 송현동 부지+왕산레저 지분 연내 매각     어머니(이명희 고문)와 여동생(조현민 전무)의 지지를 얻은 조원태 한진그룹 회장이 재무구조 개선을 골자로 한 대한항공 경영 쇄신안을 내놨다.\n  조 회장의 누나인 조현아 전 부사장 등 ‘반 조원태 연합군’을 향한 반격의 신호탄이란 분석이다.\n  이어 오는 7일에는 한진칼 이사회를 열고 경영 개선 방안 등을 내놓는다는 방침이다.\n     6일 오전 대한항공은 서울 중구 서소문 사옥에서 이사회를 열고 재무구조 개선을 위해 유휴자산인 송현동 부지와 비주력 사업인 왕산마리나 매각을 포함한 주주총회 안건을 의결했다.\n   이에 따라 대한항공은 7성급 호텔 건립 계획이 무산된 종로구 송현동 부지(토지 3만 6642㎥, 건물 605㎥) 매각과 인천시 중구 을왕동 소재 왕산마리나 운영사인 ㈜왕산레저개발 지분 매각을 추진한다.\n  수익을 내지 못하는 유휴자산과 비주력 사업 매각을 통해 재무구조를 개선하겠다는 의미다.\n   앞서 한진그룹은 지난해 2월 경영 안정성 및 수익성 향상 달성을 위해 발표한 ‘비전 2023’에서 송현동 부지 매각을 약속했다.\n  송현동 부지는 대한항공이 호텔 건립 목적으로 보유하고 있으나
