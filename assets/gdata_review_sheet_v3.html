로 불리하다. 평판 등에도 안 좋은 영향을 미친다. 하위 20% 명단을 ‘살생부’라고 부르는 이유다."}, {"kind": "F6", "id": "ota0000000098952", "input": "우리의조건에 이의가 잇으시면 언재든 말씀하시오,", "output": "우리의 조건에 이의가 있으시면 언제든 말씀하시오."}, {"kind": "F6", "id": "ext0000000121150", "input": "담당 공무원의 신경을 죠금이라도 건드리지 않으려는 모습이 역력햇다.", "output": "담당 공무원의 신경을 조금이라도 건드리지 않으려는 모습이 역력했다."}, {"kind": "F5", "id": "REPORT-news_r-04643-00002", "input": "미국인이나 미국인 직계 가족은 입국을 허용하되 14일간 자가격리를 명령했다.\n  미국과 중국을 오가는 항공편 대부분이 운항을 멈춘 상태다.\n   보다 직접적인 이유는 신종 코로나가 미국에서 확산할 경우 재선 가도에 빨간불이 켜질 수 있기 때문이다.\n  정치전문매체 폴리티코는 전문가를 인용해 “대통령 재선과 관련해 현재 가장 큰 위협은 신종 코로나 사태가 통제력을 벗어나 보건 행정과 경제에 충격을 가져오는 것”이라고 전했다.\n  의회전문매체 더힐은 트럼프가 재선되기 위해 필요한 두 가지로 경제 안정과 미국인들이 안전하다고 느끼는 감정을 꼽았다.\n  신종 코로나가 미국에서 퍼지면 두 가지를 모두 놓치게 된다.\n  23일 현재 미국 내 신종 코로나 확진자는 다이아몬드 프린세스호 승객 18명을 포함해 35명이다.\n  인구수에 비하면 적은 편이어서 잘 통제되는 것으로 보이지만, 순식간에 퍼질 수 있다는 위기감이 크다.\n  백악관에선 연일 고위급 대책회의가 열리고 있는데, 일부 관료들은 확진 사례가 너무 적은 데 의문을 제기하면서 은밀하게 퍼지고 있는데 정부가 모르는 것 아니냐는 우려까지 하고 있다고 폴리티코가 전했다.\n  월스트리트저널(WSJ) 21일 자에는 “미국 내 수십 또는 수백건의 감염 사례가 있는데 보고되지 않는 것일 수 있다”는 전직 안보ㆍ보건 관료의 공동 기고문이 실렸다.\n  백악관은 또 소비 심리가 위축되면서 경기가 하강하는 위험을 경계하고 있다.\n  중국에서 대부분의 제품을 생산하는 애플과 월마트 등 미국 기업들은 이미 올 1분기 실적 부진을 예고하고 전망치를 하향 조정했다.\n  미국 연방준비제도(Fed)도 상황을 예의 주시하고 있다.\n  트럼프가 중국의 신종 코로나 대응을 비판하지 않는 것도 주식시장을 흔들지 않기 위해서라고 전문가들은 추측한다.\n  신종 코로나 언급을 삼가면서 공개적으로 '무시' 전략을 쓰고 있지만, 사적인 자리에서 불안감을 드러내고 있다고 폴리티코는 전했다.\n   2014년 에볼라 확산으로 미국 중간선거에서 당시 집권 민주당이 공화당에 상원을 내준 불편한 기억도 트럼프를 불안케 하는 요인이다.\n  에볼라에 감염된 미국 의료진을 국내로 데려와 치료하자 민심이 동요했고, 버락 오바마 행정부가 미온적으로 대처하고 있다는 불만이 나왔다.\n  당시 공화당은 여행 금지를 주장하면서 여론에 편승했다.\n  에볼라가 미국인들에게 심각한 공중 보건 위기라는 잘못된 인식과 패닉이 퍼졌다.\n  오바마 행정부가 군인 3000명을 파병해 에볼라와 싸우겠다고 발표했지만, 너무 늦었다.", "output": "보다 직접적인 이유는 신종 코로나가 미국에서 확산할 경우 재선 가도에 빨간불이 켜질 수 있기 때문이다. 정치전문매체 폴리티코는 전문가를 인용해 “대통령 재선과 관련해 현재 가장 큰 위협은 신종 코로나 사태가 통제력을 벗어나 보건 행정과 경제에 충격을 가져오는 것”이라고 전했다. 백악관에선 연일 고위급 대책회의가 열리고 있는데, 일부 관료들은 확진 사례가 너무 적은 데 의문을 제기하면서 은밀하게 퍼지고 있는데 정부가 모르는 것 아니냐는 우려까지 하고 있다고 폴리티코가 전했다."}, {"kind": "F6", "id": "ext0000000062819", "input": "일정한자세를 오랫동안 유지하는경우에는 스트레칭과 더불어 목을자주 풀어주어 목 근육의 경직을줄이는것이 좋다.", "output": "일정한 자세를 오랫동안 유지하는 경우에는 스트레칭과 더불어 목을 자주 풀어주어 목 근육의 경직을 줄이는 것이 좋다."}, {"kind": "F6", "id": "grm2207180028429", "input": "구냥 이어폰끼구 무시가 답이겠죠?", "output": "그냥 이어폰 끼고 무시가 답이겠죠?"}, {"kind": "F5", "id": "REPORT-news_r-04664-00001", "input": "이스라엘 성지 순례를 다녀왔다가 신종 코로나바이러스 감염증(코로나19)에 걸린 경북 주민의 감염 경로가 오리무중이다.\n  이스라엘이 신종코로나 ‘청정국’을 유지하고 있는 데다 확진자들이 출국 전 이상 증세가 없었다는 점에서 이들이 여행 도중 감염된 것인지, 잠복기를 지나 입국 후 증상이 발현된 것인지 확인하지 못하고 있다.\n  23일 경북도에 따르면 지난 8일부터 9일 동안 이스라엘 성지순례에 참여한 경북도민 39명(가이드 1명 서울 포함) 가운데 9명이 전날 오전 신종코로나 확진 판정을 받은 데 이어 같은 날 오후 늦게 9명이 추가로 확진됐다.\n  지역별로 경북 안동 5명, 영주 1명, 의성 9명, 영덕 1명, 예천 1명 등 경북도 주민 17명에 서울에 사는 가이드 1명으로 파악됐다.\n  경북 성지순례단은 지난 8일부터 16일까지 이스라엘 성지 순례를 하고 인천공항으로 돌아왔다.\n  귀국 당일 오후 2시쯤 공항 종교시설에서 행사를 마친 뒤 오후 5시쯤 버스 2대에 나눠타고 오후 9시쯤 안동에 내려 각자 집으로 갔다.\n  경북 의성에 사는 예천군 공무원 A씨(59·여)가 고열과 기침 증세를 보여 검사한 결과 일행 가운데 처음으로 확진 판정을 받았다.\n  A씨는 귀국 후 몸 상태가 좋지 않아 연가를 내 출근하지 않았고 외부 활동 없이 의성 집에 머물렀던 것으로 알려졌다.\n  영주시 확진자 60대 여성은 발열과 같은 이상 증세는 없으나 예천 공무원이 확진으로 나오자 보건소 선별진료소를 찾아가 검사한 결과 양성으로 드러났다.\n  그러나 성지순례단원 일부는 귀국 다음 날부터 식당 등에 간 것으로 드러나 지역 확산이 우려되고 있다.\n  경북도는 확진자가 방문한 시설 등을 파악해 폐쇄하고 긴급 방역에 나섰다.\n  또 확진자를 자가 격리하고 동선을 파악해 접촉자를 전수 조사하고 있다.\n  확진자가 밀접 접촉한 인원은 현재까지 176명으로 집계됐다.\n  아직 이상 증세가 없는 일행 22명은 검체를 채취해 검사 결과를 기다리고 있다.\n  경북 성지순례단과는 별도로 제주 성지순례단 37명도 지난 11일부터 21일까지 이스라엘을 방문한 것으로 확인됐다.\n  제주도에 따르면 제주 성지순례단 중 1명은 기침 증상을 보여 이날 신종코로나 검사를 받았으며 결과는 23일 오후 나올 예정이다.\n  제주도는 성지순례 참가자 모두 현재 성당 측의 권고에 따라 자택에서 자가 격리 중이라고 밝혔다.\n  보건 당국은 성지순례를 다녀온 사람 가운데 앞으로 확진자가 상당수 더 나올 것으로 보고 있다.", "output": "이스라엘 성지 순례를 다녀왔다가 신종 코로나바이러스 감염증(코로나19)에 걸린 경북 주민의 감염 경로가 오리무중이다. 이스라엘이 신종코로나 ‘청정국’을 유지하고 있는 데다 확진자들이 출국 전 이상 증세가 없었다는 점에서 이들이 여행 도중 감염된 것인지, 잠복기를 지나 입국 후 증상이 발현된 것인지 확인하지 못하고 있다."}, {"kind": "F6", "id": "ext0000000062940", "input": "사실모나리자는 미술계 외에서는그렇게 유명한 작품은 아니었다", "output": "사실 모나리자는 미술계 외에서는 그렇게 유명한 작품은 아니었다."}, {"kind": "F5", "id": "REPORT-news_r-01155-00002", "input": "2012년말 12.\n 8%였던 LPG차 비율은 2018년 말 기준 8.\n 77%까지 낮아졌다.\n  LPG차 신규 판매대수가 줄어드는 추세에 2000년대 초반 등록된 차들의 말소까지 이어지며 LPG차 비율이 급속도로 줄어들고 있는 상황이다.\n  특히 LPG차 판매가 감소세로 돌아선 2013년부터는 등록대수 감소폭이 커지고 있다.\n  한국자동차산업협회(KAMA)에 따르면 LPG차 판매량은 2013년 17만8935대를 기록한 이후 계속 줄어들어 2018년에는 11만8436대에 그쳤다.\n  김필수 대림대학교 자동차학과 교수는 “2000년대 후반부터 자동차 연비 경쟁이 가속화되며 각 브랜드의 가솔린 엔진 연비가 높아졌고, 디젤차가 몇 년간 자동차 시장을 주도하며 상대적으로 LPG차에 대한 주목도가 떨어졌다”고 설명했다.\n  LPG차 등록대수가 크게 줄자 가스업계는 더욱 강하게 규제완화를 요구했다.\n  그 결과 2018년 5인승 레저용차량(RV)에 대한 규제가 완화됐고, 지난해 3월 28일에는 LPG차에 대한 규제가 완전히 사라졌다.\n  규제를 없앤 효과는 즉각적으로 나타났다.\n  KAMA에 따르면 2019년 상반기 LPG차 등록 대수는 전년 동기 대비 3.\n 5% 감소했는데, 이는 2018년 연간 감소폭이 14.\n 1%에 달했던 것과 비교해 크게 줄어든 수치다.\n  특히 구매제한 규제가 전면 폐지된 이후 4~6월 판매량은 1~3월 대비 29.\n 9% 증가했다는 게 KAMA의 설명이다.\n  LPG차의 성장을 전망하는 이유는 단순히 규제가 풀렸기 때문만은 아니다.\n  기술 발전을 통해 치명적인 단점을 지웠다.\n  대표적인 게 ‘가스 탱크’다.\n  LPG차는 트렁크 부분에 커다란 LPG 탱크를 실어야 해 공간활용이 나빴는데, 이를 거의 완벽하게 해결했다.\n  QM6 돌풍을 일으킨 르노삼성의 ‘도넛 탱크’가 주인공이었다.\n  여분의 타이어를 적재하는 트렁크 하단에 위치시켜 트렁크를 완전히 활용할 수 있도록 했다.\n  최근 현대·기아차에서도 비슷한 기술을 개발해 쏘나타와 K5 등에 적용시켰다.\n  자동차업계 관계자는 “일반 판매용 LPG차에는 대부분 도넛 형태의 탱크가 탑재될 것”이라고 전망했다.\n   2023년 디젤 엔진 사라지는 1t 트럭시장 주목최근 QM6의 성공은 올해 나올 LPG차에 대한 기대감을 높인다.\n  자동차업계에서는 지난해 LPG차 규제 전면 폐지 이후 연간 LPG차 판매량이 늘었을 것으로 추정하고 있으며 올해 LPG차 등록대수도 증가세로 전환할 것으로 기대한다.", "output": "김필수 대림대학교 자동차학과 교수는 “2000년대 후반부터 자동차 연비 경쟁이 가속화되며 각 브랜드의 가솔린 엔진 연비가 높아졌고, 디젤차가 몇 년간 자동차 시장을 주도하며 상대적으로 LPG차에 대한 주목도가 떨어졌다”고 설명했다. LPG차 신규 판매대수가 줄어드는 추세에 2000년대 초반 등록된 차들의 말소까지 이어지며 LPG차 비율이 급속도로 줄어들고 있는 상황이다."}, {"kind": "F5", "id": "REPORT-news_r-00695-00001", "input": "'명륜등심해장국'이라는 식당을 운영하는 유모씨는 지난해 8월 가맹점주들의 불만을 들었다.\n  명륜등심해장국은 1999년 충북 청주에서 영업을 시작해 현재 6개의 가맹점을 가지고 있다.\n  이 업체 가맹점주들은 \"상호가 비슷한 '명륜진사갈비'가 갑자기 유명해져 손님들이 두 가게를 혼동해 약속장소를 잘못 찾아가는 일이 생긴다\"고 했다.\n  유씨는 \"어떤 지역에는 바로 100m 거리에 두 식당이 함께 있는 데다 점심 메뉴까지 겹쳐 장사하기 힘들다\"고 말했다.\n   고민하던 유씨는 명륜진사갈비가 상표권을 확보하지 못했다는 사실을 알았다.\n  상표권을 가진 명륜등심해장국은 지난해 11월 명륜진사갈비를 상대로 \"상표권을 침해당했다\"며 \"상표를 쓰지 말고, 그동안 우리가 본 유·무형의 손해 5000만원을 배상하라\"며 서울중앙지법에 소송을 냈다.\n  2년간 상표 등록 안 한 채 가맹점 500개 모아 명륜진사갈비는 돼지갈비 프랜차이즈 업체다.\n  2017년 7월과 2018년 5월 두 차례 특허청에 상표권을 출원했지만 모두 거절당했다.\n  특허청은 \"2001년 상표를 출원한 명륜등심해장국과 이름과 판매상품이 모두 유사하다\"고 거절 이유를 밝혔다.\n   명륜진사갈비는 상표권을 얻지 못한 채 꾸준히 가맹점을 모집했다.\n  설립 2년 만에 전국 가맹점 500개를 돌파했고, 1월 1일 기준 영업 중인 점포는 456곳이다.\n   유씨는 \"명륜진사갈비가 마치 상표권이 있는 것처럼 행동해 관계자들을 속인다\"고 주장한다.\n  9일 현재 명륜진사갈비 공식 홈페이지에는 ‘상표권 침해 및 디자인 도용에 따른 법적 조치 단행’이라는 공지가 올라와있다.\n  최근 명륜진사갈비와 유사한 느낌의 가게가 많아지자 법적 대응에 나서겠다는 것이다.\n  유씨는 “상표권은 우리(명륜등심해장국)에게 있는데 어떻게 법적 조치를 하느냐”며 “가맹점주, 예비가맹점주들을 속이는 일”이라고 말했다.\n  명륜진사갈비, 특허청 결정에 불복 명륜진사갈비 측은 특허심판원에 불복 심판을 낸 상태다.\n  \"해장국과 갈비집의 상호가 소비자 입장에서 혼동되지 않는다\"는 게 명륜진사갈비의 주장이다.\n  명륜진사갈비 관계자는 “우리와 비슷한 사건에서 결정이 뒤바뀐 사례가 있어 심판원의 판단을 기다리고 있다”고 밝혔다.\n  불복 주장이 받아들여져 명륜진사갈비의 상표권이 인정되면, 명륜등심해장국이 건 소송도 자연스럽게 무효화 된다는 게 이들의 예상이다.\n  이 관계자가 제시한 특허심판원 결정은 2017년 ‘백촌막창’과 ‘백촌막국수’의 다툼이다.", "output": "2년간 상표 등록 안 한 채 가맹점 500개 모아 명륜진사갈비는 돼지갈비 프랜차이즈 업체다. 2017년 7월과 2018년 5월 두 차례 특허청에 상표권을 출원했지만 모두 거절당했다. 특허청은 \"2001년 상표를 출원한 명륜등심해장국과 이름과 판매상품이 모두 유사하다\"고 거절 이유를 밝혔다. 명륜진사갈비는 상표권을 얻지 못한 채 꾸준히 가맹점을 모집했다."}, {"kind": "F6", "id": "ota0000000053582", "input": "법적으로 미성년 자녀가 부양의무가 이ㅛ는 것은 알았는데 웬 부보 부양의무?", "output": "법적으로 미성년 자녀가 부양 의무가 있는 것은 알았는데 웬 부모 부양 의무?"}, {"kind": "F5", "id": "REPORT-news_r-01672-00001", "input": "오는 3월 열릴 주주총회부터 국민연금의 발언권이 대폭 강화된다.\n    정부는 국민연금 등 기관투자자의 주주권 행사를 지원하는 것을 골자로 하는 상법·자본시장법·국민연금법 시행령 개정안을 21일 국무회의에서 의결했다.\n  이중 상법·국민연금법 시행령은 공포 후 즉시, 자본시장법 시행령은 2월 1일부터 시행된다.\n    이는 앞서 지난 7일 문재인 대통령이 신년사를 통해 예고했던 내용이다.\n  당시 문 대통령은 “법 개정이 어려운 상황에서 시행령 등의 제·개정을 통해 ‘스튜어드십코드’를 정착시키고 대기업의 건전한 경영을 유도할 수 있는 기반을 곧 마련할 것”이라고 밝혔다.\n  ‘스튜어드십코드(수탁자책임원칙)’를 통해 국민연금의 대기업 경영에 대한 감시·견제 기능을 강화하겠다는 뜻으로 해석된다.\n  국민연금에 5%룰 완화해줘이날 국무회의 의결로 국민연금 등 공적연기금은 이른바 ‘5%룰’ 적용이 일부 완화된다.\n    기존 법령에 따르면 상장회사 주식을 5% 이상 보유한 주주는 1% 이상 지분을 사고팔 때마다 이를 5일 내 공시해야 한다(5%룰).\n  다만 국민연금 같은 공적 연기금이 경영참여가 아닌 단순투자 목적으로 주식을 사고팔 때는 5%룰의 적용을 면제받는다는 예외 규정이 있었다.\n  그간 5%룰은 국민연금의 주주활동에 걸림돌이 될 수 있다는 지적이 많았다.\n  스튜어드십코드 취지대로 국민연금이 주주로서 목소리를 내면 단순투자 목적이 아니라 경영참여 목적으로 볼 수 있어 5%룰을 적용해야 한다는 해석이 나와서다.\n  국민연금으로서는 5%룰에 따라 지분 변동 내역을 즉시 공시하면 매매전략과 투자패턴이 공개돼버려 부담이 컸다.\n  자칫 추종매매로 인해 수익률이 하락할 수 있다는 우려도 나왔다.\n    이에 따라 정부는 이번 시행령 개정을 통해 5%룰 적용 범위를 축소했다.\n  공적연기금의 기업 지배구조 개선을 위한 정관 변경 추진이나 회사 임원의 위법행위에 대한 해임청구권, 배당과 관련한 주주활동 등은 경영참여가 아니라고 보고 5%룰 적용에서 제외했다.\n  국민연금 등 5%이상 지분을 보유한 공적연기금은 이러한 주주활동을 하더라도, 지분변동이 있었던 달의 다음달 10일 이내에만 변동내용을 공시하면 된다.\n  이에 따라 국민연금이 스튜어드십코드에 따라 기업 경영에 관여할 수 있는 범위는 한층 넓어진다.\n  지난해 말 현재 국민연금이 지분 5% 이상을 보유한 상장사는 313곳이다.\n    사외이사 임기제 도입이날 개정된 상법 시행령은 사외이사의 임기를 제한하는 것이 골자다.", "output": "정부는 국민연금 등 기관투자자의 주주권 행사를 지원하는 것을 골자로 하는 상법·자본시장법·국민연금법 시행령 개정안을 21일 국무회의에서 의결했다. 당시 문 대통령은 “법 개정이 어려운 상황에서 시행령 등의 제·개정을 통해 ‘스튜어드십코드’를 정착시키고 대기업의 건전한 경영을 유도할 수 있는 기반을 곧 마련할 것”이라고 밝혔다. 이는 앞서 지난 7일 문재인 대통령이 신년사를 통해 예고했던 내용이다. 이중 상법·국민연금법 시행령은 공포 후 즉시, 자본시장법 시행령은 2월 1일부터 시행된다."}, {"kind": "F6", "id": "aud2209300027987", "input": "난 두 편 여러분 읽고 분석한다 내서 얘러분이 현여대시를 읽흘 수 있는 능력이 올라간다?", "output": "한 두 편 여러분이 읽고 분석한다고 해서 여러분이 현대시를 읽을 수 있는 능력이 올라간다?"}, {"kind": "F6", "id": "ext0000000121370", "input": "눈 하나 깜짝이지 않구 천연덕스럽게 모르쇠로 일관햇다.", "output": "눈 하나 깜짝이지 않고 천연덕스럽게 모르쇠로 일관했다."}];
const KEY = "gdata_review_v1";
let state = JSON.parse(localStorage.getItem(KEY) || "{}");
let filter = "all", onlyUnrated = false;
const list = document.getElementById("list");

function save(){ localStorage.setItem(KEY, JSON.stringify(state)); renderProgress(); }
function renderProgress(){
  const done = ITEMS.filter(i => state[i.id] && state[i.id].rating).length;
  document.getElementById("prog").textContent = `${done} / ${ITEMS.length}`;
  document.getElementById("pb").style.width = (100*done/ITEMS.length).toFixed(1) + "%";
}
function visible(){
  return ITEMS.filter(i => (filter==="all"||i.kind===filter) && (!onlyUnrated || !(state[i.id]&&state[i.id].rating)));
}
function render(){
  const items = visible();
  list.innerHTML = "";
  if(!items.length){ list.innerHTML = '<p style="color:#9aa3b2;text-align:center;padding:40px 0">표시할 항목이 없습니다.</p>'; return; }
  for(const it of items){
    const st = state[it.id] || {};
    const card = document.createElement("section");
    card.className = "card";
    card.innerHTML = `
      <span class="kind">${it.kind}</span><span class="id">${it.id}</span>
      <div class="label">입력</div><div class="text">${esc(it.input)}</div>
      <div class="label">출력</div><div class="text">${esc(it.output)}</div>
      <div class="rate">
        <button data-r="1" class="bad ${st.rating==1?'sel':''}">1 부적합</button>
        <button data-r="2" class="${st.rating==2?'sel':''}">2 보통</button>
        <button data-r="3" class="ok ${st.rating==3?'sel':''}">3 적합</button>
      </div>
      <textarea placeholder="메모(선택)">${esc(st.note||"")}</textarea>`;
    card.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>{
      state[it.id] = {rating:Number(b.dataset.r), note: card.querySelector("textarea").value};
      save(); render();
    });
    card.querySelector("textarea").oninput = e => {
      state[it.id] = Object.assign({}, state[it.id], {note:e.target.value}); save();
    };
    list.appendChild(card);
  }
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
document.querySelectorAll(".tabs button[data-f]").forEach(b=>b.onclick=()=>{
  filter=b.dataset.f; document.querySelectorAll(".tabs button[data-f]").forEach(x=>x.classList.toggle("on",x===b)); render();
});
document.getElementById("unrated").onclick = e => { onlyUnrated=!onlyUnrated; e.target.classList.toggle("on",onlyUnrated); render(); };
document.getElementById("reset").onclick = ()=>{ if(confirm("모든 판정을 지울까요?")){ state={}; save(); render(); } };
document.getElementById("export").onclick = ()=>{
  const rows = ITEMS.map(i=>({kind:i.kind,id:i.id,input:i.input,output:i.output,rating:(state[i.id]||{}).rating||null,note:(state[i.id]||{}).note||""}));
  const blob = new Blob([JSON.stringify(rows,null,1)],{type:"application/json"});
  const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="gdata_review.json"; a.click();
};
render(); renderProgress();
</script></body></html>
