<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>G-DATA v3 검토</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--fg:#e8eaf0;--mut:#9aa3b2;--acc:#4f8cff;--ok:#37c26a;--bad:#e05555;--line:#262b36}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.95);backdrop-filter:blur(8px);padding:12px 14px;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0 0 8px}
.bar{height:6px;background:#222838;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-top:6px}
.tabs{display:flex;gap:6px;padding:10px 14px 0}
.tabs button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:13px}
.tabs button.on{color:#fff;border-color:var(--acc);background:#1b2740}
main{padding:12px 14px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.kind{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#23304a;color:#9dc0ff;margin-bottom:8px}
.id{color:var(--mut);font-size:11px;margin-left:8px}
.label{color:var(--mut);font-size:12px;margin:10px 0 4px}
.text{white-space:pre-wrap;word-break:break-word;background:#11141b;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:220px;overflow:auto;font-size:14px}
.rate{display:flex;gap:8px;margin-top:10px}
.rate button{flex:1;padding:12px 0;border-radius:10px;border:1px solid var(--line);background:#11141b;color:var(--fg);font-size:14px}
.rate button.sel{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.rate button.bad.sel{background:var(--bad);border-color:var(--bad)}
.rate button.ok.sel{background:var(--ok);border-color:var(--ok)}
textarea{width:100%;margin-top:8px;background:#11141b;border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:10px;font:inherit;resize:vertical;min-height:44px}
footer{position:fixed;left:0;right:0;bottom:0;background:rgba(15,17,21,.97);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px}
footer button{flex:1;padding:13px;border-radius:12px;border:0;background:var(--acc);color:#fff;font-size:15px;font-weight:600}
footer button.ghost{background:#222838;color:var(--fg)}
.hint{color:var(--mut);font-size:12px;text-align:center;margin:8px 0 0}
</style></head><body>
<header>
  <h1>G-DATA v3 검토 <span style="color:var(--mut);font-weight:400;font-size:12px">— 출력이 입력에 비추어 적절한가?</span></h1>

</header>
<div class="tabs">

  <button id="unrated">미평가만</button>
</div>
<main id="list"></main>
<footer>
  <button class="ghost" id="reset">초기화</button>

</footer>

<script>
const ITEMS = [{"kind": "F5", "id": "REPORT-news_r-01956-00001", "input": "2000년대 네이버, 2010년대 우아한형제들(배달의민족)을 거쳐 2020년 스타트업 조이코퍼레이션(채널톡)과 클래스101.\n  천세희(46) 조이코퍼레이션 고문은 급성장하는 벤처·스타트업을 두루 거친 이력을 가지고 있다.\n  그는 지난 20년간 이들 회사에서 고객 서비스 시스템, 사업 운영 정책 등을 수립했다.\n  지금은 연매출 6조원(네이버), 기업가치 4조8000억원(우아한형제들)의 덩치 큰 회사가 됐지만, 그가 몸담았을 때만 해도 네이버와 우아한형제들 모두 급속히 발전하던 벤처기업이었다.\n  회사가 성장하면 안주할 법도 한데, 천 고문은 또 새로운 회사로 터를 옮겼다.\n  그는 자신이 현재 몸담은 조이코퍼레이션과 클래스101이 차세대 '유니콘 기업'(기업가치 1조원 이상의 비상장기업)이 될 것이라고 확신한다.\n  벤처회사의 급성장기를 연달아 경험한 그는 최근 국내 스타트업의 성장을 돕는 조력자 역할을 자처하고 있다.\n  천 고문은 온라인 취미 플랫폼 '클래스101'에서 부대표로 재직하는 동시에 조이코퍼레이션에서 사외 고문으로 활동하고 있다.\n  그에게는 숱한 스타트업인의 SOS(구조요청)가 끊이질 않는다.\n  천 고문은 이들에게 사업과 관련한 고민을 들어주고 조언해준다.\n  스타트업인에게 '대모'와 같은 존재인 셈이다.\n    지난 8일 서울 삼성동 조이코퍼레이션 사무실에서 천 고문을 만나 잘나가는 스타트업의 조건은 무엇인지, 이들에게 어떤 조언을 해주는지 물었다.\n    그는 네이버에서 CS팀장, 우아한형제들에서는 서비스운영실, 소상공인 지원프로그램 '배민아카데미' 이사 등을 지냈다.\n  과거에는 고객 응대라고 하면 무릎 꿇고 비는 식이 전부였는데, 2010년대들어서는 고객의 요구를 실제 기업의 상품과 서비스에 반영하는 방향으로 변화하기 시작했다.\n  고객 응대 매뉴얼을 만드는 것부터 시작해 그의 업무는 점차 서비스 운영, 브랜딩, 플랫폼 기획, 정책, 위기 관리 등으로 넓어졌다.\n  천 고문은 자신과 같은 역할을 '오퍼레이터'라고 한다.\n  \"오퍼레이터는 시스템 개선, 마케팅, 세일즈, 고객응대까지 업무가 다양하다\"며 \"회사가 건강히 성장하려면 오퍼레이터의 역할이 중요하다\"고 강조했다.\n    그가 몸담고 있던 우아한형제들은 지난달 독일의 딜리버리히어로(DH)와 인수·합병(M&A)하면서 기업가치 4조8000억원을 인정받고 엑싯(투자금 회수)에 성공했다.\n  천 고문은 \"6년전 김봉진 대표 등 직원들과 소소하게 회식하던 사진을 찾아봤다\"며 \"연매출 30억원하던 시절이었는데 이때는 그 누구도 지금의 배달의민족(배민)을 상상하지 못했을 것\"이라고 회상했다.", "output": "2000년대 네이버, 2010년대 우아한형제들(배달의민족)을 거쳐 2020년 스타트업 조이코퍼레이션(채널톡)과 클래스101. 천세희(46) 조이코퍼레이션 고문은 급성장하는 벤처·스타트업을 두루 거친 이력을 가지고 있다. 그는 지난 20년간 이들 회사에서 고객 서비스 시스템, 사업 운영 정책 등을 수립했다. 지금은 연매출 6조원(네이버), 기업가치 4조8000억원(우아한형제들)의 덩치 큰 회사가 됐지만, 그가 몸담았을 때만 해도 네이버와 우아한형제들 모두 급속히 발전하던 벤처기업이었다."}, {"kind": "F6", "id": "aud2208310017599", "input": "예를으 들어 건조기후우에서는 에 지뭉이 평평난가요?", "output": "예를 들어 건조기후에서는 왜 지붕이 평평한가요?"}, {"kind": "F5", "id": "REPORT-news_r-03163-00001", "input": "대한항공, 송현동 부지+왕산레저 지분 연내 매각     어머니(이명희 고문)와 여동생(조현민 전무)의 지지를 얻은 조원태 한진그룹 회장이 재무구조 개선을 골자로 한 대한항공 경영 쇄신안을 내놨다.\n  조 회장의 누나인 조현아 전 부사장 등 ‘반 조원태 연합군’을 향한 반격의 신호탄이란 분석이다.\n  이어 오는 7일에는 한진칼 이사회를 열고 경영 개선 방안 등을 내놓는다는 방침이다.\n     6일 오전 대한항공은 서울 중구 서소문 사옥에서 이사회를 열고 재무구조 개선을 위해 유휴자산인 송현동 부지와 비주력 사업인 왕산마리나 매각을 포함한 주주총회 안건을 의결했다.\n   이에 따라 대한항공은 7성급 호텔 건립 계획이 무산된 종로구 송현동 부지(토지 3만 6642㎥, 건물 605㎥) 매각과 인천시 중구 을왕동 소재 왕산마리나 운영사인 ㈜왕산레저개발 지분 매각을 추진한다.\n  수익을 내지 못하는 유휴자산과 비주력 사업 매각을 통해 재무구조를 개선하겠다는 의미다.\n   앞서 한진그룹은 지난해 2월 경영 안정성 및 수익성 향상 달성을 위해 발표한 ‘비전 2023’에서 송현동 부지 매각을 약속했다.\n  송현동 부지는 대한항공이 호텔 건립 목적으로 보유하고 있으나 학교 옆에 호텔을 지을 수 없다는 이유로 수년간 인허가가 이뤄지지 않으면서 유휴 부지로 남아있는 곳이다.\n   왕산레저개발은 2016년 준공된 해양레저시설인 용유왕산마리나의 운영사로 대한항공이 100% 지분을 소유하고 있다.\n  대한항공 측은 연내 매각 완료를 목표로 주관사 선정 및 매각공고와 같은 관련 절차를 진행한다는 계획이다.\n  대한항공 관계자는 “비수익 유휴자산과 비주력사업을 매각하는 것은 재무구조 개선의 적극적 의지 표현”이라고 했다.\n   재계 \"조현아 그룹 복귀 원천 봉쇄\" 분석도   재계에선 이날 대한항공 이사회에서 의결된 매각안이 조현아 전 부사장이 애착을 갖고 있던 사업이었던 만큼 조 전 부사장의 흔적 지우기가 아니냐는 목소리도 나온다.\n  실제로 조 회장이 호텔과 레저 사업 등 이익이 나지 않는 사업을 구조조정을 하겠다는 방침이 조 전 부사장과의 갈등을 촉발한 결정적 원인이었던 만큼, 개선안이 조 전 부사장의 그룹 복귀를 원천 봉쇄하겠단 의미가 더 크다는 것이다.\n    조원태 회장 측이 대한항공 재무구조 개선을 발표하기 전인 이날 오전 반 조원태 연합의 일원인 사모펀드 KCGI는 “현 경영진이 내는 방안에 진정성이나 신뢰성을 부여하기 어렵다”는 입장을 밝히며 조 회장 측을 먼저 견제하고 나섰다.", "output": "조 회장의 누나인 조현아 전 부사장 등 ‘반 조원태 연합군’을 향한 반격의 신호탄이란 분석이다. 이어 오는 7일에는 한진칼 이사회를 열고 경영 개선 방안 등을 내놓는다는 방침이다. 어머니(이명희 고문)와 여동생(조현민 전무)의 지지를 얻은 조원태 한진그룹 회장이 재무구조 개선을 골자로 한 대한항공 경영 쇄신안을 내놨다."}, {"kind": "F6", "id": "ext0000000056494", "input": "진정성있는소통으로 주요 난제들을시민과 함께 고민하고해법을 찾아야 문재인정부가 성공할수있다.", "output": "진정성 있는 소통으로 주요 난제들을 시민과 함께 고민하고 해법을 찾아야 문재인 정부가 성공할 수 있다."}, {"kind": "F6", "id": "ext0000000121283", "input": "부드럽게 끝나기도 햇지만 재앙이 됀 경우도 여럿이다.", "output": "부드럽게 끝나기도 했지만 재앙이 된 경우도 여럿이다."}, {"kind": "F6", "id": "aud2210040028551", "input": "너 자 그래서 요거를 선생이 완벽라게 분석해서 녀러분한테 전달헤 뒤릴 거요.", "output": "어 자 그래서 요거를 선생님이 완벽하게 분석해서 여러분한테 전달해 드릴 거에요."}, {"kind": "F5", "id": "REPORT-news_r-01655-00002", "input": "단층 위에 건설된 댐댐 공사가 부실했다는 지적도 있다.\n 영주댐 건설에 반대해온 '내성천의 친구들'은 지난해 11월 '물 새는 영주댐, 주민 안전 위협한다'는 제목의 성명을 냈다.\n  이 단체는 2016년 7월과 2017년 10월, 2019년 9월 등 세 차례 담수가 진행되는 과정에서 영주댐 벽체 동일한 위치에서 누수 현상이 관찰됐다고 밝혔다.\n 이 단체는 영주댐이 활성단층으로 추정된 옥천단층이 지나가는 지반 위에 건설됐고, 댐 하부를 지나가는 주 단층의 폭이 30m에 이르는 게 원인이라고 주장했다.\n  이들은 영주댐 건설 후 주변 15㎞ 반경에서 일어난 지진이 7차례라는 점도 지적했다.\n  영주댐 건설 이전 30년 동안에는 같은 구간 내에서 일어난 지진이 1회에 불과한 것과 큰 차이가 있다는 것이다.\n  하지만 다른 의견도 없지 않다.\n 협의체 한 위원은 \"댐 누수 현상이 일부 있다고 하더라도 보수를 하면 충분히 해결할 수 있을 것으로 본다\"고 밝히기도 했다.\n  사라진 토종 물고기 흰수마자토종 민물고기이자 멸종위기 야생생물 I급 민물고기인 흰수마자가 최고의 서식지인 내성천에서도 숫자가 급감한 것이 상류 영주댐 건설과 관련이 있다는 주장도 꾸준히 나오고 있다.\n  지난해 10월 수자원공사가 국회 환경노동위원회 이상돈 의원에게 제출한 국감 자료에 따르면 영주댐 하류에서 2014~2017년 181~492마리가 관찰됐으나, 2018년에는 9마리만 관찰됐다.\n 지난해 초까지 환경부 산하 국립생태원이 실시한 내성천 조사에서도 흰수마자는 7마리만 발견됐다.\n  흰수마자의 급감은 영주댐이 들어서면서 수질이 악화하고 상류로부터 모래 공급이 끊긴 게 원인으로 지목되고 있다.\n 흰수마자는 강바닥이 모래이고, 흐름이 비교적 빠른 여울이 있는 얕은 물에서만 산다.\n  흰수마자는 위협을 느끼면 모래 속에 파고 들어가 숨는다.\n 흰수마자가 살아가는 데는 고운 모래가 필요한 것이다.\n  수자원공사 조사에 따르면 내성천 석탑교(영주시 문수면 조제리) 지점의 경우 2014년에는 지름 1㎜ 미만의 모래가 51.\n 3%를 차지했으나, 지난해 조사에서는 20.\n 6%로 줄었다.\n 반면, 지름 1~2㎜ 모래는 39.\n 4%에서 43.\n 2%로, 지름 2㎜ 이상의 모래는 9.\n 3%에서 33.\n 4%로 늘었다.\n  영주댐 하류 내성천의 다른 지점도 상황은 비슷했다.\n 오신교 지점도 지름 1㎜ 미만의 모래는 2014년 50.\n 5%에서 지난해 32.", "output": "이 단체는 2016년 7월과 2017년 10월, 2019년 9월 등 세 차례 담수가 진행되는 과정에서 영주댐 벽체 동일한 위치에서 누수 현상이 관찰됐다고 밝혔다. 이 단체는 영주댐이 활성단층으로 추정된 옥천단층이 지나가는 지반 위에 건설됐고, 댐 하부를 지나가는 주 단층의 폭이 30m에 이르는 게 원인이라고 주장했다. 이들은 영주댐 건설 후 주변 15㎞ 반경에서 일어난 지진이 7차례라는 점도 지적했다."}, {"kind": "F6", "id": "grm2207080034782", "input": "스능국어보기전에 각성이필요하다", "output": "수능 국어 보기 전에 각성이 필요하다."}, {"kind": "F5", "id": "REPORT-news_r-02592-00001", "input": "금융감독원 제재심의위원회가 30일 손태승 우리금융지주 회장(우리은행장 겸임)과 함영주 하나금융지주 부회장(전 KEB하나은행장)에 대해 중징계인 문책경고를 의결했다.\n  해외금리 연계 파생결합펀드(DLF) 사태와 관련해 최고경영자(CEO)로서 내부통제 부실에 대한 책임을 물은 것이다.\n  윤석헌 금융감독원장이 제재심 심의 결과에 따라 중징계를 확정하면 손 회장과 함 부회장은 현재 임기를 끝으로 금융회사 경영진에서 물러나야 할 위기에 놓인다.\n  지난 16일과 22일에 이어 세 번째로 열린 이날 제재심은 오후 2시에 시작해 7시간가량 지난 오후 8시50분쯤 끝났다.\n  심의위원들은 지성규 하나은행장에 대해선 은행 자체 조사 결과를 삭제해 금감원 조사를 방해했다는 이유로 주의적 경고를 결정했다.\n  우리은행과 하나은행에 대해선 6개월간 일부 업무정지와 과태료 부과의 기관 제재를 금융위원회에 건의하기로 했다.\n  제재심의 최대 쟁점은 손 회장과 함 부회장에 대한 제재 수위였다.\n  금감원은 지난해 12월 26일 이들에게 문책경고를 사전 통보했다.\n  문책경고를 받으면 남은 임기는 채울 수 있지만 이후 최소 3년간 금융회사의 임원으로 재직할 수 없다.\n  금감원은 은행 CEO로서 내부통제 기준을 마련해야 하는 의무를 위반한 책임이 크다고 봤다.\n  우리은행과 하나은행은 내부통제 부실을 이유로 CEO까지 중징계하는 것은 지나치다며 맞섰다.\n  “CEO가 상품 판매를 위한 의사 결정에 직접 개입하지 않았고 사태 발생 이후 고객 피해 최소화와 재발 방지책 마련에 최선을 다했다”고 주장했다.\n  손 회장과 함 부회장도 제재심에 직접 참석해 반론을 폈다.\n  제재 수위를 결정하는 ‘공’은 윤석헌 금융감독원장에게 돌아갔다.\n  윤 원장이 문책경고를 확정하면 함 부회장은 올해 말 임기 만료와 함께 경영 일선에서 물러나야 한다.\n  그동안 함 부회장은 내년 3월 임기가 만료되는 김정태 하나금융 회장의 뒤를 이을 차기 회장 후보 1순위로 거론됐다.\n  발등에 불이 떨어진 건 연임을 앞둔 손 회장이다.\n  우리금융 이사회는 지난해 12월 30일 손 회장을 차기 회장직의 단독 후보로 선정했다.\n  당초 계획대로라면 손 회장은 오는 3월 말 정기주주총회를 거쳐 추가로 3년 임기의 회장직을 수행한다.\n  하지만 주총이 열리기 전에 문책경고의 효력이 발생하면 주총에 손 회장의 연임안을 상정할 수 없다.\n  변수는 있다.\n  문책경고의 통보가 늦어지는 경우다.", "output": "금융감독원 제재심의위원회가 30일 손태승 우리금융지주 회장(우리은행장 겸임)과 함영주 하나금융지주 부회장(전 KEB하나은행장)에 대해 중징계인 문책경고를 의결했다. 윤석헌 금융감독원장이 제재심 심의 결과에 따라 중징계를 확정하면 손 회장과 함 부회장은 현재 임기를 끝으로 금융회사 경영진에서 물러나야 할 위기에 놓인다. 해외금리 연계 파생결합펀드(DLF) 사태와 관련해 최고경영자(CEO)로서 내부통제 부실에 대한 책임을 물은 것이다."}, {"kind": "F5", "id": "REPORT-news_r-03454-00001", "input": "21대 총선 후보 등록(3월26일부터)까지는 11일 현재 43일이 남았지만 이미 서울 종로에선 사실상 본선 경쟁이 시작됐다.\n  박근혜ㆍ문재인 정부 국무총리 출신 간의 빅매치가 성사되면서다.\n  10일 이낙연 전 총리는 신종 코로나바이러스 감염증 사태로 직격탄을 맞은 광장시장의 상인들을 달래러 나섰고 황교안 자유한국당 대표는 모교 성균관대 앞에 있는 성균관을 찾았다.\n  두 사람의 동선에선 위기 대응을 위해선 안정이 필요하다는 점을 강조하려는 시도(이 전 총리)와 종로와의 연고를 유권자들에게 확인시키려는 노력(황 대표)이 각각 읽혔다.\n    그러나 종로구 선거를 관심있게 지켜보아 온 전문가들은 양대 정당 대표선수 간의 격돌이지만 의외로 승패는 미시적인 선거전략의 성패에 따라 갈릴 수 있다고 전망한다.\n  동별 표심이 확연히 다른 종로구의 특성 때문이다.\n  주거지가 집중된 동네들을 중심으로 보면, 종로구의 동쪽 끝인 창신 1ㆍ2ㆍ3동과 숭인 1ㆍ2 동 등은 민주당 계열의 텃밭으로 분류된다.\n  중·소형 평수 아파트와 다가구 주택에 인구가 밀집해 20대 총선 때 5개 동의 선거인수가 3만3803명에 달했다.\n  이명박 신한국당 후보가 당선됐던 1996년 15대 총선 당시 야권은 새정치국민회의 이종찬 후보와 민주당 노무현 후보로 분열됐지만 이 지역에서만큼은 이종찬 후보가 이명박 후보를 2500표 이상 앞섰다.\n  종로구의원을 오래 지낸 한 인사는 “호남 출신 인구가 많은 곳으로 정평이 나 있는 지역”이라며 “호남 향우회의 조직력이 막강하다”고 말했다.\n 2008년 18대 총선 당시 박진 한나라당 후보에 전체 2583표 차로 패한 손학규 통합민주당 후보도 이 지역에선 승리했다.\n  종로구의 서쪽 끝인 인왕산 자락의 무악동도 아직 다가구주택에 사는 서민층이 많아 민주당 유리 지역으로 꼽힌다.\n   반면 주거 형태가 대형 평수의 빌라나 고급 단독 주택 위주인 구기동과 평창동은 보수 성향 표심이 뚜렷한 지역이다.\n  2016년 20대 총선 때 이곳 선거인 수는 1만5372명이었다.\n  당시 오세훈 새누리당 후보를 1만표 이상 여유있게 따돌렸던 정세균 더불어민주당 후보도 이 구역에선 열세를 극복하지 못했다.\n  이 구역에서 최종 득표 결과는 정 후보 4571표, 오 후보 4619표였다.\n    21대 총선을 앞두고 주목받는 승부처는 행정동으로 부암동(법정동 부암ㆍ신영ㆍ홍지)과 교남동(법정동 교남ㆍ교북ㆍ송월ㆍ평ㆍ행촌ㆍ홍파)이다.", "output": "10일 이낙연 전 총리는 신종 코로나바이러스 감염증 사태로 직격탄을 맞은 광장시장의 상인들을 달래러 나섰고 황교안 자유한국당 대표는 모교 성균관대 앞에 있는 성균관을 찾았다. 21대 총선 후보 등록(3월26일부터)까지는 11일 현재 43일이 남았지만 이미 서울 종로에선 사실상 본선 경쟁이 시작됐다. 그러나 종로구 선거를 관심있게 지켜보아 온 전문가들은 양대 정당 대표선수 간의 격돌이지만 의외로 승패는 미시적인 선거전략의 성패에 따라 갈릴 수 있다고 전망한다."}, {"kind": "F5", "id": "REPORT-news_r-01679-00001", "input": "삼성전자가 스마트폰사업 수장에 노태문(52) 사장을 새로 선임하면서 국내 스마트폰 부품업계가 긴장하고 있다.\n  노 사장이 삼성전자 안에서 스마트폰의 외주 생산 확대 전략을 주도하는 인물로 알려져있기 때문이다.\n  삼성전자가 중국의 업체를 활용해 제조자개발생산(ODM) 방식으로 외주 생산을 확대할 경우 삼성 의존도가 높은 국내 부품업계는 어려움을 겪을 수 있다.\n    노태문 사장 \"스마트폰 ODM 비중 늘려야\" 스마트폰용 카메라 부품을 만드는 한 부품업체 임원은 20일 \"삼성전자의 이번 인사로 스마트폰 생산의 외주화에 가속도가 붙을 것으로 보인다\"며 \"(삼성전자 협력회사 모임인) 협성회 회원사들이 바짝 긴장하고 있다\"고 말했다.\n  다른 업체 관계자는 \"삼성이 외주 생산을 확대하는 방향으로 간다는 것은 이미 알려진 사실이기 때문에 특별히 뭐라 할 말은 없다\"며 말을 아꼈다.\n    삼성전자는 스마트폰을 100% 외주 생산하는 애플과 달리 그동안 자체 생산을 유지해 왔다.\n  하지만 2018년부터 기류가 변했다.\n  당시 삼성전자는 중국 ODM 업체인 윙테크에 중저가 스마트폰인 갤럭시A6s 생산을 맡겼다.\n  ODM이란 제품 개발부터 디자인, 생산까지 외주 업체에 맡기고 주문자는 '브랜드 로고'만 붙여 판매하는 방식이다.\n  삼성전자가 스마트폰 생산을 외부 업체에 맡긴 것은 이 때가 처음이고, 이를 주도한 것이 노태문 사장으로 알려져 있다.\n  무선개발실장(부사장)이던 그는 2018년 9월 임원진을 이끌고 윙테크를 직접 방문해 계약을 끌어냈다.\n   삼성전자 ODM 30%까지 확대할 가능성 노태문 사장은 지난해 말 주요 임원 회의에서도 “현재 스마트폰 라인업을 관리하려면 품질 관리를 위해서라도 ODM을 확대할 필요가 있다\"고 주장한 것으로 알려졌다.\n  ‘ODM 30%’라는 구체적인 수치까지 제시했다고 한다.\n  삼성전자가 최근 3년간 연평균 3억대 안팎을 출시한 점을 고려하면, ODM을 1억대까지 확대할 수 있다는 얘기다.\n   삼성전자 입장에서 ODM 확대는 불가피한 선택이다.\n  삼성전자는 중저가폰의 최대 시장인 중국과 인도에서 고전중이다.\n  2013년 20%까지 올랐던 중국 스마트폰 시장 점유율은 1%대로 떨어졌다.\n  인도에서는 지난해 3분기 기준 점유율 2위(20%)지만 선두인 샤오미(26%)와 격차가 더 벌어졌다.\n  삼성전자 스마트폰 전체 판매량에서 중저가폰은 60~70%를 차지한다.\n  중국 업체의 저가 물량 공세에 대응하기 위해서라도 ODM을 통해 원가 절감에 나설 수밖에 없는 처지다.", "output": "삼성전자가 스마트폰사업 수장에 노태문(52) 사장을 새로 선임하면서 국내 스마트폰 부품업계가 긴장하고 있다. 노 사장이 삼성전자 안에서 스마트폰의 외주 생산 확대 전략을 주도하는 인물로 알려져있기 때문이다. 삼성전자가 중국의 업체를 활용해 제조자개발생산(ODM) 방식으로 외주 생산을 확대할 경우 삼성 의존도가 높은 국내 부품업계는 어려움을 겪을 수 있다."}, {"kind": "F5", "id": "REPORT-news_r-04631-00001", "input": "흔한데 잘 모르는 점액낭염메이저리그(MLB) 특급 투수인 맥스 셔저(워싱턴 내셔널스)는 지난해 등 쪽에 뻐근함을 느껴 받은 정밀 검진에서 ‘견갑흉부 점액낭염’이란 진단을 받았다.\n  팔뼈와 몸통을 연결하는 오른쪽 어깻죽지에 염증이 생긴 것이다.\n  당시 셔저는 ‘돌이 들어간 신발을 신고 달리는 것 같다’며 통증을 호소했다.\n  　점액낭은 피부와 뼈 사이에서 마찰·압력을 줄여 완충 작용을 하고 관절의 움직임을 원활히 하는 점액 주머니다.\n  인천성모병원 정형외과 송광연 교수는 “평소에는 점액의 양이 매우 적어 만져지지 않지만 반복적으로 자극이 가해져 염증이 생기면 물이 차고 부풀어 오른다”며 “점액낭염은 환자가 꽤 많지만 잘 알려지지 않은 질환”이라고 말했다.\n  건강보험심사평가원 질병 통계에 따르면 지난해 어깨 점액낭염으로 진단받은 환자는 12만여 명, 무릎 점액낭염 환자는 4만7000여 명이었다.\n  　점액낭은 모든 관절 주변에 정상적으로 존재하는 물주머니다.\n  그중 마찰이 잦은 어깨·무릎·엉덩이뼈·발목 부위의 점액낭에 염증이 잘 생긴다.\n  어깨는 체중 부하를 받지 않는 부위지만, 팔을 머리 위로 올리거나 회전하는 반복적인 운동을 하면 스트레스가 전해져 염증이 생길 수 있다.\n  스포츠 활동을 하며 팔꿈치에 충격이 지속해서 가해지거나 팔꿈치를 책상에 괴는 습관이 있을 땐 팔꿈치에 점액낭염이 생긴다.\n  팔꿈치를 구부렸을 때 통증이 심해지는 특징이 있다.\n   지난해 어깨·무릎 환자 16만 명 넘어 사무실에서 오랫동안 앉아 있는 사람의 경우 의자와 닿는 엉덩이뼈 쪽에 점액낭염이 흔하다.\n  쿠션을 사용하면 마찰을 줄일 수 있다.\n  겨울에 부츠를 자주 신는 여성은 복숭아뼈 부위가 마찰로 자극받아 점액낭염이 생기는 경우가 있다.\n  송 교수는 “점액낭염은 생활습관이나 과한 운동, 직업 특성 때문에 발병하는 경향이 있다”며 “노화가 주요 원인이 아니므로 젊은 연령층에서도 흔하다”고 말했다.\n  　무릎의 점액낭염은 퇴행성 관절염이라 여겨지는 경우가 적지 않다.\n  하지만 두 질환에는 차이가 있다.\n  송 교수는 “점액낭염은 말랑말랑한 물주머니가 만져지면서 열감이 느껴지고 눌렀을 때 통증(압통)이 있다.\n  가만히 있을 때도 통증이 있다”며 “상대적으로 급성으로 증상이 생기며 통증이 악화한다는 점에서 관절염과 다르다”고 말했다.\n  　무릎에 생긴 부종이 점액낭염 때문인지 확인하는 방법은 이렇다.\n  먼저 양쪽 무릎을 편안하게 편 상태에서 힘을 주지 말고 무릎의 슬개골 위를 살짝 눌러 본다.", "output": "점액낭은 모든 관절 주변에 정상적으로 존재하는 물주머니다. 그중 마찰이 잦은 어깨·무릎·엉덩이뼈·발목 부위의 점액낭에 염증이 잘 생긴다. 팔꿈치를 구부렸을 때 통증이 심해지는 특징이 있다. 스포츠 활동을 하며 팔꿈치에 충격이 지속해서 가해지거나 팔꿈치를 책상에 괴는 습관이 있을 땐 팔꿈치에 점액낭염이 생긴다."}, {"kind": "F5", "id": "REPORT-news_r-01079-00001", "input": "청와대가 검찰의 조국 수사 인권 침해와 관련해 조사해 달라는 내용의 협조 공문을 국가인권위로 보냈다.\n  노영민 대통령 비서실장 명의였는데 청와대는 “인권위가 ‘실명으로 진정을 접수해야 조사할 수 있다’고 밝혀왔기 때문”이라고 설명했다.\n  이로 인해 청와대가 진정서를 냈다고 알려졌다.\n  야권과 학계에선 “청와대가 특정인을 위해 쓸 수 있는 모든 제도를 다 쓰겠다는 것으로 염치없는 일”이란 비판이 나왔다.\n  그러자 청와대는 “진정은 아니었다”고 했다.\n  청와대가 ‘조국 전 법무부 장관의 수사 과정에서 인권 침해가 발생한 데 따른 국가인권위 조사를 촉구한다’는 국민청원에 따라 노 실장 명의로 인권위에 공문을 보냈다고 밝힌 건 13일 오전이었다.\n  해당 청원은 지난해 10월 15일 이후 한 달간 22만6434명이 동의해 청와대의 공식 답변 요건(20만 명 이상)을 넘어선 상태였다.\n     청와대 강정수 디지털소통센터장은 이날 오전 청와대 페이스북 계정 등 소셜네트워크서비스(SNS)를 통해 이런 사실을 알리며, 노 실장 명의로 공문을 보낸 데 대해 “인권위가 ‘참고로 인권위법 제32조 제1항 제6호에 따라 익명으로 진정이 접수될 경우 진정 사건을 각하하도록 규정하고 있어 실명으로 진정을 접수해야 조사할 수 있다’고 밝혔다”고 전했다.\n  그러면서 “검찰의 인권 침해와 관련해 2014년 1월 1일부터 2019년 10월 말까지 인권위에는 938건의 진정이 접수됐다”고 했다.\n  이번 건을 진정으로 인식했을 수 있다는 의미다.\n  이번 청와대의 조치가 인권위엔 압박으로 여겨질 수 있다.\n  인권위법은 진정이나 민원 또는 직권에 의해 사건을 조사하도록 규정했다.\n  인권위는 청와대로부터 접수된 진정이 “(법상) 진정이 아니다”면서도 “내부 절차와 관련법에 따라 검토 예정”이라고 했다.\n  조사 착수 여부나 공문의 효력에 대해선 함구했다.\n  야권에선 강하게 성토했다.\n  김성원 한국당 대변인은 “조국 임명을 철회하라는 청원에 대해선 임명권은 대통령에게 있다며 딱 잘라 거절한 청와대”라며 “돌연 조국 가족은 구하겠다고 ‘인권 침해’ 운운하며 팔을 걷어붙이고 나선 모양새가 우습다 못해 기가 찰 지경”이라고 말했다.\n  권성주 새로운보수당 대변인도 “지난해 12월 20만 명을 넘었을 때도 지켜보겠다던 청와대가 무엇 때문에 이 시점에 인권위에 송부하는가”라며 윤석열 검찰총장에 대한 압박으로 해석했다.\n  진중권 전 동양대 교수는 “조 전 장관이 인권 침해를 당했다며 청와대가 진정하는 건 사회적 약자를 위해 만든 인권위를 고위 공직자 비리 세탁에 이용하려는 나쁜 일”이라고 했다.", "output": "청와대가 검찰의 조국 수사 인권 침해와 관련해 조사해 달라는 내용의 협조 공문을 국가인권위로 보냈다. 노영민 대통령 비서실장 명의였는데 청와대는 “인권위가 ‘실명으로 진정을 접수해야 조사할 수 있다’고 밝혀왔기 때문”이라고 설명했다. 야권과 학계에선 “청와대가 특정인을 위해 쓸 수 있는 모든 제도를 다 쓰겠다는 것으로 염치없는 일”이란 비판이 나왔다. 청와대가 ‘조국 전 법무부 장관의 수사 과정에서 인권 침해가 발생한 데 따른 국가인권위 조사를 촉구한다’는 국민청원에 따라 노 실장 명의로 인권위에 공문을 보냈다고 밝힌 건 13일 오전이었다."}, {"kind": "F6", "id": "aud2210190033940", "input": "오케리 다시 얘기해 돌아아가 보자", "output": "오케이 다시 얘기해 돌아가 보자."}, {"kind": "F5", "id": "REPORT-news_r-03166-00001", "input": "신종 코로나바이러스로 인해 중국의 직장 풍경이 바뀌고 있다.\n  실제 직장에 출근해 업무를 하는 경우는 되도록 출근 날짜를 늦추고 있으며 많은 수의 사업장은 재택근무로 전환하고 있다.\n  이에 따른 '해프닝'도 다양하다.\n     중국경제망에 따르면 지난달 28일 중국 장쑤 성에서는 오는 9일 24시 전까지는 업무개시를 하면 안 된다는 통지가 나왔다.\n  그러나 이를 무시한 채 지난 1일 가동 중인 방직공장이 당국에 적발됐다.\n  중국경제 망은 \"해당 공장 사장이 행정구류 5일 처분을 받았다\"고 보도했다.\n    긴 설 연휴를 마치고 지난 3일부터 본격적인 업무개시가 시작된 중국에선 바이러스 감염을 우려해 상당수가 재택근무 중이다.\n   대부분 중국 기업들은 2월 3~2월 7일은 재택근무를 하고 8~9일 주말을 보낸 뒤 10일부터 정상출근을 준비하는 분위기다.\n   상하이시 정부의 경우 \"도시 운영에 필요한 분야, 전염병 방지 필수 분야, 대중 생필품 분야 및 기타 주요 민생 관련 기업을 제외한 기타기업은 9일 24시까지 업무재개를 하지 않는다\"고 통지했다.\n  법무법인 율촌의 변웅재 변호사는 \"노동 당국에서 별도 공지를 하지 않는 한 기업은 근로자에게 2월 3일~2월 9일 재택근무를 지시할 수 있다\"는 뜻이라고 설명했다.\n    업무개시 첫날이었던 지난 3일, 알리바바에서 개발한 업무용 메신저 시스템인 딩딩에 접속자가 몰리며 한때 '먹통'이 되기도 했다.\n  딩딩은 중국의 대표적인 업무용 메신저로 현재 약 2억명의 회원을 두고 있다.\n    재택근무 수요가 폭발적으로 늘자 최근 다운로드 순위에서만 보면 딩딩이 국민 메신저인 중국판 카카오톡인 위챗을 앞지르는 일도 벌어졌다.\n  딩딩은 비즈니스 및 업무용으로 특화된 메신저이기 때문에 직장인 사이에서 널리 사용되고 있다.\n    이번 신종코로나 바이러스를 계기로 중국 내에서 '재택근무 혁명'이 일어날 조짐을 보인다.\n  글로벌 워크플레이스 애널리스틱스에 따르면 2005년 중국 내에서는 원격근무하는 사람이 180만명이었는데 2014년 이 숫자가 360만명으로 늘었다.\n  2017년 기준 중국의 원격근무 시장 규모는 60억 위안(약 1조원)으로 추정됐다.\n  이는 전년동기대비 68% 증가한 수치다.\n     재택근무라고 마냥 편한 것만은 아니다.\n  동료들과 아침에 화상회의를 하다 보니 \"부장님이 잠옷을 입고 회의하는 모습을 봤다\"는 반응도 있다.\n  이에 대해 소후왕은 \"집에서 업무를 본다고 파자마 차림으로 있어야 하는가에 대해 논쟁이 있다\"고 보도했다.", "output": "신종 코로나바이러스로 인해 중국의 직장 풍경이 바뀌고 있다. 실제 직장에 출근해 업무를 하는 경우는 되도록 출근 날짜를 늦추고 있으며 많은 수의 사업장은 재택근무로 전환하고 있다. 이에 따른 '해프닝'도 다양하다. 긴 설 연휴를 마치고 지난 3일부터 본격적인 업무개시가 시작된 중국에선 바이러스 감염을 우려해 상당수가 재택근무 중이다."}, {"kind": "F5", "id": "REPORT-news_r-03149-00001", "input": "22번째 신종 코로나바이러스 감염증 확진자는 16번째 확진자인 A씨(42·여)의 오빠로 확인됐다.\n  A씨 딸인 B씨(21·여)에 이어 광주·전남 지역 내 3번째 신종 코로나 확진자인 C씨(46)는 조선대병원에 격리 조치됐다.\n  1월 19일 태국에서 귀국한 후 확진 판정을 받기 전까지 16일간 무방비로 방치된 A씨가 슈퍼감염자가 될 우려도 커지고 있다.\n  딸·오빠 잇따라 확진…슈퍼감염자 되나질병관리본부는 6일 \"국내 22번째 확진자인 C씨는 16번째 확진자인 A씨의 오빠이며, 자가격리 중 신종 코로나 진단 결과 양성으로 확인돼 조선대병원에 격리 조치됐다\"고 밝혔다.\n  보건당국에 따르면 C씨는 설 연휴 기간인 1월 25일 A씨와 접촉한 것으로 파악됐다.\n  당시 A씨는 전남 나주에 있는 친정집을 방문해 오빠, 올케 등 3명이 함께 식사를 했다.\n  A씨의 친모는 1월 15일부터 19일까지 태국여행에는 동행했지만, 신종 코로나 진단 검사 결과 음성으로 확인됐다.\n  함께 식사한 올케도 음성 판정이 나왔다.\n  22번째 확진자인 C씨는 나주에 거주하면서 광주우편집중국에서 근무 중이다.\n  앞서 우정사업본부는 지난 4일 오빠 C씨가 근무하는 광주우편집중국을 임시 폐쇄하고, 근무 중인 모든 직원을 자가 격리 조치했다.\n  현재 광주우편집중국은 폐쇄 조치로 인해 350명인 전 직원들의 출근 금지 및 자가격리 조치가 내려진 상태다.\n  C씨, 우편집중국 근무…350명 출근 금지보건 당국은 C씨의 이동 동선에도 주목하고 있다.\n  C씨부부가 1월 25일 주민들과 함께 음식을 나눠 먹은 것으로 전해져서다.\n  이들은 지난 1일과 2일 나주혁신도시 내 빛가람동의 한 마트를 들렀으며, 1일 오후에는 나주시내 식당에서 식사도 한 것으로 알려졌다.\n  보건당국은 C씨의 동선 및 접촉자를 분류하는 역학조사도 진행 중이다.\n  A씨는 1월 15일부터 19일까지 일가족 5명과 함께 태국여행을 다녀온 뒤 지난달 25일 처음으로 오한과 발열 등 신종 코로나 증상이 나타났다.\n  1월 27일은 딸과 함께 방문한 광주 21세기병원에서 치료를 받고 이튿날인 1월 28일부터는 입원치료를 받았다.\n  앞서 1월 28일부터 같은 병실을 사용했던 딸 B씨는 지난 5일 신종 코로나 18번째 확진자 판정을 받은 바 있다.\n  확진자 모녀가 머물던 21세기병원 의료진 70여명과 입원환자 70여명은 신종 코로나 진단검사 결과 음성으로 판정됐다.\n  이들은 지난 4일 확진자 판정 직후 위험도에 따라 병원 내, 광주소방학교, 자가 등에 격리조치됐고 잠복기가 끝날 때까지 격리된다.", "output": "22번째 신종 코로나바이러스 감염증 확진자는 16번째 확진자인 A씨(42·여)의 오빠로 확인됐다. A씨 딸인 B씨(21·여)에 이어 광주·전남 지역 내 3번째 신종 코로나 확진자인 C씨(46)는 조선대병원에 격리 조치됐다. 1월 19일 태국에서 귀국한 후 확진 판정을 받기 전까지 16일간 무방비로 방치된 A씨가 슈퍼감염자가 될 우려도 커지고 있다."}, {"kind": "F5", "id": "REPORT-news_r-02577-00002", "input": "“봉준호 감독이 15장 분량의 '기생충' 시놉시스를 보여준 게 아직도 기억이 난다.\n  '이런 이야기를 하려고 한다'며 시놉시스를 줬는데 단 15장만으로도 좋았다.\n  그냥 시작부터 끝까지 좋았다.\n  물론 팬심에서 생긴 작품에 대한 호감도도 높았겠지만 '기생충'이라는 발상부터가 신기했다.\n  마치 '기생충' 속 기정(박소담)이 연교(조여정)에게 '어머니, 저와 함께 이 검은 상자를 열어보시겠어요?'라고 말하는 기분이었다.\n ” 그 자신이 ‘기생충’ 태동부터 팬심을 지녔던 제작자인 셈이다.\n  실제로 그는 영화를 “현재 구현할 수 있는 최고 수준으로” 만드는 데 총력을 기울였다.\n  “처음부터 전 세계에 보여질 것이 예상되는 작품이었기 때문에 현재 시점에 어느 나라 수준에서 보아도 영화의 만듦새나 상영포맷 등 퀄리티에 문제가 없는 영화였으면 했다”는 이유다.\n  봉 감독도 제작과정에서 “4K(초고해상도) 촬영, 애트모스 녹음, 과감하고 정교한 세트 등 프로덕션 밸류에 대한 아낌없는 투자가 있었다”고 만족해했을 정도다.\n  다행히 투자·배급사인 CJ엔터테인먼트 측과도 이견이 없었다고 한다.\n    ‘기생충’ 제작자로 나선 것은 어느 정도 운이 맞아떨어진 결과다.\n  봉 감독은 앞서 ‘마더’(2009)를 바른손 측과 함께 한 바 있었지만 곽 대표 취임 이후로는 연이 닿지 않았다.\n  ‘옥자’(2017)를 해외 스튜디오와 함께 했던 봉 감독은 다음 작품을 국내 제작사, 특히 바른손과 함께 하고 싶다는 의향을 보였다.\n  곽 대표는 당시 제작자로서 경험이 ‘가려진 시간’(2016, 감독 엄태화)뿐이었던 ‘초짜’였다.\n  2015년 당시 그가 처음으로 봉 감독과 연락하게 됐을 때 보낸 문자는 “작품에 폐가 될까봐 너무 두렵지만 설레기도 합니다”였다고 한다.\n    이같은 태도는 그가 영화 경력을 영화전문지 ‘키노’ 기자로서 출발한 것과도 연관된다.\n  연출자를 비지니스로만 대하는 게 아니라 예술가로, 작가로 대하는 마음이 바탕에 깔린 것이다.\n  이런 마음이 통했는지 봉 감독은 영화 편집본을 처음 보여주면서 “제작자로 말고 전직 ‘키노’ 기자로 영화를 본 소감을 얘기해 달라”고 얘기하기도 했다.\n  곽 대표는 “같은 시선과 문화를 감독들과 공유한다는 건 제작자로서 이례적인 경우가 아닐까 싶다”고 회고했다.\n  영국 아카데미상 시상식 때 봉 감독은 외국어영화상 수상 소감을 밝히면서 주연인 송강호 배우와 함께 곽 대표의 헌신에도 감사를 표했다.", "output": "실제로 그는 영화를 “현재 구현할 수 있는 최고 수준으로” 만드는 데 총력을 기울였다. “처음부터 전 세계에 보여질 것이 예상되는 작품이었기 때문에 현재 시점에 어느 나라 수준에서 보아도 영화의 만듦새나 상영포맷 등 퀄리티에 문제가 없는 영화였으면 했다”는 이유다. 봉 감독도 제작과정에서 “4K(초고해상도) 촬영, 애트모스 녹음, 과감하고 정교한 세트 등 프로덕션 밸류에 대한 아낌없는 투자가 있었다”고 만족해했을 정도다."}, {"kind": "F5", "id": "REPORT-news_r-04099-00002", "input": "그 당시부터 마는 우리의 인기 음식이었다는 방증이기도 하다.\n  마에 산에서 나는 장어라는 별명이 붙은 것은 그만큼 우리의 원기를 북돋아서 체력을 도와주는 것에서 비롯되었다.\n  이것은 우리나라뿐만 아니라 마를 먹을 줄 아는 외국에서도 알려진 사실이다.\n  아프리카의 자메이카라는 나라에서도 역시 마를 즐긴다.\n  이 나라의 마는 얌이라 불리는데, 자메이카 얌이 세계적으로 유명해진 것이 우사인 볼트 덕이다.\n  세계에서 가장 빠른 사나이인 우사인 볼트가 “나의 힘의 원천은 얌 덕분이다”라고 한 인터뷰 때문에 이제는 아예 국민 간식이 되었다.\n  마는 노화를 방지하는 생리활성 물질이 굉장하고, 체력을 키워주며, 소화기 특히 장의 기능을 좋아지게 하는 성분들이 풍부하다.\n  이런 성분들이 들어 있는 핵심적인 부분이 끈적이는 곳이다.\n  마를 잘라보면 끈적끈적한 물질들이 나와 들러붙는다.\n  끈적이는 성분에 들어 있는 뮤신이 여러 역할을 해서 마의 효능에 큰 영향을 미친다.\n  뮤신은 당단백질로 소화기관에서는 소화기 점막을 보호하고 소화 연동운동을 하는 윤활제 역할을 하며, 위산과다와 위궤양을 치료하는 성분으로 작용한다.\n  또한, 이 성분은 정력을 높이는 자양강장제로 쓰인다.\n  우리가 먹는 여러 음식 중에서 끈적이는 것이 나오는 것들이 건강에 좋은 것들이 많은 점은 주목할 필요가 있다.\n  미역이나 다시마를 치대보면 끈적이는 점액들이 나오고 이는 수용성 식이섬유로 피를 맑게 해 준다.\n  메주를 띄우거나 청국장, 낫또를 휘휘 저으면 끈적한 실 같은 물질들이 막 나오고, 뿌리채소인 연근도 자르면 끈적이는 것이 나온다.\n  오크라 모로헤이야 같은 외국에서 익숙한 채소 중에서도 끈적이는 물질이 나오는 것들이 있다.\n  모두 장에도 좋고, 면역도 도와주는 음식들이다.\n  마 하면 떠오르는 원기회복과 체력을 담당하는 성분은 아르기닌과 디오스게닌이다.\n  아르기닌은 부신의 호르몬을 왕성하게 만들어 몸의 생리대사기능을 끌어 올린다.\n  아르기닌은 성장호르몬 분비를 도와 항노화 기능이 있고, 혈관 내 산화질소 NO의 양을 늘려서 혈관 확장 및 순환 기능을 하게 하는 성분이기도 하다.\n  디오스게닌은 성호르몬 관련 물질의 원료로 현대 의학에서 인공적인 성호르몬을 만드는 성분이기도 하다.\n  이 성분은 성호르몬 전구체가 되어서 DHEA가 되고, 여기서 에스트로겐이나 남성호르몬이 만들어진다.\n  이런 성분들 덕분에 힘이 폭발적으로 늘면서 혈액순환도 되다 보니 남성의 기운을 올려주는 음식으로 주목을 받게 되었다.", "output": "마에 산에서 나는 장어라는 별명이 붙은 것은 그만큼 우리의 원기를 북돋아서 체력을 도와주는 것에서 비롯되었다. 마는 노화를 방지하는 생리활성 물질이 굉장하고, 체력을 키워주며, 소화기 특히 장의 기능을 좋아지게 하는 성분들이 풍부하다. 끈적이는 성분에 들어 있는 뮤신이 여러 역할을 해서 마의 효능에 큰 영향을 미친다. 뮤신은 당단백질로 소화기관에서는 소화기 점막을 보호하고 소화 연동운동을 하는 윤활제 역할을 하며, 위산과다와 위궤양을 치료하는 성분으로 작용한다."}, {"kind": "F6", "id": "aud2208080009312", "input": "줘국에 비가 내겠습니다.", "output": "전국에 비가 내리겠습니다."}, {"kind": "F5", "id": "REPORT-news_r-05526-00002", "input": "이에 옆 사람이 대구 중부경찰서에 제보했고 대구 동구 중앙교육연수원으로 이송해 검사한 결과 확진자로 드러났다.\n  과학기술정보통신부 우정사업본부는 2일 오전 11시부터 전국 읍·면 우체국 1406곳을 통해 마스크 65만 개를 개당 1000원에, 1인당 최대 5개씩 판매했다.\n   이날 대구 지역 우체국엔 1400세트, 청도엔 520세트가 공급됐고 대다수 우체국엔 80세트씩만 갔다.\n  대구시 수성우체국 앞에는 판매 시작 여섯 시간 전인 오전 5시부터 줄을 선 시민도 있었다.\n  그러다 보니 판매 개시 5분 만에 동났다.\n  일부 시민은 “마스크를 우체국에서 선착순 판매하는 이유를 모르겠다”면서 “주민센터에서 거주자임을 확인하고 순차적으로 나눠주면 새벽부터 줄을 서는 고생을 하지 않아도 될 일 아니냐”고 지적했다.\n  하지만 서울 등 도심 지역 우체국에선 팔지 않아 혼선이 빚어졌다.\n    상황이 이렇게 되자 ‘마스크 사재기’를 방지해야 한다는 지적과 함께 공정한 마스크 구매를 위한 제언도 쏟아졌다.\n  경북 문경시에서 일하는 약사라고 자신을 소개한 사람이 청와대 국민청원을 통해 ‘마스크 사재기 방지 대책’을 제안했다.\n  이 청원자는 “현재 한 약국에서 약을 조제받으면 다른 약국에서 중복 투약할 수 없도록 체크하는 의약품안전사용서비스(DUR) 시스템을 이용한다”며 “이를 마스크에 접목해 주민등록번호별로 공적 마스크 구매 개수를 등록하면 다른 약국에서 중복 판매를 하지 않게 해 사재기를 막을 수 있다”고 적었다.\n  마스크 공적 판매량을 아예 100%로 늘려야 한다는 주장도 나온다.\n  박종한 웰킵스 대표는 “공적 물량을 100%로 확대하는 게 유일한 해결책”이라며 “또 공적 마스크 판매처를 일반 마트와 편의점 등 모든 유통 채널로 확대하고 그 대신 매입한 가격의 110% 수준으로 팔도록 하면 된다”고 말했다.\n  편의점은 전국에 4만5000개가 분포돼 있다.\n  온라인과 오프라인 매장, TV홈쇼핑 채널까지 마스크 판매시간을 통일하면 수요가 분산되는 효과를 볼 수 있다는 제언도 있었다.\n  조용수 전남대병원 응급의학과 조교수는 “공적 판매가 아니라 정부나 지자체에서 필요한 사람에게 마스크를 우선으로 전달하는 방법도 의미가 있을 것”이라고 제언했다.\n  실제로 부산시 기장군은 예비비 54억원을 긴급 투입해 마스크 105만 개 구매 계약을 체결하고 지역 내 7만여 가구에 무상으로 나눠주고 있다.\n  일단 35만 개를 공급받아 가구당 5개씩 나눠줬다.", "output": "이에 옆 사람이 대구 중부경찰서에 제보했고 대구 동구 중앙교육연수원으로 이송해 검사한 결과 확진자로 드러났다. 과학기술정보통신부 우정사업본부는 2일 오전 11시부터 전국 읍·면 우체국 1406곳을 통해 마스크 65만 개를 개당 1000원에, 1인당 최대 5개씩 판매했다. 이날 대구 지역 우체국엔 1400세트, 청도엔 520세트가 공급됐고 대다수 우체국엔 80세트씩만 갔다. 대구시 수성우체국 앞에는 판매 시작 여섯 시간 전인 오전 5시부터 줄을 선 시민도 있었다. 그러다 보니 판매 개시 5분 만에 동났다."}, {"kind": "F6", "id": "ota0000000001892", "input": "짤자란 사슬의 연속으로 이루어져 잇지만 매우 단단한 결합으로 절대 끊어질 염려없어.", "output": "짤따란 사슬의 연속으로 이루어져 있지만 매우 단단한 결합으로 절대 끊어질 염려 없어."}, {"kind": "F5", "id": "REPORT-news_r-00356-00002", "input": "승모근을 단련해야 스탠더드 댄스에서 양팔이 옆으로 평행으로 유지하는 데 도움이 된다.\n  어린 시절에 잘못해서 벌을 받을 때 양손을 머리 위로 들어 올리라는 체벌을 받는데 승모근이 약하면 이 자세가 고역이다.\n  양팔을 위로 하는 대신 옆으로 뻗어 유지하는 스탠더드의 기본자세도 사실 상당히 힘든 자세다.\n  승모근이 잘 발달한 사람은 뒤태가 좋다.\n  머리가 앞으로 숙여진 사람들은 승모근이 머리의 무게를 받쳐야 하므로 승모근이 둥글게 휘어 거북목이 된다.\n  ‘대둔근(大臀筋)’, ‘중둔근(中臀筋)’은 엉덩이 근육을 말한다.\n  대둔근은 볼록한 엉덩이 근육 자체이며, 중둔군은 위쪽 양옆 근육을 말한다.\n  댄스를 운동으로 많이 하게 되면 엉덩이 근육이 발달하게 된다.\n  허리 근육과도 연결되어 있으므로 일어서고 앉을 때도 필수적으로 사용하는 근육이다.\n  휠체어를 주로 사용하는 장애인을 휠체어가 아닌 평지에 앉혀 놓으면 똑바로 앉지 못하고 쓰러지는 현상은 이 근육을 단련하기 어려운 신체조건인 경우가 많다.\n  라틴댄스에서 힙 무브먼트(Hip Movement)를 중시하는 동작에서는 특히 중요한 근육이다.\n  ‘내전근(內轉筋)’도 있다, 허벅지 안쪽 근육으로 이해하면 된다.\n  회전과 굴곡 운동에 필요한 근육으로 몸을 안쪽으로 지탱해주는 역할에 중요하다.\n  골반 육을 움직일 때도 안에서 지탱해주는 역할을 한다.\n  그래서 “허벅지 안쪽에 힘을 주라”는 얘기를 자주 듣게 된다.\n  발레에서도 중요한 근육이다.\n   ‘괄약근(括約筋)’도 있다.\n  괄약근은 고리 모양으로 된 근육으로, 인체의 필요로 인해 소화 기관 등의 어떤 통로를 열고 닫는 것을 제어하는 기능을 하며 조임근이라고도 한다.\n  댄스에서 얘기하는 괄약근은 항문 괄약근이다.\n  “괄약근을 조이세요”라고 하는데 라틴댄스, 스탠더드 댄스 모두 항문 괄약근을 조여야 몸이 탱탱해지고 무게 중심을 골반으로 모으는 데 도움을 준다.\n  개인적으로는 ‘흉쇄 유돌근(胸鎖-乳突筋)’에 관심이 많다.\n  다른 근육들은 옷에 가려 보이지 않지만, 흉쇄 유돌근은 목 근육으로 잘 보이기 때문이다.\n  팔다리를 제외하면 우리 인체 중에서 목이 가장 가늘다.\n  그 가는 목이 머리에 혈류 등 모든 것을 전달하는 교량 역할을 한다.\n  그 목을 받쳐주는 것이 목뼈이며 흉쇄유돌근이라는 근육이다.\n  흉쇄유돌근은 흉골과 쇄골 즉, 가슴뼈의 위 끝과 빗장뼈의 안쪽 끝에서 시작해 귀의 뒤쪽 뾰족한 뼈 유양돌기로 비스듬히 뻗어 있는 크고 긴, 목 부분의 근육을 말한다.", "output": "대둔근은 볼록한 엉덩이 근육 자체이며, 중둔군은 위쪽 양옆 근육을 말한다. 댄스를 운동으로 많이 하게 되면 엉덩이 근육이 발달하게 된다. 허리 근육과도 연결되어 있으므로 일어서고 앉을 때도 필수적으로 사용하는 근육이다. 라틴댄스에서 힙 무브먼트(Hip Movement)를 중시하는 동작에서는 특히 중요한 근육이다."}, {"kind": "F6", "id": "ext0000000055785", "input": "당시도시락에서 가장 고급 반찬이 계란 프라이였다", "output": "당시 도시락에서 가장 고급 반찬이 계란 프라이였다."}, {"kind": "F6", "id": "ext0000000113175", "input": "시중에 돈은많아졌는데 갈 곳이많지안다", "output": "시중에 돈은 많아졌는데 갈 곳이 많지 않다."}, {"kind": "F6", "id": "ext0000000121321", "input": "지휘자는 고고한 예술가의 자리에 머물지 않구 청중에게 금전 후원을 적극 권유햇다.", "output": "지휘자는 고고한 예술가의 자리에 머물지 않고 청중에게 금전 후원을 적극 권유했다."}, {"kind": "F5", "id": "REPORT-news_r-01916-00001", "input": "금융감독원이 지난해 실시한 법인보험대리점(GA) 영업 전반 검사를 통해 GA들의 내부통제 부실과 각종 불건전 영업행위 사실을 확인했다.\n  금감원은 이에 대한 제재에 나서고 올해에도 GA 영업 전반에 대한 검사를 이어나가겠다고 밝혔다.\n  금감원은 지난해 5월~11월 글로벌금융판매, 리더스금융판매, 태왕파트너스 등 3개 GA의 영업 전반을 살펴보는 검사를 실시한 결과, 이들 GA에서 업무 전반의 내부통제체계 부실, 조직적 대규모 모집질서 위반행위, 불공정행위 등 사실을 확인했다고 22일 밝혔다.\n  GA는 보험회사와 계약을 맺고 보험 판매를 전문으로 하는 대리점을 말한다.\n  특정회사의 상품이 아닌 모든 생명·손해보험사의 보험상품을 판매할 수 있기 때문에 보험 판매 시장에선 보험회사보다 더 막강한 힘을 행사하기도 한다.\n  금감원 조사 결과 일부 GA들은 보험계약 매출을 과장해 보험사에 대한 수수료 협상력을 강화하려는 목적에서 '지사형 GA'를 구성해 영업한 것으로 확인됐다.\n  소속 설계사 1만3951명의 글로벌 금융판매는 사실상 35개 GA가 연합한 지사형 GA였으며 소속설계사 8537명의 리더스금융판매는 14개 GA의 연합체였다.\n  지사형 GA는 내부통제체계가 매우 취약한 것으로 드러났다.\n  사실상 껍데기에 불과한 본사는 지사에 대한 실질적 제재 권한이 없이 명목적인 준법감시 업무만을 수행했다.\n  개별지사는 조직·인사·회계 등 모든 업무를 본사 통제 없이 수행하는 등 독립적인 경영체계로 운영됐다.\n  지사별 수수료 체계도 서로 달랐고, 수수료 편취 사고도 발생해온 것으로 확인됐다.\n  GA의 모집질서 위반 행위도 조직적이고 대규모로 이뤄졌다.\n  GA 임원은 수십억원 규모의 허위계약을 작성해 매출을 과대 계상하고 편취한 모집수수료를 자기 마음대로 사용한 것으로 드러났다.\n  GA 업계에서는 보험사가 GA에 지급하는 모집수수료와 보험상품의 해약 환급금을 합산한 금액이 의무 납입 보험료(통상 1년)보다 큰 경우, GA나 소속 설계사가 그 차익을 편취하기 위해 허위 계약을 작성하는 일이 성행한 것으로 알려졌다.\n  그 외 모집질서 위반 행위도 다수 확인됐다.\n  GA가 고소득 전문직에게 보험료의 50%를 대납해주는 등 특별이익을 제공하거나, 높은 수수료를 수령하기 위해 타인 명의로 보험 계약을 모집하고 기존계약을 부당 소멸시키는 등 경우다.\n  GA가 보험계약을 다수로 유치하기 위해 설계사 자격이 없는 사람이나 다른 GA 소속 설계사에게 보험모집을 위탁하고 부당한 수수료를 지급한 경우도 있었다.", "output": "금감원은 지난해 5월~11월 글로벌금융판매, 리더스금융판매, 태왕파트너스 등 3개 GA의 영업 전반을 살펴보는 검사를 실시한 결과, 이들 GA에서 업무 전반의 내부통제체계 부실, 조직적 대규모 모집질서 위반행위, 불공정행위 등 사실을 확인했다고 22일 밝혔다. 금감원은 이에 대한 제재에 나서고 올해에도 GA 영업 전반에 대한 검사를 이어나가겠다고 밝혔다."}, {"kind": "F6", "id": "ext0000000103935", "input": "근데도한국당은말로는 민생을 챙기겠다면서 국회 문을걸어 잠근 채 장외에서 정부비판만하고잇다.", "output": "그런데도 한국당은 말로는 민생을 챙기겠다면서 국회 문을 걸어 잠근 채 장외에서 정부 비판만 하고 있다."}, {"kind": "F6", "id": "grm2210180117755", "input": "연간계획은 점점 모순이 발견됨", "output": "연간 계획은 점점 모순이 발견됨."}, {"kind": "F5", "id": "REPORT-news_r-05289-00001", "input": "술에 취해 잠든 여성의 하반신 나체를 휴대전화 카메라로 촬영해 당사자에게 전송한 남성 A씨(67)가 2심에서 무죄를 선고받았지만, 대법원에서 이를 유죄취지로 파기환송했다.\n   대법원 1부(주심 권순일 대법관)는 “원심은 합리적인 근거가 없는 가능성만으로 A씨 범죄가 증명되지 않았다고 판단해 잘못 판결했다”며 사건을 의정부지법 형사합의1부로 돌려보냈다.\n  잠든 나체 찍고 며칠 뒤 사진 보낸 남성A씨는 경기도의 한 유흥업소 주인 B씨와 손님으로 알게 된 뒤 친분을 유지했다.\n  2017년 4월 A씨는 “그 간 외상 술값을 갚겠다”며 B씨를 자신의 집으로 데려갔다.\n  이후 A씨는 자신의 휴대전화 카메라로 성기를 삽입한 모습을 밀착해서 찍은 사진 1장과 술에 취해 잠든 B씨의 하반신 나체 사진 1장을 찍었다.\n   5일 뒤 A씨는 B씨와 카카오톡 대화를 나누다 B씨에게 사진 2장을 보낸다.\n  B씨는 “그걸 왜 찍어”라고 답하며 이런 사진이 찍힌 것에 황당해했고, A씨를 비난했다.\n  A씨는 “동의하지 않았느냐”는 취지로 답했다.\n  A씨는 결국 성폭력 처벌 특례법(카메라 등 이용촬영) 위반 혐의로 재판에 넘겨졌다.\n  “동의했다”vs“전혀 몰랐다”엇갈린 진술재판의 쟁점은 ‘사진 촬영을 피해자가 알았는지’로 모여졌다.\n  A씨는 일관되게“피해자도 알고 있었다”고 주장했지만 B씨는 일관되게“전혀 몰랐다”고 맞섰기 때문이다.\n  카메라 등 이용촬영죄는 ‘성적 욕망 또는 수치심을 유발할 수 있는 피해자의 신체’를 ‘그 의사에 반하여 촬영’한 경우 이를 처벌한다.\n  1심은 “성관계 자체에 동의한 것과 이런 사진을 찍는 것에 대한 동의는 별개의 문제”라고 분명히 했다.\n  그러면서 ▶사진 중 한장은 피해자가 잠들어 있어 촬영에 동의할 수 있는 상태가 아닌 점 ▶사진을 처음 받은 피해자가 “그걸 왜 찍어”라고 답한 점 ▶상당히 술에 취한 피해자가 분명한 의식을 갖고 촬영에 동의하기도 어려웠을 것으로 보이는 점 등을 근거로 B씨가 각 사진 촬영에 동의했다고 인정하기 어렵다고 판결했다.\n  A씨는 징역 6월에 집행유예 2년을 받았다.\n  2심, \"술 취한 피해자, 동의하고 기억 못 할 수도\"그런데 2심에서 판결은 정반대로 뒤집혔다.\n  의정부지법 형사합의1부(재판장 오원찬)는 A씨의 범죄가 \"합리적 의심 없이 증명되지 않는다\"며 무죄를 선고했다.\n  B씨가 잠든 채 사진에 찍혔고, 사진을 받고 보인 반응을 볼 때 \"A씨가 몰래 찍은 사진이 아닌가 의심이 든다\"면서도 이를 압도할 다른 '합리적인 의심'이 있다는 이유다.", "output": "술에 취해 잠든 여성의 하반신 나체를 휴대전화 카메라로 촬영해 당사자에게 전송한 남성 A씨(67)가 2심에서 무죄를 선고받았지만, 대법원에서 이를 유죄취지로 파기환송했다. 대법원 1부(주심 권순일 대법관)는 “원심은 합리적인 근거가 없는 가능성만으로 A씨 범죄가 증명되지 않았다고 판단해 잘못 판결했다”며 사건을 의정부지법 형사합의1부로 돌려보냈다."}, {"kind": "F6", "id": "ext0000000086469", "input": "또 순서상으로시각피질이나중이다.", "output": "또 순서상으로 시각피질이 나중이다."}, {"kind": "F5", "id": "REPORT-news_r-03504-00001", "input": "서울 노량진의 한 구석진 골목 피자집도 잔칫집 같았다.\n  영화 '기생충' 속 기택(송강호 분)네가 동익(이선균)네 가정부를 쫓아내기 위한 작당 모의를 하던 배경으로 등장한 곳이다.\n  10일 오후 기자가 도착했을 때 테이블은 모두 동네 주민 9명으로 가득 차 있었고 일본 방송사 NHK 기자가 스탠딩 촬영 중이었다.\n  이 집 단골이라는 주민들은 피자가 나오자 \"여기 피자가 제일 맛있어\"라고 한 마디씩 큰 소리로 말했다.\n  피자 가게 주인 엄항기(66)씨는 봉준호 감독이 아카데미에서 전해온 낭보에 \"이렇게까지 잘 될 줄은 몰랐다\"며 축하 인사를 전했다.\n  그는 \"봉준호 감독님을 처음 봤을 때 청바지에 티셔츠 하나만 걸치고 가게를 둘러보고 있었다\"며 \"너무 수더분해서 이렇게 대단한 분인지 처음엔 몰랐다.\n  촬영할 때 보니 '배운 분'이라 그런지 큰 소리 한 번 안 내고 점잖은 신사였다\"고 떠올렸다.\n  서울 전역서 피자집 물색…봉준호 한번에 \"오케이\"  엄 사장 부부는 2002년 이곳 노량진에 프랜차이즈가 아닌 개인 브랜드의 피자집을 열었다.\n  이전에 전 빵집을 운영했지만 프랜차이즈 가게에 밀렸다고 한다.\n  반죽 만큼은 자신 있었던 부부는 직접 반죽하고 굽는 컨셉의 피자집을 열었다.\n  하지만 현실은 녹록지 않았다.\n  엄 사장은 \"장사도 안되고 힘들 때 영화 관계자가 찾아왔다.\n  처음엔 남편 반대가 심했는데, 촬영 장소 대여료도 나오고 무엇보다 딸 내외가 봉 감독의 팬이라 적극 찬성을 해 촬영이 성사됐다\"고 전했다.\n  남편 강양희(72) 사장은 '왜 그렇게 반대하셨냐'는 질문에 \"조용한 동네에 민폐 끼치기 싫어서\"라고 답했다.\n  한국에서 유학 중이던 노르웨이인 사위가 특히 봉 감독의 영화는 다 챙겨본 열성 팬이었다고 한다.\n  딸 내외의 지지에 힘입어 촬영 장소를 빌린 봉 감독은 엄 사장 딸과 사위의 이름을 적고 사인을 남기기도 했다.\n  영화 제작사 섭외 관계자에 따르면 '기생충' 섭외 팀은 피자 가게를 섭외하기 전 서울 전역에서 피자집을 물색했다.\n  프랜차이즈는 제외했다.\n  노량진에서 찾은 엄씨의 가게는 영화 특유의 느낌을 살리기에 최적의 장소였다.\n  내부 공간이 호프집처럼 분할돼 있어 동선을 살리기에도 적합했다.\n  봉 감독은 이곳을 방문하자마자 \"오케이\"를 외쳤다.\n  봉 감독, 피자집 손뜨개 수세미도 활용 피자집은 영화 구석구석에 기여했다.\n  피자 박스 접기 아르바이트 장면을 찍기 전 기택네가 생계를 위해 접던 피자 박스도 여기 전시돼 있다.", "output": "반죽 만큼은 자신 있었던 부부는 직접 반죽하고 굽는 컨셉의 피자집을 열었다. 엄 사장은 \"장사도 안되고 힘들 때 영화 관계자가 찾아왔다. 처음엔 남편 반대가 심했는데, 촬영 장소 대여료도 나오고 무엇보다 딸 내외가 봉 감독의 팬이라 적극 찬성을 해 촬영이 성사됐다\"고 전했다. 남편 강양희(72) 사장은 '왜 그렇게 반대하셨냐'는 질문에 \"조용한 동네에 민폐 끼치기 싫어서\"라고 답했다."}, {"kind": "F5", "id": "REPORT-news_r-05319-00002", "input": "하지만 신종 감염병에 대한 일반적인 수준의 불안감과 약간의 스트레스는 정상이다.\n  홍 교수는 “스트레스가 자연스러운 현상이라는 점을 받아들이면서 다른 사람과 감정을 공유하면 나만 이렇게 불안하거나 힘든 게 아니라는 걸 알고 마음이 편안해지는 부분이 있다”고 말했다.\n  다만 부정확한 소문을 전하거나 최악의 상황을 상상하는 건 도움이 안 된다.\n  　셋째, 감정 조절이 지나치게 힘들면 전문가에게 도움을 청한다.\n  일시적인 불안과 스트레스는 우울증이나 불안 장애는 아니다.\n  하지만 이런 감정이 장기화하면 문제될 수 있다.\n  홍 교수는 “잠을 잘 자지 못하고 입맛이 떨어지며 가슴이 두근거리는 등 신체 증상이 나타나고 일상생활에 방해가 될 정도로 감정 조절이 힘들면 전문가의 진료를 받아봐야 한다”며 “지금은 병원에 오는 것 자체를 꺼려 이런 문제로 진료받는 환자는 없지만 기존에 불안증·우울증으로 병원에 다니던 환자 중에는 증상이 악화한 경우가 꽤 있다”고 말했다.\n   자녀가 두려움 느끼지 않게 관심을 넷째, 어린이와 청소년에게 관심을 기울여야 한다.\n  인터넷상 정보에 민감한 아이들은 과도한 불안, 두려움이나 스트레스를 경험할 수 있다.\n  아이들은 감염병에 대해 정확하게 이해하지 못하기 때문에 아이들 수준에 맞춰 침착하게 설명해 주는 것이 좋다.\n  최근 감염병에 대해 자녀가 어떻게 알고 있는지 묻고, 자녀가 걱정을 많이 한다면 왜 그런지 대화로 풀어보는 게 도움된다.\n  아이의 질문에 부모가 정확한 답을 모르면 당황해 얼버무리거나 대답을 피할 게 아니라 자녀에게 믿을 만한 정보의 출처를 알려주고 함께 정보를 찾아본다.\n  　마지막으로 격리된 환자·가족에게도 격려가 필요하다.\n  지나친 불안과 공포로 적대감을 조장하는 건 공동체의 면역력을 해친다.\n  격리는 질병의 확산을 막기 위해 불가피한 조치로 격리 대상자는 격리를 준수해야 할 책임이 있다.\n  하지만 격리 당사자와 가족에게는 스트레스가 크다.\n  자신의 질병 경과에 대한 현실적인 불안, 자신으로 인해 격리된 가족이나 지인에 대한 미안함, 격리에 따른 고립감 등 다양한 원인으로 정신적 어려움을 겪는다.\n  　격리된 상황에서는 스마트폰 등 IT기기를 이용해 가족·친구들과 영상 통화를 하면서 고립감을 줄이고 정확한 정보를 확인해 불안감을 다독이는 게 좋다.\n  홍 교수는 “감염병은 공동체 의식을 갖고 해결해야 하는 부분이라서 가해자·피해자로 나눌 수 있는 간단한 문제가 아니다”며 “갈등 구도를 만드는 건 현 상황에서는 별 도움이 안 된다”고 말했다.", "output": "셋째, 감정 조절이 지나치게 힘들면 전문가에게 도움을 청한다. 일시적인 불안과 스트레스는 우울증이나 불안 장애는 아니다. 하지만 이런 감정이 장기화하면 문제될 수 있다. 홍 교수는 “잠을 잘 자지 못하고 입맛이 떨어지며 가슴이 두근거리는 등 신체 증상이 나타나고 일상생활에 방해가 될 정도로 감정 조절이 힘들면 전문가의 진료를 받아봐야 한다”며 “지금은 병원에 오는 것 자체를 꺼려 이런 문제로 진료받는 환자는 없지만 기존에 불안증·우울증으로 병원에 다니던 환자 중에는 증상이 악화한 경우가 꽤 있다”고 말했다."}, {"kind": "F6", "id": "ext0000000109490", "input": "법안 취지에 여야 모두 동의한만큼, 상식선에서 법안을 반드시 통과시켜야한다.", "output": "법안 취지에 여야 모두 동의한 만큼, 상식선에서 법안을 반드시 통과시켜야 한다."}, {"kind": "F5", "id": "REPORT-news_r-00604-00001", "input": "서울 서북권 최대 전통시장인 마포농수산물시장의 임대 계약을 놓고 마포구와 시장 상인들이 갈등을 빚고 있다.\n  시장을 관리하는 마포구 공기업인 마포구시설관리공단이 계약 갱신이 한 달도 안 남은 지난달 초 상인들에게 임대료 인상과 계약 기간 1년 단축을 통보하면서다.\n  상인들은 “개장(1998년) 이래 계약 기간은 늘 2년이었고, 임대료 인상분도 협의를 통해 정해왔다”고 주장하며 집단 반발에 나섰다.\n  상인들의 반발은 지난해 12월 초 공단이 보낸 통지문 한 통에서 비롯됐다.\n  등기우편으로 온 ‘2020년 마포농산물시장 임대차갱신 안내’에는 ‘인상률: 현 월 임대료의 5%’, ‘임대차기간: 1년간’이라고 쓰여 있었다.\n  계약 기간은 2020년 1월 1일부터였다.\n  인상 이유는 시설관리ㆍ인건비 상승 및 적자 예상 등으로 적혀있었다.\n    이에 상인들은 통지를 받은 후 ‘계약 불가’를 원칙으로 삼고, 구청ㆍ공단ㆍ서울시청을 모두 찾아 항의했다.\n  하지만 돌아온 것은 ‘임대차해지 및 명도 통보’였다.\n  통보의 주요 내용은 \"계약을 2019년 12월 31일 오후 5시까지 완료하길 바라며, 그렇지 않을 경우 계약이 자동해지된다\"였다.\n  이어 “(계약 해지시) 2020년 1월 10일까지 매장을 원상 복구하여 공단에 반환하라”며 “미이행시엔 불법 점유로 법적 조치 진행하겠다”고 했다.\n   결국 상인들은 시장상인번영회에 위임장을 일괄 제출하고 집단행동에 나섰다.\n  8일 오후 상인 90여 명은 서울시청 앞을 찾아 ‘관리규정 2년 원칙! 1년이 웬 말이냐!’ 등 적힌 피켓을 들고 “마포구청장 옷 벗어라” “시설관리공단 이사장 옷 벗어라” 구호를 외쳤다.\n  개장 때부터 22년째 대파 상점을 운영한다는 정양호(53)씨는 “이런 독단적 운영은 처음 본다.\n  계약 기간을 1년으로 줄여 앞으론 매해 5%씩 상승하겠단 얘기가 아닌가”라며 “자기네들 적자 예상을 왜 애먼 시장 상인한테 덮어씌우느냐”고 했다.\n   공단 “서울시가 임대료 올려…적자 운영 예상으로 불가피” 이에 대해 공단 측은 임대료 5% 인상 이유로 서울시에 내는 임대료가 전년 대비 1억4000만원이 오른 점을 강조했다.\n  시장은 마포구가 서울시 시유지를 임대해 사용하고 있는데, 서울시가 임대료를 높였으니 수지를 맞추려면 마포구 역시 임대료 인상이 불가피하다는 입장이다.\n  또 새해 인건비와 시설유지 비용 상승도 임대료를 올리는 요인이 됐다고 한다.\n  계약 기간을 1년으로 단축한 데 대해 공단은 “매해 달라지는 경제여건을 감안했을 땐, 1년으로 줄여 탄력적으로 대응하는 게 맞다고 판단했다”고 했다.", "output": "서울 서북권 최대 전통시장인 마포농수산물시장의 임대 계약을 놓고 마포구와 시장 상인들이 갈등을 빚고 있다. 상인들은 “개장(1998년) 이래 계약 기간은 늘 2년이었고, 임대료 인상분도 협의를 통해 정해왔다”고 주장하며 집단 반발에 나섰다. 시장을 관리하는 마포구 공기업인 마포구시설관리공단이 계약 갱신이 한 달도 안 남은 지난달 초 상인들에게 임대료 인상과 계약 기간 1년 단축을 통보하면서다. 상인들의 반발은 지난해 12월 초 공단이 보낸 통지문 한 통에서 비롯됐다."}, {"kind": "F6", "id": "ota0000000132067", "input": "그 선생님은 걸핏하면 니 아버지 뭐 하시노 하면서 귓볼을 잡아 당겼다", "output": "그 선생님은 걸핏하면 “니 아버지 뭐 하시노?” 하면서 귓불을 잡아당겼다."}, {"kind": "F6", "id": "ota0000000229743", "input": "거주장스러운 허레허식 모두 벗어던지고 간소하게 여식운치른는 것이 좋다고생각해.", "output": "거추장스러운 허례허식 모두 벗어던지고 간소하게 예식을 치르는 것이 좋다고 생각해"}, {"kind": "F6", "id": "aud2207270005868", "input": "정해진 장솨 벗나면 추방당하꼬요?", "output": "정해진 장소 벗어나면 추방당하고요?"}, {"kind": "F5", "id": "REPORT-news_r-01359-00001", "input": "낸시 펠로시 미국 하원의장은 지난 15일, 손꼽아왔던 순간을 맞이했다.\n  도널드 트럼프 대통령에 대한 하원의 탄핵 결의안을 상원에 보내면서다.\n  이 순간을 위해 그는 강렬한 붉은 계열 원피스를 챙겨 입고 기자들 앞에 서서 이렇게 말했다.\n    “오늘 우리는 역사를 썼습니다.\n ”    평소보다 낮지만 강한 목소리였다.\n  그는 또 “미국의 대통령을 결정하는 건 미국의 유권자이지 러시아의 (블라디미르) 푸틴 (대통령)이 아니다”거나 “트럼프는 아주 오랜 기간 사실상 탄핵된 것과 무방한 상태다”라고 날선 비판을 거침없이 쏟아냈다.\n     그의 주도 하에 지난달 18일 하원이 대통령 탄핵안을 가결한 지 약 4주 만에 탄핵 절차가 상원으로 넘어갔다.\n  미국 역사상 세 번째 대통령 탄핵 심판이다.\n  상원 표결은 다음 달 중순으로 예상된다.\n  펠로시의 민주당이 장악한 하원과 달리 상원은 공화당이 53석으로 민주당(47석)에 비해 우위다.\n  탄핵이 가결되려면 3분의 2 이상의 재적 의원인 67명 이상이 찬성해야 한다.\n  민주당은 상원 탄핵 심판 과정에서 결정적 증인의 출현에 기대를 걸고 있으나, 사실상 상원 통과는 어렵다는 게 워싱턴의 기류다.\n      올해 만 80세로 1987년에 정계에 입문한 백전노장 펠로시가 이를 모를 리 없다.\n  오히려 잘 알기에 하원에서 결의안이 통과된 뒤 4주간 트럼프와 공화당의 애간장을 일부러 태웠다는 해석이 지배적이다.\n  트럼프 대통령은 수차례 “이 탄핵 거짓말을 언제 끝낼 거냐”는 트윗을 올리며 초조함을 감추지 못했다.\n  펠로시 의장은 미국 시사 주간지 타임에 “우리가 판돈을 좀 올리긴 했다”고 말했다고 한다.\n  증인 채택 시간도 벌고, 의도적으로 약도 올리는 일석이조였던 셈이다.\n     탄핵이 부결되더라도 펠로시는 승자다.\n  자신의 리더십을 국내외에 보여줬기 때문이다.\n  타임은 20일자로 발행된 최신호에서 펠로시의 리더십을 12개 면에 걸쳐 집중 조명하며 “펠로시는 수십 년 동안의 정계 활동을 해왔지만 최근 12개월 동안 가장 빛났다”고 평가했다.\n       ‘미친 낸시’ 트럼프 비난에도 여유    펠로시는 미국 최초의 여성 하원의장이다.\n  미국 헌법은 대통령 유고 시 대통령직 후계 순위 1위를 부통령, 2위를 하원의장으로 적시했다.\n  펠로시가 트럼프와 마이크 펜스 부통령에 이어 권력 3위에 해당하는 셈.\n  미국의 여성 정치인 중에서 최고위직으로 기록된 전설이다.", "output": "낸시 펠로시 미국 하원의장은 지난 15일, 손꼽아왔던 순간을 맞이했다. 도널드 트럼프 대통령에 대한 하원의 탄핵 결의안을 상원에 보내면서다. 그는 또 “미국의 대통령을 결정하는 건 미국의 유권자이지 러시아의 (블라디미르) 푸틴 (대통령)이 아니다”거나 “트럼프는 아주 오랜 기간 사실상 탄핵된 것과 무방한 상태다”라고 날선 비판을 거침없이 쏟아냈다. 그의 주도 하에 지난달 18일 하원이 대통령 탄핵안을 가결한 지 약 4주 만에 탄핵 절차가 상원으로 넘어갔다."}, {"kind": "F6", "id": "ext0000000121217", "input": "상황을 입체적으로 인식하구 다각적인 대응책을 마련하는 과제를 더 이상 미뤄서는 안 됀다.", "output": "상황을 입체적으로 인식하고 다각적인 대응책을 마련하는 과제를 더 이상 미뤄서는 안 된다."}, {"kind": "F5", "id": "REPORT-news_r-00506-00001", "input": "미국 앤젤로주립대 글로벌 특별 전형  국내 대학의 2020학년도 입시가 마무리되고 있다.\n  정시모집, 그 중에서도 군별(가·나·다 군) 전형기간만 남은 상황이다.\n  하지만 조금만 눈을 돌리면 한 번의 기회가 더 남아 있다.\n  다름 아닌 미국 명문대 입시다.\n  수능 성적이나 내신이 5등급 이내면 글로벌 특별 전형을 통해 합격할 수 있는데다 학비 감면 혜택도 누릴 수 있다.\n  졸업 후엔 현지 취업의 기회도 열려 있다.\n  글로벌 인재를 꿈꾸는 대입 수험생에게 미국 텍사스주에 위치한 앤젤로주립대(Angelo State University)가 문턱을 낮추고 입학 문을 활짝 열었다.\n    # 앤젤로주립대를 졸업한 김영광(2014년 졸업, 회계학 전공)씨는 현재 미국의 한 회계법인에서 세무사로 일하고 있다.\n  미국에서 취업하겠다는 꿈을 이루기 위해 재학 시절부터 교내에서 제공하는 인턴십 프로그램에 꾸준히 참여해 이력을 쌓았고, 회계사 출신 교수들에게 주기적으로 상담받으며 공부했다.\n  또한 앤젤로주립대가 제공하는 ‘텍사스 명문 주립대 시스템’으로 교육 받았다는 점은 취업 시장에서 큰 경쟁력으로 작용했다.\n  김씨는 “교내에서 인턴 모집을 할 때나 취업 준비를 할 때 외국 학생이란 이유로 차별하기보단 오히려 개방적인 자세로 많은 도움을 줬다”고 회상했다.\n  # 앤젤로주립대에서 국제 경영학을 전공한 졸업생 김민지(2017년 졸업)씨는 미국 뉴저지의 한 물류 회사에서 수입 오퍼레이터(Import Operator)로 재직 중이다.\n  학부에서 공부한 내용과 직결되는 직무를 맡아 만족도가 높다.\n  김씨는 한국에서 편입을 준비하다가 저렴한 학비로 미국에서 유학할 수 있다는 앤젤로주립대의 매력에 끌렸고 이곳으로 편입해 총학생회 활동, 동아리 활동, 유엔 청년의회 참석 등 다양한 경험을 쌓았다.\n  김씨는 “부족한 영어 실력을 끌어올리기 위해 학교에서 영어 모임을 만들어 미국 드라마, 영어 영상을 함께 시청하고 대사를 외우며 공부했다”며 “영어로 이력서를 작성할 때는 교수님들이 많이 도와주신 덕분에 인터뷰 제안을 많이 받을 수 있었다”고 말했다.\n   유학생 취업 지원 시스템 우수이처럼 미국에서 유학한 후 현지 취업까지 계획하는 국내 학생들에게 앤젤로주립대가 든든한 지원군이 되고 있다.\n  특히 회계학·컴퓨터공학과 등을 전공하면 현지 취업에 유리하다는 게 학교 측의 설명이다.\n  컴퓨터공학과의 졸업생 취업률은 90% 정도며 IBM·인텔 같은 세계적 IT기업에 취업하는 사례도 많다.", "output": "# 앤젤로주립대를 졸업한 김영광(2014년 졸업, 회계학 전공)씨는 현재 미국의 한 회계법인에서 세무사로 일하고 있다. 미국에서 취업하겠다는 꿈을 이루기 위해 재학 시절부터 교내에서 제공하는 인턴십 프로그램에 꾸준히 참여해 이력을 쌓았고, 회계사 출신 교수들에게 주기적으로 상담받으며 공부했다. 또한 앤젤로주립대가 제공하는 ‘텍사스 명문 주립대 시스템’으로 교육 받았다는 점은 취업 시장에서 큰 경쟁력으로 작용했다."}, {"kind": "F6", "id": "aud2207200003683", "input": "귀러니까 이 사건어 면호사가 특별히 뭘워 안 했러요", "output": "그러니까 이 사건 변호사가 특별히 뭘 안 했어요"}, {"kind": "F5", "id": "REPORT-news_r-03395-00002", "input": "7%였지만, 3분기에는 43.\n 5%로 급등했다.\n  위기 대응 능력도 빛났다.\n  비상경영 체제를 가동해 전 세계 170여국에 있는 고객사의 요청에 24시간 즉각 대응했다.\n  신뢰를 지키기 위해서다.\n  미국 구글의 운영체제(OS)인 안드로이드를 사용할 수 없게 되자 자체 개발한 ‘훙멍’을 선보였고, 주요 부품도 미국산 대신 유럽·일본·중국산 등을 활용했다.\n  이를 진두지휘한 사람이 바로 런 회장이다.\n  당황한 쪽은 미국이었다.\n  믿었던 ‘우군’인 영국은 미국의 반대에도 화웨이 5G장비를 국가 안보와 큰 관련이 없는 영역에 한해 허용하기로 했다.\n  보리스 존슨 영국 총리는 BBC와의 인터뷰에서 “화웨이 장비를 쓰지 말라고 한다면 그 대안을 함께 제시해야 한다”고 밝히기도 했다.\n  캐나다도 비슷한 제한적 도입을 검토 중이다.\n  반(反) 화웨이 동맹인 영어권 5개국 기밀정보 동맹체 ‘파이브 아이즈(Five Eyes)’에 균열이 생긴 것이다.\n  여기에 미국 반도체·소프트웨어 기업들은 미국 정부에 화웨이 제재를 풀어야 한다고 요구하고 있다.\n  이들 입장에서는 화웨이가 자사 제품을 사주는 ‘큰 손’이기 때문이다.\n  미 행정부 내에서도 비슷한 의견이 나오고 있다.\n  월스트리트저널(WSJ)에 따르면 미국 상무부는 최근 화웨이에 대한 제재를 강화하려 했으나, 오히려 미국 기업에 더 큰 타격을 줄 수 있다는 반대 의견이 나오면서 결국 계획을 미뤘다.\n  물론 이는 화웨이의 제품 경쟁력이 뒷받침됐기에 가능한 일이었다.\n  화웨이의 통신 장비 가격은 타사 대비 30~40%쯤 저렴한 데다, 지난해 2400여건의 미국 특허를 취득해 특허를 많이 받은 기업 10위에 오를 정도로 기술력도 탄탄하다.\n  하지만 화웨이의 길이 순탄치만은 않을 것이라는 전망도 많다.\n  현재 5G장비 시장은 LTE장비와 망을 함께 쓰는 비단독모드(NSA)이기 때문에 화웨이에 유리하다.\n  그러나 5G장비만 독립적으로 쓰는 단독 모드(SA)가 본격화하면 새로운 경쟁 환경이 조성된다.\n  중국 내부에서는 화웨이가 퇴직자를 부당하게 고소해 억울한 옥살이를 시킨 사건이 드러나면서 ‘애국 소비’에 찬물을 끼얹었다.\n  또 화웨이가 독자 OS를 기반으로 자체 생태계 구축을 추진하고 있으나, 이미 구글·애플 양대 진영을 주축으로 형성된 IT 생태계를 재편하는 것은 한계가 있다.\n  무엇보다 화웨이에 대한 제재를 풀지 않으려는 미 정부의 ‘마이웨이’가 큰 장벽이다.", "output": "반(反) 화웨이 동맹인 영어권 5개국 기밀정보 동맹체 ‘파이브 아이즈(Five Eyes)’에 균열이 생긴 것이다. 여기에 미국 반도체·소프트웨어 기업들은 미국 정부에 화웨이 제재를 풀어야 한다고 요구하고 있다. 캐나다도 비슷한 제한적 도입을 검토 중이다. 믿었던 ‘우군’인 영국은 미국의 반대에도 화웨이 5G장비를 국가 안보와 큰 관련이 없는 영역에 한해 허용하기로 했다. 당황한 쪽은 미국이었다."}, {"kind": "F6", "id": "grm2208260073808", "input": "근데여기서 두가지 의문점이생겼습니다.", "output": "그런데 여기서 두 가지 의문점이 생겼습니다."}, {"kind": "F6", "id": "aud2209300028258", "input": "중의적인지 와닌지 시인만 아늬까 어 의적으로 볼 수 있니의 가능성과 여지 여부만아 판돠할 사 있으면 되는 그런 선치가 나왔는돼 해리다는 뭐니? 용아 뒁사잖아요", "output": "중의적인지 아닌지 시인만 아니까 어 중의적으로 볼 수 있니의 가능성과 여지 여부만 판단할 수 있으면 되는 그런 선지가 나왔는데 내리다는 뭐니? 용언 동사잖아요"}, {"kind": "F6", "id": "aud2210140032402", "input": "제가 솜 이헣게 숨윈 의도 파악를 좀 잘합아니다.", "output": "제가 좀 이렇게 숨은 의도 파악을 좀 잘합니다."}, {"kind": "F6", "id": "ota0000000116225", "input": "변덕이 죽끌듯 하다. 정말 성격 안좋은 사람이야", "output": "변덕이 죽 끓듯 하다. 정말 성격 안 좋은 사람이야."}, {"kind": "F5", "id": "REPORT-news_r-02843-00001", "input": "\"반드시 낫게 하겠습니다.\n  첫 증상 7일째인 지난달 29일부터 폐렴 증세가 경미하게 동반됐으나 어제(2일)부터 매우 안정적인 상태로 돌아왔습니다.\n \" 신종 코로나바이러스 감염증(우한 폐렴) 3번째 확진 환자(3번 환자)가 입원치료를 받고 있는 명지병원의 이왕준 이사장(외과 전문의)은 3일 중앙일보와 통화에서 이같이 말했다.\n  경기도 고양시에 있는 명지병원에서 입원 치료를 받고 있는 3번 환자 A씨(54)를 두고 한 말이다.\n  A씨는 지난달 25일 의심환자 상태로 음압병실(외부와의 기압 차이로 병원체가 빠져나가지 못하게 만든 특수병실)에 들어와 다음날 확진 판정을 받았다.\n  이 이사장은 \"A씨가 가장 민감한 시기를 잘 통과한 듯하다\"며 A씨의 퇴원 가능성을 크게 봤다.\n  이 이사장에 따르면 신종 코로나는 증세가 나타난 후 7~12일 사이가 가장 고비로 꼽힌다.\n   이 이사장은 또 \"지난 주말부터 정신적 안정을 위해 A씨가 인터넷 댓글을 못 보게 하고 있다\"고 말했다.\n  A씨가 서울 강남, 고양 일산 등을 사흘간(지난달 22~25일) 이동한 사실이 확인되면서 인터넷에 악성 댓글이 많아진 데 따른 조치다.\n  명지병원은 A씨가 입원했다는 소식이 알려진 뒤 일반환자의 입원 외래가 평상시보다 60% 가까이 떨어졌다고 한다.\n  명지병원 일부 직원들은 그들을 꺼리는 듯한 주변 시선에 힘들어하고 있는 것으로 알려졌다.\n  이에 대해 이 이사장은 \"주변에서 꺼리고 두려워하는 걸 알고 있다\"며 \"일부가 전부는 아니라고 본다.\n  병원을 와주시는 나머지 분들에게 감사하다\"고 말했다.\n    명지병원 가족들에게 용기를 주는 사람들도 있다.\n  고양시청 관계자는 \"최근 명지병원에 '캔커피 200개를 전달해달라'는 요청이 있었다\"고 말했다.\n  이 이사장 역시 최근 자신의 페이스북을 통해 \"최근 유음료(요구르트 등)를 배달하는 아주머니가 응원 손편지 등을 전해달라 하고 익명 기부자들이 시청과 구청을 통해 직원들에게 생수와 캔커피를 보내오고 있다\"고 전했다.\n  이 이사장이 공개한 사진엔 \"명지병원 선생님들 힘내세요.\n  화이팅\"이라고 적힌 편지가 요구르트와 함께 놓여있었다.\n  명지병원은 A씨 완치에 대해 강한 자신감을 보였다.\n  명지병원 관계자는 \"의료진을 믿어주면 메르스에 이어 신종 코로나바이러스도 반드시 이겨낼 것\"이라고 말했다.\n  명지병원은 2015년 메르스(MERS·중동호흡기증후군) 사태 때도 2차 감염 없이 환자 5명을 완치한 적 있다.", "output": "경기도 고양시에 있는 명지병원에서 입원 치료를 받고 있는 3번 환자 A씨(54)를 두고 한 말이다. 명지병원은 A씨 완치에 대해 강한 자신감을 보였다. 명지병원 관계자는 \"의료진을 믿어주면 메르스에 이어 신종 코로나바이러스도 반드시 이겨낼 것\"이라고 말했다. 명지병원은 2015년 메르스(MERS·중동호흡기증후군) 사태 때도 2차 감염 없이 환자 5명을 완치한 적 있다."}, {"kind": "F5", "id": "REPORT-news_r-01269-00002", "input": "상품 선정 과정에서 내부 경고가 수차례 있었지만 무시했다.\n  2019년 3월 6일 열린 공정가액평가실무협의회에선 DLF의 기초자산인 독일 국채 10년물 금리가 -0.\n 7% 이하로 하락하면 100% 원금손실이 발생한다는 점이 지적됐다.\n  3월 11일 열린 상품선정위원회에서는 금융소비자보호센터 직원인 일부 위원이 불완전판매 개연성이 매우 높다는 점을 지적하기도 했다.\n  하지만 본점 WM사업부는 판매직원을 위한 동영상 강의에서 '국채금리가 마이너스까지 가는 것은 굉장히 비정상적인 현상'이고 '가능성은 현저히 낮다'는 내용으로 교육을 했다.\n   '금리반등 어렵다' 내부 전망에도…KPI '줄 세우기' 계열 연구소의 전망도 무시했다.\n  2018년 7월 KEB하나은행의 계열사인 하나금융경영연구소는 '2018년 내 (미국의) 장단기 금리 역전 가능성을 배제할 수 없어(중략) 글로벌 채권시장의 대내외 금리 반등도 쉽지 않을 것'이란 내용의 보고서를 작성했다.\n  그러나 KEB하나은행은 보고서 발표 이후 DLF 상품을 145건 신규 출시했다.\n  상품 구조나 시장 상황에 따른 리스크 등 교육자료도 영업점에 거의 제공하지 않았다.\n  오히려 2019년 들어 사모 DLF의 판매 목표를 전년 대비 53.\n 8% 증가한 1조원으로 상향 조정했다.\n  직원 성과지표(KPI) 주요항목 중 펀드 신탁 수수료 수익 등의 배점도 기존 220점에서 280점으로 대폭 상향 조정했다.\n   우리금융경영연구소에서도 3월 27일 독일금리 하락을 예측하는 보고서가 발표됐다.\n  하지만 우리은행 역시 PB 대상 교육자료에 '독일 실물 경제 회복으로 상반기를 저점으로 연말까지 (국채금리가) 반등할 것'이라는 내용을 기재했다.\n    사태 터지자 내부 실태조사…금감원 조사 땐 '폐기'  2019년 3월 미국 기준금리가 동결되고 향후 금리 인하가 예상되자 KEB하나은행은 DLF 판매를 중단했다.\n  이어 대규모 피해가 예상되자 1829명 가입 고객을 상대로 2차례 실태조사를 해 상당수의 불완전판매를 확인하고 손해배상 규모를 검토하기도 했다.\n  하지만 2019년 8월 금감원의 현장조사가 예정되자 KEB하나은행은 해당 검토 문건을 삭제 및 폐기했다.\n  또 자문 법무법인을 통해 'PB 불완전판매 Q&A'라는 제목의 문건을 작성해 PB들이 불완전판매를 부인하는 내용으로 답변하도록 유도하기도 했다.\n   금감원은 이날 홈페이지에 손해배상비율 세부 산정기준을 공개했다.", "output": "이어 대규모 피해가 예상되자 1829명 가입 고객을 상대로 2차례 실태조사를 해 상당수의 불완전판매를 확인하고 손해배상 규모를 검토하기도 했다. 하지만 2019년 8월 금감원의 현장조사가 예정되자 KEB하나은행은 해당 검토 문건을 삭제 및 폐기했다. 2019년 3월 미국 기준금리가 동결되고 향후 금리 인하가 예상되자 KEB하나은행은 DLF 판매를 중단했다."}, {"kind": "F6", "id": "ext0000000045692", "input": "어느 모임에서거절할수없는 술자리가 마련되었고 새벽까지 그들과 함께했다", "output": "어느 모임에서 거절할 수 없는 술자리가 마련되었고 새벽까지 그들과 함께했다."}, {"kind": "F6", "id": "grm2209190119444", "input": "붉은머리 실제로 보고싶은디", "output": "붉은 머리 실제로 보고 싶은데."}, {"kind": "F6", "id": "ext0000000055106", "input": "관광과생활 모두를가능케 하는 공존의지혜를고민해야할때가 왔다", "output": "관광과 생활 모두를 가능케 하는 공존의 지혜를 고민해야 할 때가 왔다."}, {"kind": "F6", "id": "ota0000000046648", "input": "투운데에서 자면 입 돌아가요 알른 안으로 들어오세요", "output": "추운 데에서 자면 입 돌아가요. 얼른 안으로 들어오세요."}, {"kind": "F5", "id": "REPORT-news_r-04081-00001", "input": "코로나19 국면에서 주목받은 사람 중 한 명은 경희대 학생 이동훈(27)씨다.\n  그는 코로나 확진자들의 동선을 한눈에 파악할 수 있는 ‘코로나 맵’을 만들었다.\n  '코로나 맵'은 누적조회 수 1400만회를 기록했다.\n   이씨는 17일 청와대 업무보고 자리에 특별 초대됐다.\n  청와대 강민석 대변인에 따르면 문재인 대통령은 이날 기획재정부ㆍ산업통상자원부ㆍ중소벤처기업부ㆍ금융위원회로부터 업무보고를 받는 자리에서 “이동훈 군을 특별히 칭찬해야겠다.\n  정부가 좀 배워야겠다는 생각을 했다”고 추켜세웠다고 한다.\n  문 대통령은 4개 부처 장관들의 보고와 이어진 민간분야에서의 성공사례 및 현장 경험 발표를 마친 뒤 예정에 없던 발언 기회를 요청해가며 이씨를 콕 집어 언급했다.\n  문 대통령은 “질병관리본부(질본)를 중심으로 정부는 정보를 투명하게 공개했지만, 공포ㆍ불안은 확산됐다”며 “그런데 이동훈 학생이 (질본의) 브리핑 정보를 맵으로 딱 보여주면서, 확진자가 움직이는 동선을 눈으로 볼 수 있게 되고, 우리 상황이 어느 정도인지, 얼마나 긴장해야 하는지, 지역은 어디인지, 이런 것을 쉽게 알 수 있게 됐다”고 말했다.\n  그러면서 “질본의 정보들을 정부 홍보 부서 어디선가 초기부터 활용했다면 어땠을까.\n  정부의 홍보방식에 ‘발상의 전환’을 해야 한다.\n  특별히 당부한다”고 덧붙였다.\n  앞서 이씨는 사례발표에서 “SNS, 미디어에는 공포를 조장하고 선동하는 정보가 많았다.\n  질본이 데이터를 충분히 제공한 상태라 ‘이런 정보라면 불안감을 해소하겠다’ 싶었다.\n  국가적 재난 상황은 다음에도 있을 수 있으니 데이터의 공유, 데이터 소통에 관심을 가져야 한다“고 말했다.\n   문 대통령은 비교적 길게 설명했지만, 이 장면을 요약하면 ‘불안감을 확 줄인 게 대학생 한 명이다.\n  정부는 왜 그 일을 못 했느냐’는 것이다.\n  여기엔 코로나19 못잖게 그로 인한 경기 하향을 우려하는 문 대통령의 시각이 묻어 있다.\n  과도한 불안감 때문에 일상의 경제 활동이 지나치게 위축돼있다는 것이다.\n  언론을 향한 지적도 나왔다.\n  문 대통령은 업무보고 모두 발언에서 “불황이 장기화되면 우리 경제뿐 아니라 민생에도 큰 타격이 될 것”이라며 “일부 언론을 통해 지나치게 공포나 불안이 부풀려지면서 경제 심리나 소비 심리가 극도로 위축된 아쉬움이 남는다\"고 말했다.\n  이어 \"여러 허위 정보를 막아내는 최상의 방법은 정보를 투명하게 하는 것\"이라고 강조했다.", "output": "코로나19 국면에서 주목받은 사람 중 한 명은 경희대 학생 이동훈(27)씨다. 그는 코로나 확진자들의 동선을 한눈에 파악할 수 있는 ‘코로나 맵’을 만들었다. 이씨는 17일 청와대 업무보고 자리에 특별 초대됐다. 문 대통령은 “질병관리본부(질본)를 중심으로 정부는 정보를 투명하게 공개했지만, 공포ㆍ불안은 확산됐다”며 “그런데 이동훈 학생이 (질본의) 브리핑 정보를 맵으로 딱 보여주면서, 확진자가 움직이는 동선을 눈으로 볼 수 있게 되고, 우리 상황이 어느 정도인지, 얼마나 긴장해야 하는지, 지역은 어디인지, 이런 것을 쉽게 알 수 있게 됐다”고 말했다."}, {"kind": "F5", "id": "REPORT-news_r-02226-00001", "input": "2012년 대선을 앞두고 당시 경제개혁연대 소장이었던 김상조 교수를 인터뷰한 적이 있다.\n  그 시절엔 경제민주화 열풍이 거셌고 여야가 경쟁적으로 센 공약을 쏟아내고 있었다.\n  인터뷰 때 귀에 꽂히듯 다가왔던 그의 말이 몇 대목 있었다.\n  방법론적 최소원칙, 거대담론에 대한 비판, 법치주의 같은 거였다.\n  방법론적 최소원칙이란 모든 이들이 인정하는 부분부터 천천히 개혁하자는 의미였다.\n  경제민주화한다고 너도나도 한마디씩 거들다 보니 “가장 과격한 재벌 개혁론자였단 내가 이젠 중간에 불과하다”는 말을 했고, 그게 신문에 제목으로 뽑혔다.\n  거대담론만으로는 세상을 변화시킬 수 없으며, 구체적인 정책을 만들고 집행하는 능력이 한국 사회에 부족하다는 지적은 예나 지금이나 ‘뼈를 때리는’ 지적이다.\n  법치주의는 흔히 보수의 슬로건인데, 왜 진보의 아이콘인 그가 거론했을까.\n  “사회가 정한 게임의 법칙을 지키는 자에게는 보상을 주고 기회주의적 행동을 하는 자에게는 제재한다는 원칙을 세우고 이를 엄정하게 집행해야 한다.\n  이런 원칙 없이는 어떠한 개혁·진보도 실패할 것이다.\n ” 지난 16일, 청와대 정책실장에 취임한 지 7개월 다 돼가는 그를 다시 인터뷰했다.\n  특유의 달변은 여전했지만 과거 인터뷰처럼 ‘꽂히는’ 표현은 없었다.\n  아무래도 시민단체 대표 시절처럼 자유롭게 개인 생각을 밝히기는 쉽지 않았을 것이다.\n  정부 정책을 옹호하고 배경을 설명하는 가지런하고 정선된 말들이 이어졌다.\n  어지간히 대화가 오간 뒤에 물었다.\n  그가 강조했던 방법론적 최소원칙이 과연 문 정부에서 지켜지고 있다고 믿는지 궁금했다.\n  최저임금의 급격한 인상과 비정규직 제로 정책, 근로시간 단축 등은 경제정책이 지켜야 할 합리적인 선을 넘어섰다고 평소 생각했다.\n  김 실장은 경제는 정치와 다르다고 했다.\n  정치는 표를 좇더라도 경제는 국민의 다수가 공감하는 ‘가운데 길’로 가야 한다고 답했다.\n  인터뷰에서 가장 인상적인 대목이었다.\n  지면에선 빠졌지만 이런 말도 했다는 걸 기록으로 남긴다.\n  “어느 한 쪽만의 강한 지지와 다른 쪽의 강한 비난을 받는 정책보다는 차라리 양쪽 모두로부터 비판받는 ‘가운데 길’로 가는 게 성공적인 경제정책의 길이라고 그때도 생각했고 지금도 그렇게 생각한다.\n ” ‘가운데 길’로 간다는 데 왜 노조 편향이라는 말이 나오는지 묻자 “문재인 정부는 노동 존중 사회를 표방한 정부”라면서 이렇게 답했다.", "output": "거대담론만으로는 세상을 변화시킬 수 없으며, 구체적인 정책을 만들고 집행하는 능력이 한국 사회에 부족하다는 지적은 예나 지금이나 ‘뼈를 때리는’ 지적이다. 2012년 대선을 앞두고 당시 경제개혁연대 소장이었던 김상조 교수를 인터뷰한 적이 있다. 그 시절엔 경제민주화 열풍이 거셌고 여야가 경쟁적으로 센 공약을 쏟아내고 있었다. 경제민주화한다고 너도나도 한마디씩 거들다 보니 “가장 과격한 재벌 개혁론자였단 내가 이젠 중간에 불과하다”는 말을 했고, 그게 신문에 제목으로 뽑혔다."}, {"kind": "F6", "id": "ext0000000086963", "input": "나누어서 읽지않았기때문인거까요?", "output": "나누어서 읽지 않았기 때문인 걸까요?"}, {"kind": "F5", "id": "REPORT-news_r-02957-00002", "input": "‘소셜 50’은 팬들이 가장 애착을 보이는 차트이기도 하다.\n  방탄소년단의 트위터 팔로워 수는 약 2400만명으로 1억 명을 넘긴 저스틴 비버의 4분의 1 수준이지만 언급 빈도와 조회 수 등은 팬들의 노력 여하에 달려있기 때문.\n  3년 연속 ‘톱 소셜 아티스트’를 수상한 방탄소년단에 앞서 6년 내리 수상한 저스틴 비버가 이달 5년 만에 5집 ‘체인지(Changes)’ 발매한다는 소식이 전해지자 팬덤 사이에 긴장감이 맴돌기도 했다.\n  『BTS 예술혁명』을 쓴 이지영 세종대 초빙교수는 “소셜 차트는 긍정적인 것뿐만 아니라 부정적인 것도 집계가 되기 때문에 팬들은 1위를 유지하기 위해 항상 새로운 뉴스에 촉각을 곤두세우고 있다.\n  놀이이자 노동의 결과물”이라고 밝혔다.\n   넥스트 빅 사운드에 따르면 이번 주 차트에서 방탄소년단을 언급한 트위터 멘션은 1710만건으로 지난주 대비 29% 늘었다.\n  지난달 26일 그래미 시상식에서 래퍼 릴 나스 엑스와 ‘올드 타운 로드(Old Town Road)’ 합동 무대를 선보인 데 이어 28일 CBS ‘더 레이트 레이트 쇼 위드 제임스 코든’에 출연해 신곡 ‘블랙 스완(Black Swan)’ 무대를 처음 공개하면서 평소보다 많은 버즈량(언급 횟수)을 이끌어냈다.\n  오는 21일 새 앨범 ‘맵 오브 더 솔: 7(MAP OF THE SOUL: 7)’ 발매를 앞두고 전 세계 5개 도시에서 순차 진행 중인 현대 미술 협업 프로젝트 ‘커넥트, BTS’ 역시 이들에게 새롭게 관심을 갖는데 한몫 한 것으로 보인다.\n    이 같은 성과를 보고 다른 팬덤도 분발하고 있다.\n  지난해 ‘소셜 50’ 연간 차트를 살펴보면 1위 방탄소년단을 비롯해 2위 엑소, 4위 갓세븐, 6위 세븐틴, 7위 NCT 127, 8위 몬스타엑스, 9위 블랙핑크 등 10위권 내 7팀이 K팝 아이돌 그룹이다.\n  투모로우바이투게더(12위)나 스트레이키즈(23위), 에이티즈(30위) 등 신인도 대거 포함돼 있다.\n  전체 50팀 중 차지하는 비중이 40%(20팀)에 달할 정도.\n  웹진 ‘아이돌로지’의 미묘 편집장은 “K팝 팬덤 내 경쟁이 워낙 치열하기 때문에 각종 투표에 임하는 것처럼 버즈량 늘리기에 동참하는 것 같다”며 “특히 아이돌 그룹의 활동 영역이 전 세계로 확대되면서 해외 팬들이 늘어나고 이들이 지리적ㆍ물리적 한계를 극복하기 위해 SNS를 더욱 적극적으로 활용하면서 시너지를 내고 있다”고 분석했다.", "output": "3년 연속 ‘톱 소셜 아티스트’를 수상한 방탄소년단에 앞서 6년 내리 수상한 저스틴 비버가 이달 5년 만에 5집 ‘체인지(Changes)’ 발매한다는 소식이 전해지자 팬덤 사이에 긴장감이 맴돌기도 했다. 『BTS 예술혁명』을 쓴 이지영 세종대 초빙교수는 “소셜 차트는 긍정적인 것뿐만 아니라 부정적인 것도 집계가 되기 때문에 팬들은 1위를 유지하기 위해 항상 새로운 뉴스에 촉각을 곤두세우고 있다. 놀이이자 노동의 결과물”이라고 밝혔다."}, {"kind": "F5", "id": "REPORT-news_r-03133-00001", "input": "중국 우한에서 발생한 신종 코로나바이러스 감염증 16번 환자를 처음 진료했던 광주광역시 광산구 21세기병원이 환자의 확진이 늦어진 데 대해 정부의 초동 대처를 지적하고 나섰다.\n  병원 측 신고로 초기에 환자를 걸러낼 수 있었지만, 중국 입국자 위주의 방역망으로 인해 확진이 늦어지는 바람에 접촉자가 늘어났다는 것이다.\n  최민혁 21세기병원장은 5일 중앙일보와의 통화에서 “지난달 27일 우리 병원 내과의사가 16번 환자를 진료한 뒤 신종 코로나를 의심해 관할 광산구 보건소에 전화했지만 ‘중국에 갔다 오지 않았으니 (검사 대상에) 해당이 안 된다’는 답변을 들었다”고 말했다.\n  보건당국에 따르면 16번 환자는 태국 방콕과 파타야 등을 다녀온 뒤 지난달 19일 귀국했고, 25일 저녁부터 오한과 발열 증세가 나타났다.\n  지난달 27일 21세기병원에서 진료를 받은 뒤 전남대병원을 찾았다.\n  전남대병원에서 폐렴약을 처방받은 뒤에도 호전되지 않자 다시 21세기병원을 찾았다.\n  수술을 받으러 먼저 입원해 있던 딸과 한 병실에서 8일간 머무르다 4일 확진 판정을 받았다.\n  고재민 21세기병원 총무팀장은 “인대 봉합수술을 받기 위해 병원에 왔던 딸과 동행했다가 컨디션이 좋지 않아 내과 진료를 받은 것”이라며 “보건소에선 해당 사항이 없으니 일반 진료를 받으면 된다고 했는데 우리가 신종 코로나 의심 소견서를 써 전남대병원으로 보냈다”고 설명했다.\n  이날 병원 측이 공개한 당시 진료의뢰서를 보면 21세기병원 내과의는 “(16번 환자가) 2016년 폐절제술 후 암이 진단돼 서울대병원이 추적 관찰 중”이라며 “2020년 1월 15일부터 19일까지 태국 여행을 다녀왔다.\n  태국 공항 출국장에서 상태가 안 좋은 사람과 접촉이 의심된다”고 적었다.\n  그러면서 “25일 저녁부터 발열, 몸살, 오한 증상이 발생해 금일(27일) 내원, 변종 바이러스 폐렴이 의심돼 전원한다”고 썼다.\n  상병명에는 ‘변종 코로나바이러스 폐렴의증’이라고 적혀 있다.\n  상병 분류 기호는 J18(폐렴)로 기재됐다.\n  최 병원장은 “애초 16번 환자는 (신종 코로나가) 의심되는 데다 수술한 딸을 간호할 겸 환자 본인도 같은 방에서 치료를 받겠다고 해서 단독방을 쓰게 했다.\n  딸과 엄마를 다른 환자와 철저히 격리했다”고 주장했다.\n  딸은 5일 18번째 환자로 확진받았다.\n    정은경 질병관리본부장은 이날 브리핑에서 “환자가 증상이 있었고, 또 (병원에서) 코로나 검사를 요청한 것도 맞는 사실인 것 같다”며 “현 지침으로 코로나를 의심하는 사례 정의에 들어가지 않다 보니 (보건소 등에서) 기계적으로 답변했다고 보고 있다”고 해명했다.", "output": "중국 우한에서 발생한 신종 코로나바이러스 감염증 16번 환자를 처음 진료했던 광주광역시 광산구 21세기병원이 환자의 확진이 늦어진 데 대해 정부의 초동 대처를 지적하고 나섰다. 병원 측 신고로 초기에 환자를 걸러낼 수 있었지만, 중국 입국자 위주의 방역망으로 인해 확진이 늦어지는 바람에 접촉자가 늘어났다는 것이다. 최민혁 21세기병원장은 5일 중앙일보와의 통화에서 “지난달 27일 우리 병원 내과의사가 16번 환자를 진료한 뒤 신종 코로나를 의심해 관할 광산구 보건소에 전화했지만 ‘중국에 갔다 오지 않았으니 (검사 대상에) 해당이 안 된다’는 답변을 들었다”고 말했다."}, {"kind": "F5", "id": "REPORT-news_r-03321-00001", "input": "일본의 대형 크루즈 ‘다이아몬드 프린세스’내에서 신종 코로나바이러스 감염증 환자가 대규모로 발생한 가운데 국내 항구로 조만간 입항 예정인 국제 크루즈 선박들에 대한 우려가 제기되고 있다.\n    8일 일본 보건당국에 따르면 다이아몬드 프린세스 크루즈 내 감염 의심자들에 대한 검사 결과 신종코로나 확진자가 3명 추가로 확인됐다.\n  전날 41명의 승객이 무더기로 확진 판정을 받은데 이어 또 환자가 늘어난 것이다.\n  이 크루즈 내에서 감염된 사람만 이날까지 64명이다.\n  승객과 승무원 등 3700여명을 태운 이 크루즈는 지난달 20일 일본 요코하마항을 출발해 홍콩과 동남아 지역을 운항했다.\n  이 배에 승선했던 홍콩 국적 남성(80)이 지난달 25일 홍콩에서 내린 뒤 신종 코로나 확진 판정을 받았다.\n  이 승객이 어디에서 감염됐는지는 확인되지 않았다.\n  이 배는 일본의 수도 도쿄 인근인 요코하마항에 봉쇄된 채 정박해 있다.\n  일본 정부는 신종 코로나 최대 잠복기인 14일동안 탑승객 3700여명을 크루즈 내에 머물게 할 계획이다.\n  크루즈 내에서 확진자가 속속 나타면서 감염된 승객이 내릴 경우 지역사회 감염원이 될 가능성이 있어서다.\n    크루즈선 내에는 객실, 식당, 수영장, 사우나, 운동시설, 공연시설 등이 갖춰져있다.\n  승객들은 배 안에서 먹고, 자고, 놀다가 중간 기착지마다 내려 관광을 하는 방식이다.\n  전문가들은 승객들이 식당 등 폐쇄된 실내 공간에 장시간 머물게 되는 구조가 바이러스 전파를 부추겼다고 보고있다.\n  엄중식 가천대길병원 감염내과 교수는 “배에서 확진자가 얼마나 더 나올지 알 수가 없어 걱정된다.\n  크루즈선은 내부가 굉장히 좁다.\n  승객 동선을 고려하면 확진자가 돌아다니지 않은 곳이 없을 것으로 본다.\n  폐쇄된 공간이다 보니 손님들이 다닐 수 있는 곳은 다 돌아다니기 때문에 대규모 감염 위험이 크다”라고 설명했다.\n  과거 이 크루즈가 부산항에 종종 들렀지만, 이번에는 일본 불매 운동 때문에 오지 않은 것이라는 주장도 나왔다.\n  실제로 이 크루즈선은 지난해 4월 부산항을 출발해 일본 요코하마항에 도착했다.\n  6박 7일의 여행 비용은 숙박비ㆍ식비 등을 모두 포함해 130여만원이었다.\n  \"가성비가 좋다\"는 입소문이 돌면서 승객 상당수가 한국인으로 채워졌다.\n  이번 여행상품도 예년같으면 부산항에 머무르며 부산 관광을 원하는 승객들을 내려줬을테지만, 일본 불매 운동으로 국내 수요가 급감하면서 부산을 들르지 않았다는 얘기다.", "output": "이 배는 일본의 수도 도쿄 인근인 요코하마항에 봉쇄된 채 정박해 있다. 일본 정부는 신종 코로나 최대 잠복기인 14일동안 탑승객 3700여명을 크루즈 내에 머물게 할 계획이다. 8일 일본 보건당국에 따르면 다이아몬드 프린세스 크루즈 내 감염 의심자들에 대한 검사 결과 신종코로나 확진자가 3명 추가로 확인됐다. 전날 41명의 승객이 무더기로 확진 판정을 받은데 이어 또 환자가 늘어난 것이다. 이 크루즈 내에서 감염된 사람만 이날까지 64명이다."}, {"kind": "F5", "id": "REPORT-news_r-01871-00001", "input": "2017년 대선을 앞두고 ‘드루킹’ 김동원 씨와 포털 여론 조작을 공모했다는 혐의로 재판을 받는 김경수 경남지사에 대한 선거법 위반 관련 항소심 선고가 또 다시 미뤄졌다.\n  지난해 12월 24일에서 선고가 미뤄진뒤 두 번째다.\n  오는 3월 10일로 변론 재개돼 4월 총선 이전 선고는 어려워졌다.\n  재판부 내부에서 이상 기류가 감지된다는 지적이 나오고 허익범 특검은 반발했다.\n  서울고법 형사2부(재판장 차문호)는 21일 컴퓨터 등 장애 업무방해, 공직선거법 위반 혐의로 기소된 김경수 지사의 14차 공판에서 선고 대신 A4용지 7장 분량의 서류를 들고 변론 재개 이유를 설명했다.\n  특검과 변호인측에 8개의 추가 설명이 필요한 사안을 공지하고 다음 달까지 의견서를 내 달라고 요청했다.\n  이 자리에서 재판부는 잠정적이라는 단서는 달았지만 “2016년 11월 9일 김 지사가 드루킹으로부터 온라인 정보보고를 받고, 킹크랩 시연을 본 사실은 객관적 증거로 증명됐다”고 판단했다.\n  2016년 11월 9일 김 지사가 시연에 참여했다는 점은 주 심리 대상이 아니라고 선을 그었다.\n     추후 심리에서는 김 지사를 드루킹의 공동정범으로 볼 수 있는지 살펴볼 것이라고 밝혔다.\n  재판부가 추가로 설명을 요구한 8가지는 ▶김 지사와 김동원씨가 단순 지지자와 정치인 관계였는지, 선거에서 공통 목표를 이루고자 하는 긴밀한 관계였는지 여부 ▶김 지사가 민주당 경선과 19대 대선에서 문재인 후보를 위해 담당한 역할과 포털 등 온라인 여론형성 관련성 ▶피해를 본 네이버 등 포털사이트의 이용자의 비난 정도 및 이용자수 변화 등이다.\n  재판부는 그동안의 항소심 공판의 쟁점이 ‘2016년 11월 9일 킹크랩 시연을 김 지사가 참관했는지’에 맞춰지는 바람에 이런 사안이 충실히 심리되지 않았다고 밝혔다.\n  김 지사는 1·2심에서 줄곧 “킹크랩 시연을 본 적 없다”고 주장했다.\n  1심 재판부는 김 지사와 드루킹의 공모관계에 대해 “김 지사가 킹크랩 운용을 최소한 묵시적으로 승인 내지 동의했고 뉴스 기사 주소를 전송하는 등의 행위로 댓글 순위 조작 범행에 직접 관여해 일부 분담했다고 봄이 타당하다”고 판결한 바 있다.\n  이에 대해 특검측은 “김 지사가 혐의를 부인하는 사실관계들이 모두 인정이 된 상황에서, 재판부가 김 지사에게만 형법상 교과서적인 법의 잣대로 엄격하게 해석하고 있다”고 반발했다.\n  또 다른 특검 관계자는 “이런 식으로 결정을 미루는 것은 민감한 사건에 책임을 지기 싫다는 것 아니냐”고 말했다.", "output": "지난해 12월 24일에서 선고가 미뤄진뒤 두 번째다. 2017년 대선을 앞두고 ‘드루킹’ 김동원 씨와 포털 여론 조작을 공모했다는 혐의로 재판을 받는 김경수 경남지사에 대한 선거법 위반 관련 항소심 선고가 또 다시 미뤄졌다. 오는 3월 10일로 변론 재개돼 4월 총선 이전 선고는 어려워졌다. 서울고법 형사2부(재판장 차문호)는 21일 컴퓨터 등 장애 업무방해, 공직선거법 위반 혐의로 기소된 김경수 지사의 14차 공판에서 선고 대신 A4용지 7장 분량의 서류를 들고 변론 재개 이유를 설명했다."}, {"kind": "F5", "id": "REPORT-news_r-05362-00001", "input": "미국 국무부가 29일(현지시간) 한국 대구에 대해 여행경보를 최고수준인 금지 권고(4단계)까지 상향하자, 외교부가 미국발 ‘코로나 장벽’을 막기 위해 총력전에 나섰다.\n     1일 외교부에 따르면 강경화 외교부 장관은 이날 오전 스티븐 비건 국무부 부장관과 전화 통화를 갖고 코로나 사태에 대한 한국 정부의 요청을 전달했다.\n  강 장관은 비건 부장관에게 “(한ㆍ미) 양국 간 교류를 불필요하게 위축시킬 수 있는 미 정부의 과도한 조치는 자제해달라’고 강력히 요청”했다고 한다.\n   정통한 한 외교 소식통은 “비건 대표에 전달한 ‘과도한 조치’에는 우리 국민에 대한 입국 제한 문제도 포함된다”고 말했다.\n  강 장관은 카운터파트인 마이크 폼페이오 국무부 장관이 탈레반 평화협정 문제로 출장 중이어서 비건 부장관과 이날 통화했다.\n     이번 통화는 도널드 트럼프 미 대통령이 전날 코로나19와 관련한 추가 기자회견에서 “한국ㆍ이탈리아의 ‘특정 지역’에 대한 여행금지 조치를 단행할 것”이라고 한 직후에 이뤄졌다.\n  트럼프 대통령은 기자회견에서 특정 지역을 언급하진 않았지만, 이후 국무부가 여행 경보 사이트를 통해 ‘여행하지 말 곳(do not travel to)’ 명단에 대구를 명시했다.\n  미국이 한국의 특정 지역에 대해 여행 금지 권고를 내린 건 이번이 처음이다.\n    미 정부는 일찌감치 중국(2월 2일)과 이란(2월 26일)에 대해서 여행금지 권고를 한 데 이어 이들 국가를 방문한 외국인의 입국 금지를 시행하고 있다.\n  이 때문에 한국도 여행금지→입국제한의 수순을 밟는 것이 아니냐는 우려의 목소리가 커지고 있다.\n   한 외교 소식통은 “미 정부는 중국 우한에 대해서도 전세기로 실어나른 적이 있는 만큼 대구 체류 자국민에 대해 ‘철수 권고’ 비슷한 시그널만 내더라도 한국은 경제ㆍ외교적으로 강타당할 수밖에 없다”고 우려했다.\n    이에 대해 외교부 당국자는 “이번 조치는 자국민에 대한 권고(advisory)일 뿐, 대구 지역에 있는 주한미군이나 자국민이 귀국해야 한다거나 대구발 입국자들의 입국을 제한한다는 의미는 전혀 아니다”고 설명했다.\n   \"미 정부는 신중\"이라지만.\n 비상 걸린 외교부  외교부 내에서는 “한국에 대한 입국 제한 조치는 미 정부가 매우 신중하게 보고 있다”는 분위기가 우세하다.\n  그러나 물밑에서는 비상이 걸렸다.\n   특히 트럼프 대통령이 코로나19 관련 첫 ‘원 포인트 기자회견’을 예고했던 26일(현지시간)을 전후해 워싱턴의 주미 한국 대사관은 분주하게 움직였다고 한다.", "output": "트럼프 대통령은 기자회견에서 특정 지역을 언급하진 않았지만, 이후 국무부가 여행 경보 사이트를 통해 ‘여행하지 말 곳(do not travel to)’ 명단에 대구를 명시했다. 미국이 한국의 특정 지역에 대해 여행 금지 권고를 내린 건 이번이 처음이다. 미 정부는 일찌감치 중국(2월 2일)과 이란(2월 26일)에 대해서 여행금지 권고를 한 데 이어 이들 국가를 방문한 외국인의 입국 금지를 시행하고 있다."}, {"kind": "F6", "id": "ext0000000035420", "input": "적자 낸것도모자라 직원들을길거리로내몬 게 성과란말인가", "output": "적자 낸 것도 모자라 직원들을 길거리로 내몬 게 성과란 말인가."}, {"kind": "F6", "id": "ota0000000209682", "input": "지금 시작하는게 좋을탠데 내일이면 늦을거야.", "output": "지금 시작하는 게 좋을 텐데. 내일이면 늦을 거야."}, {"kind": "F6", "id": "ota0000000231292", "input": "아직 합격자 발표 하려면 세시간이나 남았는데 왜 벌써 부터 안절부절 모해", "output": "아직 합격자 발표 하려면 세 시간이나 남았는데 왜 벌써부터 안절부절못해."}, {"kind": "F6", "id": "aud2207180002607", "input": "그러니까 여러분들의 쉽뜬 어든, 어렵든 쉽든 여러분들 절대로 좌설하거나 자만하시면 안 됩니두.", "output": "그러니까 여러분들이 쉽든 어렵든, 어렵든 쉽든 여러분들이 절대로 좌절하거나 자만하시면 안 됩니다."}, {"kind": "F6", "id": "ext0000000109754", "input": "내년 총선을 앞두고 지도부 눈 밖에나서 좋을게업다는 몸조심인지몰라도 몹시실망스러운 모습이다.", "output": "내년 총선을 앞두고 지도부 눈 밖에 나서 좋을 게 없다는 몸조심인지 몰라도 몹시 실망스러운 모습이다."}, {"kind": "F5", "id": "REPORT-news_r-01382-00001", "input": "타봤습니다…준중형 SUV 트레일 블레이저  작심하고 만든 차라는 인상을 받았다.\n  한국GM이 지난 16일 출시한 준중형 스포츠유틸리티차량(SUV) '트레일 블레이저'는 크게 흠 잡을 데가 없었다.\n   차가 부드럽게 나가고 코너링이나 가속에 있어서도 부대낀다는 느낌이 들지 않았다.\n  고속도로 주행시 특별히 가속을 한 것 같지 않았는데 어느새 시속 140㎞까지 올라가 있었다.\n  시승 차량은 ACTIV 모델로 1.\n 35L 가솔린 E-터보 엔진이 탑재됐다.\n  최고출력 139마력, 최대토크 22.\n 4㎏·m이다.\n  전체 5개 트림 중 프리미어∙ACTIV∙RS 모델은 이 엔진이고, LS∙LT 모델에는 1.\n 2L 가솔린 엔진이 달렸다.\n  컴팩트 SUV답지 않게 주행시 매우 조용하다.\n  카허 카젬 한국GM 사장은 16일 간담회에서 “한국 소비자들이 특히 소음에 민감한 것을 잘 알고 있다”며 “액티브 노이즈 캔슬레이션 시스템을 도입해 북미 등지에서도 호평을 받을 것으로 기대한다”고 말했다.\n  17일 실제 타봤더니 엔진∙주행 소음 모두 거의 느끼지 못했다.\n   트레일 블레이저의 매력은 무엇보다 가격이다.\n  스펙만 보면 기아 셀토스와 현대 투싼 사이라고 생각하기 쉽지만 사실 셀토스에 더 가깝다.\n  셀토스가 1965만~2865만원이고, 트레일 블레이저는 1995만~2830만원이다.\n  그런데 트레일 블레이저가 내부 공간이 더 넓고, 연비도 더 좋고, 각종 첨단 사양이 대거 들어가 있다.\n  특히 휠베이스가 비슷한 차종보다 10mm 더 길어 넉넉한 공간이 특징이다.\n  한국GM '저렴이' 이미지 완전히 벗었다 실내는 과거 일부 GM차에 있었던 저렴한 이미지를 완전히 벗겨냈다.\n  이 가격의 SUV가 할 수 있는 최고의 사양을 갖췄다.\n  RS 트림의 경우 D컷 스티어링휠과 RS 전용 계기반, 레드 스티치 등으로 멋을 냈다.\n  8인치 센터 디스플레이는 알차게 만들었다.\n  특히 애플 카플레이를 무선으로 사용할 수 있다.\n  케이블을 찾지 않아도 되는 건 큰 매력으로 느껴진다.\n  안드로이드 오토는 구글 정책에 따라 추후 적용 예정이다.\n   이밖에 열선 스티어링휠, 통풍시트, 핸즈프리 파워 테일게이트, 헤드업 디스플레이, 파노라마 선루프 등 한국 소비자가 선호하는 옵션이 다양하다.\n  접었다 폈다 할 수 있는 헤드업 디스플레이도 쉐보레 최초로 탑재했다.\n  간단한 온·오프 버튼 조작만으로 전륜·사륜구동 전환이 가능하다.", "output": "한국GM이 지난 16일 출시한 준중형 스포츠유틸리티차량(SUV) '트레일 블레이저'는 크게 흠 잡을 데가 없었다. 차가 부드럽게 나가고 코너링이나 가속에 있어서도 부대낀다는 느낌이 들지 않았다. 컴팩트 SUV답지 않게 주행시 매우 조용하다. 그런데 트레일 블레이저가 내부 공간이 더 넓고, 연비도 더 좋고, 각종 첨단 사양이 대거 들어가 있다. 스펙만 보면 기아 셀토스와 현대 투싼 사이라고 생각하기 쉽지만 사실 셀토스에 더 가깝다."}, {"kind": "F6", "id": "ext0000000084747", "input": "지문을 제대로 이해해두 선지에서 막히는데어떡게해야할까요?", "output": "지문을 제대로 이해해도 선지에서 막히는데 어떻게 해야 할까요?"}, {"kind": "F5", "id": "REPORT-news_r-00803-00001", "input": "우크라이나 정부가 이란 수도 테헤란 외곽에서 발생한 자국 여객기 추락 사고의 원인으로 이란이 보유한 러시아제 미사일에 의한 피격을 검토하고 있다.\n   9일(현지시간) 타스 통신에 따르면 알렉세이 다닐로프 우크라이나 국가안보국방위원회 서기는 이날 언론과의 인터뷰에서 \"우크라이나국제항공 소속 여객기가 테헤란 인근에서 러시아제 지대공 미사일 '토르'에 피격당했을 가능성을 검토하고 있다\"고 밝혔다.\n   다닐로프는 \"여객기 사고 조사 참여를 위해 테헤란으로 간 우크라이나 국가조사위원회 소속 전문가들이 이란 측 전문가들과의 회의에서 여러 가설을 점검하고 있다\"면서 이같이 말했다.\n   그는 \"주요 가설 중 토르를 포함한 지대공미사일에 의한 피격도 있다\"면서 \"사고 현장 부근에서 해당 미사일 잔해가 발견됐다는 정보가 인터넷에 올라왔기 때문\"이라고 미사일 피격설을 검토하는 이유를 설명했다.\n   다닐로프의 이런 발언은 잘못 발사된 이란 보유 러시아제 토르 미사일에 자국 여객기가 격추됐을 가능성을 시사한다.\n   토르는 옛 소련 시절인 1980년대 러시아에 군에 실전배치된 지대공미사일로 1~16km 거리, 10m~10km 고도의 목표물을 타격할 수 있다.\n  현재 이란을 포함해 11개국이 토르 미사일을 보유하고 있는 것으로 알려졌다.\n    다닐로프는 \"테헤란으로 간 우크라이나 국가조사위원회 전문가들이 사고 현장을 시찰하는 문제를 이란 측과 조율하고 있다\"며 \"현장에서 인터넷에 올라온 정보를 토대로 토르 미사일 잔해를 수색하는 작업을 벌일 것\"이라고 밝혔다.\n    그러면서 \"우리는 여객기 추락 사건 진실을 규명하기 위해 보잉 MH-17 여객기 피격 조사의 모든 경험을 검토하고 있다\"며 \"지난 2014년 우크라이나 동부에서 발생한 말레이시아 여객기 피격 추락 사건을 참조하고 있다\"고 설명했다.\n   실제 우크라이나 위원회에는 말레이시아 MH-17 여객기 피격 사건 조사에 참여한 전문가들도 포함됐다.\n    말레이시아 여객기 MH17편은 지난 2014년 7월 17일 네덜란드 암스테르담을 떠나 말레이시아 쿠알라룸푸르로 가던 중 우크라이나 정부군과 친러시아 분리주의 반군 간 교전이 치열하던 우크라이나 동부 도네츠크주(州) 상공에서 격추됐다.\n  이 사고로 승객 283명과 승무원 15명 등 298명이 모두 숨졌다.\n    당시 국제조사팀은 장기간 조사 뒤 말레이시아 여객기가 반군에 제공된 러시아제 지대공 미사일 '부크'에 의해 피격됐을 수 있다는 결론을 내렸으나 러시아는 관련 혐의를 완강히 부인했다.", "output": "9일(현지시간) 타스 통신에 따르면 알렉세이 다닐로프 우크라이나 국가안보국방위원회 서기는 이날 언론과의 인터뷰에서 \"우크라이나국제항공 소속 여객기가 테헤란 인근에서 러시아제 지대공 미사일 '토르'에 피격당했을 가능성을 검토하고 있다\"고 밝혔다. 우크라이나 정부가 이란 수도 테헤란 외곽에서 발생한 자국 여객기 추락 사고의 원인으로 이란이 보유한 러시아제 미사일에 의한 피격을 검토하고 있다."}, {"kind": "F6", "id": "ext0000000120935", "input": "분노햇지만, 돌아보면 나두 다르지 않았다.", "output": "분노했지만, 돌아보면 나도 다르지 않았다."}, {"kind": "F6", "id": "grm2209160117969", "input": "여기 야구 응원하는 댓글창 아니거든요", "output": "여기 야구 응원하는 댓글창이 아니거든요."}, {"kind": "F5", "id": "REPORT-news_r-05505-00001", "input": "집단감염으로 전국을 충격에 빠뜨렸던 경북 청도군 청도대남병원 신종코로나(코로나19) 확진환자가 4일 모두 다른 데로 옮긴다.\n  지난달 19일 이 병원 5층 폐쇄병동에서 확진환자가 처음 나온 이후 보름만이다.\n  보건 당국은 청도대남병원 2층에 격리돼 있던 확진환자 32명이 4일까지 국립정신건강센터 등으로 모두 이송될 예정이라고 밝혔다.\n  32명 중 18명은 1차 검사에서 음성이 나왔고 3일 2차 음성이 나오면 5층 폐쇄병동으로 잠시 옮겼다가 경남 부곡정신병원으로 이송된다.\n  양성 확자는 국립정신건강센터로 옮겨 전문적 치료를 받게 된다.\n  잘 오지도 않는 가족 끊길까봐 보건 당국은 환자들이 이송을 반대하는 바람에 무척 애를 먹었다고 한다.\n  최근 13명을 국립정신건강센터로 이송하려 있는데 7명이 완강하게 거부했다.\n  이유는 청도를 떠나면 가족과 끈이 떨어질 것을 우려해서다.\n  보건 당국 관계자는 \"청도에 있으면 아주 가끔씩 가족이 면회 오는데, 서울 가면 가족과 영원히 단절될 것을 우려해 이송을 거부했다.\n  밤새 설득했는데도 1명은 끝내 이송을 거부했다\"고 말했다.\n  이 관계자는 \"환자가 50대가 가장 많다.\n  부모는 대부분 사망했고, 형제·조카·사촌이 많아 애착이 덜한 편인데도 단절을 걱정하더라\"고 말했다.\n   \"정신질환자가 병실 나가면 책임질거냐\"청도대남병원 폐쇄병동 환자 102명 중 100명이 확진판정을 받자 지난달 20일 이후 국립정신건강센터와 경남 부곡병원 의료진 40여명이 급파됐다.\n  대남병원 직원 20명과 함께 확진환자와의 사투가 시작됐다.\n  가장 시급한 것은 중증환자 이송이었다.\n  상급종합병원으로 보내지 않으면 위험한 상황이었다.\n  하지만 큰 병원들이 증상이 심한 사람은 받지 않겠다고 거부했다.\n  어떤 병원은 \"정신질환자가 우리 병원의 음압격리병실 문을 열고 나오면 어떡할거냐.\n  법적 책임을 지겠느냐\"고 나왔다.\n  의료진에게 \"당신 이름이 뭐냐\"고까지 반감을 드러냈다.\n  파견 의료진이 해당 상급종합병원의 정신과 의사에게 통사정해서 설득한 뒤에야 이송할 수 있었다고 한다.\n   또 이송 차량을 구하지 못해 무척 애를 먹었다.\n  구급차에 비닐로 벽을 치고 이송하자고 해도 거부했다.\n  119구급차를 못 구해 민간 구급차를 요청했지만 이마저 안 됐다.\n  경상북도가 나서 간신이 구급차를 구했다.\n    지우지 못한 그 이름들파견 의료진이 도착했을 때는 2명 가량의 환자가 이미 다른 데로 이송간 상태였다.", "output": "집단감염으로 전국을 충격에 빠뜨렸던 경북 청도군 청도대남병원 신종코로나(코로나19) 확진환자가 4일 모두 다른 데로 옮긴다. 보건 당국은 청도대남병원 2층에 격리돼 있던 확진환자 32명이 4일까지 국립정신건강센터 등으로 모두 이송될 예정이라고 밝혔다. 보건 당국은 환자들이 이송을 반대하는 바람에 무척 애를 먹었다고 한다. 최근 13명을 국립정신건강센터로 이송하려 있는데 7명이 완강하게 거부했다. 이유는 청도를 떠나면 가족과 끈이 떨어질 것을 우려해서다."}, {"kind": "F6", "id": "ota0000000006267", "input": "실시각 채닝으로 다하는 익수지않은 무자비한 팩목때문에 현ㄷ타세게왔음", "output": "실시간 채팅으로 당하는 익숙지 않은 무자비한 팩폭 때문에 현타 세게 왔음."}, {"kind": "F5", "id": "REPORT-news_r-04659-00001", "input": "신종 코로나 감염증(코로나19)의 위협이 거세지자 세계 각국은 자국민 보호를 위한 초강력 조치를 내놓고 있다.\n    우선 자국민에게 한국 방문을 주의하라고 당부하거나 한국인의 입국을 제한하는 국가들이 속속 등장하고 있다.\n  한국의 확진자가 폭증하고 있는 데 따른 것이다.\n  23일 오전 9시 기준 신종 코로나 국내 확진자는 556명에 이르고, 사망자는 4명 발생했다.\n  이미 세계 총 41개국에서 지역과 상관없이 중국을 방문하거나 체류한 적이 있는 외국인(중국인 포함)의 입국을 거부하고 있다.\n     반면 정작 확진자가 폭증한 한국은 위기단계를 ‘경계’ 수준으로 유지하고 있다.\n  17개 광역 지방자치단체가 모두 뚫리고, 확진자가 매일 쏟아지는 상황에서 대처가 미온적인 것이 아니냐는 비판이 일고 있다.\n  국내 의학단체들은 매우 빠른 전염 속도를 감안해 위기 단계를 ‘심각’ 단계로 올려야 한다고 권고하고 있다.\n  ‘심각’ 단계 때는 정부가 휴교나 직장 폐쇄, 대중교통 운행 제한 등을 할 수 있는 권한을 갖게 된다.\n    각 국가는 신종 코로나 감염 확산을 막기 위해 어떤 조치를 펼치고 있을까.\n    이탈리아는 신종 코로나 확진자가 꾸준히 늘고 있는 북부 10여개 마을에 대해 ‘이동 제한 조치’를 내렸다.\n  주세페 콘테 이탈리아 총리는 22일(현지시간) 신종 코로나 영향권에 거주하는 주민들이 해당 지역 안팎을 오가는 것을 제한한다고 밝혔다고 AFP통신이 23일 보도했다.\n  이에 따라 5만여명의 지역 주민이 이동 제한 조치의 영향을 받게 된다.\n    감염자가 밀집한 이탈리아 북부 지역 학교와 상점들은 이미 문을 닫았다.\n  콘테 총리는 “특별 허가 없이는 (신종 코로나 감염) 거점으로 간주되는 지역에 출입을 금지한다”고 밝혔다.\n  “이번 조치가 잠복기를 고려해 1~2주가량 유지될 것”이라고 덧붙였다.\n  이탈리아에선 22일 오후 기준 신종 코로나 사망자가 2명 발생했고, 확진자는 77명이다.\n    이탈리아 정부는 감염 예방을 위해 프로축구 세리에A 경기도 취소했다.\n  콘테 총리는 이날 이동 제한 조치와 함께 신종 코로나 확진자가 발생한 베네토주와 롬바르디아주에서 23일 열리는 모든 스포츠 경기를 중단하겠다고 발표했다.\n  이란 정부 역시 국내의 모든 스포츠 경기를 10일 동안 중지시키기로 했다고 관영 IRNA 통신이 22일(현지시간) 보도했다.\n  신종 코로나로 인한 이란 내 사망자는 지금까지 6명으로 중국에 이어 두 번째로 많다.", "output": "반면 정작 확진자가 폭증한 한국은 위기단계를 ‘경계’ 수준으로 유지하고 있다. 신종 코로나 감염증(코로나19)의 위협이 거세지자 세계 각국은 자국민 보호를 위한 초강력 조치를 내놓고 있다. 우선 자국민에게 한국 방문을 주의하라고 당부하거나 한국인의 입국을 제한하는 국가들이 속속 등장하고 있다. 17개 광역 지방자치단체가 모두 뚫리고, 확진자가 매일 쏟아지는 상황에서 대처가 미온적인 것이 아니냐는 비판이 일고 있다."}, {"kind": "F5", "id": "REPORT-news_r-03274-00001", "input": "“과거 신종 플루와 메르스 사태가 발병했을 때와 비교해 공공의료체계가 바뀐 것이 없습니다.\n  대부분 민간이 역할을 담당하는 체계 그대로예요.\n ” 6일 밤 서울 서초구 대한감염학회 사무실에서 열린 기자간담회에서 손장욱 고대안암병원 감염내과 교수가 목소리를 높였다.\n  신종 코로나바이러스 감염증 사태를 둘러싼 기자간담회가 열린 자리였다.\n   백경란 대한감염학회 이사장(삼성서울병원 감염내과 교수)과 이재갑 한림대학교 강남성심병원 감염내과 교수, 손장욱 고대 안암병원 감염내과 교수, 김남중 서울대병원 감염내과 교수를 포함한 감염병 전문가들이 이날 한곳에 모였다.\n  \"보건소 환자 격리 전담하고 중증환자 공공병원으로 모아야\" 이들은 신종코로나 사태를 둘러싼 정부 정책에 대한 아쉬움을 토로했다.\n  환자들이 공공기관인 보건소 격리시설 대신 열악한 텐트 형태의 민간병원 선별진료소로 몰리고 있기 때문이다.\n   보건소와 민간병원을 포함한 의료기관의 역할이 뒤바뀌거나 겹치는 등 일원화한 정책이 없다는 비판이 나오는 이유다.\n  보건소가 환자 격리를 전담하고, 국가지정입원치료병상과 공공병원으로 중증환자를 모아야 한다는 것이 이들의 조언이다.\n  손장욱 교수는 “질병관리본부는 (비전문가인) 지자체의 영향을 받다 보니 일원화한 정책이 나오지 않고 통제가 되지 않는다”며 “시설격리가 필요한 환자들은 종합병원에서 보건소로 넘겨야 한다”고 주장했다.\n  지역사회의 신종 코로나 환자 수가 많아지면서 격리병상이 부족해질 수 있다는 우려도 나왔다.\n  현재 전국 국가지정격리병원이 보유한 음압병상(외부와의 기압 차이로 병원체가 빠져나가지 못 하는 특수병실)은 총 1027개다.\n   이재갑 교수는 “환자 수가 증가하면 중환자 중 인공호흡이나 체외 순환기를 달아야 할 병원에 가벼운 증상의 환자가 들어갈 수 있다”며 “환자 수가 늘어나기 전 증상의 심각성에 따라 병원의 역할을 구별해야 한다”고 조언했다.\n  신종 코로나, 의사 재량권 많아지면서 부작용 우려 목소리 7일부터 바뀌는 신종 코로나 대응절차에 대한 우려도 드러냈다.\n  이날부터 중국 후베이성 방문자뿐만 아니라 의사 소견에 따라 신종 코로나 감염이 의심될 경우 보건소에 신고할 수 있도록 지침이 변경됐기 때문이다.\n  중국 이외에 동남아 국가 등에서의 신종코로나 감염이 많아진 것에 따른 조치다.\n  자연스레 환자의 수가 늘어날 가능성도 커졌다.\n  따라서 한정된 의료 자원이 비효율적으로 운영될 수 있다는 지적이 나온 것이다.", "output": "신종 코로나바이러스 감염증 사태를 둘러싼 기자간담회가 열린 자리였다. 이들은 신종코로나 사태를 둘러싼 정부 정책에 대한 아쉬움을 토로했다. 보건소와 민간병원을 포함한 의료기관의 역할이 뒤바뀌거나 겹치는 등 일원화한 정책이 없다는 비판이 나오는 이유다. 환자들이 공공기관인 보건소 격리시설 대신 열악한 텐트 형태의 민간병원 선별진료소로 몰리고 있기 때문이다."}, {"kind": "F5", "id": "REPORT-news_r-04717-00002", "input": "거의 모든 주요 사건(국민이 주목하는 사건)은 정치적으로 해석된다.\n  한편에서는 윤석열 검찰총장이 정의의 칼을 휘둘렀다고 생각하고, 다른 한편에선 적폐 세력의 반격으로 여긴다.\n  일반 사건의 결과는 수임료 비싼 변호사와 검찰의 협잡이거나, 정치권력과 검찰의 유착 아니면 충돌로 이해한다.\n  지금 윤 총장을 정의의 사도로 생각하는 시민 중 상당수는 얼마 전까지만 해도 그를 권력의 앞잡이라고 비난했다.\n  판단은 언제든 다시 뒤바뀔 수 있다.\n  노무현·이명박·박근혜 전 대통령에 대한 검찰 수사 중 하나라도 반대하는 이는 검찰이 공정하다고 생각하기 어렵다.\n   “사법 불신의 끝은 배심제” 법원을 보는 시각도 크게 다르지 않다.\n  큰 사건의 판결이 나면 재판을 맡은 판사의 성향을 본다.\n  아니, 판결 전부터 그것을 근거로 삼아 예측한다.\n  ○○○연구회 소속이냐, 고향이 어디냐, 사법부에서 주류·비주류 중 어느 쪽에 속하냐를 따진다.\n  죄를 보지 않고 판사를 본다.\n  판결 뒤에는 시민들이 두 패로 갈려 싸우기 일쑤다.\n  법관은 ‘법률과 양심에 따라 재판한다’는 믿음은 헌법 속에 있는 박제가 됐다.\n  김용담 전 대법관은 “사법의 틀에 대해 근본적인 고민을 할 때가 됐다”고 말했다.\n  그는 “배심제 재판 도입도 진지하게 고민해 봐야 한다.\n  국민이 판사를 믿지 않으니 별도리가 없지 않으냐”고 했다.\n  1년 전에 만났을 때만 해도 “국민이 판사의 양심을 믿어야 한다”고 말했는데, 그런 기대를 포기한 듯했다.\n  “판사들이 정치계로 잇따라 뛰어드는 상황에서 어떻게 계속 재판에 대한 신뢰를 말할 수 있겠느냐”며 한탄했다.\n  배심제는 2008년 국민참여재판이라는 이름으로 한국 법원에 부분적으로 도입됐다.\n  ‘부분적’이라 함은 합의부 재판에서, 피고인이 동의할 경우에만 이뤄지는 데다가 판결에도 ‘권고적 효력’만 미치기 때문이다.\n  배심원 평결에서는 무죄 판단이 나와도 판사가 유죄를 선고할 수 있다.\n  김 전 대법관은 “우리 헌법에 재판은 판사가 하게 돼 있기 때문에 본격적인 배심제 도입은 개헌 사항이다.\n  이런 이유 등으로 인해 우리 법원이 배심제 도입에 대해 소극적이었다.\n  영국·미국의 배심제가 우리 현실에 맞지 않는다면 시민과 법관이 함께 판단하는 ‘참심제’ 도입도 대안으로 생각해 볼 수 있다”고 말했다.\n  독일·일본 등에서 참심제가 운용되고 있다.\n   ‘관료 사법’의 중대 위기 판·검사를 믿지 못하면 결국 갈 길은 뻔하다.", "output": "김 전 대법관은 “우리 헌법에 재판은 판사가 하게 돼 있기 때문에 본격적인 배심제 도입은 개헌 사항이다. 이런 이유 등으로 인해 우리 법원이 배심제 도입에 대해 소극적이었다. 영국·미국의 배심제가 우리 현실에 맞지 않는다면 시민과 법관이 함께 판단하는 ‘참심제’ 도입도 대안으로 생각해 볼 수 있다”고 말했다. 배심제는 2008년 국민참여재판이라는 이름으로 한국 법원에 부분적으로 도입됐다."}, {"kind": "F5", "id": "REPORT-news_r-01743-00001", "input": "“유재수는 참여정부 청와대 행정관으로 근무한 사람.\n  나와도 가까운 관계다.\n ”(윤건영 전 청와대 국정기획상황실장) “민정(수석실)은 (유재수 영전에 대해) 이견 없다.\n ”(백원우 전 민정비서관) 유재수 전 부산시 부시장 구명에 나선 친문 인사들의 청탁 내용이 조국 전 법무부 장관 공소장을 통해 생생하게 공개됐다.\n  백원우 당시 민정수석실 민정비서관도 유 전 부시장 구명과 영전 묵인 등 과정에서 적극적인 역할을 했던 것으로 조사됐다.\n  20일 주광덕 자유한국당 의원이 공개한 조 전 장관의 감찰 중단(직권남용권리행사방해 혐의) 사건 공소장에 따르면 유 전 부시장은 2017년 금융위원회 금융정책국장 재직 시 금품수수 등 비리 혐의에 대한 청와대 감찰이 시작되자 친문 실세들에게 구명을 요청했다.\n  유 전 부시장은 그해 10월께 김경수 경남지사 등에게 “감찰을 받게 돼 억울하다.\n  자리를 유지하게 해 달라”고 부탁했다.\n  김 지사는 백원우 당시 청와대 민정비서관에게 수차례 연락해 “참여정부 시절 함께 고생한 사람이다.\n  감찰을 받고 있는데 억울하다고 하니 잘 봐달라”는 취지로 부탁한 것으로 공소장에 기재됐다.\n  윤 전 실장도 백 전 비서관에게 “유재수가 나와 가까운 관계”라고 말했고, 천경득 청와대 선임행정관은 이인걸 당시 특별감찰반장에게 “참여정부에서 근무한 유재수를 왜 감찰하느냐.\n  청와대가 금융권을 잡고 나가려면 유재수 같은 사람이 필요하다”고 했다는 게 검찰 조사 결과다.\n  공소장에 따르면 이후 백 전 비서관은 박형철 전 청와대 반부패비서관에게 “(유 전 부시장을) 봐주면 어떻겠냐”고 말했다가 거부당하자 “사표만 받고 처리하면 되는 것 아니냐”고 재차 제안했다.\n  박 전 비서관은 이를 거부하고 감찰 진행 상황과 비위 내용 등을 담은 이른바 ‘4차 보고서’를 작성해 당시 민정수석이던 조 전 장관에게 전달했다.\n  조 전 장관은 박 전 비서관에게 “여기저기서 전화가 많이 온다”며 “백 비서관과 감찰 건 처리를 상의하라”고 지시했다.\n  이후 유 전 부시장에 대한 감찰은 중단됐다.\n  검찰은 조 전 장관이 백 전 비서관으로부터 “유재수가 현 정부 핵심 요직에 있고 정부 핵심 인사들과도 친분이 깊은데 정권 초기에 이런 배경을 가진 유재수의 비위가 크게 알려지면 안 된다”는 의견을 전달받은 것을 감찰 중단의 결정적 동기로 봤다.\n  공소장에 따르면 조 전 장관은 당시 금융업계 관계자들로부터 고가 승용차 무상 이용 등 1000만원 이상의 금전적 이익을 취했다는 유 전 부시장 자백까지 받아놓고도 감찰을 중단했다.", "output": "20일 주광덕 자유한국당 의원이 공개한 조 전 장관의 감찰 중단(직권남용권리행사방해 혐의) 사건 공소장에 따르면 유 전 부시장은 2017년 금융위원회 금융정책국장 재직 시 금품수수 등 비리 혐의에 대한 청와대 감찰이 시작되자 친문 실세들에게 구명을 요청했다. 유 전 부시장은 그해 10월께 김경수 경남지사 등에게 “감찰을 받게 돼 억울하다. 자리를 유지하게 해 달라”고 부탁했다."}, {"kind": "F5", "id": "REPORT-news_r-05040-00001", "input": "신종 코로나 감염증(코로나19)은 '팬데믹(pandemic·세계적 대유행)' 상황에 도달한 걸까.\n  세계보건기구(WHO)는 팬데믹 선언을 미루고 있지만, 이미 팬데믹이 시작됐다고 봐야 한다는 전문가들의 주장도 나오고 있다.\n  팬데믹은 세계보건기구(WHO) 전염경보 6단계 중 최고 단계인 5~6단계를 뜻한다.\n  전 단계인 에피데믹(epidemic·전염병)보다 광범위한 영역에 퍼지는 특성이 있다.\n  팬데믹은 국가와 대륙을 넘나들며 숙주를 감염시킨다.\n  1928년 스페인 독감과 2009년 조류독감이 그 예다.\n   2003년 발생한 사스(SARS·중증급성호흡기증후군)는 4단계 에피데믹에 머물렀다.\n   대륙 건너 발병…\"팬데믹 조건에 부합해\"  25일(현지시간) CNN에 따르면 미국 질병통제예방센터(CDC) 산하 국립면역호흡기질환센터 낸시 메소니에 국장은 \"신종 코로나가 팬데믹에 가까워졌다\"고 말했다.\n  메소니에 국장은 팬데믹의 세 가지 특성으로 사망 가능성이 있는 질병을 유발하는지, 사람 간 감염이 가능한지, 전 세계적으로 확산이 되는지를 꼽으며 \"신종 코로나는 앞의 두 가지 특성에 이미 부합하고, 발병국이 늘면서 세 번째 특성과도 가까워지고 있다\"고 설명했다.\n   마크 립시츠 하버드대 보건대학원 전염병역학센터 교수도 25일 자신의 트위터에서 신종 코로나가 \"이미 팬데믹 상황이거나, 팬데믹이 되리란 증거가 늘어나고 있다\"고 말했다.\n  한국과 이란처럼 감염자가 급격히 증가하는 게 팬데믹의 증거라고도 주장했다.\n  립시츠 교수는 \"효과적인 통제가 이뤄지지 않으면 전 세계 성인의 40~70%가 신종 코로나에 감염될 수 있다\"고도 적했다.\n   감염자 폭증하는 한국, '팬데믹 증거'로 언급그러나 WHO는 신종 코로나를 팬데믹으로 격상시키는 데 신중한 모습이다.\n   24일 테워드로스 아드하놈 거브러여수스 WHO 사무총장은 제네바에서 열린 기자 간담회에서 신종 코로나가 \"완벽히\" 팬데믹이 될 가능성이 있다면서도, \"아직은 팬데믹이란 용어를 쓸 만큼 세계적으로 퍼지지는 않았다\"고 말했다.\n  다만 WHO는 지난달 30일 신종 코로나에 대해 최고 수준의 경보인 ‘국제적 공중보건 비상사태’(PHEIC)를 선포한 상태다.\n   특히 팬데믹 가능성을 높인 건 한국과 이탈리아, 이란이다.\n  최초 발생지로 알려진 중국 우한에서 거리가 있는 이 세 곳에서 날마다 감염자가 폭증하고 있다는 점이 신종 코로나가 팬데믹에 가까워지는 증거라고 전문가들은 입을 모은다.", "output": "신종 코로나 감염증(코로나19)은 '팬데믹(pandemic·세계적 대유행)' 상황에 도달한 걸까. 세계보건기구(WHO)는 팬데믹 선언을 미루고 있지만, 이미 팬데믹이 시작됐다고 봐야 한다는 전문가들의 주장도 나오고 있다. 팬데믹은 세계보건기구(WHO) 전염경보 6단계 중 최고 단계인 5~6단계를 뜻한다."}, {"kind": "F5", "id": "REPORT-news_r-03184-00001", "input": "일부 관공서와 대형마트에 반려동물 쉼터라는 이름으로 설치된 보관함의 실효성에 의문이 제기되고 있다.\n  이용자가 없기 때문이다.\n  반려동물을 사물함 형태의 공간에 두는 ‘반려동물 쉼터’가 반려동물을 가족처럼 생각하는 인식을 따라가지 못했다는 지적이 나온다.\n    “쉼터 사용 건수는 1년에 2건”서울 서초구는 구청과 주민센터에 방문하는 반려동물 주인을 위해 2017년 반려동물 쉼터를 도입했다.\n  서초구청 내 2곳을 비롯해 주민센터 4곳 (반포1동•서초1동•양재2동•방배4동)에 보관함 형태의 반려동물 쉼터가 운영되고 있다.\n  대부분 1달에 1건 이상의 이용자를 찾기 어려운 상황이라고 한다.\n    반려동물을 보관할 수 있게끔 만들어진 보관함은 가로·세로 70cm, 폭 60cm로 전자레인지 2배 정도의 크기다.\n  서초구는 바닥 난방과 환기, 조명 시스템을 갖추고 있다고 홍보했지만 반려동물 주인들의 외면을 받고 있다.\n  지난달 17일 방배4동 주민센터의 반려동물 쉼터는 텅 비어있었다.\n  지난 한 해 동안 이용자는 2명에 그쳤다고 한다.\n  반포 1동 등 다른 주민센터의 사정도 다르지 않았다.\n  반포 1동 반려동물 쉼터의 지난해 이용자는 4명에 불과했다고 한다.\n 반포1동 주민센터 앞에서 만난 전숙희씨는 “반려견이 폐쇄된 공간을 싫어해 쉼터에 넣어 둘 수가 없다”고 말했다.\n    사용법 모르고, 고장 난 채 방치  이용자가 적다 보니 관리가 되지 않는 곳도 있었다.\n  지난달 21일 양재2동 주민센터 출입구 옆에 설치된 반려동물 쉼터의 전원은 꺼져 있었다.\n  이 센터 관계자는 “자물쇠가 작동하지 않아 고장이 났다”며 “반려견과 같이 오는 민원인이 많지 않고, 다른 업무가 있다 보니 신경 쓰기 어렵다”고 했다.\n  그는 또 “열쇠를 곧 수리할 예정이다”고 덧붙였다.\n  방배4동 주민센터의 경우 쉼터 내 온도를 조절하고 환풍기를 가동하는 방법 등을 관리자가 알지 못했다.\n  구청 차원에서의 사용법 교육이 이뤄지지 않는 등 이용자가 없다 보니 주요 업무에 포함되지 않아서다.\n  대형마트도 보관함 이용자 거의 없어비슷한 형태의 반려동물 보관함을 운영하는 대형마트의 사정도 관공서와 다르지 않다.\n  롯데마트 서초점은 고객센터 앞에 6칸의 반려동물 보관함을 운영 중이다.\n  전면이 투명한 유리로 돼 있어 내부가 보일 뿐 물품 보관함과 유사한 형태다.\n   롯데마트 해당 지점 관계자는 “이용자가 한 달에 10여건 정도다”고 말했다.", "output": "일부 관공서와 대형마트에 반려동물 쉼터라는 이름으로 설치된 보관함의 실효성에 의문이 제기되고 있다. 반려동물을 사물함 형태의 공간에 두는 ‘반려동물 쉼터’가 반려동물을 가족처럼 생각하는 인식을 따라가지 못했다는 지적이 나온다. 대부분 1달에 1건 이상의 이용자를 찾기 어려운 상황이라고 한다."}, {"kind": "F6", "id": "ext0000000121459", "input": "대신 서방 각국에선 차량으로 시민들을 공격하는 테러가 빈발하구 잇다.", "output": "대신 서방 각국에선 차량으로 시민들을 공격하는 테러가 빈발하고 있다."}, {"kind": "F6", "id": "aud2207210004172", "input": "가민의 님은 오늘으 오전 의원총회 진행했는데 어떤 내들이 논의됐습니까?", "output": "국민의 힘은 오늘 오전 의원총회를 진행했는데 어떤 내용들이 논의됐습니까?"}, {"kind": "F5", "id": "REPORT-news_r-00505-00001", "input": "미국의 국가대항전에서 유난히 뛰어난 성적을 거둬 ‘캡틴 아메리카’라는 별명을 가진 골프 스타 패트릭 리드(미국)는 6일(한국시각) 팬들로부터 ‘사기꾼’이라는 소리를 들었다.\n  하와이에서 열린 미국 프로골프(PGA) 투어 센트리 토너먼트 오브 챔피언스 연장전에서다.\n  그가 퍼트를 하고 나서 관중이 \"사기꾼\"이라고 크게 소리를 질렀다.\n  리드를 아끼던 미국 관중이어서 의미가 다르다.\n  미국 골프월드는 그를 '공공의 적'이라고 표현했다.\n     2018년 마스터스 챔피언인 리드는 사연이 많다.\n  조지아 대학에 다닐 때 스코어를 속이고, 동료 물건을 훔쳤다고 알려졌다.\n  그래서 학교를 떠나 작은 학교인 오거스타 스테이트로 옮겼는데 거기서도 동료들이 팀에서 내쫓을지 투표를 할 정도로 융화하지 못했다.\n  그래도 그는 살아남았다.\n  실력이 좋아서다.\n  리드는 팀을 두 번이나 전국 우승으로 이끌었다.\n  그 중 한 번은 자신을 쫓아낸 조지아대학을 결승에서 눌렀다.\n     프로 선수가 돼서도 환영받지 못했다.\n  동료들은 그가 너무 오만하다고 생각했다.\n  리드는 경기 중 무벌타 구제를 받지 못했을 때 “내가 (인기가 있는) 조던 스피스가 아니라서 피해를 봤다”고 말하기도 했다.\n  그러나 리드는 국가대항전에서 잘했기 때문에 인정을 받았다.\n  특히 2016년 라이더컵에서는 최고의 활약을 펼쳐 캡틴 아메리카라는 영광스러운 별명도 얻었다.\n  미국은 실력 우선이다.\n  팬들이 영웅인 그에게 복잡한 감정을 가지는 가장 큰 이유는 부모와의 불화다.\n  그는 대회장에서 경찰을 시켜 부모를 쫓아낸 일도 있다.\n  이에 대해 사과하지 않았다.\n   이후 팬들의 분위기가 변했다.\n  그러나 리드는 적대적인 분위기에서도 전혀 흔들리지 않고 경기할 수 있는 능력이 있다.\n  부정적인 분위기를 오히려 자신이 유리하게 이용하는 듯도 했다.\n  2018년 마스터스에서 그랬다.\n  싫어하는 사람들은 그래서 더 얄밉다고 여겼다.\n  마스터스 우승 후 “부모와 화해하는 것이 어떤가”라는 권유를 리드는 한칼에 거부했다.\n   상황은 나빠지고 있다.\n  2018년 라이더컵에서 리드는 팀워크를 깼다.\n  리드는 “조 편성이 잘 못 됐으며 나처럼 성적이 좋은 선수를 두 번이나 벤치에 앉혀 두는 것은 현명한 결정이 아니다”고 했다.\n  지난해 12월 히로 월드 챌린지에서는 연습스윙 하는 척하면서 모래를 치우다 발각됐다.\n  직후 열린 프레지던츠컵에서 상대 관중들이 리드를 ‘사기꾼’이라고 공격했다.", "output": "미국의 국가대항전에서 유난히 뛰어난 성적을 거둬 ‘캡틴 아메리카’라는 별명을 가진 골프 스타 패트릭 리드(미국)는 6일(한국시각) 팬들로부터 ‘사기꾼’이라는 소리를 들었다. 지난해 12월 히로 월드 챌린지에서는 연습스윙 하는 척하면서 모래를 치우다 발각됐다. 그러나 리드는 국가대항전에서 잘했기 때문에 인정을 받았다. 동료들은 그가 너무 오만하다고 생각했다. 프로 선수가 돼서도 환영받지 못했다."}, {"kind": "F6", "id": "ext0000000112763", "input": "클래식음악의 재미와 감동을 제대로 맛볼수있게 이와관련된 역사와 배경을 쉽게 소개한 교양서다.", "output": "클래식 음악의 재미와 감동을 제대로 맛볼 수 있게 이와 관련된 역사와 배경을 쉽게 소개한 교양서다."}, {"kind": "F5", "id": "REPORT-news_r-00459-00002", "input": "그도 그럴 것이 태평양·김앤장 할 것 없이 한국 로펌은 론스타의 ISD(국가-투자자 소송) 등 한국이 당사자인 굵직한 국제중재사건에서도 영미권 대형 로펌의 보조적 역할만 해왔던 게 사실이다.\n  한국 로펌이 외국 고객을 두기는커녕 한국 내에서조차 한국 로펌에 보조 역할만 기대하는 실정이다.\n  한 국제중재 변호사는 “글로벌 톱 로펌을 쓰는 건 실력 격차 외에도 명성 때문인데 브랜드파워와 맨파워가 모두 부족한 신생 로펌에 일을 줄 고객이 국내외를 막론하고 과연 있을지 회의적”이라고 말했다.\n  또 다른 한 국제중재 변호사도 “말은 글로벌을 지향한다지만 실은 오래 몸담았던 태평양에 타격을 주는 소탐대실 선택이 아니냐”는 의견을 내놓기도 했다.\n  이쯤 되면 누구라도 김 변호사의 선택을 두고 “왜”라는 질문과 함께 “세계 진출이 과연 실현 가능한 목표인지” 묻고 싶어진다.\n  오는 9일 공식 출범을 앞둔 피터&김이 자리 잡은 서울 강남구 삼성동 트레이드타워(무역센터) 17층 사무실을 찾은 이유다.\n  웬만한 신생 로펌에 비해 위치나 인테리어는 훨씬 화려했다.\n  하지만 태평양이나 김앤장처럼 방문객을 압도하는 리셉션 공간 따로 없이 집무실과 회의실만 갖춘 실용적 공간은 김 변호사 설명대로 “스타트업”이라 부를만했다.\n  김 변호사가 스타트업(피터&김)을 차린 이유는 단순했다.\n  한국이 잘 하고 있고 더 잘 할 수 있는데 내수용에 안주하면 미래는 없다는 것, 좀더 비관적으로 표현하면 결국 국내 시장도 지킬 수 없을지 모른다는 위기감이다.\n  그는 이렇게 설명했다.\n  “국제중재는 국가별 칸막이가 없어 어느 나라 고객 업무라도 수행할 수 있는 완전 자유경쟁 시장이라 아무 변호사나 뛰어들 수 있다.\n  거꾸로 말하면 전 세계 유수의 로펌들이 계급장 떼고 치열하게 싸우는 전쟁터다.\n  한국 변호사가 한국 안에서 유능한 것도 의미 있지만 글로벌에서 경쟁력을 인정받으면 향후 한국 변호사의 해외 진출 발판을 마련할 수 있지 않을까.\n ” 글로벌 역량을 키우는 게 한국시장을 지키는 방법이라는 계산도 깔려 있다.\n  K팝이 팝 심장부인 미국에서 한국어로 노래하는 BTS(방탄소년단)라는 세계적 현상을 만들어내는 동안 한때 한국이 그토록 두려워했던 J팝이 철저히 내수용에 머무는 것만 봐도 알 수 있다.\n  『걸그룹 경제학』이 2010년대 전후 한국과 일본의 대표 걸그룹 소녀시대와 AKB48을 비교한 분석을 보면 자국 음반 판매량은 AKB48의 압승이다.", "output": "그도 그럴 것이 태평양·김앤장 할 것 없이 한국 로펌은 론스타의 ISD(국가-투자자 소송) 등 한국이 당사자인 굵직한 국제중재사건에서도 영미권 대형 로펌의 보조적 역할만 해왔던 게 사실이다. 한국 로펌이 외국 고객을 두기는커녕 한국 내에서조차 한국 로펌에 보조 역할만 기대하는 실정이다."}, {"kind": "F5", "id": "REPORT-news_r-04277-00001", "input": "동서고금을 막론하고 역병이 크게 돌거나 민심이 쪼개지면 괴담이 뒤따른다.\n  미국도 예외가 아니다.\n  드라마 ‘X-파일’이 만들어진 나라 미국이 오히려 유언비어의 생산력과 다양성에서 상당한 수준으로 보인다.\n  주류 학계에서 인정받지 못하는 변방의 프린지(fringe) 가담항설이 주류 문화에까지 파고들곤 한다.\n  6년 전 에볼라 바이러스가 미국 사회를 강타했을 때가 그랬다.\n  CNN 등 주류 언론들이 미국민의 에볼라 공포를 ‘피어볼라(Fear-bola)’라는 신조어로 보도했을 때다.\n  그때 출몰했던 주요 유언비어다.\n  ①버락 오바마 대통령이 미국의 노예제 역사를 속죄하려고 에볼라 유입을 차단하지 않았다.\n  ②오바마 대통령이 미국을 아프리카처럼 만들려고 에볼라를 막지 않았다.\n  러시 림보 같은 극우 방송인들이 괴담 확산에 가세했다.\n  대선이 치러진 2016년엔 유언비어 때문에 미국의 수도 워싱턴에서 총격 사건이 벌어졌다.\n  당시 대선 후보 힐러리 클린턴이 전 세계에서 아동 성매매 조직을 운영하고 있으며 워싱턴의 피자 가게 지하에도 그 소굴이 있다는 유치찬란한 음모론이었다.\n  어리석게도 이를 믿었던 28세의 백인 청년이 그해 12월 4일 이 피자가게를 찾아와 소총을 쏴대다가 체포됐다.\n  유언비어는 이처럼 사회를 좀먹는 곰팡이다.\n  에볼라 때처럼 사람들의 불안을 파고들고, 미국 대선 때처럼 사회적 분열을 틈타 혹세무민한다.\n  유언비어와 곰팡이의 닮은 점은 속성만 아니라 생존 조건에도 있다.\n  습기와 어둠 속에서 피어오르는 곰팡이처럼 불신과 의사소통의 단절이라는 환경 속에서 유언비어가 자생한다.\n  피어볼라는 에볼라 환자를 치료하던 간호사가 감염되는 충격적 사태가 발생하며 불붙었다.\n  세계 최고의 의료 선진국인 미국에서 의료진까지 감염됐다는 뉴스에 미국민들의 심리적 마지노선이 뚫렸다.\n  아동 성매매로 돈을 번다는 ‘피자 게이트’는 어처구니없는 허구였지만 힐러리 클린턴은 대선 기간 돈 문제로 시달렸다.\n  힐러리 본인이  2억원 짜리 ‘황제 강연’을 했던 게 도마에 올랐고, 남편 빌 클린턴은 물론 외동딸 첼시까지 거액 강연에 나섰던 것도 드러났다.\n  이들 가족이 주도하는 클린턴 재단에 후원금 명목으로 근본 없는 돈까지 흘러들어왔다는 의혹도 제기됐다.\n  정부 여당은 신종 코로나 발생 후 등장하는 가짜뉴스를 크게 경계하고 있다.\n  하지만 유언비어가 자라는 습기와 어둠을 없애지 않은 채 유언비어를 때려잡으려 하면 하나만 알고 둘은 모르는 얘기다.", "output": "동서고금을 막론하고 역병이 크게 돌거나 민심이 쪼개지면 괴담이 뒤따른다. 유언비어는 이처럼 사회를 좀먹는 곰팡이다. 정부 여당은 신종 코로나 발생 후 등장하는 가짜뉴스를 크게 경계하고 있다. 습기와 어둠 속에서 피어오르는 곰팡이처럼 불신과 의사소통의 단절이라는 환경 속에서 유언비어가 자생한다. 하지만 유언비어가 자라는 습기와 어둠을 없애지 않은 채 유언비어를 때려잡으려 하면 하나만 알고 둘은 모르는 얘기다."}, {"kind": "F5", "id": "REPORT-news_r-05055-00001", "input": "프로배구 OK저축은행이 봄배구 불씨를 살렸다.\n  레오 안드리치와 최홍석의 활약을 앞세워 KB손해보험을 제압했다.\n  OK저축은행은 26일 안산 상록수체육관에서 열린 2019~2020 도드람 V리그 프로배구 6라운드 KB손해보험과 경기에서 세트 스코어 3-1(25-17, 17-25, 25-21, 25-23)로 이겼다.\n  레오가 서브득점 3개 포함 27점, 최홍석이 블로킹 2개 포함 16점을 기록했다.\n  2연승을 이어간 4위 OK저축은행은 15승16패(승점47)가 됐다.\n  3위 현대캐피탈(18승12패, 승점53)과는 승점 6점 차로 좁혔다.\n  프로배구에선 3,4위 승점이 3점 이내면 단판제 준플레이오프가 열린다.\n  경기 초반 OK저축은행은 강한 서브를 바탕으로 분위기를 이끌었다.\n  레오-송명근-최홍석-한상길-전진선의 공격적인 라인업도 잘 먹혔다.\n  두세 점 차 리드를 지키던 OK저축은행은 최홍석의 서브득점, 송명근의 페인트 공격, 최홍석의 백어택이 터지면서 21-15로 달아났다.\n  24-17에선 레오의 첫 서브득점까지 터지면서 깔끔하게 마무리했다.\n KB손보는 2세트에 변화를 줬다.\n  김학민을 먼저 넣어 공격을 강화했다.\n  마테우스와 김학민 쌍포가 터지면서 앞서갔다.\n  KB손보는 김정호의 강력한 서브와 블로킹까지 나오면서 12-6으로 달아났다.\n  OK저축은행은 송명근 대신 김웅비를 투입해 재정비했다.\n  하지만 KB손해보험은 잇따라 블로킹을 성공시키며 세트 스코어 1-1을 만들었다.\n  OK저축은행은 3세트에서 전열을 재정비했다.\n  심경섭이 투입돼 공수에서 안정감을 더했다.\n  손주형은 무려 블로킹 4개를 잡아내는 괴력을 뽐냈다.\n  공격 범실로 추격을 허용하긴 했지만 후반엔 레오가 해결사 본능을 발휘하며 승리했다.\n  4세트에선 KB손해보험이 한 발 앞서갔다.\n  하지만 레오의 강서브가 터졌다.\n  서브득점 2개 포함 레오의 서브때 연속득점이 나오면서 OK저축은행이 14-12로 뒤집었다.\n  결국 OK가 마지막까지 리드를 지켜냈다.\n  권순찬 KB손해보험 감독은 \"마테우스 말고는 공격이 잘 되지 않았다.\n  국내 선수들이 잘 못 받쳐줬다.\n  서브가 잘 들어가는 세트에선 흐름을 탔는데 그렇지 않을 땐 어려웠다.\n  김학민의 허리가 좋지 않아 완벽한 컨디션이 아니다\"고 말했다.\n  석진욱 OK저축은행 감독은 \"선수 전원이 잘 해줬다.\n  2세트에 김학민이 들어왔을 때 목적타 서브를 지시했는데 오히려 부담을 가진 것 같았다.", "output": "OK저축은행은 26일 안산 상록수체육관에서 열린 2019~2020 도드람 V리그 프로배구 6라운드 KB손해보험과 경기에서 세트 스코어 3-1(25-17, 17-25, 25-21, 25-23)로 이겼다. 레오가 서브득점 3개 포함 27점, 최홍석이 블로킹 2개 포함 16점을 기록했다. 2연승을 이어간 4위 OK저축은행은 15승16패(승점47)가 됐다."}, {"kind": "F6", "id": "aud2209300028322", "input": "왜 간련이 없는으지 볼가?", "output": "왜 관련이 없는지 볼까?"}, {"kind": "F5", "id": "REPORT-news_r-01848-00001", "input": "“‘물갈이 쇼’를 위해서라면 모를까 현직 국회의원에게 모욕과 창피를 주면서까지 살생부를 오픈할 이유는 없습니다”더불어민주당 핵심 관계자는 21일 현역 의원 평가 ‘하위 20%’에 해당하는 명단 22명을 공개하지 않고 개별 통보키로 한 이날 당 공천관리위원회(공관위) 결정 이유를 이렇게 설명했다.\n  하위 20%는 공천 심사에서 20% 감점을 받는다.\n  경선에서 절대적으로 불리하다.\n  평판 등에도 안 좋은 영향을 미친다.\n  하위 20% 명단을 ‘살생부’라고 부르는 이유다.\n     이근형 민주당 전략기획위원장은 이날 오후 공관위 전체회의가 끝난 직후 “오는 28일 공관위원장(원혜영 의원)이 하위 20% 해당자에 대해 개별통보 방식으로 통지하기로 결정했다”며 “통보가 이뤄지면 해당 의원은 48시간 내 이의신청이 가능하다”고 말했다.\n    민주당은 지난해 5월 의원들의 입법실적ㆍ지역활동ㆍ기여도 등을 평가해 하위 20%에 해당하는 의원은 공천 심사에서 20%의 감점을 받는 제도를 도입했다.\n  지난해 11월 평가에 돌입해 최근 명단을 완성했다.\n    밀봉된 '살생부'…공개 불가 당초 민주당 내부에선 명단을 외부에 공개해야 한다는 의견이 제기됐다.\n  민주당 당규 74조 1항은 “평가 대상이 된 선출직 공직자는 발표 시점으로부터 48시간 이내에 이의신청할 수 있다”고 규정하는데, 여기서 ‘발표’는 곧 외부 공개에 해당한다는 해석 때문이었다.\n  또 하위 20%에 해당하는 의원에게 일일이 전달하면서 보안을 유지하는 건 불가능하다는 판단도 적지 않았다.\n  이와 관련해 지난 20일엔 민주당 안팎에서 하위 20% 중 일부의 명단이 담긴 '지라시'가 돌면서 당이 시끌시끌했다.\n  ‘도는 글) 하위 20%’란 제목 아래 의원 12명의 이름이 적힌 것이었다.\n  지라시 속 의원들은 서울·인천·경기·충청·부산 등 지역구가 고루 분포돼 있고 초선부터 다선 중진까지 다양했지만 친문 실세로 꼽히는 의원들은 보이지 않았다.\n  이때문에 당 내부에서 “친문 쪽이 특정 의원들을 쳐내기 위해 가짜 정보를 유포하는 것 아니냐”는 얘기까지 나왔다.\n  논란이 커지자 윤호중 민주당 사무총장은 “명단은 개봉하지 않아 밀봉된 상태”라며 진화에 나섰지만 이름이 적시된 의원을 포함해 민주당은 하루 종일 술렁였다.\n  하위 20%로 지목된 한 중진 의원은 이해찬 민주당 대표를 개인적으로 찾아가 “누가 나를 흔들려고 이러느냐”며 거세게 항의했다고 한다.", "output": "이근형 민주당 전략기획위원장은 이날 오후 공관위 전체회의가 끝난 직후 “오는 28일 공관위원장(원혜영 의원)이 하위 20% 해당자에 대해 개별통보 방식으로 통지하기로 결정했다”며 “통보가 이뤄지면 해당 의원은 48시간 내 이의신청이 가능하다”고 말했다. 하위 20%는 공천 심사에서 20% 감점을 받는다. 경선에서 절대적으
