<script>
const ITEMS = [{"kind": "F5", "id": "REPORT-news_r-01964-00001", "input": "서울을 중심으로 달아올랐던 주택시장이 변곡점에 들어서고 있다.\n  시장을 좌우하는 ‘바람’이 바뀌고 있다.\n  밝던 주택시장 분석 기관의 전망도 어두워졌다.\n  지난해 12·16부동산 대책 직후까지도 올해 서울 집값을 소폭이나마 상승세로 봤는데 한국감정원은 지난 21일 하락세로 반전할 수도 있는 보합세로 예상했다.\n  서울 아파트 주간 변동률이 이번 주 강남3구(강남·서초·송파구)에서 12·16대책 5주만에 일제히 하락세를 나타냈다.\n    이준용 한국감정원 시장분석연구부장은 “정부 대책의 타깃인 9억원 초과 고가 주택은 조정을 거칠 것으로 예상하고 9억원 이하 주택이 어떻게 움직이느냐에 따라 상승과 하락이 갈라질 것”으로 내다봤다.\n   설 이후 바람의 방향과 세기가 구체화할 전망이다.\n  3~6월이 분수령이다.\n  2017년 8·2대책 후에는 방향이 별로 바뀌지 않았고 2018년 9·13대책 뒤에는 6개월가량 반대로 불다 급선회했다.\n  주택시장의 판도를 뒤흔들 바람을 움직이는 게 뭘까.\n      ‘투기와 전쟁’ 정부 정책은 주택시장의 주요 변수다.\n  이제는 변수가 아니라 상수다.\n  문재인 대통령이 지난 14일 신년 기자회견에서 ‘투기와의 전쟁’을 언급하며 집값 과열에 선전포고했다.\n  역대 최고 강도로 꼽히는 12·16대책은 개전 포문이었다.\n  그 이전 8·2대책과 9·13대책에서 실전훈련을 했다.\n   정부는 ‘집값 안정’에서 나아가 ‘원상회복’을 목표로 설정하며 방어에서 공세로 돌아섰다.\n   문재인 대통령이 14일 신년 기자회견에서 \"지금의 대책이 시효가 다했다고 판단되면 보다 강력한 대책을 끝없이 내놓겠다\"고 밝혔다.\n  김상조 청와대 정책실장은 지난 15일 라디오 인터뷰에서 “모든 정책 수단을 다 올려놓고 필요하면 전격적으로 쓰겠다”며 “절대 (지난해) 12월 16일에 부동산 대책을 소진한 게 아니다”고 말했다.\n  언제든 나올 추가 대책은 12·16대책의 강화로 전문가들은 예상한다.\n  대출 규제를 통해 사실상 허가제 수준으로 매수를 제한하고 대출 없이 주택을 사는 경우엔 자금 흐름을 샅샅이 조사한다.\n  보유세를 더욱 늘려 다주택자에게 견디기 버거운 세금 부담을 지운다.\n     박원갑 국민은행 부동산수석전문위원은 \"규제를 받지 않는다고 집값 상승을 예상할 수 없는 상황”이라며 “풍선효과나 반사이익을 기대하는 것은 위험하다\"고 말했다.\n  공시가격·보유세 ‘폭탄’   3월에 올해 보유세 ‘폭탄’ 심지에 불이 붙을 전망이다.", "output": "서울을 중심으로 달아올랐던 주택시장이 변곡점에 들어서며 한국감정원이 지난 21일 올해 서울 집값을 하락세로 반전할 수도 있는 보합세로 예상했다. 이준용 한국감정원 시장분석연구부장은 9억원 초과 고가 주택은 조정을 거칠 것으로 예상하고 9억원 이하 주택 움직임에 따라 상승과 하락이 갈라질 것이라고 내다봤다. 문재인 대통령이 지난 14일 신년 기자회견에서 '투기와의 전쟁'을 언급하며 집값 과열에 선전포고했고, 김상조 청와대 정책실장은 지난 15일 라디오 인터뷰에서 모든 정책 수단을 다 올려놓고 필요하면 전격적으로 쓰겠다고 말했다. 3월에 올해 보유세 폭탄 심지에 불이 붙을 전망이다."}, {"kind": "F6", "id": "aud2208310017599", "input": "예를으 들어 건조기후우에서는 에 지뭉이 평평난가요?", "output": "예를 들어 건조기후에서는 왜 지붕이 평평한가요?"}, {"kind": "F5", "id": "REPORT-news_r-03167-00001", "input": "수도권 아파트에 설치된 환기설비는 필터가 아예 없거나 교체 주기를 훨씬 넘긴 채 사용되는 것으로 확인됐다.\n  한국소비자원이 수도권 아파트 24개소에 대해 환기설비 사용실태를 지난해 7월부터 6개월간 조사해 6일 발표한 결과다.\n  환기설비 필터 권장 교체주기는 3~6개월(2000~4000시간)이다.\n    2006년부터 건축되는 100세대 이상 아파트는 의무적으로 환기 설비를 설치해야 한다.\n  탁한 실내공기를 밖으로 내보내고 바깥공기를 필터를 통해 정화한 후 유입시키는 장치로, 24시간 가동이 원칙이다.\n   이번에 조사한 24개소 아파트 거주자들은 일주일간 평균 3회(1회당 약 1시간 40분) 환기를 하고 있었다.\n  하지만 설치 후 이용·관리에 대한 책임은 전적으로 거주자에게 있고 이에 대한 인식도 매우 낮은 것으로 나타났다.\n    24곳 중 4곳 필터 없는데 몰라 조사 대상 24개소 아파트 중 4개소(경기도 용인 3곳과 광명 1곳)에는 환기설비에 필터가 없었는데도 거주자들은 이 사실을 모르고 있었다.\n  나머지 아파트 20개소에선 필터가 모두 최소 2년에서 최대 9년까지 교체되지 않았다.\n  모두 먼지가 많이 쌓여 있었고 곰팡이가 확인된 곳도 있었다.\n    필터 성능도 미흡했다.\n  환기설비에 필터가 장착된 아파트 20개소 중 14개소(70%)에선 필터의 공기정화 성능이 60% 미만이었다.\n  현재 기계 환기설비의 환기 성능이 60% 이상을 충족하도록 하는 내용의「건축물의 설비기준 등에 관한 규칙」 일부 개정안이 입법 예고 중이다.\n  이 중 9개 제품은 사용시간이 권장 교체주기 이내(1000시간)였지만 장착 기간(2~6년)이 오래돼 성능이 떨어진 것으로 나타났다.\n  국내 아파트는 대부분 판형 환기설비를 사용하는데, 설비 중앙에 내외부의 열을 교환하고 습기를 차단하는 전열소자를 갖추고 있다.\n  전열소자에 장착되는 필터는 일반적으로 프리필터와 미디엄필터, 헤파필터로 구성된다.\n  프리필터는 10㎛ 이상의 분진을, 미디엄·헤파필터는 직경 0.\n 3~1㎛ 이상의 초미세먼지를 포집한다.\n  이번 조사에서 60% 미만 성능을 보인 필터는 미디엄·헤파필터(각 7개소)였다.\n  절반 이상 필터 교체 필요성 몰라    이번에 조사한 아파트 24개소 중 7개소(29.\n 2%)의 거주자는 세대 내 환기 설비가 어디에 설치돼있는지 모르고 있었고, 14개소(58.\n 3%) 거주자는 환기 설비의 필터 교체 필요성을 인지하지 못하고 있었다.", "output": "한국소비자원이 수도권 아파트 24개소를 조사한 결과, 4개소는 필터가 없는데도 거주자가 모르고 있었고 나머지 20개소도 필터가 최소 2년에서 최대 9년까지 교체되지 않아 먼지와 곰팡이가 확인됐다. 필터가 장착된 20개소 중 14개소(70%)는 공기정화 성능이 60% 미만이었으며, 9개 제품은 사용시간이 권장 교체주기 이내(1000시간)였지만 장착 기간(2~6년)이 오래돼 성능이 떨어진 것으로 나타났다. 조사 대상 24개소 중 7개소(29.2%) 거주자는 환기설비 설치 위치를, 14개소(58.3%)는 필터 교체 필요성을 인지하지 못하고 있었다."}, {"kind": "F6", "id": "ext0000000056494", "input": "진정성있는소통으로 주요 난제들을시민과 함께 고민하고해법을 찾아야 문재인정부가 성공할수있다.", "output": "진정성 있는 소통으로 주요 난제들을 시민과 함께 고민하고 해법을 찾아야 문재인 정부가 성공할 수 있다."}, {"kind": "F6", "id": "ext0000000121283", "input": "부드럽게 끝나기도 햇지만 재앙이 됀 경우도 여럿이다.", "output": "부드럽게 끝나기도 했지만 재앙이 된 경우도 여럿이다."}, {"kind": "F6", "id": "aud2210040028551", "input": "너 자 그래서 요거를 선생이 완벽라게 분석해서 녀러분한테 전달헤 뒤릴 거요.", "output": "어 자 그래서 요거를 선생님이 완벽하게 분석해서 여러분한테 전달해 드릴 거에요."}, {"kind": "F5", "id": "REPORT-news_r-01655-00002", "input": "단층 위에 건설된 댐댐 공사가 부실했다는 지적도 있다.\n 영주댐 건설에 반대해온 '내성천의 친구들'은 지난해 11월 '물 새는 영주댐, 주민 안전 위협한다'는 제목의 성명을 냈다.\n  이 단체는 2016년 7월과 2017년 10월, 2019년 9월 등 세 차례 담수가 진행되는 과정에서 영주댐 벽체 동일한 위치에서 누수 현상이 관찰됐다고 밝혔다.\n 이 단체는 영주댐이 활성단층으로 추정된 옥천단층이 지나가는 지반 위에 건설됐고, 댐 하부를 지나가는 주 단층의 폭이 30m에 이르는 게 원인이라고 주장했다.\n  이들은 영주댐 건설 후 주변 15㎞ 반경에서 일어난 지진이 7차례라는 점도 지적했다.\n  영주댐 건설 이전 30년 동안에는 같은 구간 내에서 일어난 지진이 1회에 불과한 것과 큰 차이가 있다는 것이다.\n  하지만 다른 의견도 없지 않다.\n 협의체 한 위원은 \"댐 누수 현상이 일부 있다고 하더라도 보수를 하면 충분히 해결할 수 있을 것으로 본다\"고 밝히기도 했다.\n  사라진 토종 물고기 흰수마자토종 민물고기이자 멸종위기 야생생물 I급 민물고기인 흰수마자가 최고의 서식지인 내성천에서도 숫자가 급감한 것이 상류 영주댐 건설과 관련이 있다는 주장도 꾸준히 나오고 있다.\n  지난해 10월 수자원공사가 국회 환경노동위원회 이상돈 의원에게 제출한 국감 자료에 따르면 영주댐 하류에서 2014~2017년 181~492마리가 관찰됐으나, 2018년에는 9마리만 관찰됐다.\n 지난해 초까지 환경부 산하 국립생태원이 실시한 내성천 조사에서도 흰수마자는 7마리만 발견됐다.\n  흰수마자의 급감은 영주댐이 들어서면서 수질이 악화하고 상류로부터 모래 공급이 끊긴 게 원인으로 지목되고 있다.\n 흰수마자는 강바닥이 모래이고, 흐름이 비교적 빠른 여울이 있는 얕은 물에서만 산다.\n  흰수마자는 위협을 느끼면 모래 속에 파고 들어가 숨는다.\n 흰수마자가 살아가는 데는 고운 모래가 필요한 것이다.\n  수자원공사 조사에 따르면 내성천 석탑교(영주시 문수면 조제리) 지점의 경우 2014년에는 지름 1㎜ 미만의 모래가 51.\n 3%를 차지했으나, 지난해 조사에서는 20.\n 6%로 줄었다.\n 반면, 지름 1~2㎜ 모래는 39.\n 4%에서 43.\n 2%로, 지름 2㎜ 이상의 모래는 9.\n 3%에서 33.\n 4%로 늘었다.\n  영주댐 하류 내성천의 다른 지점도 상황은 비슷했다.\n 오신교 지점도 지름 1㎜ 미만의 모래는 2014년 50.\n 5%에서 지난해 32.", "output": "영주댐 건설에 반대해온 '내성천의 친구들'은 지난해 11월 성명을 내고 2016년 7월과 2017년 10월, 2019년 9월 등 세 차례 담수 과정에서 영주댐 벽체 동일한 위치에서 누수 현상이 관찰됐다고 밝혔다. 이 단체는 영주댐이 활성단층으로 추정된 옥천단층이 지나가는 지반 위에 건설됐고 댐 하부를 지나가는 주 단층의 폭이 30m에 이른 것이 원인이라고 주장했다. 또한 영주댐 건설 후 주변 15㎞ 반경에서 지진이 7차례 일어났다며 건설 이전 30년 동안 같은 구간 내 지진이 1회에 불과했던 것과 큰 차이가 있다고 지적했다. 한편 멸종위기 야생생물 I급 민물고기인 흰수마자가 내성천에서 급감한 것이 영주댐 건설과 관련이 있다는 주장도 나오고 있다."}, {"kind": "F6", "id": "grm2207080034782", "input": "스능국어보기전에 각성이필요하다", "output": "수능 국어 보기 전에 각성이 필요하다."}, {"kind": "F5", "id": "REPORT-news_r-02608-00001", "input": "평양 김일성 광장 옆에 있는 외무성은 북한 사회에서 신비로운 곳이다.\n  외무성 소속 인사들은 해외여행뿐 아니라 국외 거주까지 허락된다.\n  북한 여성들은 외무성에 대한 막연한 환상 때문에 외교관과의 결혼을 꿈꾸기도 한다.\n  그런데 최근 이 위풍당당한 기관의 위상이 흔들리는 변화가 생겼다.\n  외무성 수장 이용호 외무상이 갑자기 교체됐다.\n  후임자인 이선권은 전임 외무상들만큼의 위상을 가진 인물이 아니다.\n  이용호는 외무상이 되기 전에 영국 대사였다.\n  런던의 북한 대사관저를 방문했을 때 그는 북한 지도자의 초상화가 걸려 있는 널찍한 응접실에서 나를 맞이했다.\n  그는 강경한 메시지를 전하면서도 여유만만한 미소를 띠었고 완벽한 영어를 구사했다.\n  그는 견문이 넓고, 정보에 밝았으며, 북한 대사관을 거쳐 간 그 어떤 인사보다도 영국 정부의 동향을 제대로 이해했다.\n  추측하자면 이용호의 자리를 대신한 이선권 외무상은 훨씬 강경한 태도로 업무를 수행할 것 같다.\n  그는 까칠한 느낌을 주는 성격을 지녔다.\n  이 인사가 외교에 어떤 영향을 미칠지는 아직 모른다.\n  이선권 외무상이 북한 외교 정책에 영향력을 행사할 수 있는지도 의문이다.\n  아직 두 가지 중요한 사항이 파악되지 않았다.\n  첫째, 북한 수뇌부가 외교 정책에 대해 논의할 기관이 외무성일지, 김형준 부장이 새로 임명된 조선노동당 중앙위원회 국제부일지 알 수 없다.\n  둘째, 외무성이 북한 외교의 주도권을 갖는 경우라도 이선권 외무상이 실질적인 업무를 담당하게 될지 여부가 불투명하다.\n  북한 외무상에 실권이 없고 실질적인 권력은 외무성 제1부상이 행사하는 경우가 꽤 있었다.\n  2007년 말 외무성에서 박의춘 외무상을 만났다.\n  당시 그는 75세 노인이었고, 우리는 호의적인 분위기에서 몇 마디 대화를 나눴다.\n  그는 정치적인 사안은 언급하려 하지 않았다.\n  박의춘의 전임자이며 거의 모습을 드러내지 않았던 백남순도 실세가 아니기는 마찬가지였다.\n  박의춘과 백남순이 외무상을 지낼 때 실제 외교 업무를 담당했던 인물은 강석주 제1부상이었다.\n  이번에도 같은 상황이 전개될까? 의전상으로는 이선권 외무상이 최선희 제1부장의 상관이지만, 최선희 부장은 외무상보다 외교 경력이 더 많고 기질도 강하다.\n  또한 외무상 임명 전 이선권의 지위는 그의 전임자인 이용호가 외무상에 임명될 당시의 지위보다 낮았다.\n  따라서 실질적인 변화는 이선권이 이용호의 실권을 대체하는 것이 아니라, 경험 많고 온건한 이용호가 물러나는 대신 최선희 부장이 북미 관계를 직접 담당하게 될 가능성이 커 보인다.", "output": "평양 김일성 광장 옆 외무성의 수장 이용호 외무상이 갑자기 교체되고 후임자인 이선권은 전임 외무상들만큼의 위상을 가진 인물이 아니다. 이용호는 외무상이 되기 전에 영국 대사였으며 완벽한 영어를 구사하고 견문이 넓고 정보에 밝았던 인물로, 추측하자면 이선권 외무상은 훨씬 강경한 태도로 업무를 수행할 것 같다. 박의춘과 백남순이 외무상을 지낼 때 실제 외교 업무를 담당했던 인물은 강석주 제1부상이었던 것처럼, 이번에도 실질적인 변화는 이선권이 이용호의 실권을 대체하는 것이 아니라 경험 많고 온건한 이용호가 물러나는 대신 최선희 부장이 북미 관계를 직접 담당하게 될 가능성이 커 보인다."}, {"kind": "F5", "id": "REPORT-news_r-03456-00001", "input": "신종코로나에도 전동킥보드 이용률↑신종 코로나 바이러스는 공유경제에 직격탄을 날렸을까.\n  바이러스 확산 초기 남이 쓰던 물건이나 장소를 공유하는 소비 방식에 대한 우려가 극심했지만, 승차공유·모빌리티 서비스에서는 ‘신종 코로나’의 영향력이 제한적인 것으로 나타났다.\n   10일 전동킥보드 공유 서비스인 ‘킥고잉’을 운영하는 올룰로에 따르면 신종 코로나 확산 이후(1월 28일~2월 3일) 이용 건수는 확산 직전 주(1월 14~20일)에 비해 14.\n 33% 늘어난 것으로 나타났다.\n  킥고잉은 킥보드 6000대, 회원 수 44만명을 보유한 국내 최대 킥보드 공유 플랫폼이다.\n  신종 코로나 확산에 대한 우려가 커졌던 지난달 29일에도 전날 대비 이용자가 11% 늘었으며 그 다음 날인 30일에도 이용자가 7% 늘었다.\n  최영우 올룰로 대표는 “날씨 등 변수가 많아 신종 코로나만으로 이용 건수가 늘었다고 단정하기는 어렵다”며 “확실한 것은 신종 코로나 때문에 공유 킥보드 이용자가 줄지는 않았다는 것”이라고 설명했다.\n  쏘카·타다 \"신종코로나 영향 없다\"  다른 모빌리티 서비스도 비슷한 상황이다.\n  쏘카에 따르면, 차량 1만2000여 대를 보유한 카쉐어링 업체 쏘카의 경우 아직까지 이용 건수에 큰 변화가 없다.\n  신종 코로나 확산 전후 이용 건수는 날짜별로 ±1~2%를 오간다.\n  자회사인 VCNC가 운영하는 렌터카 기반 차량호출 서비스 '타다'도 같은 기간 하루 탑승객 이용 건수가 비슷한 추이를 보였다고 한다.\n    택시 기반 모빌리티 서비스인 마카롱 택시도 신종 코로나 확산 전 대비 최근 호출 건수가 43% 늘었다.\n  서비스 운영사인 KST모빌리티 관계자는 “설 연휴 직후에는 호출 건수가 급감했으나 시간이 지나자 오히려 급격히 늘고 있는 상황”이라고 말했다.\n   주요 상권 유동인구는 줄어 모빌리티 서비스 이용자 증가 현상은 신종 코로나 확산 우려로 유동인구가 줄어든 점을 감안하면 의외의 일이다.\n  실제 ‘서울 열린데이터 광장’에 공개된 서울 내국인 생활인구 (서울시가 KT 통신데이터를 활용해 시간대별로 해당 지역에 있는 사람 수를 추정한 데이터)를 분석한 결과 신종코로나 확산 이후 서울 주요 상권의 생활인구는 감소했다.\n   서울 주요 상권 평균 생활인구 수를 신종 코로나 발생 전(1월 16~21일)과 발생 후(1월 30~2월 4일)로 나눠 비교해보니 명동역이 있는 중구 명동의 생활인구는 11.\n 8% 줄었다.", "output": "신종 코로나 바이러스 확산에도 전동킥보드 공유 서비스 이용률이 증가했다. 올룰로에 따르면 킥고잉 이용 건수는 확산 이후(1월 28일~2월 3일) 확산 직전 주(1월 14~20일)에 비해 14.33% 늘었다. 쏘카와 타다는 이용 건수에 큰 변화가 없었고, 마카롱 택시는 확산 전 대비 최근 호출 건수가 43% 늘었다. 서울 주요 상권의 생활인구는 감소한 것으로 나타났다."}, {"kind": "F5", "id": "REPORT-news_r-01682-00001", "input": "마이크로소프트(MS)의 빌 게이츠, 애플의 아이폰을 만든 고(故) 스티브 잡스, 수억명의 사용자를 거느린 페이스북 창업자 마크 저커버그.\n  이들의 공통점은 20대 나이에 세계를 이끌어가는 기업을 일궈냈다는 점이다.\n  빌 게이츠는 20세에 MS를 세웠고 잡스는 21세에 애플컴퓨터를 만들었다.\n  저커버그는 20세부터 페이스북 최고경영자(CEO)였다.\n   20대 '황금기'가 지나면 성공의 꿈을 접어야 하는 걸까.\n  정답은 '그렇지 않다(No)'이다.\n  오히려 연륜이 있는 사업가가 창업 시 성공 확률이 더 높았다는 연구 결과가 이를 뒷받침한다.\n   미국 매사추세츠공과대학(MIT) 피에르 아주래이 교수 등이 발표한 ‘연령과 고성장 기업가정신’ 논문에 따르면 2007∼2014년 미국에서 1명 이상의 직원을 고용한 스타트업(신생 벤처기업)의 창업가가 창업한 나이는 평균 41.\n 9세였다.\n  성장률 상위 0.\n 1%인 고성장 스타트업 창업가의 경우 평균 45세였다.\n  20~30대가 주축일 것으로 보이는 스타트업 창업자도 실제는 40대가 많았단 얘기다.\n  연령대가 높은 그룹은 창업 후 성공 가능성이 높았다는 분석도 나왔다.\n  연구에 따르면 창업을 한 뒤 기업을 상장(IPO)시키거나 되팔아 투자금을 성공적으로 회수한(Exit) 비율을 보면 50대 창업가가 30대 창업가보다 1.\n 8배 높았다.\n  연구팀은 성공 비결을 '경험'에서 찾았다.\n  아주래이 교수는 \"연령이 높은 창업가들은 사업 경험이 상대적으로 풍부했고 해당 산업에 대한 이해가 높았다\"며 \"이것이 문제를 해결하는 데 도움을 준 것으로 보인다\"고 분석했다.\n   산업 분야가 아니더라도 예술·발명 등에서 늦깎이 출발을 했지만 결국 성공을 거둔 인물은 많다.\n  경제전문지 비즈니스 인사이더는 '대기만성형' 인물 24인을 소개했다.\n  이 중 대표 인물 5명을 간추려 조명한다.\n    ①피겨스케이터→기자→사업가…40세에 패션 입문한 베라 왕   베라 왕(70)은 마흔에 패션업계에 뛰어들어 세계적인 사업가로 성공했다.\n  포브스에 따르면 지난해 그의 자산은 4억6000만 달러(5327억원)다.\n  그는 어린 시절 피겨스케이팅 선수로 전미 선수권에 출전하지만, 대표로는 발탁되지 못했다.\n  그 후 미국 패션잡지 보그에서 기자로 일하다가 퇴사, 랄프 로렌에서 디자인 디렉터를 맡았다.\n  그리고는 자신의 이름을 딴 브랜드 '베라 왕'을 설립하게 된다.\n   그의 트레이드마크가 웨딩드레스가 된 계기는 단순하다.", "output": "빌 게이츠, 스티브 잡스, 마크 저커버그 등이 20대에 세계적 기업을 일궜지만, MIT 피에르 아주래이 교수 등의 '연령과 고성장 기업가정신' 논문에 따르면 2007∼2014년 미국 스타트업 창업가 평균 창업 나이는 41.9세, 성장률 상위 0.1% 고성장 스타트업 창업가는 평균 45세였다. 창업 후 상장(IPO)이나 엑시트(Exit)로 투자금을 회수한 비율은 50대 창업가가 30대보다 1.8배 높았으며, 연구팀은 성공 비결을 풍부한 사업 경험과 산업 이해도에서 찾았다. 비즈니스 인사이더는 마흔에 패션업계에 뛰어들어 지난해 자산 4억6000만 달러(5327억원)를 기록한 베라 왕 등 '대기만성형' 인물 24인을 소개했다."}, {"kind": "F5", "id": "REPORT-news_r-04631-00001", "input": "흔한데 잘 모르는 점액낭염메이저리그(MLB) 특급 투수인 맥스 셔저(워싱턴 내셔널스)는 지난해 등 쪽에 뻐근함을 느껴 받은 정밀 검진에서 ‘견갑흉부 점액낭염’이란 진단을 받았다.\n  팔뼈와 몸통을 연결하는 오른쪽 어깻죽지에 염증이 생긴 것이다.\n  당시 셔저는 ‘돌이 들어간 신발을 신고 달리는 것 같다’며 통증을 호소했다.\n  　점액낭은 피부와 뼈 사이에서 마찰·압력을 줄여 완충 작용을 하고 관절의 움직임을 원활히 하는 점액 주머니다.\n  인천성모병원 정형외과 송광연 교수는 “평소에는 점액의 양이 매우 적어 만져지지 않지만 반복적으로 자극이 가해져 염증이 생기면 물이 차고 부풀어 오른다”며 “점액낭염은 환자가 꽤 많지만 잘 알려지지 않은 질환”이라고 말했다.\n  건강보험심사평가원 질병 통계에 따르면 지난해 어깨 점액낭염으로 진단받은 환자는 12만여 명, 무릎 점액낭염 환자는 4만7000여 명이었다.\n  　점액낭은 모든 관절 주변에 정상적으로 존재하는 물주머니다.\n  그중 마찰이 잦은 어깨·무릎·엉덩이뼈·발목 부위의 점액낭에 염증이 잘 생긴다.\n  어깨는 체중 부하를 받지 않는 부위지만, 팔을 머리 위로 올리거나 회전하는 반복적인 운동을 하면 스트레스가 전해져 염증이 생길 수 있다.\n  스포츠 활동을 하며 팔꿈치에 충격이 지속해서 가해지거나 팔꿈치를 책상에 괴는 습관이 있을 땐 팔꿈치에 점액낭염이 생긴다.\n  팔꿈치를 구부렸을 때 통증이 심해지는 특징이 있다.\n   지난해 어깨·무릎 환자 16만 명 넘어 사무실에서 오랫동안 앉아 있는 사람의 경우 의자와 닿는 엉덩이뼈 쪽에 점액낭염이 흔하다.\n  쿠션을 사용하면 마찰을 줄일 수 있다.\n  겨울에 부츠를 자주 신는 여성은 복숭아뼈 부위가 마찰로 자극받아 점액낭염이 생기는 경우가 있다.\n  송 교수는 “점액낭염은 생활습관이나 과한 운동, 직업 특성 때문에 발병하는 경향이 있다”며 “노화가 주요 원인이 아니므로 젊은 연령층에서도 흔하다”고 말했다.\n  　무릎의 점액낭염은 퇴행성 관절염이라 여겨지는 경우가 적지 않다.\n  하지만 두 질환에는 차이가 있다.\n  송 교수는 “점액낭염은 말랑말랑한 물주머니가 만져지면서 열감이 느껴지고 눌렀을 때 통증(압통)이 있다.\n  가만히 있을 때도 통증이 있다”며 “상대적으로 급성으로 증상이 생기며 통증이 악화한다는 점에서 관절염과 다르다”고 말했다.\n  　무릎에 생긴 부종이 점액낭염 때문인지 확인하는 방법은 이렇다.\n  먼저 양쪽 무릎을 편안하게 편 상태에서 힘을 주지 말고 무릎의 슬개골 위를 살짝 눌러 본다.", "output": "메이저리그 투수 맥스 셔저가 견갑흉부 점액낭염 진단을 받은 사례를 중심으로 점액낭염이 소개됐다. 점액낭은 관절 주변에서 완충 작용을 하는 점액 주머니로, 반복적 자극으로 염증이 생기면 물이 차고 부풀어 오른다. 건강보험심사평가원 통계에 따르면 지난해 어깨 점액낭염 환자는 12만여 명, 무릎 점액낭염 환자는 4만7000여 명이었다. 인천성모병원 정형외과 송광연 교수는 점액낭염이 생활습관이나 과한 운동, 직업 특성 때문에 발병하는 경향이 있어 노화가 주요 원인이 아니므로 젊은 연령층에서도 흔하다고 말했다."}, {"kind": "F5", "id": "REPORT-news_r-01079-00001", "input": "청와대가 검찰의 조국 수사 인권 침해와 관련해 조사해 달라는 내용의 협조 공문을 국가인권위로 보냈다.\n  노영민 대통령 비서실장 명의였는데 청와대는 “인권위가 ‘실명으로 진정을 접수해야 조사할 수 있다’고 밝혀왔기 때문”이라고 설명했다.\n  이로 인해 청와대가 진정서를 냈다고 알려졌다.\n  야권과 학계에선 “청와대가 특정인을 위해 쓸 수 있는 모든 제도를 다 쓰겠다는 것으로 염치없는 일”이란 비판이 나왔다.\n  그러자 청와대는 “진정은 아니었다”고 했다.\n  청와대가 ‘조국 전 법무부 장관의 수사 과정에서 인권 침해가 발생한 데 따른 국가인권위 조사를 촉구한다’는 국민청원에 따라 노 실장 명의로 인권위에 공문을 보냈다고 밝힌 건 13일 오전이었다.\n  해당 청원은 지난해 10월 15일 이후 한 달간 22만6434명이 동의해 청와대의 공식 답변 요건(20만 명 이상)을 넘어선 상태였다.\n     청와대 강정수 디지털소통센터장은 이날 오전 청와대 페이스북 계정 등 소셜네트워크서비스(SNS)를 통해 이런 사실을 알리며, 노 실장 명의로 공문을 보낸 데 대해 “인권위가 ‘참고로 인권위법 제32조 제1항 제6호에 따라 익명으로 진정이 접수될 경우 진정 사건을 각하하도록 규정하고 있어 실명으로 진정을 접수해야 조사할 수 있다’고 밝혔다”고 전했다.\n  그러면서 “검찰의 인권 침해와 관련해 2014년 1월 1일부터 2019년 10월 말까지 인권위에는 938건의 진정이 접수됐다”고 했다.\n  이번 건을 진정으로 인식했을 수 있다는 의미다.\n  이번 청와대의 조치가 인권위엔 압박으로 여겨질 수 있다.\n  인권위법은 진정이나 민원 또는 직권에 의해 사건을 조사하도록 규정했다.\n  인권위는 청와대로부터 접수된 진정이 “(법상) 진정이 아니다”면서도 “내부 절차와 관련법에 따라 검토 예정”이라고 했다.\n  조사 착수 여부나 공문의 효력에 대해선 함구했다.\n  야권에선 강하게 성토했다.\n  김성원 한국당 대변인은 “조국 임명을 철회하라는 청원에 대해선 임명권은 대통령에게 있다며 딱 잘라 거절한 청와대”라며 “돌연 조국 가족은 구하겠다고 ‘인권 침해’ 운운하며 팔을 걷어붙이고 나선 모양새가 우습다 못해 기가 찰 지경”이라고 말했다.\n  권성주 새로운보수당 대변인도 “지난해 12월 20만 명을 넘었을 때도 지켜보겠다던 청와대가 무엇 때문에 이 시점에 인권위에 송부하는가”라며 윤석열 검찰총장에 대한 압박으로 해석했다.\n  진중권 전 동양대 교수는 “조 전 장관이 인권 침해를 당했다며 청와대가 진정하는 건 사회적 약자를 위해 만든 인권위를 고위 공직자 비리 세탁에 이용하려는 나쁜 일”이라고 했다.", "output": "청와대가 검찰의 조국 수사 인권 침해와 관련해 조사해 달라는 내용의 협조 공문을 노영민 대통령 비서실장 명의로 국가인권위에 보냈다. 청와대는 인권위가 실명으로 진정을 접수해야 조사할 수 있다고 밝혀왔기 때문이라고 설명했으나, 야권과 학계에서는 특정인을 위해 제도를 악용하는 것이라는 비판이 나왔다. 청와대는 이번 건이 진정은 아니었다고 해명했으며, 인권위는 법상 진정이 아니면서도 내부 절차와 관련법에 따라 검토 예정이라고 밝혔다. 김성원 한국당 대변인과 권성주 새로운보수당 대변인, 진중권 전 동양대 교수 등은 청와대의 조치를 강하게 비판했다."}, {"kind": "F6", "id": "aud2210190033940", "input": "오케리 다시 얘기해 돌아아가 보자", "output": "오케이 다시 얘기해 돌아가 보자."}, {"kind": "F5", "id": "REPORT-news_r-03168-00001", "input": "자유한국당이 ‘종로 블랙홀’에 걸려 들었다.\n  인적쇄신, 보수통합 등으로 이미지 변신을 시도하던 한국당이 황교안 대표의 종로 출마 등을 두고 옴짝달싹 못하고 있어서다.\n   새해초인 1월 3일 황 대표는 “수도권 험지에 출마하겠다”고 밝혔다.\n  당시 분위기는 나쁘지 않았다.\n  “황 대표가 희생을 각오했다”는 여론도 지배적이었다.\n  황 대표의 험지로는 종로가 1순위로 부상했다.\n  이낙연-황교안의 종로 빅매치도 초읽기에 들어가는 듯싶었다.\n    이낙연 전 총리는 기선을 뺏기지 않겠다는 듯, 지난달 23일 종로 출마를 공식화했다.\n  하지만 황 대표는 무려 34일째 오리무중이다.\n  이제는 \"황 대표의 ‘눈치 보기’가 이번 총선의 한국당 최대 악재\"라는 말까지 나오고 있다.\n    종로에 묻힌 물갈이 전략한국당은 총선 전략으로 ‘희생을 통한 혁신’을 내세웠다.\n  당 간판들의 희생을 발판삼아 ‘문재인 심판론’에 올라탄다는 전략이었다.\n  ‘TK 물갈이론’과 ‘수도권 중진 차출론’도 이런 맥락에서 나왔다.\n  하지만 황 대표가 갈팡질팡하자 \"험지에 출마하라\"는 당의 권고를 중진들은 무시하고 있다.\n  홍준표 전 대표는 6일 페이스북에 “현직 대표는 꽃신 신겨 양지로 보내고, 전직 대표는 짚신 신겨 사지로 보낸다”고 꼬집었고, 김태호 전 경남지사 역시 이날 페이스북에 \"지금 김태호가 떠받들어야 할 민심은, 바로 고향의 민심\"이라고 했다.\n   물갈이 1순위로 지목된 TK(대구ㆍ경북) 의원들은 “황 대표는 종로를 피하면서 왜 TK 희생만 강요하냐”고 반발했다.\n  경북 안동이 지역구인 김광림 최고위원은 이날 최고위에서 “TK가 봉이냐는 말이 지역신문 헤드라인을 장식한다”고 했다.\n  황 대표가 참석한 공식 석상에서 처음 나온 ‘TK 반기’다.\n   스케줄도 꼬였다.\n  한국당은 당초 1월 말까지는 공천 문제를 마무리짓고 진용을 짠다는 구상이었다.\n  한 공관위원은 “한창 총선 전략을 짜고, 후보를 지원할 시점인데, 다들 황 대표의 출마지에만 매달려 있다”며 “벌써부터 종로 바닥을 휘젓고 다니는 이낙연 전 총리의 모습과 대비된다”고 했다.\n  한국당은 이날 의원총회를 열고 새 당명을 정하려 했지만 이도 무산됐다.\n  만약 황 대표의 종로행이 불발로 끝나면 향후 컷오프(공천배제) 등 공천 파동 충격이 장기화될 것이란 관측도 있다.\n   겁쟁이 프레임으로 이미지 타격 황 대표를 겨냥한 여당의 ‘겁쟁이 프레임’은 황 대표와 한국당 양측에 짐이 되고 있다.", "output": "자유한국당이 황교안 대표의 종로 출마 여부를 두고 갈팡질팡하면서 '종로 블랙홀'에 빠졌다는 평가가 나온다. 황 대표는 1월 3일 수도권 험지 출마를 밝혔지만 이낙연 전 총리가 지난달 23일 종로 출마를 공식화한 뒤 34일째 출마지를 정하지 못하고 있다. 이에 홍준표 전 대표는 6일 페이스북에 \"현직 대표는 꽃신 신겨 양지로 보내고, 전직 대표는 짚신 신겨 사지로 보낸다\"고 꼬집었고, 김광림 최고위원은 최고위에서 \"TK가 봉이냐는 말이 지역신문 헤드라인을 장식한다\"고 했다. 한국당은 이날 의원총회를 열고 새 당명을 정하려 했지만 이도 무산됐다."}, {"kind": "F5", "id": "REPORT-news_r-03150-00002", "input": "가격도 3.\n 3㎡당 평균 1700만원대로 일반 아파트에 비해 30% 이상 저렴하게 책정돼 있다.\n  이에 따라 전용 59㎡의 경우 4억원대면 구입이 가능하다.\n  이는 송파구의 같은 크기 아파트 매매가가 10억원이 넘는다는 점을 감안하면 파격적으로 낮은 가격이다.\n  이안 송파 이스트플러스 관계자는 “이 때문에 지난 1월 문을 연 홍보관에는 청약통장 없이 주변 시세의 절반 수준 가격에 내 집을 마련하려는 수요자들의 발길이 끊이지 않고 있다”고 말했다.\n   주거환경이 쾌적하다는 점도 이안 송파 이스트플러스 홍보관에 방문객들이 몰리는 또 다른 이유로 꼽힌다.\n  이 아파트는 우선 전 세대 4베이(bay) 구조, 남향 배치로 채광과 환기를 극대화했다.\n  또 동간 거리를 충분히 확보해 개인의 프라이버시를 강화하고 일조량과 통풍성도 강화했다.\n  여기에다 단지 동쪽에는 천마산근린공원이, 남쪽엔 남한산성이 있는 숲세권 단지다.\n  송파의 대표적인 올림픽공원과 거여공원도 가깝다.\n   교통도 편리하다.\n  이안 송파 이스트플러스는 우선 지하철 5호선 거여역이 걸어서 1분 거리에 있는 초역세권 프리미엄 단지다.\n  여기에다 서울외곽순환도로와 중부고속도로가 인접해 있어 서울 중심지는 물론 외곽지역을 편리하게 오갈 수 있다.\n   교육여건도 좋다.\n  먼저 ‘초품아’(초등학교를 품은 아파트) 단지로 단지에서 100m 거리에 영풍초등학교가 있다.\n  또 단지 주변에 오주중·송파중·오금고·문정고교 등이 인접해 있다.\n   공원·남한산성 가까운 숲세권단지 주변 생활 기반시설도 잘 구축돼 있다.\n  이 아파트는 송파와 잠실을 한꺼번에 누릴 수 있는 더블 생활권 단지로 인근 위례신도시와 강남권의 고품격 생활 인프라까지 편리하게 누릴 수 있다.\n  롯데타워·롯데월드·가든파이브 등 대형 상권은 물론 가락동 농수산물도매시장·동남권유통센터·동부법조단지 등 상업·업무시설 이용이 쉽다.\n  짧은 사업 기간도 매력이다.\n  지역주택조합 아파트는 인허가에만 보통 8~10년 소요되는 재개발·재건축 아파트와는 달리 통상 4~5년 정도면 입주가 가능하다.\n  여기에다 최근 주택법이 개정되면서 자금관리 등 사업 안정성과 투명성이 높아졌다.\n  이안 송파 이스트플러스 관계자는 “교통·교육·쇼핑 등 생활 인프라가 풍부하고 입지여건이 뛰어난 데다 미래가치가 뛰어나 실수요자는 물론 투자자의 관심이 크다”고 말했다.\n  홍보관은 서울 지하철 2호선 잠실역 인근 롯데타워 뒤쪽에 운영 중이다.", "output": "이안 송파 이스트플러스는 3.3㎡당 평균 1700만원대로 일반 아파트보다 30% 이상 저렴하게 책정돼 전용 59㎡의 경우 4억원대면 구입이 가능하다. 전 세대 4베이 구조와 남향 배치, 천마산근린공원과 남한산성 인접, 지하철 5호선 거여역 1분 거리, 영풍초등학교 100m 거리 등의 주거·교통·교육 여건을 갖췄다. 지역주택조합 아파트는 통상 4~5년이면 입주가 가능하며, 홍보관은 서울 지하철 2호선 잠실역 인근 롯데타워 뒤쪽에 운영 중이다."}, {"kind": "F5", "id": "REPORT-news_r-02590-00001", "input": "미국 국제무역위원회(US ITC) 불공정수입조사국이 SK이노베이션이 지난해 ITC 재판부에 제기한 두 건의 요청에 대해 ‘기각’ 결정을 내려야 한다는 의견을 ITC 재판부에 전달한 것으로 29일 확인됐다.\n  미국 ITC는 독립적인 준사법 연방기관으로 독자적인 조사권을 가지고 있으며, LG화학이 SK이노베이션을 상대로 제기한 배터리 기술유출 특허 침해 소송을 조사하고 있다.\n  변호사 등 전문가 집단으로 꾸려진 ITC 불공정수입조사국은 접수된 사건에 대한 조사 결과와 법률적 판단 등을 담아 재판부에 제출한다.\n  ITC 행정판사는 조사국 의견을 상당부분 참고해 최종 결론을 내리는 것으로 알려져 있다.\n  ITC 불공정수입조사국 의견서에 따르면 SK이노베이션은 지난해 12월 중순 ITC에 두 건의 요청서를 냈다.\n  SK이노베이션은 당시 “LG화학이 침해를 당했다고 주장한 배터리 영업비밀 중에서 20가지 이상을 제외해 달라”고 요청했다.\n  이와 별도로 제출한 요청서에선 “소송 요건이 성립되지 않는 부분이 있으니 소송을 더는 끌지 말고 약식 판결을 내려달라”고 주장했다.\n  이에 대해 ITC 불공정수입조사국은 SK이노베이션이 제기한 요청 두 건 모두에 대해 ‘기각(deny)’ 입장을 담은 의견서를 재판부에 보냈다.\n  불공정수입조사국은 의견서에서 “SK이노베이션이 LG화학이 침해당했다고 주장하고 있는 영업비밀에 대해서 더 이상 항의하지 않았다”고 적었다.\n  이번 의견서를 통해 LG화학이 침해를 당했다고 주장한 영업비밀이 137개에 이른다는 사실도 새로 확인됐다.\n  의견서에선 SK이노베이션이 2022년 가동을 목표로 미 조지아주에 짓고 있는 배터리 공장도 언급됐다.\n  SK이노베이션이 “(LG화학이 영업비밀을 침해했다고 문제를 제기한) 배터리 기술을 조지아주 공장 가동을 위해 수입하지 않을 것”이라고 주장한 것에 대해 의견서는 “SK이노베이션이 확정적으로 이를 증명하지 못했다”고 적시했다.\n  이에 앞서 ITC 불공정수입조사국은 지난해 11월 LG화학이 제기한 조기패소 판결 요청에 대해서도 재판부에 두 차례에 걸쳐 “적절하다”는 의견을 전달했다.\n  ITC 불공정수입조사국은 당시 “SK이노베이션이 ITC의 포렌식 명령을 준수하지 않아 증거를 훼손했다고 보는 게 타당하다”고 밝혔다.\n  이에 대해 SK이노베이션은 “일부 증거가 보존되지 못했지만, 고의성은 없었다”는 입장이다.\n  SK이노베이션은 ITC에서 “기술 탈취는 없었다”는 주장을 이어오고 있다.", "output": "미국 국제무역위원회(US ITC) 불공정수입조사국이 SK이노베이션이 지난해 ITC 재판부에 제기한 두 건의 요청에 대해 '기각' 결정을 내려야 한다는 의견을 ITC 재판부에 전달한 것으로 29일 확인됐다. SK이노베이션은 LG화학이 침해를 당했다고 주장한 배터리 영업비밀 중 20가지 이상을 제외해 달라고 요청했고, 별도 요청서에선 소송 요건이 성립되지 않는 부분이 있으니 약식 판결을 내려달라고 주장했다. 불공정수입조사국은 의견서에서 SK이노베이션이 LG화학이 침해당했다고 주장하고 있는 영업비밀에 대해 더 이상 항의하지 않았다고 적었으며, LG화학이 침해를 당했다고 주장한 영업비밀이 137개에 이른다는 사실도 새로 확인됐다. 의견서는 SK이노베이션이 2022년 가동을 목표로 미 조지아주에 짓고 있는 배터리 공장에 대해 배터리 기술을 수입하지 않을 것이라는 주장을 확정적으로 증명하지 못했다고 적시했다."}, {"kind": "F5", "id": "REPORT-news_r-04099-00002", "input": "그 당시부터 마는 우리의 인기 음식이었다는 방증이기도 하다.\n  마에 산에서 나는 장어라는 별명이 붙은 것은 그만큼 우리의 원기를 북돋아서 체력을 도와주는 것에서 비롯되었다.\n  이것은 우리나라뿐만 아니라 마를 먹을 줄 아는 외국에서도 알려진 사실이다.\n  아프리카의 자메이카라는 나라에서도 역시 마를 즐긴다.\n  이 나라의 마는 얌이라 불리는데, 자메이카 얌이 세계적으로 유명해진 것이 우사인 볼트 덕이다.\n  세계에서 가장 빠른 사나이인 우사인 볼트가 “나의 힘의 원천은 얌 덕분이다”라고 한 인터뷰 때문에 이제는 아예 국민 간식이 되었다.\n  마는 노화를 방지하는 생리활성 물질이 굉장하고, 체력을 키워주며, 소화기 특히 장의 기능을 좋아지게 하는 성분들이 풍부하다.\n  이런 성분들이 들어 있는 핵심적인 부분이 끈적이는 곳이다.\n  마를 잘라보면 끈적끈적한 물질들이 나와 들러붙는다.\n  끈적이는 성분에 들어 있는 뮤신이 여러 역할을 해서 마의 효능에 큰 영향을 미친다.\n  뮤신은 당단백질로 소화기관에서는 소화기 점막을 보호하고 소화 연동운동을 하는 윤활제 역할을 하며, 위산과다와 위궤양을 치료하는 성분으로 작용한다.\n  또한, 이 성분은 정력을 높이는 자양강장제로 쓰인다.\n  우리가 먹는 여러 음식 중에서 끈적이는 것이 나오는 것들이 건강에 좋은 것들이 많은 점은 주목할 필요가 있다.\n  미역이나 다시마를 치대보면 끈적이는 점액들이 나오고 이는 수용성 식이섬유로 피를 맑게 해 준다.\n  메주를 띄우거나 청국장, 낫또를 휘휘 저으면 끈적한 실 같은 물질들이 막 나오고, 뿌리채소인 연근도 자르면 끈적이는 것이 나온다.\n  오크라 모로헤이야 같은 외국에서 익숙한 채소 중에서도 끈적이는 물질이 나오는 것들이 있다.\n  모두 장에도 좋고, 면역도 도와주는 음식들이다.\n  마 하면 떠오르는 원기회복과 체력을 담당하는 성분은 아르기닌과 디오스게닌이다.\n  아르기닌은 부신의 호르몬을 왕성하게 만들어 몸의 생리대사기능을 끌어 올린다.\n  아르기닌은 성장호르몬 분비를 도와 항노화 기능이 있고, 혈관 내 산화질소 NO의 양을 늘려서 혈관 확장 및 순환 기능을 하게 하는 성분이기도 하다.\n  디오스게닌은 성호르몬 관련 물질의 원료로 현대 의학에서 인공적인 성호르몬을 만드는 성분이기도 하다.\n  이 성분은 성호르몬 전구체가 되어서 DHEA가 되고, 여기서 에스트로겐이나 남성호르몬이 만들어진다.\n  이런 성분들 덕분에 힘이 폭발적으로 늘면서 혈액순환도 되다 보니 남성의 기운을 올려주는 음식으로 주목을 받게 되었다.", "output": "마는 예로부터 우리의 인기 음식이었으며 산에서 나는 장어라는 별명이 붙을 만큼 원기를 북돋아 체력을 도와주는 것으로 알려져 있다. 마를 자르면 나오는 끈적이는 성분에 들어 있는 뮤신은 소화기 점막을 보호하고 소화 연동운동을 하는 윤활제 역할을 하며 위산과다와 위궤양을 치료하는 성분으로 작용하고, 정력을 높이는 자양강장제로 쓰인다. 마 하면 떠오르는 원기회복과 체력을 담당하는 성분은 아르기닌과 디오스게닌으로, 아르기닌은 성장호르몬 분비를 도와 항노화 기능이 있고 혈관 내 산화질소 NO의 양을 늘려 혈관 확장 및 순환 기능을 하게 하며, 디오스게닌은 성호르몬 전구체가 되어 DHEA가 되고 여기서 에스트로겐이나 남성호르몬이 만들어진다."}, {"kind": "F6", "id": "aud2208080009312", "input": "줘국에 비가 내겠습니다.", "output": "전국에 비가 내리겠습니다."}, {"kind": "F5", "id": "REPORT-news_r-05527-00001", "input": "코로나19 공포에 대한민국 경제가 멈췄다.\n  체감 경기가 외환위기나 금융위기를 방불케 한다.\n  자영업자는 물론 기업들도 직원을 내보내고 급여를 깎는 등 살아남기 위해 안간힘을 쓰고 있다.\n  올해 성장률 0%대 전망이 나오는 등 거시경제 지표도 줄줄이 떨어지고 있다.\n  이런 상황을 타개하기 위해 대규모 추경 편성이 불가피해졌다.\n  이번 추경 규모는 세금 감면 등 세입 예산까지 포함하면 12조원 이상이 될 것으로 보인다.\n  이를 위해 10조원가량의 추가 적자 국채 발행을 피할 수 없을 듯하다.\n  당장 재정 악화 우려가 나올 수밖에 없다.\n  물론 세금은 필요할 때 써야 한다.\n  하지만 평소 낭비성 복지 예산을 퍼주는 대신 재정 건전성 유지에 좀 더 신경을 써왔다면 훨씬 여유 있는 대처가 가능했을 것이다.\n  “곳간에 재정을 쌓아 놓기만 하면 썩는다”며 호기를 부릴 일이 아니었다.\n  지금은 이런 잘잘못을 따질 여유조차 없을 만큼 상황이 엄중하다.\n  이왕 추경을 할 바에는 과감하고 신속하게 해야 한다.\n  위기에 빠진 경제 주체들이 쓰러진 뒤에 돈이 돌아야 무슨 소용이 있겠는가.\n  국회도 최대한 이른 시일 안에 추경안을 통과시킬 수 있도록 노력해야 한다.\n  예산 집행에서는 꼭 필요한 타깃에 효과적으로 전달될 수 있는 방안을 고민해야 한다.\n  건설 인프라 같은 전시성 사업을 통해 간접적 혜택이 돌아가는 방식은 한가할 뿐만 아니라 효율도 낮다.\n  지금은 그야말로 ‘경제의 심폐소생술’이 필요한 시점이다.\n  뜻하지 않은 사태에 빈사 상태에 빠진 취약층·중소기업·자영업자 등에 우선 또는 직접적인 혜택이 돌아가야 한다.\n  방역 강화도 시급하다.\n  방역이 안 되면 경제도 없다.\n  메르스 사태 때 공중보건 인프라와 보건의료에 대한 투자 확대 필요성이 제기됐지만, 체감할 만한 개선은 이뤄지지 않았다.\n  의료 인프라 및 인력 부족은 대구·경북의 코로나19 대응을 혼돈으로 몰아갔다.\n  필수 방역 인력 및 물자 확보, 검역 조치 강화, 피해 지역 구제 등에 대한 예산은 모자람이 없어야 한다.\n  그러나 아무리 급하더라도 옥석은 가려야 한다.\n  과거 메르스 추경 때도 본예산에서 삭감된 각 부처의 민원성 사업이 상당수 들어가는 바람에 문제가 됐다.\n  총선을 앞둔 시점에 이런 편법은 더 기승을 부릴 가능성이 있다.\n  정부·여당은 불요불급한 선심성 예산을 슬쩍 끼워 넣을 생각은 추호도 하지 말아야 한다.", "output": "코로나19 확산으로 한국 경제가 멈추고 체감 경기가 외환위기·금융위기를 방불케 하는 가운데, 올해 성장률 0%대 전망이 나오는 등 거시경제 지표가 악화해 대규모 추경 편성이 불가피해졌다. 이번 추경 규모는 세입 예산까지 포함하면 12조원 이상이 될 것으로 보이며, 이를 위해 10조원가량의 추가 적자 국채 발행이 불가피해 재정 악화 우려가 제기된다. 이왕 추경을 할 바에는 과감하고 신속하게 해야 하며, 국회도 최대한 이른 시일 안에 추경안을 통과시켜야 한다. 예산은 취약층·중소기업·자영업자 등에 우선 또는 직접적인 혜택이 돌아가도록 꼭 필요한 타깃에 효과적으로 전달해야 하고, 방역 강화를 위한 필수 방역 인력 및 물자 확보, 검역 조치 강화, 피해 지역 구제 등에 대한 예산은 모자람이 없어야 한다. 다만 과거 메르스 추경 때처럼 민원성 사업이나 선심성 예산이 끼어들지 않도록 옥석을 가려야 한다."}, {"kind": "F6", "id": "ota0000000001892", "input": "짤자란 사슬의 연속으로 이루어져 잇지만 매우 단단한 결합으로 절대 끊어질 염려없어.", "output": "짤따란 사슬의 연속으로 이루어져 있지만 매우 단단한 결합으로 절대 끊어질 염려 없어."}, {"kind": "F5", "id": "REPORT-news_r-00388-00001", "input": "수억원을 호가하는 마이크로 LED TV의 가정용 시대가 열릴까.\n    삼성전자는 5일(현지시간) 세계 최대 가전전시회인 CES2020을 이틀 앞두고 미국 라스베이거스에 위치한 시저스 팰리스 호텔에서 ‘삼성 퍼스트룩 2020’ 행사를 열었다.\n  이날 행사에서 한종희 삼성전자 영상디스플레이사업부 사장은 ‘스크린 에브리웨어(Screens Everywhere)’ 비전을 발표하며 종전보다 확대된 마이크로 LED ‘더 월(The Wall)’ 라인업을 공개했다.\n    이날 행사에서 공개된 더 월 라인업은 75ㆍ88ㆍ93ㆍ110인치 등 가정용 라인업에서 150ㆍ292인치까지 초대형까지 다양했다.\n  삼성전자는 2018년 더 월을 처음 출시하면서 100인치 이상 초대형 마이크로 LED TV만 판매해왔다.\n  라인업을 대거 확대시켜 가정용 홈 엔터테인먼트 시장까지 본격적으로 공략하겠다는 의도로 풀이된다.\n    마이크로 LED는 마이크로미터(㎛) 단위의 초소형 LED칩을 하나하나 이어 붙인 디스플레이다.\n  액정(LCD)이나 유기발광다이오드(OLED)처럼 패널이 필요하지 않다.\n  \"기존 디스플레이에 비해 밝기나 명암비가 우수하고 화질이나 색감, 시야각도 탁월하다\"는 게 삼성전자의 설명이다.\n    한종희 사장은 “더 월은 홈 엔터테인먼트 시장에서 표준이 되어가고 있다”면서 “단순히 스크린이 아닌 설치 환경에 완벽하게 녹아들어간 주거 환경의 일부로 인식되고 있다”고 설명했다.\n     실제로 이날 행사에선 마이크로 LED 스크린이 가진 특성을 살린 다양한 콘셉트의 제품을 전시했다.\n  스피커를 일체화 시킨 ‘큐브(Cube)’, 선반 위에 분할된 스크린을 얹어 다양한 사물인터넷(IoT) 기능을 선보이는 ‘셸프(Shelf)’, 화면을 사용하지 않을 땐 거울로 전환되는 ‘미러(Mirror)’ 등이 공개됐다.\n    관건은 가격이다.\n  가정용 마이크로 LED TV가 출시되어도 당장은 높은 가격을 감당하기가 쉽지 않기 때문이다.\n  지난해 8월 삼성전자가 공개한 146인치 마이크로 LED 가격은 대당 40만 달러(4억8300만원) 수준이다.\n  제품을 위한 18개 모듈과 설치비, 수수료 등을 포함한 가격이다.\n    다만 살인적인 가격은 제조원가가 서서히 안정되면서 낮아질 것으로 보인다.\n  시장조사기관 IHS마킷은 75인치 마이크로 LED 디스플레이 제조원가가 2026년에 이르면 현재의 5분의1 수준으로 떨어질 것으로 전망했다.", "output": "삼성전자가 CES2020을 앞두고 '삼성 퍼스트룩 2020' 행사에서 한종희 영상디스플레이사업부 사장이 '스크린 에브리웨어' 비전을 발표하고 75·88·93·110인치 가정용부터 150·292인치 초대형까지 확대된 마이크로 LED '더 월' 라인업을 공개했다. 삼성전자는 2018년 더 월 출시 이후 100인치 이상 초대형만 판매해왔으나 이번 라인업 확대로 가정용 홈 엔터테인먼트 시장을 본격 공략한다는 계획이다. 관건은 가격으로, 지난해 8월 공개한 146인치 마이크로 LED 가격은 대당 40만 달러(4억8300만원) 수준이며 IHS마킷은 75인치 마이크로 LED 제조원가가 2026년 현재의 5분의1 수준으로 떨어질 것으로 전망했다."}, {"kind": "F6", "id": "ext0000000055785", "input": "당시도시락에서 가장 고급 반찬이 계란 프라이였다", "output": "당시 도시락에서 가장 고급 반찬이 계란 프라이였다."}, {"kind": "F6", "id": "ext0000000113175", "input": "시중에 돈은많아졌는데 갈 곳이많지안다", "output": "시중에 돈은 많아졌는데 갈 곳이 많지 않다."}, {"kind": "F6", "id": "ext0000000121321", "input": "지휘자는 고고한 예술가의 자리에 머물지 않구 청중에게 금전 후원을 적극 권유햇다.", "output": "지휘자는 고고한 예술가의 자리에 머물지 않고 청중에게 금전 후원을 적극 권유했다."}, {"kind": "F5", "id": "REPORT-news_r-01919-00001", "input": "‘땅콩 회항’ 사건 피해자인 박창진 민주노총 전국공공운수노조 대한항공직원연대 지부장이 22일 4·15 총선 출마를 선언했다.\n 그는 이날 국회 정론관에서 연 기자회견에서 “공익 제보자이자 권력의 폭압으로부터 생존한 제게 주어진 숙명을 겸허히 받아들이겠다”며 “정의당 국회의원 비례대표 경선 출마를 선언한다”고 말했다.\n  박 지부장은 지난해 9월부터 정의당 국민의노조특별위원장을 맡고 있다.\n 내부고발자들의 총선 출사표가 줄을 잇고 있다.\n  박 지부장과 달리 대부분은 거대 양당을 택했고, 더불어민주당과 자유한국당은 일부를 직접 ‘인재’로영입했다.\n 이탄희 공익인권법재단 ‘공감’ 변호사는 지난 19일 민주당 10호 영입인사가 됐다.\n  그는 2017년 법원행정처 심의관으로 재직하던 중 이른바 ‘사법부 블랙리스트’와 진보 성향의 판사 모임인 국제인권법연구회 와해 계획 등을 폭로해 ‘양승태 대법원 사법농단’ 의혹의 불씨를 댕겼다.\n 이 변호사는 20일 라디오 인터뷰에서 “사법 농단 1호 사건이라고 할 수 있는 유해용 전 판사 사건에서 무죄 판결이 났는데, 제가 그때 화가 좀 많이 나서 결국 (총선 출마로) 마음을 굳히게 됐다”고 말했다.\n  민주당의 한 핵심관계자는 “이수진 전 수원지법 부장판사와 최기상 전 서울북부지법 부장판사의 입당도 곧 있을 예정”이라고 전했다.\n  양승태 대법원장 시절 사법행정권 남용을 고발한 이들이다.\n 산업재해 공익제보자 이종헌씨는 한국당이 지난 16일 네 번째로 영입한 인사다.\n  이씨는 2014년농약·비료제조사 팜한농 구미공장에서 근무하면서 사측의 산업재해 은폐 사실을 신고했다가 사내 불이익을 받았던 인물로, 이후 공익제보자 보호 운동에 몸담았다.\n  지난 대선에서 문재인 후보 캠프에서 활동했지만, 한국당의 설득 끝에 영입을 수락했다.\n  한국당은 공익제보자에게 공천 가산점 30%를 부여한다.\n 지난 13일 민주당 소속으로 경기 과천-의왕에 출마하겠다고 밝힌 장진수 전 행정안전부 장관 정책보좌관도 내부고발로 이름을 알린 인사다.\n  장 전 보좌관은 이명박 정부 때인 2008년 국무총리실 주무관으로 근무하면서 민간인 불법사찰 사건으로 기소된 뒤 2012년 “청와대 지시로 증거를 인멸했다”고 폭로했다.\n 이 사건으로 공직을 떠난 뒤 19대 대선 당시 문재인 후보 캠프의 총무지원팀장과 진영 행정안전부 장관 정책보좌관 등을 지냈다.\n  그는 출마 회견에서 “국회에 나 같은 공익제보자가 필요하다.", "output": "'땅콩 회항' 사건 피해자인 박창진 민주노총 전국공공운수노조 대한항공직원연대 지부장이 22일 국회 정론관 기자회견에서 정의당 국회의원 비례대표 경선 출마를 선언했다. 박 지부장은 지난해 9월부터 정의당 국민의노조특별위원장을 맡고 있다. 이탄희 공익인권법재단 '공감' 변호사는 지난 19일 더불어민주당 10호 영입인사가 됐으며, 산업재해 공익제보자 이종헌씨는 자유한국당이 지난 16일 네 번째로 영입한 인사다. 장진수 전 행정안전부 장관 정책보좌관도 지난 13일 민주당 소속으로 경기 과천-의왕에 출마하겠다고 밝혔다."}, {"kind": "F6", "id": "ext0000000103935", "input": "근데도한국당은말로는 민생을 챙기겠다면서 국회 문을걸어 잠근 채 장외에서 정부비판만하고잇다.", "output": "그런데도 한국당은 말로는 민생을 챙기겠다면서 국회 문을 걸어 잠근 채 장외에서 정부 비판만 하고 있다."}, {"kind": "F6", "id": "grm2210180117755", "input": "연간계획은 점점 모순이 발견됨", "output": "연간 계획은 점점 모순이 발견됨."}, {"kind": "F5", "id": "REPORT-news_r-05291-00001", "input": "마스크 제조업체를 하는 A씨(51)는 신종 코로나바이러스 감염증(코로나19) 확산으로 마스크 품귀현상이 벌어지자 창고에 쌓아둔 물건이 떠올랐다.\n  지난해 11월 식약처로부터 전량 폐기 명령을 받고 보관 중이던 어린이용 마스크였다.\n  물량은 5만5000장이나 됐다.\n  캐릭터가 그려진 마스크였는데 애초 허가와 다른 디자인으로 만들어 폐기 처분 명령을 받았던 터였다.\n  허가 기준에는 맞지 않으나 사용에는 문제가 없는 제품이다.\n  버리기엔 아까운 물건이었는데 욕심에 물건을 유통업체와 소매상에 팔아넘겼다.\n  가격도 올려 받았다.\n  정상적이었으면 애초 한장당 1000원(도매가 기준) 이었던 마스크도 1200원으로 올려 모두 유통업체 넘겼다.\n   A씨가 넘긴 마스크는 유통업체, 소매상을 통해 인터넷 사이트에서 거래됐다.\n  한 장당 2500원~4500원선에 소비자에게 팔렸다.\n  정부 허가가 나오지 않은 물건이었는데도 정상가의 2~3배 수준에 팔린 것이다.\n  그런데도 5만5000장이 일주일 만에 모두 팔려나갔다.\n  충남지방경찰청 지능범죄수사대는 이런 미허가 마스크를 판매하고 유통한 A씨와 유통업체·소매상을 검거, 기소 의견(사기와 약사법 위반 등 혐의)으로 검찰에 넘겼다.\n   A씨처럼 코로나19 확산을 틈타 마스크 매점·매석과 허위 판매로 부당이득을 챙기려는 업체와 업자들이 줄줄이 경찰에 검거됐다.\n  제주에서는 ‘마스크를 판다’는 허위 글을 인터넷에 올려 억대의 부당이득을 챙긴 혐의(사기)로 중국인 B씨(33)가 구속됐다.\n  B씨는 이달 초부터 사회관계망서비스(SNS)에 마스크 수십만개를 보유하고 있는 것처럼 허위 광고를 올려 중국인 4명의 구매자로부터 1억7000여 만원(8만1000개 분량)을 받아 가로챈 혐의를 받고 있다.\n  B씨는 애초 마스크를 보유하지 않았던 것으로 드러났다.\n  전북경찰청 사이버수사대도 마스크를 판다는 허위 글을 온라인에 올려 억대의 부당이득을 챙긴 C씨(36)를 검거했다.\n  C씨는 이달 초 인터넷 포털사이트 카페에 ‘마스크 생산공장을 운영 중인데 시세보다 싸게 팔겠다’는 글을 올린 뒤 중소유통업체들로부터 2억35000만원을 받아 가로챈 것으로 조사됐다.\n  경찰은 신고를 접수, 게시 글 작성자 아이피(IP) 주소 등을 추적, 지난 21일 C씨를 붙잡았다.\n  C씨는 경찰 조사에서 “빚을 갚으려고 범행을 저질렀다”고 진술했다.\n  조사 결과 C씨는 공장을 운영하지도 않고 마스크를 보유하고 있지 않은 것으로 드러났다.", "output": "마스크 제조업체를 하는 A씨(51)가 지난해 11월 식약처로부터 전량 폐기 명령을 받고 보관 중이던 어린이용 마스크 5만5000장을 코로나19 확산에 따른 품귀현상에 편승해 유통업체와 소매상에 정상가보다 올린 1200원에 팔아넘겼다. 이 마스크는 인터넷 사이트에서 한 장당 2500원~4500원선에 소비자에게 팔렸고 일주일 만에 모두 팔려나갔으며, 충남지방경찰청 지능범죄수사대는 A씨와 유통업체·소매상을 사기와 약사법 위반 등 혐의로 기소 의견으로 검찰에 넘겼다. 제주에서는 마스크를 판다는 허위 글을 올려 중국인 4명으로부터 1억7000여만원을 받아 가로챈 혐의로 중국인 B씨(33)가 구속됐고, 전북경찰청 사이버수사대도 허위 글으로 중소유통업체들로부터 2억35000만원을 받아 가로챈 C씨(36)를 검거했다."}, {"kind": "F6", "id": "ext0000000086469", "input": "또 순서상으로시각피질이나중이다.", "output": "또 순서상으로 시각피질이 나중이다."}, {"kind": "F5", "id": "REPORT-news_r-03507-00002", "input": "김형석 영화 저널리스트는 “아카데미 92년 역사가 백인, 남성, 중산층, 보수주의에서 점점 다양성의 영화제로 나아가고 있다”면서 “흑인 배우, 여성 감독, 퀴어영화 등에 수상하며 태생적으로 지녀온 장벽을 하나하나 해체해가는 과정이다.\n  ‘기생충’은 아카데미가 최후의 보루처럼 남겨놨던 언어적 장벽을 넘어, 미국 바깥 타인들의 이야기에 상을 줬다는 게 큰 의미”라 했다.\n    빈부 양극화 주제 시의 적절지난해 한국영화 최초 칸 황금종려상 이후 ‘기생충’이 일으킨 세계적 신드롬도 한 몫 했다.\n  반지하집 가족이 부잣집에 숨어드는 이 롤러코스터를 타는 듯한 영화는 코미디와 비극, 호러가 절묘하게 뒤섞여 “장르가 봉준호”란 말까지 나왔다.\n  봉 감독은 비공식 부문인 감독주간으로 처음 칸에 간 괴수 SF ‘괴물’부터 할리우드 배우와 함께한 ‘설국열차’, 슈퍼 돼지가 나오는 넷플릭스 영화 ‘옥자’ 등으로 해외 평단‧관객 사이에 팬덤을 쌓아왔다.\n   ‘기생충’의 빈부 양극화란 주제는 국경을 넘어 공감대를 얻었다.\n  골드더비 에디터 조이스 엥은 “시의적절한 영화일뿐 아니라 대중적으로 재밌다”며 “‘기생충’이 지난해 (아카데미 작품상 후보에 올랐지만 수상이 불발됐던 알폰소 쿠아론 감독의 멕시코 영화) ‘로마’와 다른 점”이라고 했다.\n    봉준호 '자식바보 아빠' 패러디 봉 감독 자신의 표현대로 “자본주의의 심장 같은 나라” 북미 반응은 더욱 뜨거웠다.\n   지난해 10월 단 3개관에서 개봉했지만, 결정적 반전에 대한 스포일러 방지, 영화에 대한 다양한 해석이 놀이처럼 퍼졌다.\n  봉 감독의 이름에 황금종려상(Palm d'Or)을 합한 ‘봉도르’, 팬덤을 뜻하는 ‘봉하이브(Bonghive)’ 등 SNS 해시태그도 유행했다.\n  북미 현지 배급사 네온이 ‘독도는 우리 땅’ 가락에 가사를 바꿔 극중 기정(박소담)이 흥얼거린 ‘제시카 징글’ 등을 적극 홍보하며 입소문은 커졌다.\n    봉 감독의 솔직한 유머도 호감을 더했다.\n  인기 토크쇼 ‘지미 팰런의 투나잇 쇼’에선 한국어 통역을 끼고도 청중을 웃겨, 통역사 샤론 최의 통역 실력까지 화제가 됐다.\n  ‘기생충’이 비영어 영화론 처음으로 미국배우조합 앙상블상 수상 무대에 올랐을 때 봉 감독이 흐뭇하게 웃으며 카메라에 배우들 모습을 담은 표정은 ‘자식을 자랑스러워하는 아빠(Proud Daddy)’ 같다며 패러디까지 나왔다.\n    \"자막 1인치\" 발언 美관객 녹였다“자막이란 1인치의 장벽을 넘으라”는 골든글로브 외국어영화상 수상 소감은 비영어 영화의 자막 읽기를 꺼리는 미국 대중들 사이에 화제가 되며 자성의 목소리마저 나왔다.", "output": "김형석 영화 저널리스트는 아카데미가 백인·남성·중산층·보수주의에서 다양성의 영화제로 나아가고 있다며, '기생충'이 언어적 장벽을 넘어 미국 바깥 타인들의 이야기에 상을 줬다는 게 큰 의미라고 했다. '기생충'은 지난해 한국영화 최초 칸 황금종려상 이후 세계적 신드롬을 일으켰고, 빈부 양극화 주제가 국경을 넘어 공감대를 얻었다. 북미에서 단 3개관으로 개봉했지만 스포일러 방지와 다양한 해석이 퍼지며 입소문이 커졌고, 봉준호 감독의 솔직한 유머와 '자막 1인치' 발언도 화제가 됐다."}, {"kind": "F5", "id": "REPORT-news_r-05321-00001", "input": "폐경 전후 건강 지키려면 폐경은 여성 건강의 분수령으로 통한다.\n  여성호르몬이 줄면서 다양한 신체적인 변화를 맞는다.\n  특히 생명과 삶의 질을 좌우하는 심장과 뼈 건강이 악화하기 쉽다.\n  고혈압·고지혈증 발병이 갑자기 늘어 심장 질환 발생 위험이 큰 데다 골량이 급감해 골다공증으로 이어진다.\n  세계 여성의 날(3월 8일)을 맞아 폐경 후 빈발하는 질병 정보를 알아둬 건강한 노년을 대비하는 건 어떨까.\n    폐경은 여성호르몬(에스트로겐)을 분비하는 난소가 노화한 것이다.\n  여성은 50세 전후에 폐경에 이른다.\n  이땐 에스트로겐 분비가 급감해 예기치 않은 건강 문제가 나타난다.\n  에스트로겐은 혈관을 보호하고 확장하는 기능을 한다.\n  그동안 방패막이 역할을 해왔던 에스트로겐이 줄면서 혈관 건강에 이상이 생기기 쉽다.\n   주부 김모(55)씨는 젊을 때 51~52㎏의 체중을 유지했고 건강에 이상이 없었다.\n  그러다 51세에 폐경을 맞은 후부터 체중이 늘어 지금은 65㎏ 정도다.\n  동시에 혈압이 오르기 시작해 2년 전 고혈압 진단을 받았다.\n  그는 “폐경을 거치며 전에 없던 만성질환이 생긴 친구가 꽤 많다”고 했다.\n   혈관 나빠져 고혈압·고지혈증 발병 급증 여성호르몬이 줄면 심혈관계를 둘러싼 호르몬 환경이 남성과 비슷해진다.\n  국민건강영양조사(2018)에 따르면 40~49세 여성 고혈압 유병률은 11.\n 9%로 남성(29%)보다 낮았으나, 60~69세가 되면 44.\n 6%로 급증하고 70세가 넘으면 73.\n 7%로 남성(65.\n 2%)을 앞지른다.\n  내장 지방이 쌓이는 것을 막고 혈관 세포 기능을 보호하는 에스트로겐이 줄면서 고지혈증 발병도 는다.\n  가천대 길병원 심장내과 신미승 교수는 “동맥경화 진행 속도가 빨라지면서 혈관 건강이 악화한다”며 “협심증·심근경색 등 심혈관 질환으로 이어질 수 있어 주의해야 한다”고 말했다.\n   여성은 심혈관 질환이 생겨도 남성처럼 숨이 차거나 가슴 통증을 잘 느끼지 못한다.\n  오히려 ▶상복부 답답함 ▶피로감 ▶가슴 두근거림을 많이 호소한다.\n  단순한 소화불량이나 피로로 여기다 병을 키우기 쉽다.\n  신 교수는 “조기 발견이 어렵고 진단이 늦어져 제때 치료를 받지 않고 지내다 어느 순간 혈관이 막히거나 합병증이 발생할 수 있다”며 “돌연사가 남성의 문제만이 아니다”고 경고했다.\n   폐경과 함께 고혈압·고지혈증·당뇨병·비만을 동반한 여성은 심혈관 질환 고위험군이므로 평소에 가슴 X선 촬영, 심전도 검사, 심장 초음파검사를 정기적으로 받고 특징적인 증상이 있다면 추가 정밀 검사에 나서야 한다.", "output": "폐경 전후 여성은 여성호르몬(에스트로겐) 감소로 심장과 뼈 건강이 악화하기 쉽다. 국민건강영양조사(2018)에 따르면 40~49세 여성 고혈압 유병률은 11.9%로 남성(29%)보다 낮았으나 60~69세 44.6%, 70세 이상 73.7%로 급증해 남성(65.2%)을 앞지른다. 가천대 길병원 심장내과 신미승 교수는 동맥경화 진행이 빨라져 협심증·심근경색 등 심혈관 질환으로 이어질 수 있다고 경고했다. 여성은 심혈관 질환이 생겨도 숨이 차거나 가슴 통증을 잘 느끼지 못하고 상복부 답답함·피로감·가슴 두근거림을 호소하는 경우가 많아 조기 발견이 어렵다. 폐경과 함께 고혈압·고지혈증·당뇨병·비만을 동반한 여성은 심혈관 질환 고위험군이므로 정기 검진이 필요하다."}, {"kind": "F6", "id": "ext0000000109490", "input": "법안 취지에 여야 모두 동의한만큼, 상식선에서 법안을 반드시 통과시켜야한다.", "output": "법안 취지에 여야 모두 동의한 만큼, 상식선에서 법안을 반드시 통과시켜야 한다."}, {"kind": "F5", "id": "REPORT-news_r-00604-00001", "input": "서울 서북권 최대 전통시장인 마포농수산물시장의 임대 계약을 놓고 마포구와 시장 상인들이 갈등을 빚고 있다.\n  시장을 관리하는 마포구 공기업인 마포구시설관리공단이 계약 갱신이 한 달도 안 남은 지난달 초 상인들에게 임대료 인상과 계약 기간 1년 단축을 통보하면서다.\n  상인들은 “개장(1998년) 이래 계약 기간은 늘 2년이었고, 임대료 인상분도 협의를 통해 정해왔다”고 주장하며 집단 반발에 나섰다.\n  상인들의 반발은 지난해 12월 초 공단이 보낸 통지문 한 통에서 비롯됐다.\n  등기우편으로 온 ‘2020년 마포농산물시장 임대차갱신 안내’에는 ‘인상률: 현 월 임대료의 5%’, ‘임대차기간: 1년간’이라고 쓰여 있었다.\n  계약 기간은 2020년 1월 1일부터였다.\n  인상 이유는 시설관리ㆍ인건비 상승 및 적자 예상 등으로 적혀있었다.\n    이에 상인들은 통지를 받은 후 ‘계약 불가’를 원칙으로 삼고, 구청ㆍ공단ㆍ서울시청을 모두 찾아 항의했다.\n  하지만 돌아온 것은 ‘임대차해지 및 명도 통보’였다.\n  통보의 주요 내용은 \"계약을 2019년 12월 31일 오후 5시까지 완료하길 바라며, 그렇지 않을 경우 계약이 자동해지된다\"였다.\n  이어 “(계약 해지시) 2020년 1월 10일까지 매장을 원상 복구하여 공단에 반환하라”며 “미이행시엔 불법 점유로 법적 조치 진행하겠다”고 했다.\n   결국 상인들은 시장상인번영회에 위임장을 일괄 제출하고 집단행동에 나섰다.\n  8일 오후 상인 90여 명은 서울시청 앞을 찾아 ‘관리규정 2년 원칙! 1년이 웬 말이냐!’ 등 적힌 피켓을 들고 “마포구청장 옷 벗어라” “시설관리공단 이사장 옷 벗어라” 구호를 외쳤다.\n  개장 때부터 22년째 대파 상점을 운영한다는 정양호(53)씨는 “이런 독단적 운영은 처음 본다.\n  계약 기간을 1년으로 줄여 앞으론 매해 5%씩 상승하겠단 얘기가 아닌가”라며 “자기네들 적자 예상을 왜 애먼 시장 상인한테 덮어씌우느냐”고 했다.\n   공단 “서울시가 임대료 올려…적자 운영 예상으로 불가피” 이에 대해 공단 측은 임대료 5% 인상 이유로 서울시에 내는 임대료가 전년 대비 1억4000만원이 오른 점을 강조했다.\n  시장은 마포구가 서울시 시유지를 임대해 사용하고 있는데, 서울시가 임대료를 높였으니 수지를 맞추려면 마포구 역시 임대료 인상이 불가피하다는 입장이다.\n  또 새해 인건비와 시설유지 비용 상승도 임대료를 올리는 요인이 됐다고 한다.\n  계약 기간을 1년으로 단축한 데 대해 공단은 “매해 달라지는 경제여건을 감안했을 땐, 1년으로 줄여 탄력적으로 대응하는 게 맞다고 판단했다”고 했다.", "output": "마포구시설관리공단이 지난해 12월 초 마포농수산물시장 상인들에게 임대료 5% 인상과 계약 기간 1년 단축을 통보하면서 갈등이 빚어졌다. 상인 90여 명은 8일 서울시청 앞에서 집단 시위를 벌이며 반발했고, 공단은 서울시 임대료가 전년 대비 1억4000만원 오른 점과 인건비·시설유지 비용 상승으로 인상이 불가피하다고 설명했다."}, {"kind": "F6", "id": "ota0000000132067", "input": "그 선생님은 걸핏하면 니 아버지 뭐 하시노 하면서 귓볼을 잡아 당겼다", "output": "그 선생님은 걸핏하면 “니 아버지 뭐 하시노?” 하면서 귓불을 잡아당겼다."}, {"kind": "F6", "id": "ota0000000229743", "input": "거주장스러운 허레허식 모두 벗어던지고 간소하게 여식운치른는 것이 좋다고생각해.", "output": "거추장스러운 허례허식 모두 벗어던지고 간소하게 예식을 치르는 것이 좋다고 생각해"}, {"kind": "F6", "id": "aud2207270005868", "input": "정해진 장솨 벗나면 추방당하꼬요?", "output": "정해진 장소 벗어나면 추방당하고요?"}, {"kind": "F5", "id": "REPORT-news_r-01359-00001", "input": "낸시 펠로시 미국 하원의장은 지난 15일, 손꼽아왔던 순간을 맞이했다.\n  도널드 트럼프 대통령에 대한 하원의 탄핵 결의안을 상원에 보내면서다.\n  이 순간을 위해 그는 강렬한 붉은 계열 원피스를 챙겨 입고 기자들 앞에 서서 이렇게 말했다.\n    “오늘 우리는 역사를 썼습니다.\n ”    평소보다 낮지만 강한 목소리였다.\n  그는 또 “미국의 대통령을 결정하는 건 미국의 유권자이지 러시아의 (블라디미르) 푸틴 (대통령)이 아니다”거나 “트럼프는 아주 오랜 기간 사실상 탄핵된 것과 무방한 상태다”라고 날선 비판을 거침없이 쏟아냈다.\n     그의 주도 하에 지난달 18일 하원이 대통령 탄핵안을 가결한 지 약 4주 만에 탄핵 절차가 상원으로 넘어갔다.\n  미국 역사상 세 번째 대통령 탄핵 심판이다.\n  상원 표결은 다음 달 중순으로 예상된다.\n  펠로시의 민주당이 장악한 하원과 달리 상원은 공화당이 53석으로 민주당(47석)에 비해 우위다.\n  탄핵이 가결되려면 3분의 2 이상의 재적 의원인 67명 이상이 찬성해야 한다.\n  민주당은 상원 탄핵 심판 과정에서 결정적 증인의 출현에 기대를 걸고 있으나, 사실상 상원 통과는 어렵다는 게 워싱턴의 기류다.\n      올해 만 80세로 1987년에 정계에 입문한 백전노장 펠로시가 이를 모를 리 없다.\n  오히려 잘 알기에 하원에서 결의안이 통과된 뒤 4주간 트럼프와 공화당의 애간장을 일부러 태웠다는 해석이 지배적이다.\n  트럼프 대통령은 수차례 “이 탄핵 거짓말을 언제 끝낼 거냐”는 트윗을 올리며 초조함을 감추지 못했다.\n  펠로시 의장은 미국 시사 주간지 타임에 “우리가 판돈을 좀 올리긴 했다”고 말했다고 한다.\n  증인 채택 시간도 벌고, 의도적으로 약도 올리는 일석이조였던 셈이다.\n     탄핵이 부결되더라도 펠로시는 승자다.\n  자신의 리더십을 국내외에 보여줬기 때문이다.\n  타임은 20일자로 발행된 최신호에서 펠로시의 리더십을 12개 면에 걸쳐 집중 조명하며 “펠로시는 수십 년 동안의 정계 활동을 해왔지만 최근 12개월 동안 가장 빛났다”고 평가했다.\n       ‘미친 낸시’ 트럼프 비난에도 여유    펠로시는 미국 최초의 여성 하원의장이다.\n  미국 헌법은 대통령 유고 시 대통령직 후계 순위 1위를 부통령, 2위를 하원의장으로 적시했다.\n  펠로시가 트럼프와 마이크 펜스 부통령에 이어 권력 3위에 해당하는 셈.\n  미국의 여성 정치인 중에서 최고위직으로 기록된 전설이다.", "output": "낸시 펠로시 미국 하원의장이 지난 15일 도널드 트럼프 대통령에 대한 하원의 탄핵 결의안을 상원에 보내며 \"오늘 우리는 역사를 썼습니다\"라고 말했다. 지난달 18일 하원이 대통령 탄핵안을 가결한 지 약 4주 만에 탄핵 절차가 상원으로 넘어갔으며, 미국 역사상 세 번째 대통령 탄핵 심판이다. 상원은 공화당이 53석으로 민주당(47석)에 비해 우위여서 탄핵 가결에 필요한 67명 이상 찬성은 사실상 어렵다는 게 워싱턴의 기류다. 타임은 20일자 최신호에서 펠로시의 리더십을 12개 면에 걸쳐 집중 조명하며 \"펠로시는 수십 년 동안의 정계 활동을 해왔지만 최근 12개월 동안 가장 빛났다\"고 평가했다."}, {"kind": "F6", "id": "ext0000000121217", "input": "상황을 입체적으로 인식하구 다각적인 대응책을 마련하는 과제를 더 이상 미뤄서는 안 됀다.", "output": "상황을 입체적으로 인식하고 다각적인 대응책을 마련하는 과제를 더 이상 미뤄서는 안 된다."}, {"kind": "F5", "id": "REPORT-news_r-00506-00001", "input": "미국 앤젤로주립대 글로벌 특별 전형  국내 대학의 2020학년도 입시가 마무리되고 있다.\n  정시모집, 그 중에서도 군별(가·나·다 군) 전형기간만 남은 상황이다.\n  하지만 조금만 눈을 돌리면 한 번의 기회가 더 남아 있다.\n  다름 아닌 미국 명문대 입시다.\n  수능 성적이나 내신이 5등급 이내면 글로벌 특별 전형을 통해 합격할 수 있는데다 학비 감면 혜택도 누릴 수 있다.\n  졸업 후엔 현지 취업의 기회도 열려 있다.\n  글로벌 인재를 꿈꾸는 대입 수험생에게 미국 텍사스주에 위치한 앤젤로주립대(Angelo State University)가 문턱을 낮추고 입학 문을 활짝 열었다.\n    # 앤젤로주립대를 졸업한 김영광(2014년 졸업, 회계학 전공)씨는 현재 미국의 한 회계법인에서 세무사로 일하고 있다.\n  미국에서 취업하겠다는 꿈을 이루기 위해 재학 시절부터 교내에서 제공하는 인턴십 프로그램에 꾸준히 참여해 이력을 쌓았고, 회계사 출신 교수들에게 주기적으로 상담받으며 공부했다.\n  또한 앤젤로주립대가 제공하는 ‘텍사스 명문 주립대 시스템’으로 교육 받았다는 점은 취업 시장에서 큰 경쟁력으로 작용했다.\n  김씨는 “교내에서 인턴 모집을 할 때나 취업 준비를 할 때 외국 학생이란 이유로 차별하기보단 오히려 개방적인 자세로 많은 도움을 줬다”고 회상했다.\n  # 앤젤로주립대에서 국제 경영학을 전공한 졸업생 김민지(2017년 졸업)씨는 미국 뉴저지의 한 물류 회사에서 수입 오퍼레이터(Import Operator)로 재직 중이다.\n  학부에서 공부한 내용과 직결되는 직무를 맡아 만족도가 높다.\n  김씨는 한국에서 편입을 준비하다가 저렴한 학비로 미국에서 유학할 수 있다는 앤젤로주립대의 매력에 끌렸고 이곳으로 편입해 총학생회 활동, 동아리 활동, 유엔 청년의회 참석 등 다양한 경험을 쌓았다.\n  김씨는 “부족한 영어 실력을 끌어올리기 위해 학교에서 영어 모임을 만들어 미국 드라마, 영어 영상을 함께 시청하고 대사를 외우며 공부했다”며 “영어로 이력서를 작성할 때는 교수님들이 많이 도와주신 덕분에 인터뷰 제안을 많이 받을 수 있었다”고 말했다.\n   유학생 취업 지원 시스템 우수이처럼 미국에서 유학한 후 현지 취업까지 계획하는 국내 학생들에게 앤젤로주립대가 든든한 지원군이 되고 있다.\n  특히 회계학·컴퓨터공학과 등을 전공하면 현지 취업에 유리하다는 게 학교 측의 설명이다.\n  컴퓨터공학과의 졸업생 취업률은 90% 정도며 IBM·인텔 같은 세계적 IT기업에 취업하는 사례도 많다.", "output": "국내 대학의 2020학년도 입시가 마무리되는 가운데 미국 텍사스주에 위치한 앤젤로주립대가 수능 성적이나 내신이 5등급 이내면 글로벌 특별 전형을 통해 합격할 수 있고 학비 감면 혜택도 누릴 수 있다며 입학 문을 열었다. 2014년 회계학 전공으로 졸업한 김영광씨는 미국의 한 회계법인에서 세무사로 일하고 있으며, 교내 인턴십 프로그램과 회계사 출신 교수들의 상담, 텍사스 명문 주립대 시스템이 취업 경쟁력으로 작용했다고 회상했다. 2017년 국제 경영학을 전공한 김민지씨는 미국 뉴저지의 한 물류 회사에서 수입 오퍼레이터로 재직 중이며, 저렴한 학비로 편입해 총학생회 활동, 동아리 활동, 유엔 청년의회 참석 등 다양한 경험을 쌓았다고 말했다. 학교 측은 회계학·컴퓨터공학과 등을 전공하면 현지 취업에 유리하며 컴퓨터공학과 졸업생 취업률은 90% 정도고 IBM·인텔 같은 세계적 IT기업에 취업하는 사례도 많다고 설명했다."}, {"kind": "F6", "id": "aud2207200003683", "input": "귀러니까 이 사건어 면호사가 특별히 뭘워 안 했러요", "output": "그러니까 이 사건 변호사가 특별히 뭘 안 했어요"}, {"kind": "F5", "id": "REPORT-news_r-03403-00001", "input": "대표적인 진보 단체인 민주사회를 위한 변호사모임(민변) 소속 변호사가 “(청와대의 울산시장 선거개입 의혹 사건)공소장 내용은 명백한 대통령 탄핵 사유”라고 강도 높게 비판했다.\n  자유한국당은 “문재인 대통령이 울산 사건 ‘몸통’으로 확인되면 탄핵을 추진하겠다”고 주장했다.\n  9일 법조계 등에 따르면 법무법인 해미르 소속의 권경애(55·사진) 변호사는 지난 7일 페이스북 글에서 “공소장 내용은 대통령의 명백한 탄핵사유이고 형사처벌 사안인데도 그분은 가타부타 일언반구가 없다.\n  이곳은 왕정이거나 입헌군주제 국가인가”라고 비판했다.\n    그는 9일 올린 글에서도 “공소장에 기재된 범죄사실을 보면 1992년의 초원복집 회동은 발톱의 때도 못 된다”며 “감금과 테러가 없다뿐이지 (울산경찰청)수사의 조작적 작태는 이승만 시대 정치경찰의 활약에 맞먹는다”고 적었다.\n    초원복집 사건은 14대 대선 직전인 1992년12월11일 당시 법무부 장관에서 물러난 직후였던 김기춘 전 대통령 비서실장이 부산 초원복국 식당에 지역 기관장들을 모아놓고 불법 선거운동을 모의한 사건이다.\n  당시 “우리가 남이가, 이번에 (김영삼 후보가) 안 되면 영도 다리에 빠져 죽자”며 지역감정을 조장하는 대화를 나눈 게 도청을 통해 폭로됐다.\n  권 변호사는 “추미애 법무장관은 위중한 본질을 덮기 위해 공소장을 비공개하고, 유출자를 색출하겠다고 나서며 공소장 공개 시기에 대한 공론을 조장한다”며 “‘타는 목마름으로 민주주의여’를 외치던 세력들이 김기춘 공안검사의 파렴치함을 능가하고 있다”고 썼다.\n  권 변호사는 “민주화 세력은 독재정권을 꿈꾸고 검찰은 반민주주의자들에 저항하는 듯한, 이 ‘괴랄’한 초현실에 대해 책임 있는 발언을 해야 할 사람은 입을 꾹 닫고 여론이 잠잠해지기만을 기다리고 있다”며 “야당이 저 모양이니, 총선이 지나면 다 묻힐 것이라고 참고 기다리고 있는 것인가”라고도 했다.\n  ‘괴랄’은 ‘괴이하고 악랄하다’는 뜻의 인터넷 신조어다.\n  권 변호사는 문 대통령 사진을 첨부하면서 그를 겨냥한 비판임을 시사했다.\n  권 변호사는 천안함 사건 진실규명 범시민사회공동대책협의회 법률자문단에서 활동했고, 현재 서울지방변호사회 고위공직자범죄수사처(공수처) 테스크포스(TF)에서 활동하고 있다.\n  그동안 한·미 FTA 반대, 국가보안법 수사 중단 촉구 등 목소리를 내왔다.\n     울산 사건 또는 울산 사건 공소장 비공개 조치에 대한 진보 진영의 비판은 계속 이어지고 있다.", "output": "민주사회를 위한 변호사모임(민변) 소속 권경애(55) 변호사가 청와대의 울산시장 선거개입 의혹 사건 공소장 내용을 두고 \"명백한 대통령 탄핵 사유\"라고 비판했다. 권 변호사는 1992년 초원복집 회동과 비교하며 울산경찰청 수사의 조작적 작태를 비판했고, 추미애 법무장관이 공소장을 비공개하고 유출자 색출에 나서는 것을 지적했다. 자유한국당은 \"문재인 대통령이 울산 사건 '몸통'으로 확인되면 탄핵을 추진하겠다\"고 주장했으며, 울산 사건 또는 공소장 비공개 조치에 대한 진보 진영의 비판은 계속 이어지고 있다."}, {"kind": "F6", "id": "grm2208260073808", "input": "근데여기서 두가지 의문점이생겼습니다.", "output": "그런데 여기서 두 가지 의문점이 생겼습니다."}, {"kind": "F6", "id": "aud2209300028258", "input": "중의적인지 와닌지 시인만 아늬까 어 의적으로 볼 수 있니의 가능성과 여지 여부만아 판돠할 사 있으면 되는 그런 선치가 나왔는돼 해리다는 뭐니? 용아 뒁사잖아요", "output": "중의적인지 아닌지 시인만 아니까 어 중의적으로 볼 수 있니의 가능성과 여지 여부만 판단할 수 있으면 되는 그런 선지가 나왔는데 내리다는 뭐니? 용언 동사잖아요"}, {"kind": "F6", "id": "aud2210140032402", "input": "제가 솜 이헣게 숨윈 의도 파악를 좀 잘합아니다.", "output": "제가 좀 이렇게 숨은 의도 파악을 좀 잘합니다."}, {"kind": "F6", "id": "ota0000000116225", "input": "변덕이 죽끌듯 하다. 정말 성격 안좋은 사람이야", "output": "변덕이 죽 끓듯 하다. 정말 성격 안 좋은 사람이야."}, {"kind": "F5", "id": "REPORT-news_r-02852-00001", "input": "2015년 메르스(MERS·중동호흡기증후군) 사태 당시 메르스 바이러스 유전물질(RNA)가 최대 5일까지 환자 주변 병실 내에 남아있었던 것으로 확인됐다.\n  환자의 몸에서 배출된 뒤 1~2일이면 사라지는 인플루엔자 바이러스 등에 비해 메르스 바이러스가 더 오래 살아남을 수도 있다는 의미다.\n  중국 우한에서 발생한 신종 코로나바이러스와 메르스 바이러스가 동일한 바이러스가 아니어서 직접 적용하기는 어렵지만, 신종 코로나바이러스에 감염된 환자가 머문 장소를 방역할 때 이 같은 점을 고려해 방역을 강화할 필요가 있는 것으로 나타났다.\n  메르스나 신종 코로나바이러스 둘 다 사람에 감염하는 휴먼 코로나바이러스이고, 인플루엔자 바이러스보다는 훨씬 가깝기 때문이다.\n  충북대 의대 최영기(미생물학) 교수팀은 지난 2015년 6~7월 2개 병원에 입원한 4명의 여성 환자를 대상으로 메르스 바이러스 검출 여부를 지속해서 조사했다.\n  그 결과, 증상이 나타나기 시작한 날을 기준으로 18~25일 후까지도 메르스 바이러스가 검출됐다.\n 당초 환자들이 2주일가량 바이러스를 배출하는 것으로 알려졌으나, 그보다 훨씬 오래 바이러스를 배출한 것이다.\n  일부 환자의 경우 증상이 사라진 뒤에도 바이러스가 계속 검출됐다.\n 증상과 무관하게 바이러스가 검출되지 않을 때까지 충분히 격리할 필요가 있는 것으로 지적됐다.\n  특히, 환자에게서 마지막으로 바이러스가 검출된 날로부터 2~5일 후까지도 침대 주변 등 병실 비품 등에서 바이러스 유전물질인 RNA(리보핵산)가 검출됐다.\n 살아있는 바이러스는 아니지만, 바이러스가 최대 5일까지도 죽지 않고 남아있을 가능성을 보여주는 것이다.\n  공기 중에서는 수 시간, 건조한 표면에 떨어졌을 때도 1~2일이면 사라진다는 인플루엔자 바이러스보다 메르스 바이러스가 더 안정적일 수 있다는 것이다.\n 온도 섭씨 20도, 상대습도 40% 조건에서 메르스 바이러스가 48시간 생존했다는 보고도 있다.\n  일부 전문가는 \"바이러스의 경우 건조한 상태에서는 얼마 견디지 못하고 죽는데, 메르스 등 코로나바이러스의 경우 바이러스 외피에 있는 당단백질 때문에 잘 견디는 것으로 보인다\"는 해석을 제기하기도 했다.\n 이처럼 메르스 바이러스가 환경에서 예상보다 오래 생존함에 따라 메르스의 병원 내에서 접촉에 의한 전파 가능성도 제기됐다.\n  실제로 2015년 당시 온도계와 이동식 X-레이 장비 등에서 RNA가 검출돼 의료장비로 인해 바이러스가 전파될 가능성이 있는 것으로 나타났다.", "output": "충북대 의대 최영기 교수팀이 2015년 메르스 사태 당시 2개 병원 입원 환자 4명을 조사한 결과, 증상 발생 18~25일 후까지 메르스 바이러스가 검출됐고 환자에게서 마지막으로 바이러스가 검출된 날로부터 2~5일 후까지 병실 비품 등에서 바이러스 유전물질(RNA)이 검출됐다. 이는 인플루엔자 바이러스보다 메르스 바이러스가 환경에서 더 오래 생존할 수 있음을 보여주는 것으로, 신종 코로나바이러스와 메르스 바이러스가 같은 휴먼 코로나바이러스 계열이어서 방역 강화 필요성이 제기됐다. 실제로 2015년 당시 온도계와 이동식 X-레이 장비 등에서 RNA가 검출돼 의료장비를 통한 전파 가능성도 나타났다."}, {"kind": "F5", "id": "REPORT-news_r-01269-00002", "input": "상품 선정 과정에서 내부 경고가 수차례 있었지만 무시했다.\n  2019년 3월 6일 열린 공정가액평가실무협의회에선 DLF의 기초자산인 독일 국채 10년물 금리가 -0.\n 7% 이하로 하락하면 100% 원금손실이 발생한다는 점이 지적됐다.\n  3월 11일 열린 상품선정위원회에서는 금융소비자보호센터 직원인 일부 위원이 불완전판매 개연성이 매우 높다는 점을 지적하기도 했다.\n  하지만 본점 WM사업부는 판매직원을 위한 동영상 강의에서 '국채금리가 마이너스까지 가는 것은 굉장히 비정상적인 현상'이고 '가능성은 현저히 낮다'는 내용으로 교육을 했다.\n   '금리반등 어렵다' 내부 전망에도…KPI '줄 세우기' 계열 연구소의 전망도 무시했다.\n  2018년 7월 KEB하나은행의 계열사인 하나금융경영연구소는 '2018년 내 (미국의) 장단기 금리 역전 가능성을 배제할 수 없어(중략) 글로벌 채권시장의 대내외 금리 반등도 쉽지 않을 것'이란 내용의 보고서를 작성했다.\n  그러나 KEB하나은행은 보고서 발표 이후 DLF 상품을 145건 신규 출시했다.\n  상품 구조나 시장 상황에 따른 리스크 등 교육자료도 영업점에 거의 제공하지 않았다.\n  오히려 2019년 들어 사모 DLF의 판매 목표를 전년 대비 53.\n 8% 증가한 1조원으로 상향 조정했다.\n  직원 성과지표(KPI) 주요항목 중 펀드 신탁 수수료 수익 등의 배점도 기존 220점에서 280점으로 대폭 상향 조정했다.\n   우리금융경영연구소에서도 3월 27일 독일금리 하락을 예측하는 보고서가 발표됐다.\n  하지만 우리은행 역시 PB 대상 교육자료에 '독일 실물 경제 회복으로 상반기를 저점으로 연말까지 (국채금리가) 반등할 것'이라는 내용을 기재했다.\n    사태 터지자 내부 실태조사…금감원 조사 땐 '폐기'  2019년 3월 미국 기준금리가 동결되고 향후 금리 인하가 예상되자 KEB하나은행은 DLF 판매를 중단했다.\n  이어 대규모 피해가 예상되자 1829명 가입 고객을 상대로 2차례 실태조사를 해 상당수의 불완전판매를 확인하고 손해배상 규모를 검토하기도 했다.\n  하지만 2019년 8월 금감원의 현장조사가 예정되자 KEB하나은행은 해당 검토 문건을 삭제 및 폐기했다.\n  또 자문 법무법인을 통해 'PB 불완전판매 Q&A'라는 제목의 문건을 작성해 PB들이 불완전판매를 부인하는 내용으로 답변하도록 유도하기도 했다.\n   금감원은 이날 홈페이지에 손해배상비율 세부 산정기준을 공개했다.", "output": "KEB하나은행이 DLF 상품 선정 과정에서 내부 경고를 수차례 무시한 것으로 드러났다. 2019년 3월 6일 공정가액평가실무협의회는 독일 국채 10년물 금리가 -0.7% 이하로 하락하면 100% 원금손실이 발생한다는 점을 지적했고, 3월 11일 상품선정위원회에서도 일부 위원이 불완전판매 개연성이 매우 높다고 지적했다. 그러나 본점 WM사업부는 판매직원 교육에서 국채금리가 마이너스까지 가는 것은 '가능성은 현저히 낮다'는 내용으로 교육했다. KEB하나은행은 2019년 사모 DLF 판매 목표를 전년 대비 53.8% 증가한 1조원으로 상향 조정했고, 금감원 현장조사가 예정되자 검토 문건을 삭제 및 폐기했다."}, {"kind": "F6", "id": "ext0000000045692", "input": "어느 모임에서거절할수없는 술자리가 마련되었고 새벽까지 그들과 함께했다", "output": "어느 모임에서 거절할 수 없는 술자리가 마련되었고 새벽까지 그들과 함께했다."}, {"kind": "F6", "id": "grm2209190119444", "input": "붉은머리 실제로 보고싶은디", "output": "붉은 머리 실제로 보고 싶은데."}, {"kind": "F6", "id": "ext0000000055106", "input": "관광과생활 모두를가능케 하는 공존의지혜를고민해야할때가 왔다", "output": "관광과 생활 모두를 가능케 하는 공존의 지혜를 고민해야 할 때가 왔다."}, {"kind": "F6", "id": "ota0000000046648", "input": "투운데에서 자면 입 돌아가요 알른 안으로 들어오세요", "output": "추운 데에서 자면 입 돌아가요. 얼른 안으로 들어오세요."}, {"kind": "F5", "id": "REPORT-news_r-04081-00001", "input": "코로나19 국면에서 주목받은 사람 중 한 명은 경희대 학생 이동훈(27)씨다.\n  그는 코로나 확진자들의 동선을 한눈에 파악할 수 있는 ‘코로나 맵’을 만들었다.\n  '코로나 맵'은 누적조회 수 1400만회를 기록했다.\n   이씨는 17일 청와대 업무보고 자리에 특별 초대됐다.\n  청와대 강민석 대변인에 따르면 문재인 대통령은 이날 기획재정부ㆍ산업통상자원부ㆍ중소벤처기업부ㆍ금융위원회로부터 업무보고를 받는 자리에서 “이동훈 군을 특별히 칭찬해야겠다.\n  정부가 좀 배워야겠다는 생각을 했다”고 추켜세웠다고 한다.\n  문 대통령은 4개 부처 장관들의 보고와 이어진 민간분야에서의 성공사례 및 현장 경험 발표를 마친 뒤 예정에 없던 발언 기회를 요청해가며 이씨를 콕 집어 언급했다.\n  문 대통령은 “질병관리본부(질본)를 중심으로 정부는 정보를 투명하게 공개했지만, 공포ㆍ불안은 확산됐다”며 “그런데 이동훈 학생이 (질본의) 브리핑 정보를 맵으로 딱 보여주면서, 확진자가 움직이는 동선을 눈으로 볼 수 있게 되고, 우리 상황이 어느 정도인지, 얼마나 긴장해야 하는지, 지역은 어디인지, 이런 것을 쉽게 알 수 있게 됐다”고 말했다.\n  그러면서 “질본의 정보들을 정부 홍보 부서 어디선가 초기부터 활용했다면 어땠을까.\n  정부의 홍보방식에 ‘발상의 전환’을 해야 한다.\n  특별히 당부한다”고 덧붙였다.\n  앞서 이씨는 사례발표에서 “SNS, 미디어에는 공포를 조장하고 선동하는 정보가 많았다.\n  질본이 데이터를 충분히 제공한 상태라 ‘이런 정보라면 불안감을 해소하겠다’ 싶었다.\n  국가적 재난 상황은 다음에도 있을 수 있으니 데이터의 공유, 데이터 소통에 관심을 가져야 한다“고 말했다.\n   문 대통령은 비교적 길게 설명했지만, 이 장면을 요약하면 ‘불안감을 확 줄인 게 대학생 한 명이다.\n  정부는 왜 그 일을 못 했느냐’는 것이다.\n  여기엔 코로나19 못잖게 그로 인한 경기 하향을 우려하는 문 대통령의 시각이 묻어 있다.\n  과도한 불안감 때문에 일상의 경제 활동이 지나치게 위축돼있다는 것이다.\n  언론을 향한 지적도 나왔다.\n  문 대통령은 업무보고 모두 발언에서 “불황이 장기화되면 우리 경제뿐 아니라 민생에도 큰 타격이 될 것”이라며 “일부 언론을 통해 지나치게 공포나 불안이 부풀려지면서 경제 심리나 소비 심리가 극도로 위축된 아쉬움이 남는다\"고 말했다.\n  이어 \"여러 허위 정보를 막아내는 최상의 방법은 정보를 투명하게 하는 것\"이라고 강조했다.", "output": "경희대 학생 이동훈(27)씨가 코로나 확진자 동선을 한눈에 볼 수 있는 '코로나 맵'을 만들어 누적조회 수 1400만회를 기록했다. 문재인 대통령은 17일 청와대 업무보고 자리에서 이동훈씨를 특별히 칭찬하며 \"정부가 좀 배워야겠다는 생각을 했다\"고 말했다. 문 대통령은 질병관리본부 정보를 정부 홍보 부서가 초기부터 활용했으면 어땠을까라며 정부 홍보방식에 '발상의 전환'을 당부했다. 이동훈씨는 국가적 재난 상황에 대비해 데이터 공유와 소통에 관심을 가져야 한다고 말했다."}, {"kind": "F5", "id": "REPORT-news_r-02240-00001", "input": "미국 국무부가 27일(현지시간) 중국 신종 코로나바이러스(우한 폐렴) 확산 사태와 관련 중국 전역에 대해 \"여행을 재고하라\"고 여행 경보를 상향 조정했다.\n  질병통제센터도 \"비필수적인 모든 중국 여행을 피하라(Avoid Nonessential Travel)\"는 여행자 건강 관련 3단계 경고를 발령했다.\n  도널드 트럼프 미국 대통령이 트위터를 통해 시진핑 중국 국가주석에 \"필요한 도움을 제공하겠다\"고 제안한 당일 미국민에 중국 여행 자제를 경고한 셈이다.\n  미국 국무부는 이날 웹사이트를 통해 \"중국 우한에서 신종 코로나바이러스가 처음으로 확인됐고 일부 지역들에 위험이 증가했기 때문에 중국으로 여행을 자제하라\"며 중국 여행 경보 3단계를 발령했다.\n  4단계 여행 경보 가운데 종전 2단계 '주의 확대'에서→ 3단계 여행 재고(Reconsider travel)로 한 단계 높인 것이다.\n  최종 4단계는 여행 금지(Do not travel)다.\n   국무부는 경보에서 \"호흡기 질환을 일으키는 신종 코로나바이러스가 지난해 12월 초순 중국 허베이성 우한에서 발생하기 시작해 계속 증가하고 있다\"며 \"중국 보건 당국은 중국 전역에서 수천건의 발병 사례를 보고했다\"고 설명했다.\n 국무부에 따르면 미 질병통제센터(CDC)도 이날 2단계 경계 '예방조치 강화'에서→3단계 경고(Warning)로 경보를 상향 조정했다.\n  \"비필수적인 중국 여행을 피하라\"는 내용이다.\n  중국 당국이 우한 등에 대해 격리 조치를 시행했으며, 자국 전역에 대한 여행을 자제하고 있다고도 밝혔다.\n  질병통제센터는 최초 발생 지역인 우한을 포함한 허베이성 전역에 대해선 4단계 여행 금지 경보를 발령했다.\n   질병통제센터는 \"현재 진행 중인 신종 코로나바이러스에 의한 호흡기 질환은 사람 간에 퍼질 수 있다\"며 \"중국 당국은 허베이성 우한과 다른 도시로의 버스·철도·공항을 통한 모든 출입을 폐쇄했다\"고 밝혔다.\n  그러면서 \"노인이나 기저 질환이 있는 사람들은 심각한 질병에 노출될 위험이 커질 수 있다\"고 경고했다.\n   질병통제센터는 \"상황이 계속 발전하고 있다\"며 \"추가 정보를 계속 업데이트하겠다\"고 밝혔다.\n  CDC는 \"원래 사람에 감염되는 코로나바이러스는 보통 감기와 같은 가벼운 호흡기 질환을 일으킨다\"며 \"하지만 과거 중증 호흡기질환인 사스(SARS)와 중동 호흡기질환 메르스(MERS)처럼 최소 두 건의 심각한 질환을 야기한 것으로 확인됐다\"고 설명했다.", "output": "미국 국무부가 27일(현지시간) 중국 신종 코로나바이러스 확산과 관련해 중국 전역에 대해 여행 경보를 2단계 '주의 확대'에서 3단계 '여행 재고'로 상향 조정했다. 미 질병통제센터(CDC)도 '비필수적인 모든 중국 여행을 피하라'는 3단계 여행자 건강 경고를 발령하고, 우한을 포함한 허베이성 전역에는 4단계 여행 금지 경보를 내렸다. 이는 도널드 트럼프 미국 대통령이 트위터를 통해 시진핑 중국 국가주석에게 필요한 도움을 제공하겠다고 제안한 당일에 나온 조치다."}, {"kind": "F6", "id": "ext0000000086963", "input": "나누어서 읽지않았기때문인거까요?", "output": "나누어서 읽지 않았기 때문인 걸까요?"}, {"kind": "F5", "id": "REPORT-news_r-02966-00001", "input": "16번째 확진…16일간 무방비 노출광주·전남 지역에서 첫 신종 코로나바이러스 감염증 환자가 발생해 전남대병원에서 격리 치료를 받고 있다.\n  질병관리본부는 태국에서 감염된 국내 16번째 확진자에 대한 역학조사를 통해 동선 및 접촉자 정보 등을 파악 중이다.\n  4일 광주시와 질병관리본부 등에 따르면 16번째 신종 코로나 확진자 A씨(42·여)는 광주광역시 광산구에 거주하는 시민으로 확인됐다.\n  A씨는 신종 코로나 위험지역인 중국 우한 등이 아닌 태국에서 감염된 첫 사례다.\n  중국 우한이 아닌 제3국에서 신종 코로나에 감염된 사례는 일본에서 일본 확진자와 접촉한 것으로 파악된 12번째 환자 이후 2번째다.\n  특히 A씨는 전남대병원에 입원하기 전 중급병원인 광주 광산구 소재 B병원에서 치료를 받은 것으로 확인돼 논란이 일고 있다.\n  지난달 27일 B병원을처음 방문해 치료를 받은 데 이어 2월 1일부터 3일까지도 치료를 받았던 것으로 알려졌다.\n   A씨가 광주로 들어온 지난달 19일부터 전남대병원에 내원했던 지난 3일까지 16일 동안 공백이 있는 상태다.\n  특히 A씨는 설날에 증상을 느낀 것으로 알려져 설 연휴를 친척 등과 보냈을 가능성이 있다.\n  광주시와 질병관리본부는 A씨의 동선과 접촉자 등 추가 정보를 확인하는 대로 공개할 방침이다.\n  광산구 한 병원서 7일간 치료 '논란'A씨는 지난달 15일부터 19일까지 태국 여행을 하고 국내로 입국한 것으로 나타났다.\n  A씨는 여행 도중에는 신종 코로나 유증상이 나타나지 않았지만 지난달 25일 저녁부터 오한 등 증상이 나타난 것으로 전해졌다.\n  A씨는 폐 관련 기저질환자로 오한 등 증상이 호전되지 않자 약 10일 뒤인 지난 3일 전남대병원을 찾았다.\n  전남대병원 측은 신종 코로나 감염 배제를 위해 격리 조치한 뒤 광주 보건환경연구원에 정밀검사를 의뢰했고 4일 오전 양성 확진 판정을 받았다.\n  A씨와 접촉한 가족들에게서는 신종 코로나 유증상이 나타나지 않은 상태로 자가격리됐다.\n  A씨는 전남대병원 국가지정 격리병실에서 치료를 받는 중이다.\n  광주·전남 행사 취소 속출 앞서 광주와 전남은 신종 코로나 확산 우려 때문에 대규모 행사가 잇따라 취소됐었다.\n  오는 6일 광주에서 열릴 예정이던 대한민국 시도지사협의회 정기 총회가 취소됐다.\n  오는 7일 박원순 시장 등 서울시 관계자들이 참석하기로 예정된 광주시와 서울시의 5·18 민주화운동 40주년 기념 협력사업 추진 협약식도 무기한 연기된 바 있다.", "output": "광주·전남 지역에서 첫 신종 코로나바이러스 감염증 환자가 발생해 전남대병원에서 격리 치료를 받고 있다. 질병관리본부는 태국에서 감염된 국내 16번째 확진자 A씨(42·여)에 대한 역학조사를 통해 동선 및 접촉자 정보 등을 파악 중이다. A씨는 지난달 15일부터 19일까지 태국 여행 후 입국해 지난달 25일 저녁부터 오한 등 증상이 나타났으며, 지난 3일 전남대병원을 찾아 4일 오전 양성 확진 판정을 받았다. A씨는 전남대병원 입원 전 광주 광산구 소재 B병원에서 지난달 27일과 2월 1일부터 3일까지 치료를 받은 것으로 확인됐다."}, {"kind": "F5", "id": "REPORT-news_r-03136-00001", "input": "5일(현지시간) 미국 아이오와 코커스(당원대회) 중간개표 결과에서 38세 신인 피트 부티지지 전 인디애나 사우스벤드 시장이 선두를 달리는 이변을 일으켰다.\n  선거구별 결과 집계 오류로 발생한 개표 지연으로 이날 오전 3시 기준 71%가 집계됐다.\n  부티지지가 26.\n 8%로 버니 샌더스(79) 상원의원(25.\n 2%)을 근소하게 앞섰다.\n  전국 여론조사 선두인 조 바이든(78) 전 부통령은 15.\n 4%로 4위로 주저앉았다.\n  중도와 통합을 앞세운 부티지지는 농촌 지역을 포함해 절반 이상의 카운티에서 1위를 차지했다.\n  아이오와는 대의원 수가 41명, 전체 1%밖에 되지 않지만 첫 경선으로 앞으로 대선 구도를 파악할 수 있는 풍향계로 주목받아 왔다.\n  토머스 슈워츠 밴더빌트대 정치학 교수는 중앙일보에 “바이든이 최대 패자가 됐고, 부티지지와 샌더스 2명이 아이오와 코커스의 승자”라고 말했다.\n  현재 뉴햄프셔 여론조사에선 샌더스가 강세를 보여 부티지지-샌더스 구도가 이어질 가능성이 높다.\n  부티지지의 정치 경력이라고는 미국 중부 인디애나주의 작은 도시 사우스벤드(South Bend) 시장이 전부다.\n  아이오와에서 민주당이 신선한 얼굴을 택한 것은 기성 정치에 대한 염증을 반영한 것일 수 있다는 분석도 나온다.\n  도널드 트럼프 미국 대통령과 공화당에 대해서뿐 아니라 민주당 기성 정치인들에 대한 반기이자 세대교체에 대한 열망을 보여준다.\n  최연소 대선후보인 부티지지를 지지하는 세력은 뜻밖에도 청년 세대가 아닌 중장년 중산층인 것으로 나타났다.\n  워싱턴포스트는 코커스 시작 전 이뤄진 조사를 인용해 45~64세 코커스 참가자 4명 중 1명(26%)은 부티지지를 최종 선택했다고 보도했다.\n  부티지지는 다른 민주당 후보들과 달리 군과 국방력의 중요성을 언급하고, 정치·사회 통합의 가치를 얘기했다.\n  부티지지의 아버지는 유럽 소국 몰타 출신으로 미국으로 건너와 사우스벤드에 있는 노터데임대에서 29년간 교수를 지냈다.\n  어머니 쪽은 대대로 인디애나주에서 산 토박이다.\n  2008년 버락 오바마 대통령이 아이오와 코커스에서 1위에 오르며 돌풍을 일으켰을 때 자원봉사자로 선거운동을 도왔다.\n  자신을 오바마 대통령과 연결 지으며 ‘백인 오바마’ 전략을 썼다.\n  그는 하버드대를 졸업하고 로즈 장학금으로 옥스퍼드대에서 유학했다.\n  2007~2010년 맥킨지에서 경영 컨설턴트로 일했다.\n  해군 정보장교로 복무했으며 아프가니스탄에 파병돼 훈장도 받았다.", "output": "5일(현지시간) 미국 아이오와 코커스(당원대회) 중간개표 결과에서 38세 신인 피트 부티지지 전 인디애나 사우스벤드 시장이 26.8%로 버니 샌더스(79) 상원의원(25.2%)을 근소하게 앞서며 선두를 달리는 이변을 일으켰다. 전국 여론조사 선두인 조 바이든(78) 전 부통령은 15.4%로 4위로 주저앉았다. 토머스 슈워츠 밴더빌트대 정치학 교수는 중앙일보에 \"바이든이 최대 패자가 됐고, 부티지지와 샌더스 2명이 아이오와 코커스의 승자\"라고 말했다. 부티지지의 정치 경력은 미국 중부 인디애나주의 작은 도시 사우스벤드 시장이 전부이며, 워싱턴포스트는 코커스 시작 전 조사를 인용해 45~64세 코커스 참가자 4명 중 1명(26%)이 부티지지를 최종 선택했다고 보도했다."}, {"kind": "F5", "id": "REPORT-news_r-03324-00001", "input": "‘기생충’이 아카데미 작품상을 차지하며 아카데미 역사를 새로 썼다.\n  한국영화 최초일 뿐더러, 아카데미 92년 사상 비영어 영화의 작품상 수상은 처음이다.\n  이로써 ‘기생충’은 후보에 오른 6개 부문 중 감독‧각본‧국제영화상까지 총 4관왕을 받았다.\n   \"상상도 해본 적 없는 일이 실제 벌어지니 너무 기쁘고.\n  지금 이순간이 상상도 못하고 역사가 이루어진 기분이 듭니다.\n  이러한, 결정을 해주신 아카데미 회원분들에 경의와 감사를 드립니다.\n \" 9일 저녁(현지시간) 열린 제92회 아카데미 무대에서 제작자 곽신애(바른손이앤에이) 대표의 소감이다.\n  전혀 예상치 못한 표정이었다.\n  샤론 최의 통역이 끝날 때마다 객석엔 박수가 터져나왔다.\n    무대위엔 봉준호 감독, CJ 이미경 부회장도 함께 올랐다.\n  출연진도 모두 함께했다.\n  객석에 할리우드 스타들은 기립 박수를 아끼지 않았다.\n  칸 황금종려상과 아카데미 작품상을 동시에 받은 것도 1955년 미국영화 ‘마티’ 이후 단 두 번째다.\n   이 부회장은 \"하이 에브리바디\"라는 인삿말로 시작해 영어로 \"감사하다.\n  나는 봉준호의 모든 것을 좋아한다.\n  그의 미소, 트레이드 마크인 헤어스타일, 광기, 특히 연출 모두 좋아한다.\n  그의 유머감각을 좋아하고, 그는 정말 사람을 재미있게 할 줄 안다.\n  정말 감사하다\"고 거듭 말했다.\n  또 \"'기생충'을 지지하고 사랑한 모든 사람에 감사한다.\n  내 남동생 이재현(CJ 회장)에게도 감사하다.\n  한국영화 보러 가주시는 분들 모두가 영화를 지원해준 분들이다.\n  또한 주저하지 않고 저희에게 의견을 바로바로 말씀해주셨다.\n  감사하다.\n  그런 의견 덕에 저희가 안주하지 않을 수 있었고, 계속해서 감독과 창작자들이 앞으로 나아갈 수 있었다\"고 말했다.\n   아시아계의 감독상 수상도 대만 감독 이안에 더해 봉 감독이 단 두 명째다.\n  이안 감독은 할리우드 영화 ‘브로크백 마운틴’ ‘라이프 오브 파이’로 두 차례 감독상을 받았다.\n  ‘기생충’은 당초 작품상‧감독상에 가장 유력하게 점쳐졌던 샘 멘데스 감독의 제1차 세계대전 영화 ‘1917’도 제쳤다.\n  멘데스 감독은 데뷔작 ‘아메리칸 뷰티’로 2001년 아카데미 작품상‧감독상‧각본상‧남우주연상(케빈 스페이시)‧촬영상 5부문 수상하는 기염을 토한 데 더해 19년 만에 다시 트로피를 노렸다.\n  ‘1917’은 할리우드에 영향력이 큰 스티븐 스필버그 감독이 세운 앰블린파트너스가 제작한 데다 앞서 골든글로브 작품상‧감독상 2관왕, 영국 아카데미 시상식에선 7관왕에 올라 올해 가장 막강한 후보로 주목받았다.", "output": "‘기생충’이 제92회 아카데미 시상식에서 작품상을 수상하며 한국영화 최초이자 아카데미 92년 사상 비영어 영화 최초의 작품상 수상이라는 역사를 썼다. 이로써 ‘기생충’은 후보에 오른 6개 부문 중 감독상·각본상·국제영화상까지 총 4관왕을 차지했으며, 제작자 곽신애(바른손이앤에이) 대표는 “상상도 해본 적 없는 일이 실제 벌어지니 너무 기쁘고 지금 이순간이 상상도 못하고 역사가 이루어진 기분”이라고 소감을 밝혔다. 무대에는 봉준호 감독과 CJ 이미경 부회장도 함께 올랐고, 칸 황금종려상과 아카데미 작품상을 동시에 받은 것은 1955년 미국영화 ‘마티’ 이후 단 두 번째다. ‘기생충’은 작품상·감독상의 유력 후보였던 샘 멘데스 감독의 ‘1917’도 제쳤다."}, {"kind": "F5", "id": "REPORT-news_r-01875-00001", "input": "“페이스북을 통해서만 이야기하겠습니다.\n ” 진중권(57) 전 동양대 교수가 지난 3일 기자에게 한 말이다.\n  그는 기자의 인터뷰 요청에 “언론 인터뷰는 일절 하지 않고 있다.\n  페이스북을 봐 달라”며 전화를 끊었다.\n  요즘 여의도에서 가장 뜨거운 정치논객의 이름은 ‘진중권’이다.\n  그는 작심한 듯 매일 엄청난 양의 글을 올리고 있다.\n  통로는 오직 페이스북이다.\n  더불어민주당에선 “‘트위터 중독’인 도널드 트럼프 미국 대통령을 능가한다”는 말이 나온다.\n  기자가 그가 동양대를 떠난 지난달 27일부터 21일까지 26일간 올린 글을 세어 보니 151건이었다.\n  하루 평균 6건(5.\n 8건)꼴이다.\n  지난해 7월 ‘페북 항일전’을 주도하며 대일(對日) 성토 글을 쏟아냈던 조국 당시 청와대 민정수석(11일간 44건)과 비교해 봐도 진 전 교수의 ‘화력’이 압도적이다.\n  최근 일주일 새 빈도가 더 늘었다.\n  21일 오전에만 네 건, 오후 세 건의 글을 올렸다.\n  151개의 글을 확인해 보니 주로 친문(親文) 세력, 그리고 문재인 정부 열혈 지지층에 대한 비평이었다.\n  친문계를 포함한 범여권 비판이 72개, 친정인 정의당 비판 글이 3개로 나타났다.\n  반면에 자유한국당 등 보수진영 비판 글은 5개뿐.\n  표현은 ‘신랄’을 넘어 위험 수위를 오르내렸다.\n  이미 진 전 교수는 유시민 노무현재단 이사장의 ‘알릴레오’, 김어준씨의 ‘뉴스공장’을 “우리 사회에 음모론을 생산해 판매하는 2개의 대기업”이라고 지목한 적이 있다.\n  “유시민의 ‘꿈꿀레오’와 김어준의 ‘개꿈공장’은 일종의 판타지 산업, 한국판 마블 혹은 성인용 디즈니랜드”라면서다.\n  최근엔 유시민·김어준씨 외의 친여(親與) 인사들을 향해 무차별 공격을 퍼붓고 있다.\n     판사 시절 ‘양승태 사법부’의 사법행정권 남용 의혹을 폭로한 뒤 여당행을 선언한 이탄희 변호사에겐 “쉰 맛 추잉껌”이라고, 총선 출마를 준비 중인 김의겸 전 청와대 대변인에겐 “선거가 땟국물 빼주는 세탁기냐”고 직격탄을 날렸다.\n  진 전 교수가 동양대 사직 후 처음 글을 올렸을 때의 첫머리는 “오해하는 사람이 많다.\n  나는 아직 문재인 대통령의 국정 운영을 지지한다”(12월 27일)였다.\n  당시만 해도 문 대통령과 ‘인의 장막’(PK 친문)을 분리해 접근했다.\n     하지만 근래 들어 여권의 ‘유재수(전 부산시 경제부시장) 엄호’를 비판하면서 “문 대통령이 과연 공직 수행에 적합한 인물인가 깊은 회의를 품게 된다”고 했다.", "output": "진중권(57) 전 동양대 교수가 지난 3일 기자에게 \"페이스북을 통해서만 이야기하겠습니다\"라며 언론 인터뷰는 일절 하지 않고 있다고 밝혔다. 기자가 그가 동양대를 떠난 지난달 27일부터 21일까지 26일간 올린 글을 세어 보니 151건으로 하루 평균 6건(5.8건)꼴이었고, 151개의 글 중 친문계를 포함한 범여권 비판이 72개, 친정인 정의당 비판 글이 3개인 반면 자유한국당 등 보수진영 비판 글은 5개뿐이었다. 진 전 교수는 유시민 노무현재단 이사장의 '알릴레오', 김어준씨의 '뉴스공장'을 \"우리 사회에 음모론을 생산해 판매하는 2개의 대기업\"이라고 지목했고, 이탄희 변호사에겐 \"쉰 맛 추잉껌\", 김의겸 전 청와대 대변인에겐 \"선거가 럟국물 빼주는 세탁기냐\"고 직격탄을 날렸다. 진 전 교수는 동양대 사직 후 처음 글을 올렸을 때 \"나는 아직 문재인 대통령의 국정 운영을 지지한다\"(12월 27일)고 했지만, 근래 들어 여권의 '유재수(전 부산시 경제부시장) 엄호'를 비판하면서 \"문 대통령이 과연 공직 수행에 적합한 인물인가 깊은 회의를 품게 된다\"고 했다."}, {"kind": "F5", "id": "REPORT-news_r-05366-00001", "input": "충남 천안에서 신종 코로나바이러스 감염증(코로나19)이 급증하는 가운데 1일 첫 공무원 확진자가 나왔다.\n  충남도 등에 따르면 천안시 동남구청 직원 A씨가 신종코로나 양성 판정을 받았다.\n  A씨는 천안아산상생협력센터에서 근무하고 있다.\n  이곳은 인접 지역인 천안·아산의 치안 등을 공동 관리하기 위해 만들었다.\n  천안시는 확진자가 근무한 상생협력센터와 구청 교통지도단속 사무실에 대해 정밀 방역을 했다.\n  이곳에 있는 도서관은 이미 문들 닫은 상태다.\n  A씨는 지난달 29일 부인이 신종코로나 확진 판정을 받자, 증상이 없음에도 검사를 받았다.\n  부인은 천안 첫 확진자인 ‘줌바댄스’ 강사 B씨(46)의 수강생이었던 것으로 알려졌다.\n  천안에서는 A씨를 포함해 이날 신종코로나 확진자가 12명 추가됐다.\n  확진자 가운데는 원인 불명의 폐렴 증세를 보인 2살짜리 남자아이도 포함됐다.\n  추가 확진자 가운데 남성이 7명이고, 나머지는 여성이다.\n  지난달 26일 줌바댄스 강사 B씨가 신종코로나 확진 판정을 받은 이후 천안에선 27일 10명, 28일 23명, 29일 16명 등 지역 감염이 급속히 증가하고 있다.\n  확진자 발생에 따라 이들이 다녀간 천안 갤러리아센터시티, 신세계이마트 터미널점 등이 휴점을 결정했고 의료진 2명이 감염된 천안21세기병원은 코호트 격리 조치됐다.\n  천안과 아산은 이날까지 모두 74명이 신종코로나 확진자가 발생했다.\n  천안이 67명, 아산은 7명이다.\n  충남 전체 확진자(75명)의 98.\n 6%가 몰려있다.\n  천안시는 역학 조사결과 확진자 대부분이 줌바댄스 교습과정에서 감염된 것으로 추정했다.\n  발열·콧물 등 증세도 비슷하다.\n  천안지역 확진자 39명 대부분이 20~60대 여성인 데다 줌바댄스 교습에 다닌 적이 있다는 조사 결과가 나왔기 때문이다.\n  하지만 방역당국은 줌바댄스 강사의 감염원은 아직 찾아내지 못하고 있다.\n  이 강사는 천안시 불당동의 아파트 단지 내 요가방과 피트니스센터 등에서 강사로 활동해왔다.\n  그가 가르치는 수강생은 모두 73명으로 천안시는 이들의 명단을 확보, 모두 자가 격리 통보하고 검사를 의뢰했다.\n  천안 확진자와 신천지와의 관계는 아직 파악되지 않았다.\n  충남도는 중앙방역대책본부에서 6560명의 충남 지역 신천지 신도·교육생 명단을 받아 전수 조사를 벌이고 있다.\n  의심 증세를 보인 148명 중 27명이 ‘음성’ 반응을 보였고, 나머지는 검사가 진행 중이다.", "output": "충남 천안에서 코로나19가 급증하는 가운데 1일 첫 공무원 확진자가 나왔다. 천안시 동남구청 직원 A씨가 천안아산상생협력센터에서 근무하던 중 양성 판정을 받았으며, 부인이 천안 첫 확진자인 줌바댄스 강사 B씨(46)의 수강생이었던 것으로 알려졌다. 천안에서는 A씨를 포함해 이날 확진자가 12명 추가됐고, 원인 불명의 폐렴 증세를 보인 2살짜리 남자아이도 포함됐다. 지난달 26일 B씨 확진 이후 천안에선 27일 10명, 28일 23명, 29일 16명 등 지역 감염이 급속히 증가해 천안과 아산에서 이날까지 모두 74명(천안 67명, 아산 7명)이 확진됐다."}, {"kind": "F6", "id": "ext0000000035420", "input": "적자 낸것도모자라 직원들을길거리로내몬 게 성과란말인가", "output": "적자 낸 것도 모자라 직원들을 길거리로 내몬 게 성과란 말인가."}, {"kind": "F6", "id": "ota0000000209682", "input": "지금 시작하는게 좋을탠데 내일이면 늦을거야.", "output": "지금 시작하는 게 좋을 텐데. 내일이면 늦을 거야."}, {"kind": "F6", "id": "ota0000000231292", "input": "아직 합격자 발표 하려면 세시간이나 남았는데 왜 벌써 부터 안절부절 모해", "output": "아직 합격자 발표 하려면 세 시간이나 남았는데 왜 벌써부터 안절부절못해."}, {"kind": "F6", "id": "aud2207180002607", "input": "그러니까 여러분들의 쉽뜬 어든, 어렵든 쉽든 여러분들 절대로 좌설하거나 자만하시면 안 됩니두.", "output": "그러니까 여러분들이 쉽든 어렵든, 어렵든 쉽든 여러분들이 절대로 좌절하거나 자만하시면 안 됩니다."}, {"kind": "F6", "id": "ext0000000109754", "input": "내년 총선을 앞두고 지도부 눈 밖에나서 좋을게업다는 몸조심인지몰라도 몹시실망스러운 모습이다.", "output": "내년 총선을 앞두고 지도부 눈 밖에 나서 좋을 게 없다는 몸조심인지 몰라도 몹시 실망스러운 모습이다."}, {"kind": "F5", "id": "REPORT-news_r-01382-00001", "input": "타봤습니다…준중형 SUV 트레일 블레이저  작심하고 만든 차라는 인상을 받았다.\n  한국GM이 지난 16일 출시한 준중형 스포츠유틸리티차량(SUV) '트레일 블레이저'는 크게 흠 잡을 데가 없었다.\n   차가 부드럽게 나가고 코너링이나 가속에 있어서도 부대낀다는 느낌이 들지 않았다.\n  고속도로 주행시 특별히 가속을 한 것 같지 않았는데 어느새 시속 140㎞까지 올라가 있었다.\n  시승 차량은 ACTIV 모델로 1.\n 35L 가솔린 E-터보 엔진이 탑재됐다.\n  최고출력 139마력, 최대토크 22.\n 4㎏·m이다.\n  전체 5개 트림 중 프리미어∙ACTIV∙RS 모델은 이 엔진이고, LS∙LT 모델에는 1.\n 2L 가솔린 엔진이 달렸다.\n  컴팩트 SUV답지 않게 주행시 매우 조용하다.\n  카허 카젬 한국GM 사장은 16일 간담회에서 “한국 소비자들이 특히 소음에 민감한 것을 잘 알고 있다”며 “액티브 노이즈 캔슬레이션 시스템을 도입해 북미 등지에서도 호평을 받을 것으로 기대한다”고 말했다.\n  17일 실제 타봤더니 엔진∙주행 소음 모두 거의 느끼지 못했다.\n   트레일 블레이저의 매력은 무엇보다 가격이다.\n  스펙만 보면 기아 셀토스와 현대 투싼 사이라고 생각하기 쉽지만 사실 셀토스에 더 가깝다.\n  셀토스가 1965만~2865만원이고, 트레일 블레이저는 1995만~2830만원이다.\n  그런데 트레일 블레이저가 내부 공간이 더 넓고, 연비도 더 좋고, 각종 첨단 사양이 대거 들어가 있다.\n  특히 휠베이스가 비슷한 차종보다 10mm 더 길어 넉넉한 공간이 특징이다.\n  한국GM '저렴이' 이미지 완전히 벗었다 실내는 과거 일부 GM차에 있었던 저렴한 이미지를 완전히 벗겨냈다.\n  이 가격의 SUV가 할 수 있는 최고의 사양을 갖췄다.\n  RS 트림의 경우 D컷 스티어링휠과 RS 전용 계기반, 레드 스티치 등으로 멋을 냈다.\n  8인치 센터 디스플레이는 알차게 만들었다.\n  특히 애플 카플레이를 무선으로 사용할 수 있다.\n  케이블을 찾지 않아도 되는 건 큰 매력으로 느껴진다.\n  안드로이드 오토는 구글 정책에 따라 추후 적용 예정이다.\n   이밖에 열선 스티어링휠, 통풍시트, 핸즈프리 파워 테일게이트, 헤드업 디스플레이, 파노라마 선루프 등 한국 소비자가 선호하는 옵션이 다양하다.\n  접었다 폈다 할 수 있는 헤드업 디스플레이도 쉐보레 최초로 탑재했다.\n  간단한 온·오프 버튼 조작만으로 전륜·사륜구동 전환이 가능하다.", "output": "한국GM이 지난 16일 출시한 준중형 SUV 트레일 블레이저를 시승한 결과 부드러운 주행과 코너링, 가속 성능에서 흠 잡을 데가 없었고 고속도로에서 어느새 시속 140㎞까지 올라가 있었다. 시승 차량은 ACTIV 모델로 1.35L 가솔린 E-터보 엔진이 탑재돼 최고출력 139마력, 최대토크 22.4㎏·m를 낸다. 카허 카젬 한국GM 사장은 한국 소비자들이 소음에 민감하다며 액티브 노이즈 캔슬레이션 시스템을 도입했다고 말했고, 실제 주행에서도 엔진·주행 소음이 거의 느껴지지 않았다. 트레일 블레이저는 1995만~2830만원의 가격에 셀토스보다 넓은 내부 공간과 무선 애플 카플레이, 헤드업 디스플레이 등 첨단 사양을 갖췄다."}, {"kind": "F6", "id": "ext0000000084747", "input": "지문을 제대로 이해해두 선지에서 막히는데어떡게해야할까요?", "output": "지문을 제대로 이해해도 선지에서 막히는데 어떻게 해야 할까요?"}, {"kind": "F5", "id": "REPORT-news_r-00803-00001", "input": "우크라이나 정부가 이란 수도 테헤란 외곽에서 발생한 자국 여객기 추락 사고의 원인으로 이란이 보유한 러시아제 미사일에 의한 피격을 검토하고 있다.\n   9일(현지시간) 타스 통신에 따르면 알렉세이 다닐로프 우크라이나 국가안보국방위원회 서기는 이날 언론과의 인터뷰에서 \"우크라이나국제항공 소속 여객기가 테헤란 인근에서 러시아제 지대공 미사일 '토르'에 피격당했을 가능성을 검토하고 있다\"고 밝혔다.\n   다닐로프는 \"여객기 사고 조사 참여를 위해 테헤란으로 간 우크라이나 국가조사위원회 소속 전문가들이 이란 측 전문가들과의 회의에서 여러 가설을 점검하고 있다\"면서 이같이 말했다.\n   그는 \"주요 가설 중 토르를 포함한 지대공미사일에 의한 피격도 있다\"면서 \"사고 현장 부근에서 해당 미사일 잔해가 발견됐다는 정보가 인터넷에 올라왔기 때문\"이라고 미사일 피격설을 검토하는 이유를 설명했다.\n   다닐로프의 이런 발언은 잘못 발사된 이란 보유 러시아제 토르 미사일에 자국 여객기가 격추됐을 가능성을 시사한다.\n   토르는 옛 소련 시절인 1980년대 러시아에 군에 실전배치된 지대공미사일로 1~16km 거리, 10m~10km 고도의 목표물을 타격할 수 있다.\n  현재 이란을 포함해 11개국이 토르 미사일을 보유하고 있는 것으로 알려졌다.\n    다닐로프는 \"테헤란으로 간 우크라이나 국가조사위원회 전문가들이 사고 현장을 시찰하는 문제를 이란 측과 조율하고 있다\"며 \"현장에서 인터넷에 올라온 정보를 토대로 토르 미사일 잔해를 수색하는 작업을 벌일 것\"이라고 밝혔다.\n    그러면서 \"우리는 여객기 추락 사건 진실을 규명하기 위해 보잉 MH-17 여객기 피격 조사의 모든 경험을 검토하고 있다\"며 \"지난 2014년 우크라이나 동부에서 발생한 말레이시아 여객기 피격 추락 사건을 참조하고 있다\"고 설명했다.\n   실제 우크라이나 위원회에는 말레이시아 MH-17 여객기 피격 사건 조사에 참여한 전문가들도 포함됐다.\n    말레이시아 여객기 MH17편은 지난 2014년 7월 17일 네덜란드 암스테르담을 떠나 말레이시아 쿠알라룸푸르로 가던 중 우크라이나 정부군과 친러시아 분리주의 반군 간 교전이 치열하던 우크라이나 동부 도네츠크주(州) 상공에서 격추됐다.\n  이 사고로 승객 283명과 승무원 15명 등 298명이 모두 숨졌다.\n    당시 국제조사팀은 장기간 조사 뒤 말레이시아 여객기가 반군에 제공된 러시아제 지대공 미사일 '부크'에 의해 피격됐을 수 있다는 결론을 내렸으나 러시아는 관련 혐의를 완강히 부인했다.", "output": "우크라이나 정부가 이란 수도 테헤란 외곽에서 발생한 자국 여객기 추락 사고의 원인으로 이란이 보유한 러시아제 미사일에 의한 피격을 검토하고 있다. 알렉세이 다닐로프 우크라이나 국가안보국방위원회 서기는 9일(현지시간) 타스 통신과의 인터뷰에서 우크라이나국제항공 소속 여객기가 테헤란 인근에서 러시아제 지대공 미사일 '토르'에 피격당했을 가능성을 검토하고 있다고 밝혔다. 그는 사고 현장 부근에서 해당 미사일 잔해가 발견됐다는 정보가 인터넷에 올라왔기 때문이라고 설명했다. 다닐로프는 2014년 우크라이나 동부에서 발생한 말레이시아 여객기 MH17 피격 추락 사건 조사의 모든 경험을 참조하고 있다고 밝혔다."}, {"kind": "F6", "id": "ext0000000120935", "input": "분노햇지만, 돌아보면 나두 다르지 않았다.", "output": "분노했지만, 돌아보면 나도 다르지 않았다."}, {"kind": "F6", "id": "grm2209160117969", "input": "여기 야구 응원하는 댓글창 아니거든요", "output": "여기 야구 응원하는 댓글창이 아니거든요."}, {"kind": "F5", "id": "REPORT-news_r-05505-00002", "input": "그 이후 박모(55·여)씨가 부산대병원으로 후송되자마자 숨졌다.\n  그 이후에도 2~3명이 이송된 후 숨졌다.\n  그들은 모두 멀쩡하게 걸어서 구급차에 올랐다.\n  박씨는 \"바깥 나들이를 하니 기분이 너무 좋다.\n  빨리 갔다 오겠다\"고 말하고 떠났다.\n  다른 환자는 의료진에게 \"그동안 고마웠다.\n  잘 다녀오겠다\"고 말했다.\n  의료진도 \"안심해도 된다.\n  잘 치료받고 오라\"고 손을 잡아줬다.\n  그렇게 떠난 뒤 얼마 지나지 않아 숨을 거뒀다.\n  의료진은 환자가 치료받고 돌아올 줄 알고 5층 병실의 이름을 남겨뒀다.\n  사망 소식을 듣고서도 선뜻 지우지 못했다.\n  의료진들은 가슴이 너무 아파 함께 울었다고 한다.\n  보건 당국 관계자는 \"의식이 또렷했고, 다 상태가 괜찮았는데, 갑자기 병세가 악화했다.\n  코로나19의 이런 특성을 알지 못했다\"고 말했다.\n  손목에 매직으로 이름 써청도대남병원은 강제결박 병실 몇 개를 제외한 나머지 병실이 침대가 없는 방이었다.\n  2인실, 4인실, 8인실 모두 그랬다.\n  남의 방에 가서 누워자는 게 예사였다고 한다.\n  확진환자가 나오자 직원이 격리됐고 청소부도 기피했다.\n  쓰레기를 치울 사람이 없었고 밥을 나를 사람이 없었다.\n  이게 다 의료진 몫이었다.\n  환자를 구별할 수 없어서 이름표를 옷에 달아줬더니 다 찢어버렸다.\n  할 수 없어서 손목에 매직으로 이름을 썼다.\n  이런 상태에서 환자 상태를 진단해 구분하는데 시간이 많이 걸렸다.\n  지적장애인이 적지 않아 더 그랬다.\n  CT를 찍기 위해 이동하는 통로에 비닐을 쳐서 감염을 막아야 했다.\n   환자들은 방바닥 생활에 익숙해서인지 2층 침대병실로 옮긴 뒤 상당수는 바닥으로 내려와서 누웠다.\n  어쩔 수 없이 낙상할까봐 일부는 바닥에 매트를 깔아줬다.\n  5층 폐쇄병동 중간의 휴게실(day room)에 모여지내는 게 일상화됐고, 거기에 드러누워서 TV를 보는 경우가 많았다.\n  환자들의 영양 상태가 매우 좋지 않았다.\n  대부분 고혈압·당뇨병·폐결핵 등의 만성질환을 앓고 있었다.\n  운동량도 절대적으로 부족했다.\n  2명을 제외하고 100명이 감염된 이유가 너무나 분명했다.\n   의료진에 온 과일, 환자에게국립정신건강센터·부곡병원·대남병원의 의료진·직원 약 60명은 극심한 스트레스를 받고 있다.\n  일부 직원은 열이나고 목에 통증이 생겼다.\n  감염이 의심돼 검사를 받았더니 다행히 음성이었다.\n  국립정신건강센터 의료진 12명은 서울시 인재개발원에 자가격리돼 있다.", "output": "청도대남병원에서 다른 곳으로 이송된 환자 중 박모(55·여)씨를 포함해 2~3명이 이송 직후 숨졌다. 이들은 모두 걸어서 구급차에 올랐고 의료진에게 고마움을 전했으며, 의료진은 이들이 돌아올 것으로 알고 5층 병실에 이름을 남겨뒀다가 사망 소식에 지우지 못했다. 청도대남병원은 강제결박 병실 몇 개를 제외하면 침대가 없는 병실이었고, 확진환자 발생 후 직원 격리와 청소부 기피로 의료진이 쓰레기 처리와 식사 배식까지 맡았다. 환자 구별을 위해 손목에 매직으로 이름을 썼으며, 환자 대부분이 고혈압·당뇨병·폐결핵 등 만성질환을 앓고 영양 상태가 좋지 않아 2명을 제외한 100명이 감염됐다."}, {"kind": "F6", "id": "ota0000000006267", "input": "실시각 채닝으로 다하는 익수지않은 무자비한 팩목때문에 현ㄷ타세게왔음", "output": "실시간 채팅으로 당하는 익숙지 않은 무자비한 팩폭 때문에 현타 세게 왔음."}, {"kind": "F5", "id": "REPORT-news_r-04659-00001", "input": "신종 코로나 감염증(코로나19)의 위협이 거세지자 세계 각국은 자국민 보호를 위한 초강력 조치를 내놓고 있다.\n    우선 자국민에게 한국 방문을 주의하라고 당부하거나 한국인의 입국을 제한하는 국가들이 속속 등장하고 있다.\n  한국의 확진자가 폭증하고 있는 데 따른 것이다.\n  23일 오전 9시 기준 신종 코로나 국내 확진자는 556명에 이르고, 사망자는 4명 발생했다.\n  이미 세계 총 41개국에서 지역과 상관없이 중국을 방문하거나 체류한 적이 있는 외국인(중국인 포함)의 입국을 거부하고 있다.\n     반면 정작 확진자가 폭증한 한국은 위기단계를 ‘경계’ 수준으로 유지하고 있다.\n  17개 광역 지방자치단체가 모두 뚫리고, 확진자가 매일 쏟아지는 상황에서 대처가 미온적인 것이 아니냐는 비판이 일고 있다.\n  국내 의학단체들은 매우 빠른 전염 속도를 감안해 위기 단계를 ‘심각’ 단계로 올려야 한다고 권고하고 있다.\n  ‘심각’ 단계 때는 정부가 휴교나 직장 폐쇄, 대중교통 운행 제한 등을 할 수 있는 권한을 갖게 된다.\n    각 국가는 신종 코로나 감염 확산을 막기 위해 어떤 조치를 펼치고 있을까.\n    이탈리아는 신종 코로나 확진자가 꾸준히 늘고 있는 북부 10여개 마을에 대해 ‘이동 제한 조치’를 내렸다.\n  주세페 콘테 이탈리아 총리는 22일(현지시간) 신종 코로나 영향권에 거주하는 주민들이 해당 지역 안팎을 오가는 것을 제한한다고 밝혔다고 AFP통신이 23일 보도했다.\n  이에 따라 5만여명의 지역 주민이 이동 제한 조치의 영향을 받게 된다.\n    감염자가 밀집한 이탈리아 북부 지역 학교와 상점들은 이미 문을 닫았다.\n  콘테 총리는 “특별 허가 없이는 (신종 코로나 감염) 거점으로 간주되는 지역에 출입을 금지한다”고 밝혔다.\n  “이번 조치가 잠복기를 고려해 1~2주가량 유지될 것”이라고 덧붙였다.\n  이탈리아에선 22일 오후 기준 신종 코로나 사망자가 2명 발생했고, 확진자는 77명이다.\n    이탈리아 정부는 감염 예방을 위해 프로축구 세리에A 경기도 취소했다.\n  콘테 총리는 이날 이동 제한 조치와 함께 신종 코로나 확진자가 발생한 베네토주와 롬바르디아주에서 23일 열리는 모든 스포츠 경기를 중단하겠다고 발표했다.\n  이란 정부 역시 국내의 모든 스포츠 경기를 10일 동안 중지시키기로 했다고 관영 IRNA 통신이 22일(현지시간) 보도했다.\n  신종 코로나로 인한 이란 내 사망자는 지금까지 6명으로 중국에 이어 두 번째로 많다.", "output": "코로나19 확진자가 폭증하자 세계 각국은 자국민에게 한국 방문을 주의하라고 당부하거나 한국인의 입국을 제한하는 조치를 내놓고 있다. 23일 오전 9시 기준 국내 확진자는 556명, 사망자는 4명이며, 이미 세계 총 41개국이 중국을 방문하거나 체류한 적이 있는 외국인의 입국을 거부하고 있다. 반면 한국은 위기단계를 '경계' 수준으로 유지하고 있어 국내 의학단체들은 '심각' 단계로 올려야 한다고 권고하고 있다. 이탈리아는 북부 10여개 마을에 이동 제한 조치를 내리고 세리에A 경기를 취소했으며, 이란도 모든 스포츠 경기를 10일 동안 중지시키기로 했다."}, {"kind": "F5", "id": "REPORT-news_r-03280-00001", "input": "싱하이밍(邢海明) 주한 중국대사가 7일 오전 청와대에서 문재인 대통령에게 시진핑 중국 국가주석의 신임장 정본을 제출했다.\n  지난달 30일 싱 대사가 한국에 입국한 지 8일 만이다.\n   외교부는 이날 보도자료를 내고 “문 대통령이 이날 오전 싱 대사와 도미타 고지(冨田浩司) 주한 일본대사 등 신임 주한대사 두 명으로부터 신임장을 제정받았다”고 밝혔다.\n   싱 대사는 앞서 신임장 제정식 전인 지난 4일 신종 코로나바이러스 감염증(우한 폐렴) 설명회를 여는 등 공개 행보를 해 외교적 결례 논란이 일었다.\n  논란이 있은 후 사흘 만에 신임장 제정식이 열린 셈이다.\n   이와 관련, 일각에선 정부가 신종 코로나 확산으로 대중 여론이 좋지 않은 상황에서 싱 대사의 공개 활동에 비판 여론이 생기자 제정식을 서둘러 진행한 게 아니냐는 논란이 일고 있다.\n  이날 함께 신임장을 제정한 도미타 대사는 12월 3일 들어와서 두 달이나 신임장 제정식을 기다리고 있는 상태였다.\n    해리 해리스 미국 대사의 사례에 비춰보더라도 싱 대사의 신임장 제출은 빠른 편이다.\n  해리스 대사는 2018년 7월 7일 한국에 들어와 18일 만인 같은 달 25일 문 대통령에게 신임장을 제출했다.\n   이에 대해 외교부는 오비이락(烏飛梨落)이라는 입장이다.\n  외교부 당국자는 “정말 우연히 타이밍이 맞은 것일 뿐”이라며 “마지막 신임장 제정식이 작년 11월이었고 3개월 간격으로 제정식을 할 예정이었다”고 설명했다.\n  이 당국자는 “싱 대사의 경우 공교롭게도 신종 코로나바이러스 사태로 인해 국가 간 협력이 더욱 중요한 상황에서 중국 대사가 (신속하게 제정식을 하게 돼) 공식적으로 활동할 수 있게 된 것은 다행스러운 일”이라고 말했다.\n   1년에 네 차례 정도 있는 신임장 제정식의 통상 일정에 따른 것이라는 설명이다.\n  가장 최근 신임장 제정식은 지난해 11월 14일이었다.\n     신임장은 각국에 파견하는 외교 사절에 대해 파견국 국가원수가 ‘외교적으로 신뢰할 수 있는 사람’이라고 보증해주는 문서다.\n  ‘정본’과 ‘사본’ 두 장을 주재국에 제출하는데, 정본은 대통령에게, 사본은 외교부 의전장에게 낸다.\n   나라별로 사정은 조금씩 다르지만 한국은 정본 제출 전에는 대통령과 국회의장, 대법원장 등 3부 요인과 정식으로 만날 수 없다.\n  꼭 필요한 경우에만 예외적으로 허용하고 있다.\n  대사로서 온전히 활동하기 위해선 신임장 제정식을 반드시 거쳐야 한다는 얘기다.", "output": "싱하이밍 주한 중국대사가 7일 오전 청와대에서 문재인 대통령에게 시진핑 중국 국가주석의 신임장 정본을 제출했다. 싱 대사는 지난달 30일 한국에 입국한 지 8일 만에 신임장을 제출했으며, 도미타 고지 주한 일본대사도 같은 날 신임장을 제정받았다. 싱 대사는 신임장 제정식 전인 지난 4일 신종 코로나바이러스 감염증 설명회를 여는 등 공개 행보로 외교적 결례 논란이 일었고, 논란 후 사흘 만에 제정식이 열려 정부가 서둘러 진행한 게 아니냐는 논란이 일고 있다. 외교부는 마지막 신임장 제정식이 작년 11월이었고 3개월 간격으로 할 예정이었다며 오비이락이라는 입장을 밝혔다."}, {"kind": "F5", "id": "REPORT-news_r-04717-00002", "input": "거의 모든 주요 사건(국민이 주목하는 사건)은 정치적으로 해석된다.\n  한편에서는 윤석열 검찰총장이 정의의 칼을 휘둘렀다고 생각하고, 다른 한편에선 적폐 세력의 반격으로 여긴다.\n  일반 사건의 결과는 수임료 비싼 변호사와 검찰의 협잡이거나, 정치권력과 검찰의 유착 아니면 충돌로 이해한다.\n  지금 윤 총장을 정의의 사도로 생각하는 시민 중 상당수는 얼마 전까지만 해도 그를 권력의 앞잡이라고 비난했다.\n  판단은 언제든 다시 뒤바뀔 수 있다.\n  노무현·이명박·박근혜 전 대통령에 대한 검찰 수사 중 하나라도 반대하는 이는 검찰이 공정하다고 생각하기 어렵다.\n   “사법 불신의 끝은 배심제” 법원을 보는 시각도 크게 다르지 않다.\n  큰 사건의 판결이 나면 재판을 맡은 판사의 성향을 본다.\n  아니, 판결 전부터 그것을 근거로 삼아 예측한다.\n  ○○○연구회 소속이냐, 고향이 어디냐, 사법부에서 주류·비주류 중 어느 쪽에 속하냐를 따진다.\n  죄를 보지 않고 판사를 본다.\n  판결 뒤에는 시민들이 두 패로 갈려 싸우기 일쑤다.\n  법관은 ‘법률과 양심에 따라 재판한다’는 믿음은 헌법 속에 있는 박제가 됐다.\n  김용담 전 대법관은 “사법의 틀에 대해 근본적인 고민을 할 때가 됐다”고 말했다.\n  그는 “배심제 재판 도입도 진지하게 고민해 봐야 한다.\n  국민이 판사를 믿지 않으니 별도리가 없지 않으냐”고 했다.\n  1년 전에 만났을 때만 해도 “국민이 판사의 양심을 믿어야 한다”고 말했는데, 그런 기대를 포기한 듯했다.\n  “판사들이 정치계로 잇따라 뛰어드는 상황에서 어떻게 계속 재판에 대한 신뢰를 말할 수 있겠느냐”며 한탄했다.\n  배심제는 2008년 국민참여재판이라는 이름으로 한국 법원에 부분적으로 도입됐다.\n  ‘부분적’이라 함은 합의부 재판에서, 피고인이 동의할 경우에만 이뤄지는 데다가 판결에도 ‘권고적 효력’만 미치기 때문이다.\n  배심원 평결에서는 무죄 판단이 나와도 판사가 유죄를 선고할 수 있다.\n  김 전 대법관은 “우리 헌법에 재판은 판사가 하게 돼 있기 때문에 본격적인 배심제 도입은 개헌 사항이다.\n  이런 이유 등으로 인해 우리 법원이 배심제 도입에 대해 소극적이었다.\n  영국·미국의 배심제가 우리 현실에 맞지 않는다면 시민과 법관이 함께 판단하는 ‘참심제’ 도입도 대안으로 생각해 볼 수 있다”고 말했다.\n  독일·일본 등에서 참심제가 운용되고 있다.\n   ‘관료 사법’의 중대 위기 판·검사를 믿지 못하면 결국 갈 길은 뻔하다.", "output": "거의 모든 주요 사건이 정치적으로 해석되면서 윤석열 검찰총장을 정의의 사도로 보는 시민 중 상당수가 얼마 전까지만 해도 그를 권력의 앞잡이라고 비난했고, 판결이 나면 판사의 성향을 따지며 죄를 보지 않고 판사를 보는 현상이 나타나고 있다. 김용담 전 대법관은 사법의 틀에 대해 근본적인 고민을 할 때가 됐다며 배심제 재판 도입도 진지하게 고민해 봐야 한다고 말했다. 배심제는 2008년 국민참여재판이라는 이름으로 부분 도입됐으나 합의부 재판에서 피고인 동의 시에만 이뤄지고 판결에 권고적 효력만 미친다. 김 전 대법관은 본격적인 배심제 도입은 개헌 사항이라며 영국·미국의 배심제가 현실에 맞지 않으면 시민과 법관이 함께 판단하는 참심제 도입도 대안으로 생각해 볼 수 있다고 말했다."}, {"kind": "F5", "id": "REPORT-news_r-01744-00001", "input": "미·중 무역전쟁 끝날 수 없는 이유무역전쟁을 벌여오던 미국과 중국이 ‘1단계 합의’ 문서에 서명했다.\n  류허(劉鶴) 중국 부총리는 지난 15일 워싱턴을 방문해 미국산 제품 수입을 대폭 확대하는 합의문에 서명했다.\n  미국은 중국을 겨냥해 인상했던 관세를 일부 인하한다고 약속했다.\n  서명식 직전 미국은 지난해 8월 중국의 ‘통화 조작국’ 지정을 철회했다.\n  재선을 노리는 트럼프 대통령은 “어마어마한 합의”라고 자신의 공적을 치켜세웠다.\n  2018년 봄 관세 전쟁으로 시작해 투자·기술·과학, 인력교류 등 전방위로 전선이 확대된 미·중 무역전쟁은 세계 경제를 침체국면으로 몰고 갈 최악의 변수로 지목돼 왔다.\n  2008년 미국발 금융위기 이후 10년이 넘도록 이어지는 세계적 경기 부진 속에서 세계 최대 경제대국 두 나라가 벌이는 무역전쟁은 소비와 투자심리를 위축시키고, 글로벌 가치사슬을 분절화하면서 통제 불가능한 불확실성을 몰고 왔다.\n  양국 간 무역전쟁은 ‘1단계 합의’를 계기로 ‘평화로운 휴전’으로 들어갈까.\n  국가 간 합의는 제대로 이행되지 못하면 휴짓조각에 불과하다.\n  중국은 그간 미국과 많은 무역협정을 맺었지만, 이행 실적은 초라하다.\n  가장 최근의 경우를 보자.\n  2015년 9월 미·중 정상회담에서 시진핑(習近平) 주석은 남중국해 군사화 금지, 민간기업 전산망 침투와 영업비밀 빼가기 금지 등을 약속했지만, 그 이후 중국의 발걸음은 말과 달랐다.\n  이번에는 다를까.\n  중국이 추가 구매 약속한 향후 2년간 2000억 달러, 그중 농산물 320억 달러는 그리 간단한 물량이 아니다.\n  무역전쟁 직전 2017년 미국의 대중국 수출액은 1280억 달러였다.\n  중국의 구매 능력, 미국의 공급능력은 문제없을까.\n  중국에 이만큼의 물량을 밀어내면서 미국 스스로 중국의 향후 보복에 취약해지게 만드는 것은 현명한 것일까.\n  설령 합의가 제대로 지켜진다 해도, 1단계 합의는 작은 한걸음에 불과하다.\n  중국이 미국산 수입을 대폭 확대하기로 한 1단계 합의는 미국의 거대한 대중국 무역적자 가뭄에 단비일 수 있지만, 근본적 해결책이 아니다.\n   덩치 큰 국영기업들이 경제 인프라를 독차지하고, 그들에게 엄청난 보조금을 살포하고, 외국기업에 대한 차별적 규제가 만연하는 기울어진 운동장-‘중국 특색의 사회주의 경제체제’가 시장경제 체제와의 무역에서 필연적으로 발생할 수밖에 없는 구조적 문제를 풀 묘수는 1단계 합의에 없다.", "output": "미국과 중국이 무역전쟁을 벌여온 끝에 지난 15일 워싱턴에서 류허 중국 부총리가 미국산 제품 수입을 대폭 확대하는 '1단계 합의'에 서명했고, 미국은 대중 관세를 일부 인하하고 중국의 '통화 조작국' 지정도 철회했다. 트럼프 대통령은 이를 \"어마어마한 합의\"라며 자신의 공적으로 치켜세웠다. 그러나 중국이 향후 2년간 2000억 달러(농산물 320억 달러 포함)를 추가 구매하기로 한 약속은 2017년 미국의 대중 수출액 1280억 달러와 비교해 이행 가능성에 의문이 제기된다. 1단계 합의는 미국의 대중 무역적자 문제에 단비일 수 있지만 국영기업 보조금과 차별적 규제 등 '중국 특색의 사회주의 경제체제'에서 비롯된 구조적 문제를 푸는 근본적 해결책은 아니라는 지적이다."}, {"kind": "F5", "id": "REPORT-news_r-05040-00001", "input": "신종 코로나 감염증(코로나19)은 '팬데믹(pandemic·세계적 대유행)' 상황에 도달한 걸까.\n  세계보건기구(WHO)는 팬데믹 선언을 미루고 있지만, 이미 팬데믹이 시작됐다고 봐야 한다는 전문가들의 주장도 나오고 있다.\n  팬데믹은 세계보건기구(WHO) 전염경보 6단계 중 최고 단계인 5~6단계를 뜻한다.\n  전 단계인 에피데믹(epidemic·전염병)보다 광범위한 영역에 퍼지는 특성이 있다.\n  팬데믹은 국가와 대륙을 넘나들며 숙주를 감염시킨다.\n  1928년 스페인 독감과 2009년 조류독감이 그 예다.\n   2003년 발생한 사스(SARS·중증급성호흡기증후군)는 4단계 에피데믹에 머물렀다.\n   대륙 건너 발병…\"팬데믹 조건에 부합해\"  25일(현지시간) CNN에 따르면 미국 질병통제예방센터(CDC) 산하 국립면역호흡기질환센터 낸시 메소니에 국장은 \"신종 코로나가 팬데믹에 가까워졌다\"고 말했다.\n  메소니에 국장은 팬데믹의 세 가지 특성으로 사망 가능성이 있는 질병을 유발하는지, 사람 간 감염이 가능한지, 전 세계적으로 확산이 되는지를 꼽으며 \"신종 코로나는 앞의 두 가지 특성에 이미 부합하고, 발병국이 늘면서 세 번째 특성과도 가까워지고 있다\"고 설명했다.\n   마크 립시츠 하버드대 보건대학원 전염병역학센터 교수도 25일 자신의 트위터에서 신종 코로나가 \"이미 팬데믹 상황이거나, 팬데믹이 되리란 증거가 늘어나고 있다\"고 말했다.\n  한국과 이란처럼 감염자가 급격히 증가하는 게 팬데믹의 증거라고도 주장했다.\n  립시츠 교수는 \"효과적인 통제가 이뤄지지 않으면 전 세계 성인의 40~70%가 신종 코로나에 감염될 수 있다\"고도 적했다.\n   감염자 폭증하는 한국, '팬데믹 증거'로 언급그러나 WHO는 신종 코로나를 팬데믹으로 격상시키는 데 신중한 모습이다.\n   24일 테워드로스 아드하놈 거브러여수스 WHO 사무총장은 제네바에서 열린 기자 간담회에서 신종 코로나가 \"완벽히\" 팬데믹이 될 가능성이 있다면서도, \"아직은 팬데믹이란 용어를 쓸 만큼 세계적으로 퍼지지는 않았다\"고 말했다.\n  다만 WHO는 지난달 30일 신종 코로나에 대해 최고 수준의 경보인 ‘국제적 공중보건 비상사태’(PHEIC)를 선포한 상태다.\n   특히 팬데믹 가능성을 높인 건 한국과 이탈리아, 이란이다.\n  최초 발생지로 알려진 중국 우한에서 거리가 있는 이 세 곳에서 날마다 감염자가 폭증하고 있다는 점이 신종 코로나가 팬데믹에 가까워지는 증거라고 전문가들은 입을 모은다.", "output": "세계보건기구(WHO)는 신종 코로나 감염증(코로나19)의 팬데믹 선언을 미루고 있지만, 전문가들은 이미 팬데믹이 시작됐다고 보고 있다. 미국 질병통제예방센터(CDC) 산하 국립면역호흡기질환센터 낸시 메소니에 국장은 25일(현지시간) CNN에 신종 코로나가 팬데믹에 가까워졌다고 말했고, 마크 립시츠 하버드대 보건대학원 전염병역학센터 교수도 같은 날 트위터에서 이미 팬데믹 상황이거나 팬데믹이 되리란 증거가 늘어나고 있다고 밝혔다. 테워드로스 아드하놈 거브러여수스 WHO 사무총장은 24일 제네바 기자 간담회에서 신종 코로나가 완벽히 팬데믹이 될 가능성이 있다면서도 아직은 팬데믹이란 용어를 쓸 만큼 세계적으로 퍼지지는 않았다고 말했다. WHO는 지난달 30일 신종 코로나에 대해 국제적 공중보건 비상사태(PHEIC)를 선포한 상태다."}, {"kind": "F5", "id": "REPORT-news_r-03188-00002", "input": "간판은 매장의 상징이며 이름표다.\n  간판은 매장을 고객에게 알리는 상징물로서 중요한 의미를 갖는다.\n  최근 개성이 중시되면서 간판도 무한 변신하고 있다.\n  최근 간판들은 정형적인 직사각형을 벗어나서 재미와 흥미를 끄는 등 개성을 중시하기도 한다.\n  예전 간판은 단순히 매장의 이름표에 불과했다면, 최근에는 이름표를 넘어서 명함의 역할을 하고 있다고 평가된다.\n  간판은 소재와 부착하는 위치에 따라서 여러 가지 종류로 나뉜다.\n  먼저 부착하는 곳에 따라 전면간판, 돌출간판, 입간판, 지주간판 등이 있다.\n  전면간판은 건물 전면에 부착하는 간판으로 약 4m 크기가 가장 일반적인 크기로 간판을 붙이는 곳은 간판 부착부의 80%가 허용된다.\n  건물 모서리 부분에 부착하는 세로형 양면 간판은 돌출간판이다.\n  건물 입구에 세워진 양면 세로형 간판은 지주간판이다.\n  대형 건물인 경우 단독 지주간판을 부착하기도 하고, 여러 매장을 알리기 위한 합동지주 간판도 있다.\n   소재에 따라 구분하기도 한다.\n  1970년대에는 아크릴 간판이 등장해 발전했다.\n  아크릴은 가벼우면서 가공하기 쉬워서 거의 모든 간판의 소재가 되기도 했다.\n  1980년대 접어들면서 파나플렉스를 이용한 플렉스 간판이 등장했다.\n  아크릴이나 금속제 간판보다 다양한 색상 표현이 가능해 주목받았다.\n  최근에는 LED, 레이저 등을 이용한 간판부터 나무, 돌, 금속 등 전통적인 소재도 사용되고 있다.\n  최근 음식점들은 간판에 다양한 문구를 넣어 예쁘게 꾸미고 있는데, 고객에게 매장을 알리려는 목적이 가장 크다.\n  좋은 간판이란 소비자에게 매장에 대한 정확한 정보를 제공해 방문을 유도하는 것이다.\n  특히 간판 속에 사업 내용과 컨셉을 담아서 애매한 것을 싫어하는 고객의 마음을 사로잡는 것이 중요하다.\n  2008년부터는 간판에 관한 법률이 새로 규정되어 설치 시 참고해야 한다.\n  하나의 예로 서울 각 구마다도 간판 설치 규정이 다르기 때문에, 각 해당 관청에 문의한 후 제작해야 한다.\n  최근의 간판의 문제는 너무 개성만을 중시한 나머지 매장이 입점한 건물이나 주변 환경과의 조화를 전혀 고려하지 않는 점이다.\n  그래서 정부와 각 지자체에서는 간판 규제에 나서고 있고, 아름다운 거리 만들기 등의 캠페인을 펼치고 있다.\n  예를 들어 붉은색과 검은색이 간판의 50% 이상을 사용하지 못하게 하거나, 건물과 조화를 이루지 못하는 대형 간판 등은 규제 대상이다.", "output": "간판은 매장의 상징이자 이름표로, 최근에는 정형적인 직사각형을 벗어나 개성을 중시하며 명함 역할까지 하고 있다. 간판은 부착 위치에 따라 전면간판·돌출간판·입간판·지주간판 등으로, 소재에 따라 아크릴(1970년대), 파나플렉스를 이용한 플렉스 간판(1980년대), 최근 LED·레이저·나무·돌·금속 등으로 나뉜다. 좋은 간판은 소비자에게 매장 정보를 정확히 제공해 방문을 유도하는 것이며, 2008년부터 새로 규정된 간판 관련 법률에 따라 서울 각 구마다 다른 설치 규정을 해당 관청에 문의한 후 제작해야 한다. 최근에는 개성만 중시해 주변 환경과 조화를 고려하지 않는 간판이 문제가 되면서 정부와 지자체가 규제와 아름다운 거리 만들기 캠페인을 펼치고 있다."}, {"kind": "F6", "id": "ext0000000121459", "input": "대신 서방 각국에선 차량으로 시민들을 공격하는 테러가 빈발하구 잇다.", "output": "대신 서방 각국에선 차량으로 시민들을 공격하는 테러가 빈발하고 있다."}, {"kind": "F6", "id": "aud2207210004172", "input": "가민의 님은 오늘으 오전 의원총회 진행했는데 어떤 내들이 논의됐습니까?", "output": "국민의 힘은 오늘 오전 의원총회를 진행했는데 어떤 내용들이 논의됐습니까?"}, {"kind": "F5", "id": "REPORT-news_r-00505-00001", "input": "미국의 국가대항전에서 유난히 뛰어난 성적을 거둬 ‘캡틴 아메리카’라는 별명을 가진 골프 스타 패트릭 리드(미국)는 6일(한국시각) 팬들로부터 ‘사기꾼’이라는 소리를 들었다.\n  하와이에서 열린 미국 프로골프(PGA) 투어 센트리 토너먼트 오브 챔피언스 연장전에서다.\n  그가 퍼트를 하고 나서 관중이 \"사기꾼\"이라고 크게 소리를 질렀다.\n  리드를 아끼던 미국 관중이어서 의미가 다르다.\n  미국 골프월드는 그를 '공공의 적'이라고 표현했다.\n     2018년 마스터스 챔피언인 리드는 사연이 많다.\n  조지아 대학에 다닐 때 스코어를 속이고, 동료 물건을 훔쳤다고 알려졌다.\n  그래서 학교를 떠나 작은 학교인 오거스타 스테이트로 옮겼는데 거기서도 동료들이 팀에서 내쫓을지 투표를 할 정도로 융화하지 못했다.\n  그래도 그는 살아남았다.\n  실력이 좋아서다.\n  리드는 팀을 두 번이나 전국 우승으로 이끌었다.\n  그 중 한 번은 자신을 쫓아낸 조지아대학을 결승에서 눌렀다.\n     프로 선수가 돼서도 환영받지 못했다.\n  동료들은 그가 너무 오만하다고 생각했다.\n  리드는 경기 중 무벌타 구제를 받지 못했을 때 “내가 (인기가 있는) 조던 스피스가 아니라서 피해를 봤다”고 말하기도 했다.\n  그러나 리드는 국가대항전에서 잘했기 때문에 인정을 받았다.\n  특히 2016년 라이더컵에서는 최고의 활약을 펼쳐 캡틴 아메리카라는 영광스러운 별명도 얻었다.\n  미국은 실력 우선이다.\n  팬들이 영웅인 그에게 복잡한 감정을 가지는 가장 큰 이유는 부모와의 불화다.\n  그는 대회장에서 경찰을 시켜 부모를 쫓아낸 일도 있다.\n  이에 대해 사과하지 않았다.\n   이후 팬들의 분위기가 변했다.\n  그러나 리드는 적대적인 분위기에서도 전혀 흔들리지 않고 경기할 수 있는 능력이 있다.\n  부정적인 분위기를 오히려 자신이 유리하게 이용하는 듯도 했다.\n  2018년 마스터스에서 그랬다.\n  싫어하는 사람들은 그래서 더 얄밉다고 여겼다.\n  마스터스 우승 후 “부모와 화해하는 것이 어떤가”라는 권유를 리드는 한칼에 거부했다.\n   상황은 나빠지고 있다.\n  2018년 라이더컵에서 리드는 팀워크를 깼다.\n  리드는 “조 편성이 잘 못 됐으며 나처럼 성적이 좋은 선수를 두 번이나 벤치에 앉혀 두는 것은 현명한 결정이 아니다”고 했다.\n  지난해 12월 히로 월드 챌린지에서는 연습스윙 하는 척하면서 모래를 치우다 발각됐다.\n  직후 열린 프레지던츠컵에서 상대 관중들이 리드를 ‘사기꾼’이라고 공격했다.", "output": "‘캡틴 아메리카’ 별명을 가진 골프 스타 패트릭 리드가 6일(한국시각) 하와이에서 열린 미국 프로골프(PGA) 투어 센트리 토너먼트 오브 챔피언스 연장전에서 퍼트 후 관중으로부터 '사기꾼'이라는 소리를 들었다. 리드는 조지아 대학 시절 스코어를 속이고 동료 물건을 훔쳤다고 알려졌으며, 프로 선수가 된 뒤에도 동료들과 융화하지 못했고 대회장에서 경찰을 시켜 부모를 쫓아낸 일도 있다. 2018년 라이더컵에서는 조 편성에 불만을 드러내 팀워크를 깼고, 지난해 12월 히로 월드 챌린지에서는 연습스윙 하는 척하면서 모래를 치우다 발각됐다."}, {"kind": "F6", "id": "ext0000000112763", "input": "클래식음악의 재미와 감동을 제대로 맛볼수있게 이와관련된 역사와 배경을 쉽게 소개한 교양서다.", "output": "클래식 음악의 재미와 감동을 제대로 맛볼 수 있게 이와 관련된 역사와 배경을 쉽게 소개한 교양서다."}, {"kind": "F5", "id": "REPORT-news_r-00459-00002", "input": "그도 그럴 것이 태평양·김앤장 할 것 없이 한국 로펌은 론스타의 ISD(국가-투자자 소송) 등 한국이 당사자인 굵직한 국제중재사건에서도 영미권 대형 로펌의 보조적 역할만 해왔던 게 사실이다.\n  한국 로펌이 외국 고객을 두기는커녕 한국 내에서조차 한국 로펌에 보조 역할만 기대하는 실정이다.\n  한 국제중재 변호사는 “글로벌 톱 로펌을 쓰는 건 실력 격차 외에도 명성 때문인데 브랜드파워와 맨파워가 모두 부족한 신생 로펌에 일을 줄 고객이 국내외를 막론하고 과연 있을지 회의적”이라고 말했다.\n  또 다른 한 국제중재 변호사도 “말은 글로벌을 지향한다지만 실은 오래 몸담았던 태평양에 타격을 주는 소탐대실 선택이 아니냐”는 의견을 내놓기도 했다.\n  이쯤 되면 누구라도 김 변호사의 선택을 두고 “왜”라는 질문과 함께 “세계 진출이 과연 실현 가능한 목표인지” 묻고 싶어진다.\n  오는 9일 공식 출범을 앞둔 피터&김이 자리 잡은 서울 강남구 삼성동 트레이드타워(무역센터) 17층 사무실을 찾은 이유다.\n  웬만한 신생 로펌에 비해 위치나 인테리어는 훨씬 화려했다.\n  하지만 태평양이나 김앤장처럼 방문객을 압도하는 리셉션 공간 따로 없이 집무실과 회의실만 갖춘 실용적 공간은 김 변호사 설명대로 “스타트업”이라 부를만했다.\n  김 변호사가 스타트업(피터&김)을 차린 이유는 단순했다.\n  한국이 잘 하고 있고 더 잘 할 수 있는데 내수용에 안주하면 미래는 없다는 것, 좀더 비관적으로 표현하면 결국 국내 시장도 지킬 수 없을지 모른다는 위기감이다.\n  그는 이렇게 설명했다.\n  “국제중재는 국가별 칸막이가 없어 어느 나라 고객 업무라도 수행할 수 있는 완전 자유경쟁 시장이라 아무 변호사나 뛰어들 수 있다.\n  거꾸로 말하면 전 세계 유수의 로펌들이 계급장 떼고 치열하게 싸우는 전쟁터다.\n  한국 변호사가 한국 안에서 유능한 것도 의미 있지만 글로벌에서 경쟁력을 인정받으면 향후 한국 변호사의 해외 진출 발판을 마련할 수 있지 않을까.\n ” 글로벌 역량을 키우는 게 한국시장을 지키는 방법이라는 계산도 깔려 있다.\n  K팝이 팝 심장부인 미국에서 한국어로 노래하는 BTS(방탄소년단)라는 세계적 현상을 만들어내는 동안 한때 한국이 그토록 두려워했던 J팝이 철저히 내수용에 머무는 것만 봐도 알 수 있다.\n  『걸그룹 경제학』이 2010년대 전후 한국과 일본의 대표 걸그룹 소녀시대와 AKB48을 비교한 분석을 보면 자국 음반 판매량은 AKB48의 압승이다.", "output": "한국 로펌은 론스타의 ISD 등 한국이 당사자인 굵직한 국제중재사건에서 영미권 대형 로펌의 보조적 역할만 해왔고, 한 국제중재 변호사는 브랜드파워와 맨파워가 모두 부족한 신생 로펌에 일을 줄 고객이 있을지 회의적이라고 말했다. 오는 9일 공식 출범을 앞둔 피터&김의 김 변호사는 한국이 내수용에 안주하면 미래는 없다는 위기감에 스타트업을 차렸다며, 국제중재는 국가별 칸막이가 없는 완전 자유경쟁 시장이라 글로벌에서 경쟁력을 인정받으면 한국 변호사의 해외 진출 발판을 마련할 수 있을 것이라고 설명했다."}, {"kind": "F5", "id": "REPORT-news_r-04277-00001", "input": "동서고금을 막론하고 역병이 크게 돌거나 민심이 쪼개지면 괴담이 뒤따른다.\n  미국도 예외가 아니다.\n  드라마 ‘X-파일’이 만들어진 나라 미국이 오히려 유언비어의 생산력과 다양성에서 상당한 수준으로 보인다.\n  주류 학계에서 인정받지 못하는 변방의 프린지(fringe) 가담항설이 주류 문화에까지 파고들곤 한다.\n  6년 전 에볼라 바이러스가 미국 사회를 강타했을 때가 그랬다.\n  CNN 등 주류 언론들이 미국민의 에볼라 공포를 ‘피어볼라(Fear-bola)’라는 신조어로 보도했을 때다.\n  그때 출몰했던 주요 유언비어다.\n  ①버락 오바마 대통령이 미국의 노예제 역사를 속죄하려고 에볼라 유입을 차단하지 않았다.\n  ②오바마 대통령이 미국을 아프리카처럼 만들려고 에볼라를 막지 않았다.\n  러시 림보 같은 극우 방송인들이 괴담 확산에 가세했다.\n  대선이 치러진 2016년엔 유언비어 때문에 미국의 수도 워싱턴에서 총격 사건이 벌어졌다.\n  당시 대선 후보 힐러리 클린턴이 전 세계에서 아동 성매매 조직을 운영하고 있으며 워싱턴의 피자 가게 지하에도 그 소굴이 있다는 유치찬란한 음모론이었다.\n  어리석게도 이를 믿었던 28세의 백인 청년이 그해 12월 4일 이 피자가게를 찾아와 소총을 쏴대다가 체포됐다.\n  유언비어는 이처럼 사회를 좀먹는 곰팡이다.\n  에볼라 때처럼 사람들의 불안을 파고들고, 미국 대선 때처럼 사회적 분열을 틈타 혹세무민한다.\n  유언비어와 곰팡이의 닮은 점은 속성만 아니라 생존 조건에도 있다.\n  습기와 어둠 속에서 피어오르는 곰팡이처럼 불신과 의사소통의 단절이라는 환경 속에서 유언비어가 자생한다.\n  피어볼라는 에볼라 환자를 치료하던 간호사가 감염되는 충격적 사태가 발생하며 불붙었다.\n  세계 최고의 의료 선진국인 미국에서 의료진까지 감염됐다는 뉴스에 미국민들의 심리적 마지노선이 뚫렸다.\n  아동 성매매로 돈을 번다는 ‘피자 게이트’는 어처구니없는 허구였지만 힐러리 클린턴은 대선 기간 돈 문제로 시달렸다.\n  힐러리 본인이  2억원 짜리 ‘황제 강연’을 했던 게 도마에 올랐고, 남편 빌 클린턴은 물론 외동딸 첼시까지 거액 강연에 나섰던 것도 드러났다.\n  이들 가족이 주도하는 클린턴 재단에 후원금 명목으로 근본 없는 돈까지 흘러들어왔다는 의혹도 제기됐다.\n  정부 여당은 신종 코로나 발생 후 등장하는 가짜뉴스를 크게 경계하고 있다.\n  하지만 유언비어가 자라는 습기와 어둠을 없애지 않은 채 유언비어를 때려잡으려 하면 하나만 알고 둘은 모르는 얘기다.", "output": "미국에서 역병이나 민심 분열 시 괴담이 뒤따르는 사례로, 6년 전 에볼라 바이러스가 미국 사회를 강타했을 때 '피어볼라(Fear-bola)'라는 신조어와 함께 버락 오바마 대통령 관련 유언비어가 확산됐다. 2016년 대선 때는 힐러리 클린턴이 아동 성매매 조직을 운영한다는 음모론을 믿은 28세 백인 청년이 워싱턴의 피자가게에서 소총을 쏴대다 체포됐다. 유언비어는 불신과 의사소통 단절이라는 환경에서 자생하며, 정부 여당은 신종 코로나 발생 후 등장하는 가짜뉴스를 크게 경계하고 있다."}, {"kind": "F5", "id": "REPORT-news_r-05055-00001", "input": "프로배구 OK저축은행이 봄배구 불씨를 살렸다.\n  레오 안드리치와 최홍석의 활약을 앞세워 KB손해보험을 제압했다.\n  OK저축은행은 26일 안산 상록수체육관에서 열린 2019~2020 도드람 V리그 프로배구 6라운드 KB손해보험과 경기에서 세트 스코어 3-1(25-17, 17-25, 25-21, 25-23)로 이겼다.\n  레오가 서브득점 3개 포함 27점, 최홍석이 블로킹 2개 포함 16점을 기록했다.\n  2연승을 이어간 4위 OK저축은행은 15승16패(승점47)가 됐다.\n  3위 현대캐피탈(18승12패, 승점53)과는 승점 6점 차로 좁혔다.\n  프로배구에선 3,4위 승점이 3점 이내면 단판제 준플레이오프가 열린다.\n  경기 초반 OK저축은행은 강한 서브를 바탕으로 분위기를 이끌었다.\n  레오-송명근-최홍석-한상길-전진선의 공격적인 라인업도 잘 먹혔다.\n  두세 점 차 리드를 지키던 OK저축은행은 최홍석의 서브득점, 송명근의 페인트 공격, 최홍석의 백어택이 터지면서 21-15로 달아났다.\n  24-17에선 레오의 첫 서브득점까지 터지면서 깔끔하게 마무리했다.\n KB손보는 2세트에 변화를 줬다.\n  김학민을 먼저 넣어 공격을 강화했다.\n  마테우스와 김학민 쌍포가 터지면서 앞서갔다.\n  KB손보는 김정호의 강력한 서브와 블로킹까지 나오면서 12-6으로 달아났다.\n  OK저축은행은 송명근 대신 김웅비를 투입해 재정비했다.\n  하지만 KB손해보험은 잇따라
